Object.assign(CLUES,{
  a4selo:c(L('O selo desfeito','The undone seal','El sello deshecho'),L(`O selo de Conhecimento na caixa de chumbo não foi quebrado. Foi desfeito, letra por letra, na ordem certa. Com a letra do Kavyur, ou com a de alguém que aprendeu com ele.`,`The Knowledge seal on the lead box wasn't broken. It was undone, letter by letter, in the right order. In Kavyur's handwriting, or in the hand of someone who learned from him.`,`El sello de Conocimiento de la caja de plomo no fue roto. Fue deshecho, letra por letra, en el orden correcto. Con la letra de Kavyur, o con la de alguien que aprendió de él.`)),
  a4cafe:c(L('O café da guarita','The guard post coffee','El café de la garita'),L(`O Tuninho estava de guarda no cofre e dormiu depois de tomar um café que alguém deixou na guarita. Ninguém admite ter levado. No fundo do copo, um pó branco que não é açúcar.`,`Tuninho was guarding the vault and fell asleep after drinking a coffee someone left at the guard post. Nobody admits bringing it. At the bottom of the cup, a white powder that isn't sugar.`,`Tuninho estaba de guardia en la bóveda y se durmió después de tomar un café que alguien dejó en la garita. Nadie admite haberlo llevado. En el fondo del vaso, un polvo blanco que no es azúcar.`)),
  a4chave:c(L('A chave com cera','The waxed key','La llave con cera'),L(`A chave do cofre, no chaveiro do Flavio, tem restos de cera nos dentes. Alguém fez um molde. "Esse chaveiro não sai do arsenal", o Flavio jura. "Só quem é de casa chega perto."`,`The vault key, on Flavio's keyring, has wax residue in its teeth. Someone made a mold. "That keyring never leaves the armory," Flavio swears. "Only family gets near it."`,`La llave de la bóveda, en el llavero de Flavio, tiene restos de cera en los dientes. Alguien hizo un molde. "Ese llavero no sale del arsenal", jura Flavio. "Solo los de casa se acercan."`)),
  a4chinelo:c(L('Os pés na câmera','The feet on camera','Los pies en la cámara'),L(`A câmera da escada dos fundos do bar pega só a parte de baixo: às 3h12, alguém de bermuda e chinelo desce para a Base, devagar, sem acender a luz. Às 3h40, sobe com uma caixa pesada. O Tuninho anda de chinelo pela Base. Você conhece mais alguém que também anda.`,`The bar's back-stairs camera only catches the bottom half: at 3:12 a.m., someone in shorts and flip-flops goes down into the Base, slowly, without turning on the light. At 3:40, they come up carrying a heavy box. Tuninho wears flip-flops around the Base. You know someone else who does too.`,`La cámara de la escalera trasera del bar solo toma la parte de abajo: a las 3:12, alguien de bermudas y ojotas baja a la Base, despacio, sin prender la luz. A las 3:40, sube con una caja pesada. Tuninho anda de ojotas por la Base. Conoces a alguien más que también.`)),
  a4remedio:c(L('A sala dos remédios','The medicine room','La sala de los remedios'),L(`Falta um frasco de sedativo na enfermaria. A Iris lembra de quem ficou sozinho na sala dos remédios na semana passada, enquanto ela cuidava de um curativo: o VT, que tinha vindo trazer o Kavyur para costurar a mão.`,`A vial of sedative is missing from the infirmary. Iris remembers who was alone in the medicine room last week while she was dressing a wound: VT, who had brought Kavyur in to get his hand stitched.`,`Falta un frasco de sedante en la enfermería. Iris recuerda quién estuvo solo en la sala de remedios la semana pasada mientras ella hacía una curación: VT, que había traído a Kavyur para que le cosieran la mano.`)),
  a4sedativo:c(L('Sedativo sumido','Missing sedative','Sedante desaparecido'),L(`Falta um frasco de sedativo na enfermaria. O Logan tem certeza de que ninguém da equipe pegou. A Iris fica quieta demais.`,`A vial of sedative is missing from the infirmary. Logan is sure no one on the staff took it. Iris goes a little too quiet.`,`Falta un frasco de sedante en la enfermería. Logan está seguro de que nadie del equipo lo tomó. Iris se queda demasiado callada.`)),
  a4pagina:c(L('A página arrancada','The torn page','La página arrancada'),L(`Do caderno da Maitê sobre a Magistrada, alguém arrancou uma página: a que dizia onde ela se manifesta. Na borda rasgada, uma mancha escura de óleo de arma.`,`Someone tore a page from Maitê's notebook on the Magistrate: the one that said where she manifests. On the torn edge, a dark smudge of gun oil.`,`Del cuaderno de Maitê sobre la Magistrada, alguien arrancó una página: la que decía dónde se manifiesta. En el borde roto, una mancha oscura de aceite de arma.`)),
  a4velho:c(L('O homem de dentro','The man inside','El hombre de adentro'),L(`O Sílvio lembra de uma frase do Brenner: "O Comprador tem um homem que conhece os irmãos Zart desde que eram meninos. Faz anos. Foi ele que contou o que aquela luva era de verdade."`,`Sílvio remembers something Brenner said: "The Buyer has a man who's known the Zart brothers since they were boys. For years. He's the one who said what that glove really was."`,`Sílvio recuerda una frase de Brenner: "El Comprador tiene un hombre que conoce a los hermanos Zart desde que eran chicos. Hace años. Fue él quien dijo qué era ese guante de verdad."`)),
  a4kavyur:c(L('A mensagem do Kavyur','Kavyur\'s message','El mensaje de Kavyur'),L(`O Kavyur não atende. Depois de uma hora, uma mensagem: "Não posso falar. Ele tá do lado. Não confia em ninguém que sabia da usina, Adam. Ninguém."`,`Kavyur doesn't pick up. An hour later, a text: "Can't talk. He's right here. Don't trust anyone who knew about the plant, Adam. Anyone."`,`Kavyur no atiende. Una hora después, un mensaje: "No puedo hablar. Él está al lado. No confíes en nadie que supiera de la usina, Adam. En nadie."`))
});
const K=L('Ato II · Cap. 4 · A Magistrada','Act II · Ch. 4 · The Magistrate','Acto II · Cap. 4 · La Magistrada');
const KI=L('Ato II · Cap. 4 · O traidor','Act II · Ch. 4 · The traitor','Acto II · Cap. 4 · El traidor');
const KF=L('Ato II · Cap. 4 · O Fórum Velho','Act II · Ch. 4 · The Old Courthouse','Acto II · Cap. 4 · El Foro Viejo');
Object.assign(SCENES,{
a4a_cicatriz:{act:K,title:L('A cicatriz','The scar','La cicatriz'),checkpoint:true,
  text:()=>P(L(`O raio deixou uma marca no seu peito. Uma cicatriz vermelha que se abre em galhos, do esterno até o ombro, como uma árvore desenhada por dentro da pele. O Logan disse que vai ficar para sempre.

A Koranna está sentada na beira da sua cama com um pote de pomada e um rolo de gaze. Ela não precisava estar aqui. A Iris se ofereceu. A Koranna disse que não.

Ela passa a pomada devagar, seguindo cada galho da cicatriz com a ponta dos dedos. Você deveria reclamar que arde. Não reclama.

"Você se jogou na frente de um raio", ela diz, sem levantar os olhos. "De novo. Sem pensar. De novo."`,
`The lightning left a mark on your chest. A red scar that branches out, from your sternum to your shoulder, like a tree drawn under the skin. Logan said it will be there forever.

Koranna is sitting on the edge of your bed with a jar of ointment and a roll of gauze. She didn't need to be here. Iris offered. Koranna said no.

She spreads the ointment slowly, following every branch of the scar with her fingertips. You should complain that it stings. You don't.

"You threw yourself in front of a lightning bolt," she says, without looking up. "Again. Without thinking. Again."`,
`El rayo te dejó una marca en el pecho. Una cicatriz roja que se abre en ramas, del esternón al hombro, como un árbol dibujado debajo de la piel. Logan dijo que va a quedar para siempre.

Koranna está sentada en el borde de tu cama con un frasco de pomada y un rollo de gasa. No tenía por qué estar acá. Iris se ofreció. Koranna dijo que no.

Pasa la pomada despacio, siguiendo cada rama de la cicatriz con la punta de los dedos. Deberías quejarte de que arde. No te quejas.

"Te tiraste delante de un rayo", dice, sin levantar la vista. "Otra vez. Sin pensar. Otra vez."`)),
  choices:()=>[
    {once:'medo4',label:L('Contar do que você tem medo','Tell her what you\'re afraid of','Contarle a qué le tienes miedo'),
      run:()=>({text:P(L(`Você nunca disse isso em voz alta. Nem para o Thomas.

"Todo mundo que eu deixei chegar perto, eu enterrei." A sua voz sai baixa. "Meus pais. Meus avós. O Bob. O Thomas. A Base inteira. Toda vez que eu gosto de alguém, eu começo a contar os dias."

A Koranna para de passar a pomada. Ela segura o seu rosto com as duas mãos, ainda com cheiro de remédio, e te obriga a olhar para ela.

"Então conta os meus", ela diz. "Mas conta todos. Porque eu não vou a lugar nenhum."`,`You've never said this out loud. Not even to Thomas.

"Everyone I've let get close, I've buried." Your voice comes out low. "My parents. My grandparents. Bob. Thomas. The whole Base. Every time I care about someone, I start counting the days."

Koranna stops spreading the ointment. She takes your face in both hands, still smelling of medicine, and makes you look at her.

"Then count mine," she says. "But count all of them. Because I'm not going anywhere."`,`Nunca lo dijiste en voz alta. Ni siquiera a Thomas.

"A todos los que dejé acercarse, los enterré." Tu voz sale baja. "Mis padres. Mis abuelos. Bob. Thomas. La Base entera. Cada vez que quiero a alguien, empiezo a contar los días."

Koranna deja de pasar la pomada. Te toma la cara con las dos manos, todavía con olor a remedio, y te obliga a mirarla.

"Entonces cuenta los míos", dice. "Pero cuéntalos todos. Porque no me voy a ninguna parte."`))+bond('koranna',3)+calm(5)})},
    {once:'derick4',label:L('Deixar o Derick entrar','Let Derick in','Dejar entrar a Derick'),
      run:()=>({text:P(L(`Ele está parado na porta faz um tempo, sem coragem de bater. Quando você acena, ele entra, olha a cicatriz e fica branco. "Era para ser em mim", ele diz. "Aquilo me escolheu." Você puxa ele pelo braço até ele sentar do seu lado. "E eu escolhi você primeiro. No porão. Lembra?" Ele não responde. Só encosta a testa no seu ombro bom, igual fazia quando tinha doze anos.`,`He's been standing at the door for a while, not brave enough to knock. When you wave, he comes in, looks at the scar and goes pale. "It was supposed to be me," he says. "It chose me." You pull him by the arm until he sits beside you. "And I chose you first. In the basement. Remember?" He doesn't answer. He just rests his forehead on your good shoulder, the way he did when he was twelve.`,`Hace rato que está parado en la puerta, sin valor para golpear. Cuando le haces una seña, entra, mira la cicatriz y se pone pálido. "Tenía que ser en mí", dice. "Me eligió a mí." Lo tiras del brazo hasta que se sienta a tu lado. "Y yo te elegí primero. En el sótano. ¿Te acuerdas?" No responde. Solo apoya la frente en tu hombro sano, como hacía cuando tenía doce años.`))+bond('derick',2)+calm(2)})},
    {label:L('Atender o Flavio, que está batendo na porta','Answer Flavio, who\'s pounding on the door','Atender a Flavio, que está golpeando la puerta'),main:true,
      run:()=>({text:P(L(`O Flavio está pálido, com o chaveiro do arsenal apertado na mão. "A caixa", ele diz. "A caixa de chumbo com a esfera. Sumiu do cofre."`,`Flavio is pale, the armory keyring clenched in his hand. "The box," he says. "The lead box with the sphere. It's gone from the vault."`,`Flavio está pálido, con el llavero del arsenal apretado en la mano. "La caja", dice. "La caja de plomo con la esfera. Desapareció de la bóveda."`)),go:'a4b_cofre'})}
  ]},

a4b_cofre:{act:KI,title:L('O cofre vazio','The empty vault','La bóveda vacía'),checkpoint:true,
  text:()=>P(L(`Nenhuma porta arrombada. Nenhum alarme. A prateleira onde a caixa de chumbo estava tem só o contorno limpo na poeira.

Quem entrou tinha a chave. Sabia o caminho. Sabia desfazer o selo.

A Base tem dez pessoas. Você confia a sua vida a cada uma delas. Pela primeira vez desde o massacre, você olha em volta e começa a contar.`,
`No doors forced. No alarm. The shelf where the lead box sat has only a clean outline in the dust.

Whoever came in had the key. Knew the way. Knew how to undo the seal.

The Base has ten people. You trust your life to every one of them. For the first time since the massacre, you look around and start counting.`,
`Ninguna puerta forzada. Ninguna alarma. El estante donde estaba la caja de plomo solo tiene el contorno limpio en el polvo.

Quien entró tenía la llave. Conocía el camino. Sabía deshacer el sello.

La Base tiene diez personas. Les confías tu vida a cada una. Por primera vez desde la masacre, miras alrededor y empiezas a contar.`))+loseSan('1d4',L('a desconfiança','the suspicion','la desconfianza')),
  choices:()=>[
    {once:'selo4',label:L('Examinar os restos do selo','Examine what\'s left of the seal','Examinar los restos del sello'),test:{sk:'Investigação',dt:15},
      ok:()=>({text:P(L(`As letras foram desfeitas uma por uma, na ordem inversa. Sem pressa. Você conhece essa caligrafia. Viu ela sendo escrita no chão da casa de turbinas.`,`The letters were undone one by one, in reverse order. Without hurry. You know this handwriting. You watched it being written on the turbine hall floor.`,`Las letras fueron deshechas una por una, en orden inverso. Sin apuro. Conoces esta caligrafía. La viste escribirse en el piso de la sala de turbinas.`))+addClue('a4selo')}),
      fail:()=>({text:P(L(`Letras e borrões. A Maitê chega, olha por cima do seu ombro e diz em voz baixa: "Isso não foi quebrado, Mada. Foi desfeito. Por alguém que sabia."`,`Letters and smudges. Maitê arrives, looks over your shoulder and says quietly: "This wasn't broken, Mada. It was undone. By someone who knew how."`,`Letras y manchas. Maitê llega, mira por encima de tu hombro y dice en voz baja: "Esto no se rompió, Mada. Se deshizo. Alguien que sabía cómo."`))+addClue('a4selo')})},
    {once:'tun4',label:L('Falar com o Tuninho, que estava de guarda','Talk to Tuninho, who was on watch','Hablar con Tuninho, que estaba de guardia'),
      run:()=>({text:P(L(`Ele está sentado no chão do corredor com a cabeça entre os joelhos. "Eu dormi, Mada. Eu nunca durmo no turno. Nunca." Ele mostra o copo de papel amassado na mão. "Tinha um café na guarita quando eu cheguei. Achei que alguém tinha deixado para mim." Os olhos dele estão cheios d'água. "Eu sei como isso parece. Ex-Formiga, de guarda, dormindo na noite do roubo. Eu sei."`,`He's sitting on the corridor floor with his head between his knees. "I fell asleep, Mada. I never sleep on watch. Never." He shows you the crumpled paper cup in his hand. "There was a coffee at the guard post when I got there. I thought someone left it for me." His eyes are full. "I know how this looks. Ex-Formiga, on watch, asleep on the night of the theft. I know."`,`Está sentado en el piso del pasillo con la cabeza entre las rodillas. "Me dormí, Mada. Nunca me duermo en la guardia. Nunca." Te muestra el vaso de papel arrugado en la mano. "Había un café en la garita cuando llegué. Pensé que alguien me lo había dejado." Tiene los ojos llenos de lágrimas. "Sé cómo se ve esto. Ex-Formiga, de guardia, dormido la noche del robo. Lo sé."`))+addClue('a4cafe')})},
    {once:'flavio4',label:L('Olhar o chaveiro do Flavio','Look at Flavio\'s keyring','Mirar el llavero de Flavio'),test:{sk:'Percepção',dt:14},
      ok:()=>({text:P(L(`Você pega a chave do cofre contra a luz. Nos dentes, restos brancos. Cera.`,`You hold the vault key up to the light. In its teeth, white residue. Wax.`,`Levantas la llave de la bóveda contra la luz. En los dientes, restos blancos. Cera.`))+addClue('a4chave')}),
      fail:()=>({text:P(L(`Uma chave comum. O Flavio arranca o chaveiro da sua mão, ofendido. "Você acha que fui eu?" Você não responde. O silêncio responde por você.`,`An ordinary key. Flavio snatches the keyring out of your hand, offended. "You think it was me?" You don't answer. The silence answers for you.`,`Una llave común. Flavio te arrebata el llavero, ofendido. "¿Crees que fui yo?" No respondes. El silencio responde por ti.`))+loseSan('1d2',L('o olhar do Flavio','Flavio\'s look','la mirada de Flavio'))})},
    {label:L('Reunir o que dá para reunir','Gather what you can','Reunir lo que se pueda'),main:true,run:()=>({go:'a4c_hub'})}
  ]},

a4c_hub:{act:KI,title:L('Dez pessoas','Ten people','Diez personas'),
  text:()=>P(L(`O mural do Thomas volta para a parede da sala de reunião. Só que, desta vez, as fotos presas nele são das pessoas que dormem no mesmo andar que você.

Você odeia cada minuto disso.`,
`Thomas's board goes back up on the meeting room wall. Only this time, the photos pinned to it are of the people who sleep on the same floor as you.

You hate every minute of it.`,
`El mural de Thomas vuelve a la pared de la sala de reuniones. Solo que esta vez, las fotos clavadas son de la gente que duerme en el mismo piso que tú.

Odias cada minuto.`)),
  choices:()=>[
    {once:'enf4',label:L('A enfermaria do Logan e da Iris','Logan and Iris\'s infirmary','La enfermería de Logan e Iris'),test:{sk:'Intuição',dt:15},
      ok:()=>({text:P(L(`O Logan jura que ninguém da equipe mexeu nos sedativos. A Iris concorda rápido demais. Você espera o Logan sair e senta do lado dela. "Iris." Ela aguenta dez segundos. Depois conta, com a voz tremendo, porque sabe o que isso significa para você.`,`Logan swears no one on staff touched the sedatives. Iris agrees too quickly. You wait for Logan to leave and sit beside her. "Iris." She lasts ten seconds. Then she tells you, her voice shaking, because she knows what this means to you.`,`Logan jura que nadie del equipo tocó los sedantes. Iris asiente demasiado rápido. Esperas a que Logan salga y te sientas a su lado. "Iris." Aguanta diez segundos. Después te lo cuenta, con la voz temblando, porque sabe lo que significa para ti.`))+addClue('a4remedio')+bond('iris')+loseSan('1d3',L('o que a Iris disse','what Iris said','lo que dijo Iris'))}),
      fail:()=>({text:P(L(`O Logan jura que ninguém da equipe mexeu nos sedativos. A Iris concorda. Você sai com a sensação de que alguém ali sabe mais do que disse.`,`Logan swears no one on staff touched the sedatives. Iris agrees. You leave with the feeling that someone there knows more than they said.`,`Logan jura que nadie del equipo tocó los sedantes. Iris asiente. Te vas con la sensación de que alguien ahí sabe más de lo que dijo.`))+addClue('a4sedativo')})},
    {once:'bar4',label:L('As câmeras do bar da Juliana','The cameras in Juliana\'s bar','Las cámaras del bar de Juliana'),
      run:()=>({text:P(L(`A Juliana rebobina a gravação com as mãos firmes e a boca apertada. "Eu instalei essa câmera virada para a escada porque ninguém devia descer por ali sem eu saber." Ela para a imagem. "Alguém desceu." Ela não diz o que pensa. Você também não.`,`Juliana rewinds the recording with steady hands and a tight mouth. "I installed this camera facing the stairs because nobody should go down there without me knowing." She pauses the image. "Somebody did." She doesn't say what she thinks. Neither do you.`,`Juliana rebobina la grabación con las manos firmes y la boca apretada. "Instalé esta cámara apuntando a la escalera porque nadie debería bajar por ahí sin que yo lo sepa." Pausa la imagen. "Alguien bajó." No dice lo que piensa. Tú tampoco.`))+addClue('a4chinelo')+bond('juliana')})},
    {once:'maite4',label:L('O caderno da Maitê','Maitê\'s notebook','El cuaderno de Maitê'),test:{sk:'Percepção',dt:15},
      ok:()=>({text:P(L(`A Maitê está furiosa. Faz semanas que ela pesquisa a Magistrada, e alguém arrancou a única página que importava. Você olha a borda rasgada contra a luz. Aquela mancha escura. Você conhece o cheiro. Passou a adolescência limpando armas naquele porão.`,`Maitê is furious. She's been researching the Magistrate for weeks, and someone tore out the only page that mattered. You hold the torn edge up to the light. That dark smudge. You know the smell. You spent your teenage years cleaning guns in that basement.`,`Maitê está furiosa. Hace semanas que investiga a la Magistrada, y alguien arrancó la única página que importaba. Levantas el borde roto contra la luz. Esa mancha oscura. Conoces el olor. Pasaste la adolescencia limpiando armas en ese sótano.`))+addClue('a4pagina')+bond('maite')}),
      fail:()=>({text:P(L(`A Maitê está furiosa. Alguém arrancou a página sobre onde a Magistrada se manifesta. O Derick olha para ela de um jeito que ela percebe. "Você acha que fui eu?", ela pergunta. Ninguém responde.`,`Maitê is furious. Someone tore out the page on where the Magistrate manifests. Derick looks at her in a way she notices. "You think it was me?" she asks. No one answers.`,`Maitê está furiosa. Alguien arrancó la página sobre dónde se manifiesta la Magistrada. Derick la mira de una forma que ella nota. "¿Creen que fui yo?", pregunta. Nadie responde.`))+loseSan('1d2',L('a sala em silêncio','the silent room','la sala en silencio'))})},
    {once:'silvio4',label:L('O Sílvio','Sílvio','Sílvio'),
      run:()=>({text:P(L(`O Sílvio escuta, pensa e fica pálido. "Tem uma coisa que o Brenner disse uma vez. Eu achei que era bravata." Ele te olha com uma coisa que parece pena. "Você não vai gostar, Zart."`,`Sílvio listens, thinks and goes pale. "There's something Brenner said once. I thought he was bragging." He looks at you with something like pity. "You're not going to like it, Zart."`,`Sílvio escucha, piensa y se pone pálido. "Hay algo que Brenner dijo una vez. Pensé que era fanfarronería." Te mira con algo parecido a la lástima. "No te va a gustar, Zart."`))+addClue('a4velho')+loseSan('1d3',L('a frase do Brenner','Brenner\'s words','la frase de Brenner'))})},
    {once:'kav4',label:L('Ligar para o Kavyur','Call Kavyur','Llamar a Kavyur'),
      run:()=>({text:P(L(`Chama. Chama. Cai na caixa. Você liga de novo. E de novo. Uma hora depois, o celular vibra.`,`It rings. It rings. Voicemail. You call again. And again. An hour later, the phone buzzes.`,`Suena. Suena. Buzón. Vuelves a llamar. Y otra vez. Una hora después, el celular vibra.`))+addClue('a4kavyur')})},
    {once:'briga',label:L('A Koranna','Koranna','Koranna'),run:()=>({go:'a4d_briga'})},
    {label:L('Montar o quadro','Put the board together','Armar el mural'),main:true,run:()=>({go:S.flags.a4ataque?'a4e_quadro':'a4c_ataque'})}
  ]},

a4d_briga:{act:KI,title:L('"Você acha que sou eu?"','"You think it\'s me?"','"¿Crees que soy yo?"'),
  text:()=>P(L(`Ela te acha na sala de treino, parado na frente do mural há uma hora, olhando a foto dela no meio das outras.

"Você colocou a minha foto aí." A voz dela está muito calma. Calma demais. "Depois de ontem. Depois de tudo o que eu te disse com a mão no seu peito."

Você abre a boca e não sai nada.

"Fala, Adam. Você acha que sou eu?"`,
`She finds you in the training room, standing in front of the board for an hour, staring at her photo among the others.

"You put my photo up there." Her voice is very calm. Too calm. "After yesterday. After everything I said to you with my hand on your chest."

You open your mouth and nothing comes out.

"Say it, Adam. You think it's me?"`,
`Te encuentra en la sala de entrenamiento, parado frente al mural hace una hora, mirando su foto entre las demás.

"Pusiste mi foto ahí." Su voz está muy calma. Demasiado calma. "Después de ayer. Después de todo lo que te dije con la mano en tu pecho."

Abres la boca y no sale nada.

"Dilo, Adam. ¿Crees que soy yo?"`)),
  choices:()=>[
    {label:L('Tirar a foto dela do mural','Take her photo off the board','Sacar su foto del mural'),main:true,
      run:()=>{S.flags.a4foto=true;return {text:P(L(`Você não diz nada. Vai até o mural, tira a foto dela, e depois, uma por uma, tira todas as outras. O Tuninho. A Maitê. O Flavio. A Juliana. O Logan. A Iris. O Derick. Só fica o espaço vazio.

"Eu não consigo fazer isso", você diz de costas para ela. "Eu não consigo desconfiar de vocês. Se eu começar, eu viro o que eles querem."

Ela te abraça por trás. Encosta o rosto nas suas costas. Fica.

"Então a gente procura juntos", ela diz. "Fora dessa sala."`,`You say nothing. You walk to the board, take her photo down, and then, one by one, all the others. Tuninho. Maitê. Flavio. Juliana. Logan. Iris. Derick. Only the empty space remains.

"I can't do this," you say, your back to her. "I can't suspect you people. If I start, I become what they want."

She hugs you from behind. Rests her cheek against your back. Stays.

"Then we look together," she says. "Outside this room."`,`No dices nada. Vas al mural, sacas su foto y después, una por una, todas las demás. Tuninho. Maitê. Flavio. Juliana. Logan. Iris. Derick. Solo queda el espacio vacío.

"No puedo hacer esto", dices de espaldas a ella. "No puedo desconfiar de ustedes. Si empiezo, me vuelvo lo que ellos quieren."

Te abraza por detrás. Apoya la cara en tu espalda. Se queda.

"Entonces buscamos juntos", dice. "Fuera de esta sala."`))+bond('koranna',3)+calm(4),go:'a4c_hub'}}},
    {label:L('"Onde você estava às três da manhã?"','"Where were you at three a.m.?"','"¿Dónde estabas a las tres de la mañana?"'),
      run:()=>{S.flags.a4perguntou=true;return {text:P(L(`As palavras saem antes de você conseguir segurar. Você vê cada uma acertar ela.

Ela fica quieta por muito tempo. "No seu quarto", ela diz por fim. "Trocando a gaze da sua cicatriz enquanto você dormia. Duas vezes." Ela vira as costas. "Você não lembra porque o Logan te deu remédio para dor."

Ela sai. Você fica sozinho com o mural. É a pior coisa que você já sentiu desde o túnel.

Uma hora depois, ela bate na porta. Os olhos vermelhos. "Eu tô brava", ela diz. "Muito. Mas eu não vou deixar isso fazer o que eles querem." Ela entra. Não te abraça. Mas senta do seu lado.`,`The words come out before you can stop them. You watch each one hit her.

She's quiet for a long time. "In your room," she finally says. "Changing the gauze on your scar while you slept. Twice." She turns her back. "You don't remember because Logan gave you painkillers."

She leaves. You're alone with the board. It's the worst thing you've felt since the tunnel.

An hour later, she knocks on the door. Red eyes. "I'm angry," she says. "Very. But I won't let this do what they want." She comes in. She doesn't hug you. But she sits beside you.`,`Las palabras salen antes de que puedas detenerlas. Ves cómo cada una la golpea.

Se queda callada mucho tiempo. "En tu cuarto", dice al fin. "Cambiándote la gasa de la cicatriz mientras dormías. Dos veces." Se da vuelta. "No te acuerdas porque Logan te dio calmantes."

Se va. Te quedas solo con el mural. Es lo peor que sentiste desde el túnel.

Una hora después, golpea la puerta. Los ojos rojos. "Estoy enojada", dice. "Mucho. Pero no voy a dejar que esto haga lo que ellos quieren." Entra. No te abraza. Pero se sienta a tu lado.`))+loseSan('2d4',L('o que você disse','what you said','lo que dijiste'))+bond('koranna'),go:'a4c_hub'}}}
  ]},

a4c_ataque:{act:KI,title:L('O interfone','The intercom','El interfono'),checkpoint:true,
  text:()=>P(L(`O interfone toca às onze da noite. A voz da Juliana, cortada: "Tem gente descendo. Não são clientes. Mada, eles sabem da esca—"

A linha cai. Lá em cima, vidro quebrando. Depois, silêncio de arma com silenciador.

Alguém disse a eles exatamente onde fica a Base. Alguém que sabia.`,
`The intercom buzzes at eleven at night. Juliana's voice, broken up: "There are people coming down. They're not customers. Mada, they know about the sta—"

The line goes dead. Upstairs, glass breaking. Then the silence of suppressed weapons.

Someone told them exactly where the Base is. Someone who knew.`,
`El interfono suena a las once de la noche. La voz de Juliana, entrecortada: "Hay gente bajando. No son clientes. Mada, saben de la esca—"

La línea se corta. Arriba, vidrio rompiéndose. Después, el silencio de armas con silenciador.

Alguien les dijo exactamente dónde queda la Base. Alguien que sabía.`)),
  choices:()=>[
    {label:L('Subir pela escada dos fundos','Go up the back stairs','Subir por la escalera de atrás'),main:true,
      run:()=>({text:P(L(`Você sobe de três em três degraus, de Raijin na mão, sem proteção, sem camisa, com a cicatriz ainda enfaixada. A Koranna vem atrás. O Derick vem atrás dela.`,`You take the stairs three at a time, Raijin in hand, no armor, no shirt, the scar still bandaged. Koranna follows. Derick follows her.`,`Subes de a tres escalones, con la Raijin en la mano, sin protección, sin remera, con la cicatriz todavía vendada. Koranna te sigue. Derick la sigue a ella.`)),combat:{id:'agentes',after:'a4c_juliana',allies:['koranna','derick16'],enemyFirst:true,winText:L('O último homem do Comprador cai em cima do balcão do bar, levando garrafas junto.','The last of the Buyer\'s men falls onto the bar counter, taking bottles with him.','El último hombre del Comprador cae sobre la barra, llevándose botellas con él.')}})}
  ]},

a4c_juliana:{act:KI,title:L('O bar destruído','The wrecked bar','El bar destrozado'),
  text:()=>{S.flags.a4ataque=true;return P(L(`O bar está destruído. Espelho quebrado, garrafas no chão, cheiro de álcool e pólvora. A Juliana está sentada atrás do balcão, com um corte na testa e um taco de beisebol na mão. Tem um dos homens desacordado aos pés dela.

"Eles sabiam do interfone", ela diz. "Sabiam da escada. Sabiam que a porta dos fundos emperra." Ela te olha. "Pouca gente sabe que aquela porta emperra, Mada. Pouca gente de fora."

No bolso de um dos homens, o Derick acha um bilhete com o endereço do bar escrito à mão. A letra é larga, apressada. Você já viu essa letra em algum lugar. Numa cobertura de bolo. "ADAN".`,
`The bar is wrecked. Broken mirror, bottles on the floor, the smell of alcohol and gunpowder. Juliana sits behind the counter with a cut on her forehead and a baseball bat in her hand. One of the men lies unconscious at her feet.

"They knew about the intercom," she says. "Knew about the stairs. Knew the back door sticks." She looks at you. "Not many people know that door sticks, Mada. Not many outsiders."

In one of the men's pockets, Derick finds a note with the bar's address written by hand. The writing is wide, hurried. You've seen this handwriting somewhere. On a cake's frosting. "ADAN".`,
`El bar está destrozado. Espejo roto, botellas en el piso, olor a alcohol y pólvora. Juliana está sentada detrás de la barra, con un corte en la frente y un bate de béisbol en la mano. Uno de los hombres está inconsciente a sus pies.

"Sabían del interfono", dice. "Sabían de la escalera. Sabían que la puerta de atrás se traba." Te mira. "Poca gente sabe que esa puerta se traba, Mada. Poca gente de afuera."

En el bolsillo de uno de los hombres, Derick encuentra una nota con la dirección del bar escrita a mano. La letra es ancha, apurada. Ya viste esta letra en algún lado. En el glaseado de una torta. "ADAN".`))+loseSan('1d6',L('a letra','the handwriting','la letra'))+bond('juliana')},
  choices:()=>[{label:L('Descer e montar o quadro','Go down and put the board together','Bajar y armar el mural'),main:true,run:()=>({go:'a4e_quadro'})}]},

a4e_quadro:{act:KI,title:L('Quem?','Who?','¿Quién?'),
  text:()=>P(L(`Você fica sozinho na frente do mural. A Koranna na porta, sem entrar. Você precisa dizer um nome em voz alta. Você já sabe qual é. Só não quer.

<b>Quem roubou a caixa e entregou a Base?</b>`,`You stand alone in front of the board. Koranna at the door, not coming in. You have to say a name out loud. You already know which one. You just don't want to.

<b>Who stole the box and gave up the Base?</b>`,`Te quedas solo frente al mural. Koranna en la puerta, sin entrar. Tienes que decir un nombre en voz alta. Ya sabes cuál es. Solo no quieres.

<b>¿Quién robó la caja y entregó la Base?</b>`))+hints([
    ['a4selo',L('O selo foi desfeito com a letra do Kavyur, ou de alguém que aprendeu com ele. O Kavyur mora com uma pessoa só.','The seal was undone in Kavyur\'s hand, or someone who learned from him. Kavyur lives with only one person.','El sello fue deshecho con la letra de Kavyur, o de alguien que aprendió de él. Kavyur vive con una sola persona.')],
    ['a4cafe',L('O Tuninho foi drogado com um café. Ele era a vítima, não o ladrão.','Tuninho was drugged with a coffee. He was the victim, not the thief.','A Tuninho lo drogaron con un café. Era la víctima, no el ladrón.')],
    ['a4chave',L('Alguém de casa fez um molde da chave do Flavio.','Someone who counts as family made a mold of Flavio\'s key.','Alguien de la casa hizo un molde de la llave de Flavio.')],
    ['a4chinelo',L('Bermuda e chinelo na câmera, às três da manhã.','Shorts and flip-flops on camera, at three a.m.','Bermudas y ojotas en la cámara, a las tres de la mañana.')],
    ['a4remedio',L('A Iris viu o VT sozinho na sala dos remédios.','Iris saw VT alone in the medicine room.','Iris vio a VT solo en la sala de remedios.')],
    ['a4sedativo',L('Sumiu sedativo da enfermaria, e a Iris sabe mais do que disse.','Sedative went missing, and Iris knows more than she said.','Desapareció sedante, e Iris sabe más de lo que dijo.')],
    ['a4pagina',L('Óleo de arma na página arrancada da Maitê.','Gun oil on the page torn from Maitê\'s notebook.','Aceite de arma en la página arrancada del cuaderno de Maitê.')],
    ['a4velho',L('"Um homem que conhece os irmãos Zart desde que eram meninos."','"A man who\'s known the Zart brothers since they were boys."','"Un hombre que conoce a los hermanos Zart desde que eran chicos."')],
    ['a4kavyur',L('"Não posso falar. Ele tá do lado."','"Can\'t talk. He\'s right here."','"No puedo hablar. Él está al lado."')]
  ])+`<p class="hint" style="margin-top:10px">${L('E o bilhete no bolso do homem do Comprador, com a letra de quem errou o seu nome num bolo.','And the note in the Buyer\'s man\'s pocket, in the handwriting of the man who misspelled your name on a cake.','Y la nota en el bolsillo del hombre del Comprador, con la letra de quien escribió mal tu nombre en una torta.')}</p>`,
  choices:()=>[
    {label:'Tuninho',run:()=>{S.flags.acusou='tuninho';return {go:'a4e_errado'}}},
    {label:'Maitê',run:()=>{S.flags.acusou='maite';return {go:'a4e_errado'}}},
    {label:'Flavio',run:()=>{S.flags.acusou='flavio';return {go:'a4e_errado'}}},
    {label:'Kavyur',run:()=>{S.flags.acusou='kavyur';return {go:'a4e_errado'}}},
    {label:'VT',run:()=>{S.flags.acusou='vt';return {go:'a4e_certo'}}}
  ]},

a4e_errado:{act:KI,title:L('O nome errado','The wrong name','El nombre equivocado'),
  text:()=>{const n={tuninho:'Tuninho',maite:'Maitê',flavio:'Flavio',kavyur:'Kavyur'}[S.flags.acusou];
    const r={
      tuninho:L(`O Tuninho não se defende. Tira os óculos tortos, limpa com a camiseta, coloca de volta. "Eu sabia que um dia ia ser eu", ele diz baixinho. "Ex-Formiga. É sempre o ex-Formiga." Ele não chora. É pior do que se chorasse.`,`Tuninho doesn't defend himself. He takes off his crooked glasses, wipes them on his shirt, puts them back on. "I knew someday it'd be me," he says quietly. "Ex-Formiga. It's always the ex-Formiga." He doesn't cry. It's worse than if he did.`,`Tuninho no se defiende. Se saca los anteojos torcidos, los limpia con la remera, se los vuelve a poner. "Sabía que algún día iba a ser yo", dice bajito. "Ex-Formiga. Siempre es el ex-Formiga." No llora. Es peor que si llorara.`),
      maite:L(`A Maitê fica parada, com o batom vinho pela metade. "Eu passei semanas tentando entender aquela coisa para proteger vocês", ela diz. "E você me olha como se eu fosse o Brenner." Ela guarda o batom e sai sem terminar.`,`Maitê stands still, her wine lipstick half applied. "I spent weeks trying to understand that thing to protect you," she says. "And you look at me like I'm Brenner." She puts the lipstick away and leaves without finishing.`,`Maitê se queda quieta, con el labial color vino a medio poner. "Pasé semanas intentando entender esa cosa para protegerlos", dice. "Y me miras como si fuera Brenner." Guarda el labial y se va sin terminar.`),
      flavio:L(`O Flavio coloca o chaveiro do arsenal em cima da mesa, devagar. "Vinte anos cuidando das armas dessa Ordem. Eu limpei o sangue do seu irmão daquele corredor." Ele empurra as chaves na sua direção. "Pode ficar."`,`Flavio sets the armory keyring on the table, slowly. "Twenty years looking after this Order's weapons. I cleaned your brother's blood off that corridor." He pushes the keys toward you. "You can keep them."`,`Flavio deja el llavero del arsenal sobre la mesa, despacio. "Veinte años cuidando las armas de esta Orden. Limpié la sangre de tu hermano de ese pasillo." Te empuja las llaves. "Quédatelas."`),
      kavyur:L(`Você diz o nome do Kavyur, e o Derick olha para você como se você tivesse batido nele. "O Kavyur mandou mensagem avisando", ele diz. "Ele é o único que avisou."`,`You say Kavyur's name, and Derick looks at you as if you'd hit him. "Kavyur texted to warn us," he says. "He's the only one who did."`,`Dices el nombre de Kavyur, y Derick te mira como si le hubieras pegado. "Kavyur mandó un mensaje para avisar", dice. "Es el único que avisó."`)
    }[S.flags.acusou];
    return P(L(`Você diz "${n}" em voz alta.`,`You say "${n}" out loud.`,`Dices "${n}" en voz alta.`)+'\n\n'+r+'\n\n'+L(`O seu celular toca. Número do hangar. A voz do Kavyur, baixa, rápida, com o barulho do elevador de carga no fundo.

"Adam. Me escuta. Não é ninguém daí." Uma pausa longa. "É o VT. Me desculpa. Eu devia ter te contado antes. Ele foi para o Fórum Velho com a caixa. Eu tô sozinho no hangar."

Você olha para o mural. Para o bilhete. Para a letra do bolo.

Você sabia. Você sempre soube. Você só não quis.`,`Your phone rings. The hangar number. Kavyur's voice, low, fast, with the freight elevator noise in the background.

"Adam. Listen to me. It's no one there." A long pause. "It's VT. I'm sorry. I should've told you before. He went to the Old Courthouse with the box. I'm alone at the hangar."

You look at the board. At the note. At the cake handwriting.

You knew. You always knew. You just didn't want to.`,`Te suena el celular. Número del hangar. La voz de Kavyur, baja, rápida, con el ruido del montacargas de fondo.

"Adam. Escúchame. No es nadie de ahí." Una pausa larga. "Es VT. Perdóname. Debí habértelo dicho antes. Se fue al Foro Viejo con la caja. Estoy solo en el hangar."

Miras el mural. La nota. La letra de la torta.

Lo sabías. Siempre lo supiste. Solo no quisiste.`))+loseSan('2d4',L('o nome errado','the wrong name','el nombre equivocado'))+loseSan('2d6',L('o VT','VT','VT'))},
  choices:()=>[{label:L('Ir até o hangar','Go to the hangar','Ir al hangar'),main:true,run:()=>({go:'a4f_hangar'})}]},

a4e_certo:{act:KI,title:'VT',
  text:()=>P(L(`Você diz o nome.

Não sai alto. Sai como quando você era criança e dizia uma coisa que ia fazer ela ser verdade.

"VT."

Ninguém na sala diz nada. A Koranna atravessa o quarto e segura a sua mão. Ela não diz "sinto muito". Ela só segura.

O seu celular toca. Número do hangar. A voz do Kavyur, baixa, rápida.

"Você descobriu, né?" Uma pausa longa. "Me desculpa, Adam. Eu devia ter te contado antes. Ele foi para o Fórum Velho com a caixa. Eu tô sozinho no hangar. Vem."`,
`You say the name.

It doesn't come out loud. It comes out the way things did when you were a kid, when saying something would make it true.

"VT."

Nobody in the room says anything. Koranna crosses the room and takes your hand. She doesn't say "I'm sorry". She just holds on.

Your phone rings. The hangar number. Kavyur's voice, low, fast.

"You figured it out, didn't you?" A long pause. "I'm sorry, Adam. I should've told you before. He went to the Old Courthouse with the box. I'm alone at the hangar. Come."`,
`Dices el nombre.

No sale fuerte. Sale como cuando eras chico y decir algo lo volvía verdad.

"VT."

Nadie en la sala dice nada. Koranna cruza el cuarto y te toma la mano. No dice "lo siento". Solo sostiene.

Te suena el celular. Número del hangar. La voz de Kavyur, baja, rápida.

"Lo descubriste, ¿no?" Una pausa larga. "Perdóname, Adam. Debí habértelo dicho antes. Se fue al Foro Viejo con la caja. Estoy solo en el hangar. Ven."`))+loseSan('2d6',L('o VT','VT','VT'))+bond('koranna',2),
  choices:()=>[{label:L('Ir até o hangar','Go to the hangar','Ir al hangar'),main:true,run:()=>({go:'a4f_hangar'})}]},

a4f_hangar:{act:K,title:L('O quarto do VT','VT\'s room','El cuarto de VT'),checkpoint:true,
  text:()=>P(L(`O elevador de carga desce fazendo o mesmo barulho de sempre. O Kavyur está sentado no último degrau com as mãos entre os joelhos. Ele tem um corte no lábio. Tentou impedir.

"Ele não é mau, Adam", o Kavyur diz antes de você perguntar qualquer coisa. "Ele só nunca parou de enterrar vocês."

A porta do quarto do VT está aberta pela primeira vez desde que você tinha dezoito anos.`,
`The freight elevator goes down with the same noise as always. Kavyur is sitting on the bottom step with his hands between his knees. He has a cut on his lip. He tried to stop him.

"He's not evil, Adam," Kavyur says before you ask anything. "He just never stopped burying you."

VT's bedroom door is open for the first time since you were eighteen.`,
`El montacargas baja haciendo el mismo ruido de siempre. Kavyur está sentado en el último escalón con las manos entre las rodillas. Tiene un corte en el labio. Intentó detenerlo.

"No es malo, Adam", dice Kavyur antes de que preguntes nada. "Solo nunca dejó de enterrarlos."

La puerta del cuarto de VT está abierta por primera vez desde que tenías dieciocho años.`)),
  choices:()=>[
    {once:'quartovt',label:L('Entrar no quarto do VT','Go into VT\'s room','Entrar en el cuarto de VT'),
      run:()=>({text:P(L(`Uma cama de campanha. Uma TV velha. E, na parede inteira, fotos. Você com dezoito anos, de Raijin nova na mão. O Thomas montando o fuzil. O Bob, de catorze, com as correntes enroladas no braço, fazendo careta. O bolo com "ADAN" escrito errado. Os três dormindo no sofá do porão. Dezenas.

Na mesa, uma caixa de sapato cheia de envelopes. Todos com o mesmo destinatário, na letra larga e apressada.

"Bob."

Nenhum foi enviado.`,`A camp bed. An old TV. And, covering the entire wall, photos. You at eighteen, a brand-new Raijin in your hand. Thomas assembling the rifle. Bob, fourteen, chains wrapped around his arm, pulling a face. The cake with "ADAN" misspelled. The three of you asleep on the basement couch. Dozens.

On the desk, a shoebox full of envelopes. All to the same person, in wide, hurried handwriting.

"Bob."

None were ever sent.`,`Una cama de campaña. Una tele vieja. Y, cubriendo toda la pared, fotos. Tú a los dieciocho, con la Raijin nueva en la mano. Thomas armando el fusil. Bob, de catorce, con las cadenas en el brazo, haciendo una mueca. La torta con "ADAN" mal escrito. Los tres dormidos en el sillón del sótano. Decenas.

Sobre el escritorio, una caja de zapatos llena de sobres. Todos para la misma persona, con letra ancha y apurada.

"Bob."

Ninguno fue enviado.`))+loseSan('1d4',L('as fotos','the photos','las fotos'))})},
    {once:'cartas',label:L('Ler uma das cartas','Read one of the letters','Leer una de las cartas'),test:{sk:'Vontade',dt:18},
      ok:()=>({text:P(L(`"Bob. Hoje fez um ano. Eu não fui no seu enterro porque eu fui o motivo. Eu contei para um homem o que era uma luva velha guardada no cofre da Base. Ninguém lá sabia que ela era uma relíquia. Eu sabia. Ele disse que ia pegar sem ninguém ver. Eu queria que a Ordem pagasse por ter levado vocês de mim. Eu não sabia que você ia estar lá. Eu juro que não sabia.

Tem uma coisa que escreve as regras do mundo, Bob. Eu vou achar. Eu vou reescrever aquela noite. Você vai estar vivo, e o Thomas, e o Adam não vai ter aquela cara nunca mais.

Me perdoa. Ou não precisa. Só volta."

Você dobra a carta. As suas mãos estão firmes. Você não sabe como.`,`"Bob. It's been a year today. I didn't go to your funeral because I was the reason. I told a man what an old glove kept in the Base's vault really was. Nobody there knew it was a relic. I did. He said he'd take it without anyone seeing. I wanted the Order to pay for taking you from me. I didn't know you'd be there. I swear I didn't know.

There's a thing that writes the rules of the world, Bob. I'm going to find it. I'm going to rewrite that night. You'll be alive, and Thomas, and Adam will never have that look on his face again.

Forgive me. Or you don't have to. Just come back."

You fold the letter. Your hands are steady. You don't know how.`,`"Bob. Hoy se cumple un año. No fui a tu entierro porque yo fui el motivo. Le dije a un hombre qué era un guante viejo guardado en la bóveda de la Base. Nadie ahí sabía que era una reliquia. Yo sí. Dijo que lo iba a sacar sin que nadie viera. Quería que la Orden pagara por habérmelos quitado. No sabía que ibas a estar ahí. Te juro que no sabía.

Hay una cosa que escribe las reglas del mundo, Bob. La voy a encontrar. Voy a reescribir esa noche. Vas a estar vivo, y Thomas, y Adam no va a tener esa cara nunca más.

Perdóname. O no hace falta. Solo vuelve."

Doblas la carta. Tienes las manos firmes. No sabes cómo.`))+addClue('a4velho')+bond('bob')}),
      fail:()=>({text:P(L(`Você lê a primeira linha. "Bob. Hoje fez um ano. Eu não fui no seu enterro porque eu fui o motivo."

Você não consegue ler a segunda. Você senta no chão do quarto do VT, com a carta no colo, e chora pela primeira vez desde o posto de gasolina. A Koranna senta do seu lado e não diz nada. O Kavyur fecha a porta para vocês.`,`You read the first line. "Bob. It's been a year today. I didn't go to your funeral because I was the reason."

You can't read the second. You sit on the floor of VT's room with the letter in your lap and cry for the first time since the gas station. Koranna sits beside you and says nothing. Kavyur closes the door for you.`,`Lees la primera línea. "Bob. Hoy se cumple un año. No fui a tu entierro porque yo fui el motivo."

No puedes leer la segunda. Te sientas en el piso del cuarto de VT, con la carta en el regazo, y lloras por primera vez desde la estación de servicio. Koranna se sienta a tu lado y no dice nada. Kavyur les cierra la puerta.`))+loseSan('2d6',L('a carta','the letter','la carta'))+bond('koranna',2)})},
    {once:'kavconta',label:L('Ouvir o Kavyur','Listen to Kavyur','Escuchar a Kavyur'),
      run:()=>({text:P(L(`"Ele me contou tudo na noite do enterro do Bob. Bêbado, chorando no chão da cozinha. Depois nunca mais falou disso." O Kavyur passa a mão no corte do lábio. "Quando você desceu aqui pedindo ajuda com o Sílvio, eu vi a cara dele. Ele achou que era um sinal. Que dava para consertar."

Ele olha para você. "Ele ajudou vocês com o trono e com a usina porque o Comprador precisava das relíquias contidas. Em troca, o Comprador disse onde a Magistrada ia acordar. Hoje à noite. No Fórum Velho." Ele engole em seco. "Ele não quer poder, Adam. Ele quer o Bob."`,`"He told me everything the night of Bob's funeral. Drunk, crying on the kitchen floor. Then he never mentioned it again." Kavyur touches the cut on his lip. "When you came down here asking for help with Sílvio, I saw his face. He thought it was a sign. That it could be fixed."

He looks at you. "He helped you with the throne and the plant because the Buyer needed the relics contained. In exchange, the Buyer told him where the Magistrate would wake. Tonight. At the Old Courthouse." He swallows. "He doesn't want power, Adam. He wants Bob."`,`"Me contó todo la noche del entierro de Bob. Borracho, llorando en el piso de la cocina. Después nunca más habló de eso." Kavyur se toca el corte del labio. "Cuando bajaste a pedir ayuda con Sílvio, le vi la cara. Pensó que era una señal. Que se podía arreglar."

Te mira. "Los ayudó con el trono y con la usina porque el Comprador necesitaba las reliquias contenidas. A cambio, el Comprador le dijo dónde iba a despertar la Magistrada. Esta noche. En el Foro Viejo." Traga saliva. "No quiere poder, Adam. Quiere a Bob."`))+bond('kavyur',2)})},
    {label:L('Voltar para a Base e se preparar','Go back to the Base and get ready','Volver a la Base y prepararte'),main:true,run:()=>({go:'a4g_noite'})}

a4g_noite:{act:K,title:L('A noite antes','The night before','La noche antes'),checkpoint:true,
  text:()=>P(L(`O Fórum Velho abre à meia-noite do dia seguinte, segundo a página arrancada. Vocês têm uma noite.

O Derick passa por você no corredor e para. "Se for ele na sua frente", ele pergunta, "você consegue?"

Você não responde. Ele entende. Ele te abraça rápido, forte, e vai dormir.

No seu quarto, a Koranna está sentada na cama, com a lança encostada na parede. Não é para trocar a gaze. Os dois sabem disso.`,
`The Old Courthouse opens at midnight tomorrow, according to the torn page. You have one night.

Derick passes you in the hallway and stops. "If it's him in front of you," he asks, "can you do it?"

You don't answer. He understands. He hugs you, quick and hard, and goes to bed.

In your room, Koranna is sitting on the bed, her spear leaning against the wall. It isn't to change the gauze. You both know it.`,
`El Foro Viejo se abre a la medianoche de mañana, según la página arrancada. Tienen una noche.

Derick pasa a tu lado en el pasillo y se detiene. "Si es él el que está delante", pregunta, "¿puedes?"

No respondes. Él entiende. Te abraza, rápido y fuerte, y se va a dormir.

En tu cuarto, Koranna está sentada en la cama, con la lanza apoyada en la pared. No es para cambiar la gasa. Los dos lo saben.`)),
  choices:()=>[
    {label:L('"Eu te amo."','"I love you."','"Te amo."'),main:true,test:{sk:'Vontade',dt:16},
      ok:()=>{S.flags.teamo=true;return {text:P(L(`Você nunca disse isso para ninguém que não fosse da sua família. Sai simples. Sem tremer.

"Eu te amo, Koranna."

Ela fica olhando para você por muito tempo, como se estivesse guardando o momento. Depois sorri, com os olhos cheios.

"Eu também te amo, Adam", ela diz. A voz falha no meio. "Faz tempo. Eu só tava esperando você saber também."

Ela apaga a luz. Dessa vez, ela fica a noite inteira. E, pela primeira vez em nove anos, você não conta os dias. Você só dorme.`,`You've never said this to anyone who wasn't family. It comes out simple. Without shaking.

"I love you, Koranna."

She looks at you for a long time, as if storing the moment. Then she smiles, her eyes full.

"I love you too, Adam," she says. Her voice breaks in the middle. "For a long time now. I was just waiting for you to know it too."

She turns off the light. This time, she stays the whole night. And for the first time in nine years, you don't count the days. You just sleep.`,`Nunca se lo dijiste a nadie que no fuera de tu familia. Sale simple. Sin temblar.

"Te amo, Koranna."

Ella te mira mucho tiempo, como si guardara el momento. Después sonríe, con los ojos llenos.

"Yo también te amo, Adam", dice. La voz se le quiebra a la mitad. "Hace tiempo. Solo estaba esperando que tú también lo supieras."

Apaga la luz. Esta vez, se queda toda la noche. Y, por primera vez en nueve años, no cuentas los días. Solo duermes.`))+bond('koranna',4)+calm(10),go:'a4h_forum'}},
      fail:()=>({text:P(L(`As palavras estão ali, na garganta, inteiras. Não saem. Você abre a boca duas vezes.

Ela levanta, atravessa o quarto e coloca a mão na sua cicatriz. "Não precisa ter pressa", ela sussurra. "Eu tô aqui."

E então sai. Baixinho, quebrado, quase sem voz: "Eu te amo."

Ela encosta a testa na sua. "Eu também te amo, Adam. Eu também."

Ela apaga a luz e fica a noite inteira. Você dorme com a mão dela no seu peito, em cima do raio.`,`The words are right there in your throat, whole. They won't come out. You open your mouth twice.

She gets up, crosses the room and puts her hand on your scar. "There's no rush," she whispers. "I'm here."

And then it comes out. Quietly, broken, almost voiceless: "I love you."

She rests her forehead against yours. "I love you too, Adam. I do."

She turns off the light and stays the whole night. You sleep with her hand on your chest, on top of the lightning.`,`Las palabras están ahí, en la garganta, enteras. No salen. Abres la boca dos veces.

Ella se levanta, cruza el cuarto y pone la mano sobre tu cicatriz. "No hay apuro", susurra. "Estoy aquí."

Y entonces sale. Bajito, quebrado, casi sin voz: "Te amo."

Apoya la frente contra la tuya. "Yo también te amo, Adam. Yo también."

Apaga la luz y se queda toda la noche. Duermes con su mano en tu pecho, encima del rayo.`))+bond('koranna',3)+calm(8),go:'a4h_forum'})}
  ]},

a4h_forum:{act:KF,title:L('O Fórum Velho','The Old Courthouse','El Foro Viejo'),checkpoint:true,
  text:()=>P(L(`Um tribunal de 1890, abandonado, com colunas rachadas e pombos no teto. Meia-noite.

No salão principal, onde ficava o júri, a esfera de Energia está no chão, aberta, soltando raios que sobem pelas paredes e acendem letras que não eram para existir. No alto, na mesa do juiz, uma cadeira vazia. E um livro aberto, grosso como uma porta, virando as próprias páginas. Escrevendo sozinho.

A Magistrada.

Na frente do livro, de costas para vocês, de bermuda e chinelo, com uma caneta preta na mão esquerda: o VT.

Ele não se vira. "Você achou mais rápido do que eu pensei", ele diz. "O Thomas ia ficar orgulhoso."`,
`An 1890 courthouse, abandoned, with cracked columns and pigeons in the rafters. Midnight.

In the main hall, where the jury used to sit, the Energy sphere lies open on the floor, throwing lightning that climbs the walls and lights up letters that shouldn't exist. Up high, at the judge's bench, an empty chair. And an open book, thick as a door, turning its own pages. Writing by itself.

The Magistrate.

In front of the book, his back to you, in shorts and flip-flops, a black pen in his left hand: VT.

He doesn't turn around. "You found it faster than I thought," he says. "Thomas would've been proud."`,
`Un tribunal de 1890, abandonado, con columnas agrietadas y palomas en el techo. Medianoche.

En el salón principal, donde se sentaba el jurado, la esfera de Energía está en el piso, abierta, soltando rayos que suben por las paredes y encienden letras que no deberían existir. Arriba, en el estrado del juez, una silla vacía. Y un libro abierto, grueso como una puerta, pasando sus propias páginas. Escribiendo solo.

La Magistrada.

Frente al libro, de espaldas, de bermudas y ojotas, con una pluma negra en la mano izquierda: VT.

No se da vuelta. "Lo encontraste más rápido de lo que pensé", dice. "Thomas habría estado orgulloso."`))+loseSan('1d6',L('a Magistrada','the Magistrate','la Magistrada')),
  choices:()=>[
    {once:'ouvirvt',label:L('Deixar ele falar','Let him talk','Dejarlo hablar'),
      run:()=>({text:P(L(`Ele se vira. Os olhos vermelhos. A mão suja de tinta até o pulso.

"Esse livro escreve as regras, Adam. Tudo. Quem vive, quem morre, que noite aconteceu e qual não." A voz dele quebra. "Eu posso escrever que o Leon nunca abriu aquele cofre. Que o Bob nunca entrou naquele túnel. Que o Thomas tá vivo, organizando pasta num escritório chato." Ele dá um passo. "Eu posso escrever o aniversário do seu vô. Sem os vizinhos no portão. Sua mãe lavando a louça. Seu pai rindo da história do fogo."

Ele estende a caneta para você.

"Me deixa devolver o que eu tirei de vocês."`,`He turns around. Red eyes. Hand stained with ink up to the wrist.

"This book writes the rules, Adam. All of them. Who lives, who dies, which night happened and which didn't." His voice breaks. "I can write that Leon never opened that vault. That Bob never went into that tunnel. That Thomas is alive, filing folders in some boring office." He takes a step. "I can write your grandpa's birthday. Without the neighbors at the gate. Your mom washing the dishes. Your dad laughing at the fire story."

He holds out the pen to you.

"Let me give back what I took from you."`,`Se da vuelta. Los ojos rojos. La mano manchada de tinta hasta la muñeca.

"Este libro escribe las reglas, Adam. Todas. Quién vive, quién muere, qué noche pasó y cuál no." Se le quiebra la voz. "Puedo escribir que Leon nunca abrió esa bóveda. Que Bob nunca entró en ese túnel. Que Thomas está vivo, ordenando carpetas en una oficina aburrida." Da un paso. "Puedo escribir el cumpleaños de tu abuelo. Sin los vecinos en el portón. Tu mamá lavando los platos. Tu papá riéndose de la historia del fuego."

Te tiende la pluma.

"Déjame devolverte lo que te quité."`))+loseSan('2d4',L('a oferta','the offer','la oferta'))})},
    {label:L('"Não, VT."','"No, VT."','"No, VT."'),main:true,
      run:()=>({text:P(L(`"Não, VT." A sua voz sai calma. Mais calma do que você está. "O Bob morreu. O Thomas morreu. Os meus pais morreram. E eu passei nove anos sobrevivendo a isso. Você não vai apagar o que a gente virou."

O VT fecha os olhos. Quando abre, eles estão secos.

"Então sai da frente", ele diz, e tira o M4 do ombro. "Porque eu não vou parar."`,`"No, VT." Your voice comes out calm. Calmer than you are. "Bob died. Thomas died. My parents died. And I spent nine years surviving it. You're not going to erase what we became."

VT closes his eyes. When he opens them, they're dry.

"Then get out of the way," he says, and slides the M4 off his shoulder. "Because I'm not stopping."`,`"No, VT." Tu voz sale calma. Más calma de lo que estás. "Bob murió. Thomas murió. Mis padres murieron. Y pasé nueve años sobreviviendo a eso. No vas a borrar lo que nos volvimos."

VT cierra los ojos. Cuando los abre, están secos.

"Entonces sal del medio", dice, y se descuelga el M4 del hombro. "Porque no voy a parar."`)),combat:{id:'vtfinal',after:'a4i_livro',allies:['koranna','derick16'],script:'magistrada'}})}
  ]},

a4i_livro:{act:KF,title:L('Uma linha','One line','Una línea'),
  text:()=>P(L(`O VT está de joelhos no pé da mesa do juiz, com o M4 descarregado no chão e sangue escorrendo do ombro. Ele ainda está com a caneta na mão. O livro, acima dele, continua aberto. Esperando.

"Uma linha", ele diz. Não para você. Para o livro, para o chão, para ninguém. "Só uma. O Bob vivo. Só isso. Eu nem preciso estar lá."

Ele levanta a mão com a caneta, tremendo.

A Maitê disse uma vez, com o guardanapo na mão: Conhecimento cede ao Sangue. Você olha para a sua palma. Para a Raijin.`,
`VT is on his knees at the foot of the judge's bench, the M4 empty on the floor and blood running from his shoulder. He's still holding the pen. The book above him is still open. Waiting.

"One line," he says. Not to you. To the book, to the floor, to no one. "Just one. Bob alive. That's all. I don't even need to be there."

He raises his hand with the pen, shaking.

Maitê said it once, napkin in hand: Knowledge yields to Blood. You look at your palm. At Raijin.`,
`VT está de rodillas al pie del estrado, con el M4 descargado en el piso y sangre chorreándole del hombro. Todavía tiene la pluma en la mano. El libro, encima de él, sigue abierto. Esperando.

"Una línea", dice. No a ti. Al libro, al piso, a nadie. "Solo una. Bob vivo. Nada más. Ni siquiera necesito estar ahí."

Levanta la mano con la pluma, temblando.

Maitê lo dijo una vez, con la servilleta en la mano: el Conocimiento cede ante la Sangre. Te miras la palma. La Raijin.`)),
  choices:()=>[
    {once:'deixar',label:L('Deixar ele tentar','Let him try','Dejarlo intentar'),
      run:()=>({text:P(L(`Você não se mexe. O VT encosta a caneta no papel e escreve, devagar, com a letra larga e apressada: "Bob Zart está vivo."

A tinta fica vermelha. Depois as letras se reorganizam sozinhas, uma por uma, até formar outra frase.

"Para que um volte, quem escreve fica no lugar."

O VT olha para aquilo por muito tempo. Depois ri. Um riso quebrado, molhado. "Tá bom", ele diz. "Tá bom. Eu aceito." Ele levanta a caneta de novo.

Você entende o que ele vai fazer.`,`You don't move. VT touches the pen to the page and writes, slowly, in wide, hurried letters: "Bob Zart is alive."

The ink turns red. Then the letters rearrange themselves, one by one, into another sentence.

"For one to return, the one who writes takes his place."

VT stares at it for a long time. Then he laughs. A broken, wet laugh. "All right," he says. "All right. I accept." He raises the pen again.

You understand what he's about to do.`,`No te mueves. VT apoya la pluma en el papel y escribe, despacio, con su letra ancha y apurada: "Bob Zart está vivo."

La tinta se vuelve roja. Después las letras se reordenan solas, una por una, hasta formar otra frase.

"Para que uno vuelva, el que escribe ocupa su lugar."

VT mira eso mucho tiempo. Después se ríe. Una risa rota, mojada. "Está bien", dice. "Está bien. Acepto." Vuelve a levantar la pluma.

Entiendes lo que va a hacer.`))+loseSan('2d4',L('a frase do livro','the book\'s sentence','la frase del libro'))})},
    {label:L('Fechar o livro com o seu sangue','Close the book with your blood','Cerrar el libro con tu sangre'),main:true,test:{sk:'Vontade',dt:20},
      ok:()=>({text:P(L(`Você passa a palma da mão na lâmina da Raijin e segura o pulso do VT antes que a caneta encoste no papel.

"Não", você diz. "O Bob não ia querer voltar assim."

Você bate a mão ensanguentada no centro do livro. O sangue dos Zart. O mesmo do seu pai, que voltou num set para buscar um par de luvas.

O livro grita sem boca. As páginas param de virar. As letras nas paredes apagam uma por uma. A Magistrada fecha, com o som de uma porta pesada, e fica ali, em cima da mesa do juiz, com a marca da sua mão vermelha na capa.

O VT solta a caneta. E chora, de joelhos, com a cabeça encostada na sua perna, como você nunca imaginou que um dia ia ver.`,`You drag your palm along Raijin's blade and grab VT's wrist before the pen touches the page.

"No," you say. "Bob wouldn't want to come back like this."

You slam your bloody hand onto the center of the book. Zart blood. The same as your father's, who went back to a set to get a pair of gloves.

The book screams without a mouth. The pages stop turning. The letters on the walls go out one by one. The Magistrate closes, with the sound of a heavy door, and lies there on the judge's bench with your red handprint on its cover.

VT drops the pen. And cries, on his knees, his head against your leg, in a way you never imagined you'd see.`,`Te pasas la palma por la hoja de la Raijin y le agarras la muñeca a VT antes de que la pluma toque el papel.

"No", dices. "Bob no querría volver así."

Golpeas con la mano ensangrentada el centro del libro. La sangre de los Zart. La misma que la de tu padre, que volvió a un set a buscar un par de guantes.

El libro grita sin boca. Las páginas dejan de pasar. Las letras de las paredes se apagan una por una. La Magistrada se cierra, con el sonido de una puerta pesada, y queda ahí, sobre el estrado, con la marca roja de tu mano en la tapa.

VT suelta la pluma. Y llora, de rodillas, con la cabeza apoyada en tu pierna, como nunca imaginaste que ibas a ver.`))+bond('vt',3)+calm(4),go:'a4j_destino'}),
      fail:()=>({text:P(L(`Você corta a palma na Raijin, mas a sua mão treme. Uma parte de você quer deixar ele escrever. Quer o Bob de volta, rindo no colchão.

A caneta encosta no papel.

Então a Koranna segura o seu pulso, a mão ensanguentada, e empurra junto com você. As duas mãos batem no centro do livro ao mesmo tempo.

A Magistrada fecha, com o som de uma porta pesada. As letras nas paredes apagam. O VT solta a caneta e cai de lado no chão, soluçando.

Você fica de joelhos, com a mão na capa, e a Koranna com a mão por cima da sua. Nenhum dos dois consegue soltar.`,`You cut your palm on Raijin, but your hand shakes. Part of you wants to let him write. Wants Bob back, laughing on the mattress.

The pen touches the page.

Then Koranna grabs your bloody wrist and pushes with you. Both hands hit the center of the book at the same time.

The Magistrate closes, with the sound of a heavy door. The letters on the walls go out. VT drops the pen and falls onto his side on the floor, sobbing.

You stay on your knees, your hand on the cover, and Koranna's hand on top of yours. Neither of you can let go.`,`Te cortas la palma con la Raijin, pero te tiembla la mano. Una parte de ti quiere dejarlo escribir. Quiere a Bob de vuelta, riéndose en el colchón.

La pluma toca el papel.

Entonces Koranna te agarra la muñeca ensangrentada y empuja contigo. Las dos manos golpean el centro del libro al mismo tiempo.

La Magistrada se cierra, con el sonido de una puerta pesada. Las letras de las paredes se apagan. VT suelta la pluma y cae de costado al piso, sollozando.

Te quedas de rodillas, con la mano en la tapa, y la mano de Koranna encima de la tuya. Ninguno puede soltar.`))+loseSan('2d6',L('o livro','the book','el libro'))+bond('koranna',3)+bond('vt',2),go:'a4j_destino'})}
  ]},

a4j_destino:{act:KF,title:L('A última lição','The last lesson','La última lección'),
  text:()=>P(L(`O Kavyur chega de moto meia hora depois, sem capacete, e para na porta do salão. Ele vê o VT sentado no chão, de costas para a coluna, com o ombro enfaixado pelo Derick. Não diz nada. Só atravessa o salão e senta do lado dele, como fazia no hangar.

O VT fala sem levantar a cabeça. "O Comprador me ligou uma vez só, com voz. Faz anos. Ele sabia o seu nome, Adam. O seu nome de verdade. Sabia antes de mim." Ele respira. "E disse que a última relíquia ele não precisa procurar. Que a Morte sempre vem até quem espera."

Então ele levanta a mão esquerda. A tinta preta não parou no pulso. Subiu pelo braço enquanto vocês lutavam, e agora passa do ombro em linhas finas, como letras, subindo pelo pescoço.

"O livro cobra de quem tira a caneta dele", ele diz. "Eu achei que era lenda." Ele sorri, cansado. "Quando chegar nos olhos, eu viro a mão dele. Vou escrever o que ele mandar. Pra quem pagar mais. Pro Comprador, talvez."

A Koranna liga para a Maitê no viva-voz. A voz dela treme do outro lado. "Não tem como tirar, Mada. Conhecimento só cede ao Sangue." Um silêncio. "Ao seu."

O VT olha para a Raijin na sua mão. Depois para você.

"Eu te ensinei a segurar ela", ele diz. "Deixa eu ver se você aprendeu."`,
`Kavyur arrives on a motorcycle half an hour later, no helmet, and stops at the hall door. He sees VT sitting on the floor, back against a column, his shoulder bandaged by Derick. He says nothing. He just crosses the hall and sits down beside him, the way he used to at the hangar.

VT speaks without lifting his head. "The Buyer called me only once, with his own voice. Years ago. He knew your name, Adam. Your real name. He knew it before I did." He breathes. "And he said he doesn't need to look for the last relic. That Death always comes to whoever waits."

Then he raises his left hand. The black ink didn't stop at the wrist. It climbed his arm while you fought, and now it's past his shoulder in thin lines, like letters, crawling up his neck.

"The book collects from whoever takes its pen," he says. "I thought it was a legend." He smiles, tired. "When it reaches my eyes, I become its hand. I'll write whatever it tells me to. For whoever pays most. For the Buyer, maybe."

Koranna calls Maitê on speaker. Her voice shakes on the other end. "There's no way to take it off, Mada. Knowledge only yields to Blood." A silence. "To yours."

VT looks at the Raijin in your hand. Then at you.

"I taught you how to hold her," he says. "Let me see if you learned."`,
`Kavyur llega en moto media hora después, sin casco, y se detiene en la puerta del salón. Ve a VT sentado en el piso, con la espalda contra una columna, el hombro vendado por Derick. No dice nada. Solo cruza el salón y se sienta a su lado, como hacía en el hangar.

VT habla sin levantar la cabeza. "El Comprador me llamó una sola vez, con su voz. Hace años. Sabía tu nombre, Adam. Tu nombre de verdad. Lo sabía antes que yo." Respira. "Y dijo que la última reliquia no necesita buscarla. Que la Muerte siempre llega a quien espera."

Entonces levanta la mano izquierda. La tinta negra no se detuvo en la muñeca. Le subió por el brazo mientras peleaban, y ahora pasa del hombro en líneas finas, como letras, trepándole por el cuello.

"El libro le cobra a quien le saca la pluma", dice. "Creí que era una leyenda." Sonríe, cansado. "Cuando llegue a los ojos, me convierto en su mano. Voy a escribir lo que me mande. Para quien pague más. Para el Comprador, quizás."

Koranna llama a Maitê en altavoz. Su voz tiembla del otro lado. "No hay forma de sacarla, Mada. El Conocimiento solo cede ante la Sangre." Un silencio. "Ante la tuya."

VT mira la Raijin en tu mano. Después a ti.

"Te enseñé a sostenerla", dice. "Déjame ver si aprendiste."`))+loseSan('1d6',L('a tinta subindo','the ink climbing','la tinta subiendo')),
  choices:()=>[
    {once:'porque4',label:L('Perguntar por que ele nunca contou','Ask why he never told you','Preguntarle por qué nunca te lo contó'),
      run:()=>({text:P(L(`"Por que você não me contou?", você pergunta. "Nove anos. Você me viu procurando."

"Porque você ia me perdoar." Ele finalmente te olha. "Você é assim, Adam. Você ia me perdoar, e eu ia ter que viver com isso. Era mais fácil você me odiar."

"Eu não consigo."

"Eu sei." Ele encosta a cabeça na coluna. "Por isso eu tô pedindo pra você."`,`"Why didn't you tell me?" you ask. "Nine years. You watched me searching."

"Because you'd forgive me." He finally looks at you. "That's how you are, Adam. You'd forgive me, and I'd have to live with it. It was easier if you hated me."

"I can't."

"I know." He leans his head back against the column. "That's why I'm asking you."`,`"¿Por qué no me lo contaste?", preguntas. "Nueve años. Me viste buscando."

"Porque me ibas a perdonar." Por fin te mira. "Eres así, Adam. Me ibas a perdonar, y yo iba a tener que vivir con eso. Era más fácil que me odiaras."

"No puedo."

"Lo sé." Apoya la cabeza contra la columna. "Por eso te lo pido a ti."`))+bond('vt')})},
    {once:'kavdesp',label:L('Deixar o Kavyur se despedir','Let Kavyur say goodbye','Dejar que Kavyur se despida'),
      run:()=>({text:P(L(`Você se afasta dois passos. O Kavyur segura o rosto do VT com as duas mãos, testa com testa. A tinta já chegou no queixo.

Você não ouve o que eles dizem. Só o fim, quando o VT levanta a voz o bastante para você escutar.

"Cuida dele pra mim, Adam. Ele vai querer ir com vocês." Uma pausa. "Deixa ele ir."

O Kavyur levanta e fica do seu lado. Ele não chora. Ainda não.`,`You step back two paces. Kavyur holds VT's face in both hands, forehead to forehead. The ink has reached his chin.

You can't hear what they say. Only the end, when VT raises his voice enough for you to hear.

"Look after him for me, Adam. He'll want to go with you." A pause. "Let him."

Kavyur gets up and stands beside you. He doesn't cry. Not yet.`,`Te alejas dos pasos. Kavyur le sostiene la cara a VT con las dos manos, frente con frente. La tinta ya le llegó al mentón.

No oyes lo que se dicen. Solo el final, cuando VT levanta la voz lo suficiente para que escuches.

"Cuídamelo, Adam. Va a querer irse con ustedes." Una pausa. "Déjalo."

Kavyur se levanta y se queda a tu lado. No llora. Todavía no.`))+bond('kavyur',2)})},
    {label:L('Segurar a Raijin do jeito que ele ensinou','Hold the Raijin the way he taught you','Sostener la Raijin como él te enseñó'),main:true,
      run:()=>{S.flags.vtmorto=true;return {text:P(L(`Você fica de pé na frente dele. O Derick vira o rosto. A Koranna não. Ela fica, porque sabe que você vai precisar que alguém tenha visto.

"Pés firmes", o VT diz, como no primeiro treino, no galpão. "Ombro solto. Respira."

Você respira.

"Não fecha os olhos, garoto. Nunca fecha os olhos."

A tinta chega na borda do olho dele. Ele não pisca.

"Eu te amo, velho", você diz. É a primeira vez que você diz isso para ele. Vai ser a última.

"Eu sei." Ele sorri. "Volta inteiro. Sempre."

Um corte só. Limpo. Do jeito que ele ensinou.

As letras no pescoço dele param de subir. Depois clareiam, uma por uma, até sumir. A caneta rola do banco do juiz e cai no chão sem fazer barulho.

O Kavyur grita. Um som que você já ouviu antes, saindo da sua própria garganta, nove anos atrás, num quarto cheio de sangue.

Você fica ali, de joelhos, segurando o VT até ele esfriar. Ninguém te pede para soltar.`,`You stand in front of him. Derick turns his face away. Koranna doesn't. She stays, because she knows you'll need someone to have seen it.

"Feet planted," VT says, like at the first training session, in the warehouse. "Loose shoulder. Breathe."

You breathe.

"Don't close your eyes, kid. Never close your eyes."

The ink reaches the rim of his eye. He doesn't blink.

"I love you, old man," you say. It's the first time you've said it to him. It'll be the last.

"I know." He smiles. "Come back in one piece. Always."

One cut. Clean. The way he taught you.

The letters on his neck stop climbing. Then they fade, one by one, until they're gone. The pen rolls off the judge's bench and hits the floor without a sound.

Kavyur screams. A sound you've heard before, coming out of your own throat, nine years ago, in a room full of blood.

You stay there, on your knees, holding VT until he goes cold. Nobody asks you to let go.`,`Te pones de pie frente a él. Derick aparta la cara. Koranna no. Se queda, porque sabe que vas a necesitar que alguien lo haya visto.

"Pies firmes", dice VT, como en el primer entrenamiento, en el galpón. "Hombro suelto. Respira."

Respiras.

"No cierres los ojos, chico. Nunca cierres los ojos."

La tinta llega al borde de su ojo. No parpadea.

"Te quiero, viejo", dices. Es la primera vez que se lo dices. Va a ser la última.

"Lo sé." Sonríe. "Vuelve entero. Siempre."

Un solo corte. Limpio. Como él te enseñó.

Las letras de su cuello dejan de subir. Después se aclaran, una por una, hasta desaparecer. La pluma rueda del estrado y cae al piso sin hacer ruido.

Kavyur grita. Un sonido que ya oíste antes, saliendo de tu propia garganta, hace nueve años, en un cuarto lleno de sangre.

Te quedas ahí, de rodillas, sosteniendo a VT hasta que se enfría. Nadie te pide que lo sueltes.`))+loseSan('3d6',L('a Raijin, nas suas mãos','the Raijin, in your hands','la Raijin, en tus manos'))+bond('koranna'),go:'a4k_fim'}}}
  ]},

a4k_fim:{act:K,title:L('Fim do Capítulo 4','End of Chapter 4','Fin del Capítulo 4'),
  text:()=>P(L(`Vocês enterram o VT no dia seguinte, no terreno atrás do hangar. De bermuda e chinelo. O M4 descarregado em cima do caixão. O Kavyur cava sozinho e não deixa ninguém ajudar.

Quando a terra termina de cobrir, ele finca a pá no chão e vem até você, com as mãos sujas e os olhos vermelhos.

"Ele disse que eu ia querer ir com vocês." Ele engole seco. "Ele tava certo. Eu quero entrar na Ordem, Mada. Não por ele. Pelo Comprador. Eu quero estar lá quando você achar esse homem."

Você estende a mão. Ele aperta, e não solta por um tempo.

Naquela noite, o Flavio entrega ao Kavyur um crachá da Base e uma chave nova. Três relíquias contidas. Antes de sair do Fórum, o Kavyur tinha recolhido a esfera de Energia do chão e refeito o selo na caixa de chumbo, letra por letra, com a mão tremendo. A Magistrada fica no cofre, trancada com a marca da sua mão na capa. O Tuninho não dorme mais nos turnos, nem quando você manda.

De madrugada, você sobe no bar destruído da Juliana. A Koranna está sentada no único banco que sobrou inteiro. Você senta do lado dela, e ela encosta a cabeça no seu ombro, em cima da cicatriz. Você chora. Pela primeira vez desde o Bob, você chora, e ela não diz nada, só segura.

"Falta uma", ela diz, muito depois.

"A Morte."

"E ele sabe o seu nome."

"Então ele vai vir até mim." Você segura a mão dela. "E dessa vez eu não vou estar sozinho."`,
`You bury VT the next day, on the plot behind the hangar. In shorts and flip-flops. The empty M4 on top of the coffin. Kavyur digs alone and won't let anyone help.

When the dirt finishes covering it, he drives the shovel into the ground and walks over to you, hands dirty, eyes red.

"He said I'd want to go with you." He swallows hard. "He was right. I want to join the Order, Mada. Not for him. For the Buyer. I want to be there when you find that man."

You hold out your hand. He shakes it, and doesn't let go for a while.

That night, Flavio hands Kavyur a Base badge and a new key. Three relics contained. Before leaving the Forum, Kavyur had gathered the Energy sphere from the floor and redone the seal on the lead box, letter by letter, his hand shaking. The Magistrate stays in the vault, locked away with your handprint on its cover. Tuninho doesn't sleep on watch anymore, even when you tell him to.

Before dawn, you go up to Juliana's wrecked bar. Koranna is sitting on the only stool still in one piece. You sit beside her, and she rests her head on your shoulder, on top of the scar. You cry. For the first time since Bob, you cry, and she says nothing, just holds on.

"One left," she says, a long time later.

"Death."

"And he knows your name."

"Then he'll come to me." You take her hand. "And this time I won't be alone."`,
`Entierran a VT al día siguiente, en el terreno detrás del hangar. De bermudas y ojotas. El M4 descargado sobre el ataúd. Kavyur cava solo y no deja que nadie lo ayude.

Cuando la tierra termina de cubrirlo, clava la pala en el suelo y viene hacia ti, con las manos sucias y los ojos rojos.

"Él dijo que iba a querer irme con ustedes." Traga saliva. "Tenía razón. Quiero entrar en la Orden, Mada. No por él. Por el Comprador. Quiero estar ahí cuando encuentres a ese hombre."

Le tiendes la mano. Te la aprieta, y no la suelta por un rato.

Esa noche, Flavio le entrega a Kavyur una credencial de la Base y una llave nueva. Tres reliquias contenidas. Antes de salir del Foro, Kavyur había recogido la esfera de Energía del piso y rehecho el sello en la caja de plomo, letra por letra, con la mano temblando. La Magistrada queda en la bóveda, encerrada con la marca de tu mano en la tapa. Tuninho ya no se duerme en las guardias, ni cuando se lo pides.

De madrugada, subes al bar destrozado de Juliana. Koranna está sentada en el único banco que quedó entero. Te sientas a su lado, y ella apoya la cabeza en tu hombro, encima de la cicatriz. Lloras. Por primera vez desde Bob, lloras, y ella no dice nada, solo te sostiene.

"Falta una", dice, mucho después.

"La Muerte."

"Y él sabe tu nombre."

"Entonces va a venir a mí." Le tomas la mano. "Y esta vez no voy a estar solo."`)),
  choices:()=>[{label:L('Ver o relatório','See the report','Ver el informe'),main:true,run:()=>({end:true})}]}
});
