    presence:{dt:18,san:'1d6'},special:{every:3,kind:'atk',name:L('Lodo','Sludge','Lodo'),text:L(`Ele abre a boca e vomita lodo preto. Onde o lodo encosta, a madeira apodrece na hora.`,`It opens its mouth and vomits black sludge. Where the sludge touches, the wood rots on the spot.`,`Abre la boca y vomita lodo negro. Donde el lodo toca, la madera se pudre al instante.`),dmg:'3d8+4'},
    desc:L(`Tem a altura de um homem e a forma de um homem, mas é feito de lodo preto escorrendo para cima. No lugar do rosto, uma espiral que gira devagar. Todos os relógios da sala andam para trás quando ele passa.`,`It has a man's height and a man's shape, but it's made of black sludge running upward. Where the face should be, a spiral turns slowly. Every clock in the room runs backward when it passes.`,`Tiene la altura de un hombre y la forma de un hombre, pero está hecho de lodo negro que chorrea hacia arriba. En lugar de la cara, una espiral que gira despacio. Todos los relojes de la sala andan hacia atrás cuando pasa.`)},
  guardaslz:{human:true,eyes:true,name:L('Guarda do Solar','The Solar\'s guard','Guardia del Solar'),kind:L('Humanos · grupo','Humans · group','Humanos · grupo'),el:null,pv:170,def:23,atk:16,dmg:'2d10+6',res:7,init:6,presence:null,
    special:{every:3,kind:'atk',name:L('Fogo cruzado','Crossfire','Fuego cruzado'),text:L(`Eles abrem fogo dos dois lados do corredor ao mesmo tempo.`,`They open fire from both ends of the corridor at once.`,`Abren fuego desde los dos lados del pasillo a la vez.`),dmg:'3d10+6'},
    desc:L(`Oito homens de branco, como enfermeiros, com fuzis por baixo dos jalecos. Nenhum deles tem pressa. Eles foram pagos para esperar.`,`Eight men in white, like nurses, with rifles under their coats. None of them is in a hurry. They were paid to wait.`,`Ocho hombres de blanco, como enfermeros, con fusiles debajo de las batas. Ninguno tiene apuro. Les pagaron para esperar.`)},
  morte:{eyes:true,name:L('A Morte','Death','La Muerte'),kind:L('Relíquia da Calamidade · Morte','Relic of Calamity · Death','Reliquia de la Calamidad · Muerte'),el:'morte',pv:320,def:25,atk:17,dmg:'2d10+6',res:10,init:7,
    presence:{dt:20,san:'2d4'},special:{every:3,kind:'atk',name:L('Ceifa','Reap','Siega'),text:L(`Ela passa a mão pelo ar como quem colhe trigo. O tempo do seu corpo anda dez anos em um segundo.`,`She sweeps her hand through the air like someone harvesting wheat. Your body's time moves ten years in one second.`,`Pasa la mano por el aire como quien cosecha trigo. El tiempo de tu cuerpo avanza diez años en un segundo.`),dmg:'4d10+2'},
    desc:L(`Ela não tem pressa. Nunca teve. Uma figura alta de lodo preto e ponteiros de relógio, com uma espiral no lugar do rosto e uma ampulheta no lugar do coração. A areia cai para cima. Ela só olha para você.`,`She is in no hurry. She never was. A tall figure of black sludge and clock hands, with a spiral for a face and an hourglass for a heart. The sand falls upward. She only looks at you.`,`No tiene apuro. Nunca lo tuvo. Una figura alta de lodo negro y agujas de reloj, con una espiral en lugar de cara y un reloj de arena en lugar de corazón. La arena cae hacia arriba. Solo te mira a ti.`)}
});

Object.assign(CLUES,{
  a5relogio:c(L('O relógio do Thomas','Thomas\'s watch','El reloj de Thomas'),L(`O relógio do Thomas, no seu pulso, voltou a andar. Para trás. O ponteiro das horas virou um contador: sete. Seis. A Maitê diz que é o tempo que falta.`,`Thomas's watch, on your wrist, started moving again. Backward. The hour hand became a counter: seven. Six. Maitê says it's the time you have left.`,`El reloj de Thomas, en tu muñeca, volvió a andar. Hacia atrás. La aguja de las horas se volvió un contador: siete. Seis. Maitê dice que es el tiempo que queda.`)),
  a5morte:c(L('Quem escapou dela','Whoever escaped her','Quien escapó de ella'),L(`A Relíquia de Morte não tem dono. Ela vai atrás de quem escapou dela vezes demais. Você escapou três: a rua da vó, o massacre da Base, o raio da usina.`,`The Death Relic has no owner. It goes after whoever has escaped it too many times. You've escaped three: Grandma's street, the Base massacre, the lightning at the plant.`,`La Reliquia de Muerte no tiene dueño. Va tras quien se le escapó demasiadas veces. Tú escapaste tres: la calle de la abuela, la masacre de la Base, el rayo de la usina.`)),
  a5tatuagem:c(L('A tatuagem','The tattoo','El tatuaje'),L(`O homem do Comprador preso na Base tem uma espiral tatuada no pulso, com um sol pequeno no centro. Ele só repete: "O velho espera. O velho sempre espera."`,`The Buyer's man held at the Base has a spiral tattooed on his wrist, with a small sun at its center. He only repeats: "The old man waits. The old man always waits."`,`El hombre del Comprador detenido en la Base tiene una espiral tatuada en la muñeca, con un sol pequeño en el centro. Solo repite: "El viejo espera. El viejo siempre espera."`)),
  a5empresa:c(L('Fundação Solar','Solar Foundation','Fundación Solar'),L(`O dinheiro que desligou a Subestação Serra Alta saiu de três empresas de fachada. As três pertencem à mesma dona: a Fundação Solar, uma instituição de "cuidados paliativos".`,`The money that shut down the Serra Alta Substation came from three shell companies. All three have the same owner: the Solar Foundation, a "palliative care" institution.`,`El dinero que apagó la Subestación Serra Alta salió de tres empresas fantasma. Las tres tienen la misma dueña: la Fundación Solar, una institución de "cuidados paliativos".`)),
  a5fundacao:c(L('Projeto Lázaro','Project Lazarus','Proyecto Lázaro'),L(`Nos papéis queimados da oficina Karlovski: "Financiamento: Fundação Solar. Projeto Lázaro. Objetivo: um corpo que não morre." A criatura que matou os irmãos Karlovski, a família que o Kavyur escolheu, foi encomendada.`,`In the burned papers from the Karlovski workshop: "Funding: Solar Foundation. Project Lazarus. Goal: a body that doesn't die." The creature that killed the Karlovski brothers, the family Kavyur chose, was ordered.`,`En los papeles quemados del taller Karlovski: "Financiamiento: Fundación Solar. Proyecto Lázaro. Objetivo: un cuerpo que no muere." La criatura que mató a los hermanos Karlovski, la familia que Kavyur eligió, fue encargada.`)),
  a5ficha:c(L('A ficha do seu pai','Your father\'s file','La ficha de tu padre'),L(`A ficha de funcionário do Maxwel no filme de Atlanta. Dependentes: Thomas, Adam, Bob. Assinatura do produtor executivo: L. Mercer. E, a caneta, ao lado do seu nome: "O do meio."`,`Maxwel's employee file from the Atlanta movie. Dependents: Thomas, Adam, Bob. Executive producer's signature: L. Mercer. And, in pen, beside your name: "The middle one."`,`La ficha de empleado de Maxwel en la película de Atlanta. Dependientes: Thomas, Adam, Bob. Firma del productor ejecutivo: L. Mercer. Y, en birome, al lado de tu nombre: "El del medio."`)),
  a5doente:c(L('O homem que está morrendo','The dying man','El hombre que se está muriendo'),L(`O Sílvio lembra: o Brenner prestava contas a um homem que não sai da cama faz vinte anos. "Está morrendo desde que eu era jovem", o Brenner dizia. "E não morre."`,`Sílvio remembers: Brenner answered to a man who hasn't left his bed in twenty years. "He's been dying since I was young," Brenner used to say. "And he doesn't die."`,`Sílvio recuerda: Brenner le rendía cuentas a un hombre que no sale de la cama hace veinte años. "Se está muriendo desde que yo era joven", decía Brenner. "Y no se muere."`)),
  a5clinica:c(L('Solar dos Ipês','Solar dos Ipês','Solar dos Ipês'),L(`O sedativo que derrubou o Tuninho é de um lote que só vai para uma clínica: o Solar dos Ipês, na serra. Uma clínica de cuidados paliativos. Onde as pessoas vão para esperar.`,`The sedative that knocked out Tuninho comes from a batch that only goes to one clinic: the Solar dos Ipês, in the hills. A palliative care clinic. Where people go to wait.`,`El sedante que tumbó a Tuninho es de un lote que solo va a una clínica: el Solar dos Ipês, en la sierra. Una clínica de cuidados paliativos. Adonde la gente va a esperar.`)),
  a5sussurro:c(L('O que o arauto disse','What the herald said','Lo que dijo el heraldo'),L(`Antes de se desfazer, o arauto falou com a voz do Thomas: "Lázaro espera por você, Adam. No sol. Onde os ipês caem."`,`Before it came apart, the herald spoke in Thomas's voice: "Lazarus is waiting for you, Adam. In the sun. Where the ipê trees shed."`,`Antes de deshacerse, el heraldo habló con la voz de Thomas: "Lázaro te espera, Adam. En el sol. Donde caen los ipês."`))
});

a5a_relogio:{act:K,title:L('Sete','Seven','Siete'),checkpoint:true,
  text:()=>P(L(`Você acorda às 3h17 com um barulho que não ouvia desde o massacre.

Tic.

O relógio do Thomas, no seu pulso, está andando. Ele parou na noite em que o Thomas morreu e nunca mais andou. Você nunca trocou a pilha. Nunca quis.

Agora ele anda. Para trás.

A Koranna está dormindo no seu peito, com a mão aberta em cima da cicatriz. Faz uma semana que ela não volta para o quarto dela. Ninguém na Base comentou. A Juliana só passou a deixar duas xícaras na bandeja.

Você fica olhando o ponteiro das horas. Ele não marca hora nenhuma. Ele desce, devagar, e para em cima do sete.`,
`You wake at 3:17 a.m. to a sound you haven't heard since the massacre.

Tick.

Thomas's watch, on your wrist, is running. It stopped the night Thomas died and never ran again. You never changed the battery. You never wanted to.

Now it's running. Backward.

Koranna is asleep on your chest, her open hand on top of the scar. She hasn't gone back to her own room in a week. Nobody at the Base has said a word. Juliana just started leaving two cups on the tray.

You watch the hour hand. It isn't marking any hour. It moves down, slowly, and stops on the seven.`,
`Te despiertas a las 3:17 con un sonido que no oías desde la masacre.

Tic.

El reloj de Thomas, en tu muñeca, está andando. Se detuvo la noche en que Thomas murió y nunca más anduvo. Nunca le cambiaste la pila. Nunca quisiste.

Ahora anda. Hacia atrás.

Koranna duerme sobre tu pecho, con la mano abierta encima de la cicatriz. Hace una semana que no vuelve a su cuarto. Nadie en la Base dijo nada. Juliana solo empezó a dejar dos tazas en la bandeja.

Miras la aguja de las horas. No marca ninguna hora. Baja, despacio, y se detiene sobre el siete.`))+addClue('a5relogio'),
  choices:()=>[
    {once:'manha5',label:L('Ficar mais um pouco com ela','Stay with her a little longer','Quedarte un poco más con ella'),
      run:()=>({text:P(L(`Você não acorda a Koranna. Fica ali, ouvindo o tic do relógio e a respiração dela, até a respiração ganhar.

Quando ela acorda, ela não abre os olhos. "Você tá acordado faz tempo", ela diz. Não é pergunta.

"Um pouco."

"Pensando no VT."

"No VT. No Kavyur cavando. Em você." Você passa o polegar no ombro dela. "Eu nunca tive isso, Koranna. Acordar do lado de alguém e não ter pressa de ir embora."

Ela sorri com a boca encostada na cicatriz. "Então não vai."

Por dez minutos, você não vai.`,`You don't wake Koranna. You stay there, listening to the tick of the watch and her breathing, until the breathing wins.

When she wakes, she doesn't open her eyes. "You've been awake a while," she says. It isn't a question.

"A little."

"Thinking about VT."

"About VT. About Kavyur digging. About you." You run your thumb over her shoulder. "I never had this, Koranna. Waking up next to someone and not being in a hurry to leave."

She smiles with her mouth against the scar. "Then don't go."

For ten minutes, you don't.`,`No despiertas a Koranna. Te quedas ahí, escuchando el tic del reloj y su respiración, hasta que la respiración gana.

Cuando se despierta, no abre los ojos. "Hace rato que estás despierto", dice. No es pregunta.

"Un poco."

"Pensando en VT."

"En VT. En Kavyur cavando. En ti." Le pasas el pulgar por el hombro. "Nunca tuve esto, Koranna. Despertarme al lado de alguien y no tener apuro por irme."

Sonríe con la boca apoyada en la cicatriz. "Entonces no te vayas."

Durante diez minutos, no te vas.`))+bond('koranna')+calm(3)})},
    {once:'olhar5',label:L('Examinar o relógio','Examine the watch','Examinar el reloj'),test:{sk:'Percepção',dt:16},
      ok:()=>({text:P(L(`O vidro está frio. Frio demais, como metal deixado na geladeira. Por baixo dos ponteiros, na pintura do mostrador, apareceu uma espiral fina que não estava ali ontem. Ela gira, bem devagar, no sentido contrário ao dos ponteiros.

Isso não é o relógio quebrado. Isso é alguém contando.`,`The glass is cold. Too cold, like metal left in the fridge. Under the hands, in the paint of the dial, a thin spiral has appeared that wasn't there yesterday. It turns, very slowly, against the direction of the hands.

This isn't the watch breaking. This is someone counting.`,`El vidrio está frío. Demasiado frío, como metal dejado en la heladera. Debajo de las agujas, en la pintura de la esfera, apareció una espiral fina que ayer no estaba. Gira, muy despacio, en sentido contrario a las agujas.

Esto no es el reloj rompiéndose. Es alguien contando.`))+loseSan('1d3',L('a espiral','the spiral','la espiral'))}),
      fail:()=>({text:P(L(`Você tenta abrir a tampa de trás com a unha. Não abre. O metal está frio como gelo, e o tic continua, teimoso, para trás.`,`You try to pry the back open with your fingernail. It won't open. The metal is ice cold, and the tick goes on, stubborn, backward.`,`Intentas abrir la tapa trasera con la uña. No se abre. El metal está frío como hielo, y el tic sigue, terco, hacia atrás.`))})},
    {label:L('Levar o relógio para a Maitê','Take the watch to Maitê','Llevarle el reloj a Maitê'),main:true,run:()=>({go:'a5b_reuniao'})}
  ]},

a5b_reuniao:{act:K,title:L('A quarta relíquia','The fourth relic','La cuarta reliquia'),
  text:()=>P(L(`A Maitê não retoca o batom. É assim que você sabe que é grave.

Ela segura o seu pulso em cima da mesa da sala de reunião, com a lupa na outra mão, e fica muito tempo em silêncio. Em volta, a Base inteira: a Koranna, o Derick, o Tuninho, o Flavio, o Logan, a Iris, a Juliana com um curativo na testa. E o Kavyur, sentado no canto, de crachá novo no peito, com a pistola do VT no coldre.

"Relíquia de Morte", ela diz, enfim. "Ela não tem dono. Nunca teve. Ela é o tempo passando, a coisa apodrecendo, o fim de tudo. E ela tem uma regra." Ela solta o seu pulso. "Ela vai atrás de quem escapou dela."

"Todo mundo escapa dela", diz o Derick. "Até não escapar."

"Uma vez. Duas." A Maitê olha para você. "Você escapou três. A rua da vó. O massacre. O raio na usina, que devia ter parado o seu coração e não parou. Três vezes, Mada. Para ela, isso é uma dívida."

O relógio faz tic no silêncio.

"Sete dias", diz a Maitê. "Talvez menos."

O Kavyur se levanta. "O Comprador disse ao VT que não precisava procurar a última relíquia. Que a Morte vem até quem espera." A voz dele é baixa e firme. "Ele sabia disso. Ele sabe que ela vem atrás de você. Ele vai estar esperando onde ela chegar."

"Então a gente acha ele primeiro", você diz.

Ninguém fala o resto. Se vocês não acharem, a Morte acha você.`,
`Maitê doesn't touch up her lipstick. That's how you know it's serious.

She holds your wrist on the meeting-room table, a magnifying glass in her other hand, and stays silent for a long time. Around you, the whole Base: Koranna, Derick, Tuninho, Flavio, Logan, Iris, Juliana with a bandage on her forehead. And Kavyur, sitting in the corner, a new badge on his chest, VT's pistol in his holster.

"The Death Relic," she finally says. "It has no owner. It never did. It is time passing, things rotting, the end of everything. And it has one rule." She lets go of your wrist. "It goes after whoever escaped it."

"Everybody escapes it," says Derick. "Until they don't."

"Once. Twice." Maitê looks at you. "You escaped three times. Grandma's street. The massacre. The lightning at the plant, which should have stopped your heart and didn't. Three times, Mada. To her, that's a debt."

The watch ticks in the silence.

"Seven days," says Maitê. "Maybe less."

Kavyur stands up. "The Buyer told VT he didn't need to look for the last relic. That Death comes to whoever waits." His voice is low and steady. "He knew this. He knows she's coming for you. He'll be waiting wherever she arrives."

"Then we find him first," you say.

Nobody says the rest. If you don't find him, Death finds you.`,
`Maitê no se retoca el labial. Así sabes que es grave.

Te sostiene la muñeca sobre la mesa de la sala de reuniones, con la lupa en la otra mano, y se queda mucho tiempo en silencio. Alrededor, toda la Base: Koranna, Derick, Tuninho, Flavio, Logan, Iris, Juliana con una curita en la frente. Y Kavyur, sentado en el rincón, con la credencial nueva en el pecho y la pistola de VT en la funda.

"Reliquia de Muerte", dice al fin. "No tiene dueño. Nunca tuvo. Es el tiempo pasando, las cosas pudriéndose, el fin de todo. Y tiene una regla." Te suelta la muñeca. "Va tras quien se le escapó."

"Todo el mundo se le escapa", dice Derick. "Hasta que no."

"Una vez. Dos." Maitê te mira. "Tú te escapaste tres. La calle de la abuela. La masacre. El rayo en la usina, que debió pararte el corazón y no lo paró. Tres veces, Mada. Para ella, eso es una deuda."

El reloj hace tic en el silencio.

"Siete días", dice Maitê. "Quizás menos."

Kavyur se levanta. "El Comprador le dijo a VT que no necesitaba buscar la última reliquia. Que la Muerte llega a quien espera." Su voz es baja y firme. "Él lo sabía. Sabe que viene por ti. Va a estar esperando donde ella llegue."

"Entonces lo encontramos primero", dices.

Nadie dice el resto. Si no lo encuentran, la Muerte te encuentra a ti.`))+addClue('a5morte')+loseSan('1d4',L('a dívida','the debt','la deuda')),
  choices:()=>[
    {once:'kavprom5',label:L('Falar com o Kavyur a sós','Talk to Kavyur alone','Hablar con Kavyur a solas'),
      run:()=>({text:P(L(`Você encontra o Kavyur no estande de tiro, descarregando a pistola do VT num alvo de papel. Todos os tiros no mesmo buraco.

"Ele me ensinou aqui", ele diz, sem se virar. "Eu tinha acabado de chegar no hangar e tremia tanto que acertei o teto."

"Kavyur. Quando a gente achar ele..."

"Eu sei o que você vai pedir." Ele tira os protetores de ouvido. "Você vai pedir para eu não ir sozinho. Para eu esperar a equipe. Para eu não fazer besteira."

"Vou pedir para você me deixar estar lá."

Ele te olha, surpreso. Depois assente, devagar. "Tá. Mas quando chegar a hora, Mada, a mão é minha."

Você não responde. Ele entende o silêncio como sim.`,`You find Kavyur at the firing range, emptying VT's pistol into a paper target. Every shot through the same hole.

"He taught me here," he says, without turning around. "I'd just arrived at the hangar and I was shaking so hard I hit the ceiling."

"Kavyur. When we find him..."

"I know what you're going to ask." He takes off his ear protectors. "You're going to ask me not to go alone. To wait for the team. Not to do anything stupid."

"I'm going to ask you to let me be there."

He looks at you, surprised. Then he nods, slowly. "Fine. But when the time comes, Mada, the hand is mine."

You don't answer. He takes the silence as a yes.`,`Encuentras a Kavyur en el polígono de tiro, vaciando la pistola de VT sobre un blanco de papel. Todos los tiros en el mismo agujero.

"Me enseñó acá", dice, sin darse vuelta. "Yo acababa de llegar al hangar y temblaba tanto que le di al techo."

"Kavyur. Cuando lo encontremos..."

"Sé lo que me vas a pedir." Se quita los protectores de oído. "Me vas a pedir que no vaya solo. Que espere al equipo. Que no haga ninguna locura."

"Te voy a pedir que me dejes estar ahí."

Te mira, sorprendido. Después asiente, despacio. "Está bien. Pero cuando llegue la hora, Mada, la mano es mía."

No respondes. Él toma el silencio como un sí.`))+bond('kavyur',2)})},
    {label:L('Montar o quadro de novo','Put the board up again','Armar el mural de nuevo'),main:true,run:()=>({go:'a5c_hub'})}
  ]},

a5c_hub:{act:KI,title:L('Os dias','The days','Los días'),
  text:()=>{const d=S.flags.a5dia||0;
    const sinais=[
      L(`O quadro do Thomas está na parede pela terceira vez este ano. No centro, uma folha em branco com uma palavra só, na sua letra: COMPRADOR.`,`Thomas's board is on the wall for the third time this year. In the center, a blank sheet with one word on it, in your handwriting: BUYER.`,`El mural de Thomas está en la pared por tercera vez este año. En el centro, una hoja en blanco con una sola palabra, con tu letra: COMPRADOR.`),
      L(`As plantas do bar da Juliana secaram durante a noite. Só as que ficam no caminho entre a escada e o seu quarto.`,`The plants in Juliana's bar dried up overnight. Only the ones along the path between the stairs and your room.`,`Las plantas del bar de Juliana se secaron durante la noche. Solo las que están en el camino entre la escalera y tu cuarto.`),
      L(`De manhã, a Koranna acha três fios brancos no meio dos seus dreads. Ela não diz nada. Só separa os três com cuidado, como quem esconde, e te dá um beijo na testa.`,`In the morning, Koranna finds three white strands among your dreads. She says nothing. She just tucks them away carefully, like someone hiding them, and kisses your forehead.`,`A la mañana, Koranna encuentra tres hebras blancas entre tus rastas. No dice nada. Solo las separa con cuidado, como quien las esconde, y te da un beso en la frente.`),
      L(`Todos os relógios da Base pararam às 3h17. O do refeitório, o do arsenal, o celular do Derick. Só o do Thomas continua andando.`,`Every clock in the Base stopped at 3:17. The one in the cafeteria, the one in the armory, Derick's phone. Only Thomas's keeps running.`,`Todos los relojes de la Base se detuvieron a las 3:17. El del comedor, el del arsenal, el celular de Derick. Solo el de Thomas sigue andando.`),
      L(`O espelho do banheiro te mostra um segundo atrasado. Você levanta a mão, e o seu reflexo demora para levantar.`,`The bathroom mirror shows you one second late. You raise your hand, and your reflection takes a moment to follow.`,`El espejo del baño te muestra un segundo tarde. Levantas la mano, y tu reflejo tarda en levantarla.`),
      L(`O pão que a Juliana deixou na bandeja mofou em dez minutos. Ela jogou fora sem dizer nada e fez outro. E outro.`,`The bread Juliana left on the tray grew mold in ten minutes. She threw it out without a word and made more. And more.`,`El pan que Juliana dejó en la bandeja se enmoheció en diez minutos. Lo tiró sin decir nada e hizo otro. Y otro.`),
      L(`Você não dorme mais. Toda vez que fecha os olhos, ouve passos no corredor. Passos lentos, de quem não tem pressa.`,`You don't sleep anymore. Every time you close your eyes, you hear footsteps in the corridor. Slow footsteps, of someone in no hurry.`,`Ya no duermes. Cada vez que cierras los ojos, oyes pasos en el pasillo. Pasos lentos, de alguien que no tiene apuro.`)
    ];
    return `<p class="hint" style="font-family:var(--mono);letter-spacing:.08em">${L('Relógio do Thomas','Thomas\'s watch','Reloj de Thomas')}: ${falta()} · ${L('Dia','Day','Día')} ${d+1}</p>`+P(sinais[Math.min(d,6)])+
      (d===2?loseSan('1d4',L('os fios brancos','the white strands','las hebras blancas')):'')+
      (d===4?loseSan('1d6',L('o reflexo atrasado','the late reflection','el reflejo atrasado')):'')+
      P(L(`Cada pista custa um dia. Você não tem muitos.`,`Every lead costs a day. You don't have many.`,`Cada pista cuesta un día. No tienes muchos.`))},
  choices:()=>[
    {once:'agente5',label:L('Interrogar o homem do Comprador','Interrogate the Buyer\'s man','Interrogar al hombre del Comprador'),test:{sk:'Intimidação',dt:17},
      ok:()=>{dia();return {text:P(L(`Ele está na cela ao lado do Sílvio desde o ataque ao bar. Você não grita. Você só puxa a cadeira, senta na frente dele e fica olhando, sem piscar, com o relógio fazendo tic entre vocês dois.

Depois de meia hora, ele é quem fala. "Para com isso. Para com esse relógio." Ele esfrega o pulso até a pele ficar vermelha, e você vê a tatuagem: uma espiral com um sol pequeno no meio. "Todo mundo que trabalha para ele tem. É o sol do Solar. O velho gosta de marcar o que é dele."

"Que velho?"

"O velho espera", ele sussurra. "O velho sempre espera. Ele esperou vinte anos por você, cara. Você acha que eu vou falar o nome dele?"`,`He's been in the cell next to Sílvio's since the attack on the bar. You don't shout. You just pull up the chair, sit in front of him and stare, without blinking, with the watch ticking between you.

After half an hour, he's the one who talks. "Stop it. Stop that watch." He rubs his wrist until the skin goes red, and you see the tattoo: a spiral with a small sun in the middle. "Everybody who works for him has one. It's the sun of the Solar. The old man likes to mark what's his."

"What old man?"

"The old man waits," he whispers. "The old man always waits. He waited twenty years for you, man. You think I'm going to say his name?"`,`Está en la celda al lado de Sílvio desde el ataque al bar. No gritas. Solo acercas la silla, te sientas frente a él y lo miras, sin parpadear, con el reloj haciendo tic entre los dos.

Después de media hora, es él quien habla. "Para. Para con ese reloj." Se frota la muñeca hasta que la piel se pone roja, y ves el tatuaje: una espiral con un sol pequeño en el medio. "Todos los que trabajan para él lo tienen. Es el sol del Solar. Al viejo le gusta marcar lo que es suyo."

"¿Qué viejo?"

"El viejo espera", susurra. "El viejo siempre espera. Te esperó veinte años, flaco. ¿Crees que voy a decir su nombre?"`))+addClue('a5tatuagem'),go:'a5c_hub'}},
      fail:()=>{dia();return {text:P(L(`Você bate a mão na mesa. Ele ri. "Pode bater. O que ele faz com quem fala é pior." Ele esconde o pulso dentro da manga, rápido demais, e você só vê a ponta de uma tatuagem: uma curva, como o começo de uma espiral.`,`You slam your hand on the table. He laughs. "Go ahead. What he does to people who talk is worse." He hides his wrist inside his sleeve, too fast, and you only see the edge of a tattoo: a curve, like the start of a spiral.`,`Golpeas la mesa con la mano. Se ríe. "Pega. Lo que él les hace a los que hablan es peor." Esconde la muñeca dentro de la manga, demasiado rápido, y solo ves el borde de un tatuaje: una curva, como el comienzo de una espiral.`)),go:'a5c_hub'}}},
    {once:'sub5',label:L('Seguir o dinheiro da subestação com o Derick','Follow the substation money with Derick','Seguir el dinero de la subestación con Derick'),test:{sk:'Investigação',dt:16},
      ok:()=>{dia();return {text:P(L(`O Derick passa a noite em claro com três notebooks abertos e uma garrafa de café. Você fica do lado, passando os extratos que ele pede. Às quatro da manhã, ele vira a tela para você.

"Três empresas de fachada. Uma de transporte, uma de eventos, uma de limpeza." Ele aponta. "As três têm a mesma dona. Fundação Solar. Cuidados paliativos." Ele esfrega os olhos. "Uma fundação que cuida de gente morrendo pagou para apagar uma usina, Mada."

Você coloca a mão no ombro dele. Ele não era mais o menino do porão fazia tempo. Mas às vezes você esquece, e ele deixa.`,`Derick stays up all night with three laptops open and a bottle of coffee. You sit beside him, passing him the statements he asks for. At four in the morning, he turns the screen toward you.

"Three shell companies. One in transport, one in events, one in cleaning." He points. "All three have the same owner. The Solar Foundation. Palliative care." He rubs his eyes. "A foundation that cares for dying people paid to shut down a power plant, Mada."

You put your hand on his shoulder. He stopped being the boy from the basement a long time ago. But sometimes you forget, and he lets you.`,`Derick pasa la noche en vela con tres notebooks abiertas y una botella de café. Te quedas a su lado, pasándole los extractos que pide. A las cuatro de la mañana, gira la pantalla hacia ti.

"Tres empresas fantasma. Una de transporte, una de eventos, una de limpieza." Señala. "Las tres tienen la misma dueña. Fundación Solar. Cuidados paliativos." Se frota los ojos. "Una fundación que cuida a gente que se muere pagó para apagar una usina, Mada."

Le pones la mano en el hombro. Hace mucho que dejó de ser el chico del sótano. Pero a veces lo olvidas, y él te deja.`))+addClue('a5empresa')+bond('derick'),go:'a5c_hub'}},
      fail:()=>{dia();return {text:P(L(`O dinheiro passa por onze contas em quatro países e some. O Derick fecha o notebook com raiva. "Alguém muito rico não quer ser achado." Numa das transferências, um nome solto: "Solar". Pode ser uma empresa. Pode ser nada.`,`The money passes through eleven accounts in four countries and disappears. Derick shuts the laptop in frustration. "Someone very rich doesn't want to be found." On one of the transfers, a stray word: "Solar". It could be a company. It could be nothing.`,`El dinero pasa por once cuentas en cuatro países y desaparece. Derick cierra la notebook con rabia. "Alguien muy rico no quiere que lo encuentren." En una de las transferencias, una palabra suelta: "Solar". Puede ser una empresa. Puede no ser nada.`))+bond('derick'),go:'a5c_hub'}}},
    {once:'kar5',label:L('Voltar com o Kavyur à oficina Karlovski','Go back to the Karlovski workshop with Kavyur','Volver con Kavyur al taller Karlovski'),run:()=>{dia();return {go:'a5d_oficina'}}},
    {once:'atl5',label:L('Reabrir o envelope de Atlanta','Reopen the Atlanta envelope','Reabrir el sobre de Atlanta'),run:()=>{dia();return {go:'a5d_atlanta'}}},
    {once:'silvio5',label:L('Descer até a cela do Sílvio','Go down to Sílvio\'s cell','Bajar a la celda de Sílvio'),test:{sk:'Intuição',dt:15},
      ok:()=>{dia();return {text:P(L(`O Sílvio está pintando. Pediram tinta para ele ficar quieto, e ele pinta a parede da cela inteira de branco, todo dia, por cima do branco de ontem.

"O Brenner tinha medo de uma pessoa só", ele diz, sem parar o pincel. "Um homem que ele chamava de patrão. Nunca vi. O Brenner dizia que ele não sai da cama faz vinte anos. Que está morrendo desde que o Brenner era moço." O pincel para. "E que não morre. Que ele estava esperando alguma coisa para morrer direito."

Ele te olha pela primeira vez. "Você tá com cara de quem é essa coisa, garoto."`,`Sílvio is painting. They gave him paint to keep him quiet, and he paints the whole cell wall white, every day, on top of yesterday's white.

"Brenner was afraid of only one person," he says, without stopping the brush. "A man he called the boss. I never saw him. Brenner said he hasn't left his bed in twenty years. That he's been dying since Brenner was young." The brush stops. "And he doesn't die. That he was waiting for something before dying properly."

He looks at you for the first time. "You look like you're that something, kid."`,`Sílvio está pintando. Le dieron pintura para que se quedara quieto, y pinta toda la pared de la celda de blanco, todos los días, encima del blanco de ayer.

"Brenner le tenía miedo a una sola persona", dice, sin parar el pincel. "Un hombre al que llamaba el patrón. Nunca lo vi. Brenner decía que no sale de la cama hace veinte años. Que se está muriendo desde que Brenner era joven." El pincel se detiene. "Y que no se muere. Que estaba esperando algo para morirse como se debe."

Te mira por primera vez. "Tienes cara de ser ese algo, chico."`))+addClue('a5doente')+loseSan('1d3',L('o Sílvio','Sílvio','Sílvio')),go:'a5c_hub'}},
      fail:()=>{dia();return {text:P(L(`O Sílvio não para de pintar. "Eu já falei tudo do Brenner." Ele passa o pincel por cima da mesma mancha. "O resto não é meu para contar. O resto é do patrão." Ele não diz mais nada.`,`Sílvio doesn't stop painting. "I already told you everything about Brenner." He runs the brush over the same patch. "The rest isn't mine to tell. The rest belongs to the boss." He says nothing more.`,`Sílvio no para de pintar. "Ya te conté todo de Brenner." Pasa el pincel por la misma mancha. "Lo demás no me toca contarlo. Lo demás es del patrón." No dice nada más.`)),go:'a5c_hub'}}},
    {once:'enf5',label:L('Pedir ao Logan e à Iris para analisar o sedativo','Ask Logan and Iris to analyze the sedative','Pedirles a Logan e a Iris que analicen el sedante'),test:{sk:'Medicina',dt:16},
      ok:()=>{dia();return {text:P(L(`O Logan acende a luz do microscópio. A Iris lê o número do lote no frasco vazio achado na guarita e digita no computador. Os dois ficam quietos.

"Esse sedativo não se compra em farmácia", diz o Logan. "É de uso hospitalar. E esse lote..." Ele vira a tela. "Esse lote só foi para um lugar. Solar dos Ipês. Uma clínica de cuidados paliativos, lá na serra."

"Paliativos", repete a Iris, baixinho. "É para onde a gente manda as pessoas quando não tem mais nada para fazer. Para esperar."

Ela te olha, e depois olha o seu pulso. "Mada. Deixa eu ver esses fios brancos."`,`Logan switches on the microscope light. Iris reads the batch number off the empty vial found at the guard post and types it into the computer. They both go quiet.

"You can't buy this sedative at a pharmacy," Logan says. "It's hospital-only. And this batch..." He turns the screen. "This batch only went to one place. Solar dos Ipês. A palliative care clinic, up in the hills."

"Palliative," Iris repeats, softly. "It's where we send people when there's nothing left to do. To wait."

She looks at you, then at your wrist. "Mada. Let me see those white strands."`,`Logan enciende la luz del microscopio. Iris lee el número de lote del frasco vacío encontrado en la garita y lo escribe en la computadora. Los dos se quedan callados.

"Este sedante no se compra en farmacia", dice Logan. "Es de uso hospitalario. Y este lote..." Gira la pantalla. "Este lote fue a un solo lugar. Solar dos Ipês. Una clínica de cuidados paliativos, allá en la sierra."

"Paliativos", repite Iris, bajito. "Es adonde mandamos a la gente cuando ya no hay nada que hacer. A esperar."

Te mira, y después mira tu muñeca. "Mada. Déjame ver esas hebras blancas."`))+addClue('a5clinica')+bond('iris'),go:'a5c_hub'}},
      fail:()=>{dia();return {text:P(L(`O frasco foi lavado por dentro. O Logan passa a noite tentando e só consegue metade do número do lote. "Hospitalar", ele diz. "Alguém com acesso a hospital. Ou a uma clínica. Não consigo dizer qual." A Iris cobre você com uma manta quando você cochila na cadeira.`,`The vial was rinsed out. Logan spends the night trying and only gets half the batch number. "Hospital-grade," he says. "Someone with access to a hospital. Or a clinic. I can't tell which." Iris puts a blanket over you when you doze off in the chair.`,`El frasco fue lavado por dentro. Logan pasa la noche intentando y solo consigue la mitad del número de lote. "Hospitalario", dice. "Alguien con acceso a un hospital. O a una clínica. No sé decirte cuál." Iris te tapa con una manta cuando te duermes en la silla.`)),go:'a5c_hub'}}},
    {once:'kor5',label:L('Uma noite só com a Koranna','One night with just Koranna','Una noche solo con Koranna'),run:()=>{dia();return {go:'a5d_telhado'}}},
    {label:L('Montar o quadro','Build the board','Armar el mural'),main:true,run:()=>({go:S.flags.a5arauto?'a5f_quadro':'a5e_arauto'})}
  ]},

a5d_oficina:{act:KI,title:L('A oficina','The workshop','El taller'),
  text:()=>P(L(`O portão de ferro da oficina Karlovski continua entortado de dentro para fora, do jeito que o Ciborgue deixou anos atrás. O mato cresceu por dentro. Tem ninho de passarinho na cápsula rasgada.

O Kavyur para na porta. Você espera. Ele demora quase um minuto para passar.

"Eu nunca voltei", ele diz. "O VT queria vir comigo. Eu disse que não precisava." Ele ri sem vontade. "Eu menti muito para aquele homem também."`,
`The iron gate of the Karlovski workshop is still bent from the inside out, just as the Cyborg left it years ago. Weeds have grown inside. There's a bird's nest in the torn capsule.

Kavyur stops at the door. You wait. It takes him almost a minute to step through.

"I never came back," he says. "VT wanted to come with me. I told him there was no need." He laughs without meaning it. "I lied to that man a lot too."`,
`El portón de hierro del taller Karlovski sigue doblado de adentro hacia afuera, como lo dejó el Ciborg hace años. Creció maleza adentro. Hay un nido de pájaro en la cápsula desgarrada.

Kavyur se detiene en la puerta. Esperas. Tarda casi un minuto en pasar.

"Nunca volví", dice. "VT quería venir conmigo. Le dije que no hacía falta." Se ríe sin ganas. "A ese hombre también le mentí mucho."`)),
  choices:()=>[
    {once:'irmaos5',label:L('Ficar com ele na frente da bancada','Stay with him at the workbench','Quedarte con él frente al banco de trabajo'),
      run:()=>({text:P(L(`Em cima da bancada, debaixo de poeira, uma foto num porta-retrato de plástico: três rapazes de macacão sujo de graxa, rindo, e um rapaz magro de óculos no meio, mais novo que os três, sério. O Kavyur limpa o vidro com a manga.

"O Gustavo, o Matheus e o Marcos", ele diz. "Não eram meus irmãos de sangue. O Gustavo me achou na faculdade, lendo sobre o Outro Lado escondido no fundo da biblioteca, e me levou para casa. Os três me adotaram sem perguntar nada. Eu nunca tive família antes deles." "O Matheus fazia pão aos domingos. O Marcos cantava errado de propósito para me irritar." Ele engole. "Eu escrevi naquele relatório que a gente tinha que parar. Eles riram de mim. Uma semana depois, a coisa saiu da cápsula."

Você não diz que não foi culpa dele. Ele sabe. Não ajuda. Você só fica do lado, ombro com ombro, como o Thomas fazia, até ele guardar a foto no bolso de dentro da jaqueta.`,`On the workbench, under the dust, a photo in a plastic frame: three young men in grease-stained overalls, laughing, and a skinny young man with glasses in the middle, younger than the other three, serious. Kavyur wipes the glass with his sleeve.

"Gustavo, Matheus and Marcos," he says. "They weren't my brothers by blood. Gustavo found me at the university, reading about the Other Side hidden at the back of the library, and took me home. The three of them took me in without asking anything. I never had a family before them." "Matheus baked bread on Sundays. Marcos sang off-key on purpose to annoy me." He swallows. "I wrote in that report that we had to stop. They laughed at me. A week later, the thing came out of the capsule."

You don't tell him it wasn't his fault. He knows. It doesn't help. You just stand beside him, shoulder to shoulder, the way Thomas used to, until he puts the photo in the inside pocket of his jacket.`,`Sobre el banco, bajo el polvo, una foto en un portarretrato de plástico: tres muchachos de mameluco manchado de grasa, riéndose, y un muchacho flaco de anteojos en el medio, más joven que los tres, serio. Kavyur limpia el vidrio con la manga.

"Gustavo, Matheus y Marcos", dice. "No eran mis hermanos de sangre. Gustavo me encontró en la facultad, leyendo sobre el Otro Lado escondido al fondo de la biblioteca, y me llevó a su casa. Los tres me adoptaron sin preguntar nada. Nunca había tenido una familia antes de ellos." "Matheus hacía pan los domingos. Marcos cantaba mal a propósito para molestarme." Traga saliva. "Escribí en ese informe que teníamos que parar. Se rieron de mí. Una semana después, la cosa salió de la cápsula."

No le dices que no fue su culpa. Él lo sabe. No ayuda. Solo te quedas a su lado, hombro con hombro, como hacía Thomas, hasta que guarda la foto en el bolsillo interno de la campera.`))+bond('kavyur',2)+loseSan('1d3',L('a foto','the photo','la foto'))})},
    {once:'papeis5',label:L('Procurar os papéis que não queimaram','Look for the papers that didn\'t burn','Buscar los papeles que no se quemaron'),test:{sk:'Investigação',dt:17},
      ok:()=>({text:P(L(`No fundo de um arquivo de metal, com as bordas pretas de fogo, uma pasta que sobreviveu. Recibos. Muitos recibos. Todos com o mesmo carimbo: uma espiral com um sol no meio.

"Financiamento: Fundação Solar. Projeto Lázaro. Objetivo: um corpo que não morre."

O Kavyur lê por cima do seu ombro. As mãos dele param de tremer. Isso é pior.

"Eles não eram cientistas loucos", ele diz, muito calmo. "Eles eram funcionários. Alguém encomendou aquela coisa. Alguém pagou pelo que matou os meus irmãos." Ele dobra o recibo e guarda junto com a foto. "Agora eu sei o nome do projeto. Falta o nome do homem."`,`At the back of a metal filing cabinet, its edges black from fire, a folder that survived. Receipts. Lots of receipts. All with the same stamp: a spiral with a sun in the middle.

"Funding: Solar Foundation. Project Lazarus. Goal: a body that doesn't die."

Kavyur reads over your shoulder. His hands stop shaking. That's worse.

"They weren't mad scientists," he says, very calmly. "They were employees. Someone ordered that thing. Someone paid for what killed my brothers." He folds the receipt and puts it away with the photo. "Now I know the project's name. I still need the man's."`,`Al fondo de un archivador de metal, con los bordes negros de fuego, una carpeta que sobrevivió. Recibos. Muchos recibos. Todos con el mismo sello: una espiral con un sol en el medio.

"Financiamiento: Fundación Solar. Proyecto Lázaro. Objetivo: un cuerpo que no muere."

Kavyur lee por encima de tu hombro. Le dejan de temblar las manos. Eso es peor.

"No eran científicos locos", dice, muy tranquilo. "Eran empleados. Alguien encargó esa cosa. Alguien pagó por lo que mató a mis hermanos." Dobla el recibo y lo guarda junto con la foto. "Ahora sé el nombre del proyecto. Me falta el del hombre."`))+addClue('a5fundacao')}),
      fail:()=>({text:P(L(`Cinza, papel queimado e ferrugem. O Kavyur acha um pedaço de recibo com metade de um carimbo: um sol pequeno, e a curva de alguma coisa em volta. O resto virou pó na mão dele.`,`Ash, burned paper and rust. Kavyur finds a scrap of a receipt with half a stamp: a small sun, and the curve of something around it. The rest turns to dust in his hand.`,`Ceniza, papel quemado y óxido. Kavyur encuentra un pedazo de recibo con medio sello: un sol pequeño, y la curva de algo alrededor. El resto se hace polvo en su mano.`))})},
    {label:L('Voltar para a Base','Head back to the Base','Volver a la Base'),main:true,run:()=>({go:'a5c_hub'})}
  ]},

a5d_atlanta:{act:KI,title:L('Atlanta, de novo','Atlanta, again','Atlanta, otra vez'),
  text:()=>P(L(`O envelope do Thomas está onde você deixou, no fundo do armário dele. "Atlanta", na letra dele. Você passou meses sem conseguir abrir da primeira vez. Agora você abre de novo, sozinho, no chão do quarto dele.

A ficha técnica do filme. O recorte do incêndio no set. E, por trás de tudo, uma folha grampeada que você não viu da primeira vez, porque não conseguiu ler até o fim.`,
`Thomas's envelope is where you left it, at the back of his locker. "Atlanta", in his handwriting. The first time, you went months without being able to open it. Now you open it again, alone, on the floor of his room.

The movie credits. The clipping about the fire on set. And, behind everything, a stapled page you didn't see the first time, because you couldn't read to the end.`,
`El sobre de Thomas está donde lo dejaste, al fondo de su casillero. "Atlanta", con su letra. La primera vez pasaste meses sin poder abrirlo. Ahora lo abres de nuevo, solo, en el piso de su cuarto.

La ficha técnica de la película. El recorte del incendio en el set. Y, detrás de todo, una hoja abrochada que no viste la primera vez, porque no pudiste leer hasta el final.`)),
  choices:()=>[
    {once:'ficha5',label:L('Ler a folha grampeada','Read the stapled page','Leer la hoja abrochada'),test:{sk:'Vontade',dt:16},
      ok:()=>({text:P(L(`É a ficha de funcionário do seu pai. Uma foto 3x4 dele, jovem, com o sorriso torto que o Bob herdou. "Maxwel Zart. Coordenador de dublês. Dependentes: Thomas, Adam, Bob." Embaixo, a assinatura do produtor executivo do filme, acima do nome do Otto Brenner: "L. Mercer."

E, a caneta, em letra fina e antiga, ao lado do seu nome, uma anotação que não é do Thomas nem do seu pai:

"O do meio."

Alguém leu essa ficha há mais de vinte anos, quando você era um menino que pulava do muro da vó, e escolheu você.

Você fica muito tempo sentado no chão do quarto do Thomas. O relógio dele faz tic no seu pulso.`,`It's your father's employee file. A passport photo of him, young, with the crooked smile Bob inherited. "Maxwel Zart. Stunt coordinator. Dependents: Thomas, Adam, Bob." Below, the signature of the movie's executive producer, above Otto Brenner's name: "L. Mercer."

And, in pen, in thin, old-fashioned handwriting, beside your name, a note that isn't Thomas's or your father's:

"The middle one."

Someone read this file more than twenty years ago, when you were a boy jumping off Grandma's wall, and chose you.

You sit on the floor of Thomas's room for a long time. His watch ticks on your wrist.`,`Es la ficha de empleado de tu padre. Una foto carné de él, joven, con la sonrisa torcida que heredó Bob. "Maxwel Zart. Coordinador de dobles. Dependientes: Thomas, Adam, Bob." Abajo, la firma del productor ejecutivo de la película, encima del nombre de Otto Brenner: "L. Mercer."

Y, en birome, con letra fina y antigua, al lado de tu nombre, una anotación que no es de Thomas ni de tu padre:

"El del medio."

Alguien leyó esta ficha hace más de veinte años, cuando eras un chico que saltaba del muro de la abuela, y te eligió.

Te quedas mucho tiempo sentado en el piso del cuarto de Thomas. Su reloj hace tic en tu muñeca.`))+addClue('a5ficha')+loseSan('1d6',L('"O do meio."','"The middle one."','"El del medio."'))}),
      fail:()=>({text:P(L(`Você vê a foto do seu pai, jovem, com o sorriso do Bob, e não consegue passar dela. As letras embaixo borram. Você dobra a folha e guarda no bolso para ler depois, quando conseguir. Só consegue ver uma assinatura: "L. M...", o resto escondido pela sua lágrima no papel.`,`You see the photo of your father, young, with Bob's smile, and you can't get past it. The letters below blur. You fold the page and put it in your pocket to read later, when you can. You only make out a signature: "L. M...", the rest hidden by your tear on the paper.`,`Ves la foto de tu padre, joven, con la sonrisa de Bob, y no puedes pasar de ahí. Las letras de abajo se borronean. Doblas la hoja y la guardas en el bolsillo para leerla después, cuando puedas. Solo distingues una firma: "L. M...", el resto escondido por tu lágrima en el papel.`))+loseSan('1d4',L('a foto do seu pai','your father\'s photo','la foto de tu padre'))})},
    {once:'korat5',label:L('Deixar a Koranna entrar','Let Koranna in','Dejar entrar a Koranna'),
      run:()=>({text:P(L(`Ela bate na porta aberta com dois dedos, do jeito que só ela bate. Você não responde, e ela entra mesmo assim, e senta no chão do seu lado, no meio dos papéis do Thomas.

"Você nunca me falou da sua mãe", ela diz.

Você fica quieto um tempo. Depois conta. A Adriana, que caía de moto em cima de colchão de ar e levantava rindo. Que dançava sozinha na cozinha da vó enquanto o seu pai cantava baixinho uma música que ele tinha escrito para ela. Que tinha um anel de prata fino, sem pedra, que nunca tirava, nem para gravar.

"A vó me deu esse anel quando eu fiz dezessete", você diz. Você puxa a corrente de dentro da camisa. O anel balança entre vocês dois. "Eu nunca soube o que fazer com ele."

A Koranna olha o anel. Depois olha para você. Não diz nada. Mas as orelhas dela ficam vermelhas, e ela segura a sua mão até você terminar de guardar os papéis.`,`She knocks on the open door with two fingers, the way only she knocks. You don't answer, and she comes in anyway, and sits on the floor beside you, among Thomas's papers.

"You never told me about your mother," she says.

You stay quiet for a while. Then you tell her. Adriana, who would crash a motorcycle onto an air mattress and get up laughing. Who danced alone in Grandma's kitchen while your father quietly sang a song he had written for her. Who had a thin silver ring, no stone, that she never took off, not even on set.

"Grandma gave me that ring when I turned seventeen," you say. You pull the chain out from under your shirt. The ring swings between you. "I never knew what to do with it."

Koranna looks at the ring. Then at you. She says nothing. But her ears go red, and she holds your hand until you've finished putting the papers away.`,`Golpea la puerta abierta con dos dedos, como solo ella golpea. No respondes, y entra igual, y se sienta en el piso a tu lado, entre los papeles de Thomas.

"Nunca me hablaste de tu madre", dice.

Te quedas callado un rato. Después le cuentas. Adriana, que se caía de la moto sobre un colchón de aire y se levantaba riendo. Que bailaba sola en la cocina de la abuela mientras tu padre cantaba bajito una canción que había escrito para ella. Que tenía un anillo de plata fino, sin piedra, que nunca se quitaba, ni para filmar.

"La abuela me dio ese anillo cuando cumplí diecisiete", dices. Sacas la cadena de debajo de la camisa. El anillo se balancea entre los dos. "Nunca supe qué hacer con él."

Koranna mira el anillo. Después te mira a ti. No dice nada. Pero se le ponen rojas las orejas, y te sostiene la mano hasta que terminas de guardar los papeles.`))+bond('koranna')+calm(3)})},
    {label:L('Guardar o envelope','Put the envelope away','Guardar el sobre'),main:true,run:()=>({go:'a5c_hub'})}
  ]},

a5d_telhado:{act:KI,title:L('O telhado','The roof','El techo'),
  text:()=>P(L(`O Estúdio Imperial está fechado desde o Brenner. Você ainda tem a chave do portão lateral. A Koranna sobe a escada de incêndio na sua frente, rindo baixo, como se estivessem fazendo alguma coisa proibida.

No telhado, a cidade inteira acesa. Foi aqui que a Koranna te beijou pela primeira vez, ao amanhecer, sem nem esperar você responder. Agora é meia-noite, e ela trouxe uma garrafa de vinho barato e duas canecas da Base.

"Nada de relíquia hoje", ela diz. "Nada de quadro. Nada de relógio." Ela cobre o seu pulso com a mão. "Hoje é só a gente."`,
`The Imperial Studio has been closed since Brenner. You still have the key to the side gate. Koranna climbs the fire escape ahead of you, laughing quietly, as if you were doing something forbidden.

On the roof, the whole city lit up. This is where Koranna kissed you for the first time, at dawn, without even waiting for your answer. Now it's midnight, and she brought a bottle of cheap wine and two mugs from the Base.

"No relics tonight," she says. "No board. No watch." She covers your wrist with her hand. "Tonight it's just us."`,
`El Estudio Imperial está cerrado desde Brenner. Todavía tienes la llave del portón lateral. Koranna sube la escalera de incendios delante de ti, riéndose bajito, como si estuvieran haciendo algo prohibido.

En el techo, la ciudad entera encendida. Aquí Koranna te besó por primera vez, al amanecer, sin siquiera esperar tu respuesta. Ahora es medianoche, y ella trajo una botella de vino barato y dos tazas de la Base.

"Nada de reliquias hoy", dice. "Nada de mural. Nada de reloj." Te cubre la muñeca con la mano. "Hoy somos solo nosotros."`))+calm(4),
  choices:()=>[
    {once:'danca5',label:L('Chamar ela para dançar','Ask her to dance','Invitarla a bailar'),
      run:()=>({text:P(L(`Não tem música. Você estende a mão mesmo assim.

"Você dança?", ela pergunta, desconfiada.

"Minha mãe dançava. Eu olhava."

Ela ri e aceita. Vocês dançam no concreto do telhado, sem música, pisando um no pé do outro. Você é um dublê que cai de prédio sem errar um passo e não consegue acertar dois passos de uma dança lenta. Ela ri tanto que precisa se segurar no seu ombro.

Depois ela para de rir. Encosta a testa no seu peito. "Eu não quero que ela te leve, Mada."

"Ela não vai."

"Promete."

Você nunca prometeu nada que não pudesse cumprir. "Prometo", você diz, e é a primeira vez na vida que você prometeu sem saber se ia conseguir.`,`There's no music. You hold out your hand anyway.

"You dance?" she asks, suspicious.

"My mother danced. I watched."

She laughs and takes your hand. You dance on the roof's concrete, no music, stepping on each other's feet. You're a stuntman who falls off buildings without missing a step and can't get two steps of a slow dance right. She laughs so hard she has to hold on to your shoulder.

Then she stops laughing. She rests her forehead on your chest. "I don't want her to take you, Mada."

"She won't."

"Promise."

You've never promised anything you couldn't keep. "I promise," you say, and it's the first time in your life you've promised without knowing if you could.`,`No hay música. Le tiendes la mano igual.

"¿Tú bailas?", pregunta, desconfiada.

"Mi madre bailaba. Yo miraba."

Se ríe y acepta. Bailan sobre el concreto del techo, sin música, pisándose los pies. Eres un doble que se cae de edificios sin errar un paso y no puedes acertar dos pasos de un baile lento. Ella se ríe tanto que tiene que agarrarse de tu hombro.

Después deja de reírse. Apoya la frente en tu pecho. "No quiero que te lleve, Mada."

"No lo va a hacer."

"Prométemelo."

Nunca prometiste nada que no pudieras cumplir. "Te lo prometo", dices, y es la primera vez en tu vida que prometes sin saber si vas a poder.`))+bond('koranna',2)+calm(4)})},
    {once:'futuro5',label:L('Perguntar o que ela quer depois de tudo isso','Ask what she wants after all this','Preguntarle qué quiere después de todo esto'),
      run:()=>({text:P(L(`Ela pensa muito antes de responder. A Koranna nunca responde rápido as coisas importantes.

"Uma casa com quintal", ela diz. "Um papagaio que fale besteira. Cachorro. Gato. Muitos cachorros e muitos gatos, Mada, eu tô falando sério. E acordar num domingo sem nenhum rádio tocando." Ela olha para você de lado. "E você lá. Isso é o principal. O resto eu negocio."

Você não sabe o que responder. Então você fala a verdade. "Eu nunca pensei em depois. Desde os dezessete, eu só pensava no próximo dia."

"Então pensa agora." Ela encosta a caneca na sua. "Eu espero."`,`She thinks a long time before answering. Koranna never answers important things quickly.

"A house with a backyard," she says. "A parrot that says ridiculous things. Dogs. Cats. Lots of dogs and lots of cats, Mada, I'm serious. And waking up on a Sunday with no radio going off." She looks at you sideways. "And you there. That's the main thing. The rest I can negotiate."

You don't know what to say. So you tell the truth. "I never thought about after. Since I was seventeen, I only thought about the next day."

"Then think about it now." She clinks her mug against yours. "I'll wait."`,`Piensa mucho antes de responder. Koranna nunca responde rápido las cosas importantes.

"Una casa con patio", dice. "Un loro que diga tonterías. Perros. Gatos. Muchos perros y muchos gatos, Mada, lo digo en serio. Y despertarme un domingo sin ninguna radio sonando." Te mira de costado. "Y tú ahí. Eso es lo principal. Lo demás lo negocio."

No sabes qué responder. Entonces dices la verdad. "Nunca pensé en el después. Desde los diecisiete, solo pensaba en el día siguiente."

"Entonces piénsalo ahora." Choca su taza con la tuya. "Yo espero."`))+bond('koranna')})},
    {label:L('Descer antes do amanhecer','Go down before dawn','Bajar antes del amanecer'),main:true,run:()=>({go:'a5c_hub'})}
  ]},

a5e_arauto:{act:K,title:L('Passos no corredor','Footsteps in the corridor','Pasos en el pasillo'),
  text:()=>P(L(`Às 3h17, os passos param na frente da sua porta.

Você está acordado. Você está sempre acordado agora. A Koranna também, com a lança já na mão. Por baixo da porta, o lodo preto entra devagar, escorrendo para cima pela madeira, e a madeira apodrece por onde ele passa.

No corredor, o Tuninho grita.`,
`At 3:17 a.m., the footsteps stop outside your door.

You're awake. You're always awake now. So is Koranna, her spear already in hand. Under the door, black sludge creeps in slowly, running upward along the wood, and the wood rots wherever it passes.

In the corridor, Tuninho screams.`,
`A las 3:17, los pasos se detienen frente a tu puerta.

Estás despierto. Ahora siempre estás despierto. Koranna también, con la lanza ya en la mano. Por debajo de la puerta, el lodo negro entra despacio, chorreando hacia arriba por la madera, y la madera se pudre por donde pasa.

En el pasillo, Tuninho grita.`)),
  choices:()=>[
    {label:L('Abrir a porta','Open the door','Abrir la puerta'),main:true,
      run:()=>({text:P(L(`O arauto está no meio do corredor, com a mão de lodo no rosto do Tuninho. O cabelo dele está ficando branco, fio por fio, enquanto você olha. O Kavyur sai do quarto do lado com a pistola do VT. O Derick vem do outro lado, descalço.

A espiral no lugar do rosto do arauto vira para você. Ele solta o Tuninho. Era só um recado.

Maitê grita do fim do corredor: "A cicatriz, Mada! Morte cede à Energia!"`,`The herald is in the middle of the corridor, its sludge hand on Tuninho's face. His hair is turning white, strand by strand, as you watch. Kavyur comes out of the room next door with VT's pistol. Derick comes from the other end, barefoot.

The spiral where the herald's face should be turns toward you. It lets go of Tuninho. That was only a message.

Maitê shouts from the end of the corridor: "The scar, Mada! Death yields to Energy!"`,`El heraldo está en medio del pasillo, con la mano de lodo en la cara de Tuninho. Se le está poniendo blanco el pelo, hebra por hebra, mientras miras. Kavyur sale del cuarto de al lado con la pistola de VT. Derick viene del otro lado, descalzo.

La espiral en lugar de la cara del heraldo gira hacia ti. Suelta a Tuninho. Era solo un mensaje.

Maitê grita desde el final del pasillo: "¡La cicatriz, Mada! ¡La Muerte cede ante la Energía!"`)),combat:{id:'arauto',after:'a5e_depois',allies:['koranna','derick16','kavyur'],script:'ampulheta'}})}
  ]},

a5e_depois:{act:K,title:L('Cabelo branco','White hair','Pelo blanco'),
  text:()=>{S.flags.a5arauto=true;return P(L(`O arauto se desfaz em lodo, e o lodo seca no chão como lama ao sol, e a lama vira pó. Antes de sumir de vez, a espiral gira uma última vez, e ele fala. Com a voz do Thomas.

"Lázaro espera por você, Adam. No sol. Onde os ipês caem."

Depois, silêncio. Os relógios da Base voltam a andar, todos juntos, para frente. Menos o do seu pulso. O do seu pulso andou mais um número para baixo.

O Tuninho está sentado no chão do corredor, com a Iris ajoelhada do lado. Ele tem vinte e três anos. O cabelo dele está todo branco.`,`The herald comes apart into sludge, and the sludge dries on the floor like mud in the sun, and the mud turns to dust. Before it's completely gone, the spiral turns one last time, and it speaks. In Thomas's voice.

"Lazarus is waiting for you, Adam. In the sun. Where the ipê trees shed."

Then silence. The Base's clocks start running again, all together, forward. Except the one on your wrist. The one on your wrist moved one more number down.

Tuninho is sitting on the corridor floor, with Iris kneeling beside him. He's twenty-three. His hair is completely white.`,`El heraldo se deshace en lodo, y el lodo se seca en el piso como barro al sol, y el barro se hace polvo. Antes de desaparecer del todo, la espiral gira una última vez, y habla. Con la voz de Thomas.

"Lázaro te espera, Adam. En el sol. Donde caen los ipês."

Después, silencio. Los relojes de la Base vuelven a andar, todos juntos, hacia adelante. Menos el de tu muñeca. El de tu muñeca bajó un número más.

Tuninho está sentado en el piso del pasillo, con Iris arrodillada a su lado. Tiene veintitrés años. Tiene el pelo completamente blanco.`))+addClue('a5sussurro')+loseSan('1d6',L('a voz do Thomas','Thomas\'s voice','la voz de Thomas'))},
  choices:()=>[
    {once:'tun5',label:L('Sentar do lado do Tuninho','Sit beside Tuninho','Sentarte al lado de Tuninho'),
      run:()=>({text:P(L(`Você senta no chão, encostado na mesma parede. O Tuninho passa a mão no cabelo e olha os dedos, como se esperasse ver tinta.

"Era por você que ele veio, né?", ele pergunta.

"Era."

"E ele passou por mim primeiro." Ele solta o ar. "Na semana passada todo mundo achou que eu era o traidor. Hoje eu fiquei na frente da porta do seu quarto." Ele ri, meio chorando. "Eu tô parecendo meu avô, Mada."

"Tá parecendo alguém que ficou na frente da porta", você diz. Você tira o próprio casaco e põe nos ombros dele. "Ninguém nessa Base vai esquecer."

Ele encosta a cabeça no seu ombro. Pela primeira vez desde que chegou da Formiga, ele dorme de verdade.`,`You sit on the floor, leaning against the same wall. Tuninho runs a hand through his hair and looks at his fingers, as if expecting to see paint.

"It was you it came for, right?" he asks.

"It was."

"And it went through me first." He lets out a breath. "Last week everyone thought I was the traitor. Tonight I stood in front of your door." He laughs, half crying. "I look like my grandpa, Mada."

"You look like someone who stood in front of the door," you say. You take off your own jacket and put it over his shoulders. "Nobody in this Base is going to forget."

He rests his head on your shoulder. For the first time since he came over from the Formiga, he really sleeps.`,`Te sientas en el piso, apoyado en la misma pared. Tuninho se pasa la mano por el pelo y se mira los dedos, como si esperara ver pintura.

"Era por ti que vino, ¿no?", pregunta.

"Sí."

"Y pasó por mí primero." Suelta el aire. "La semana pasada todos pensaban que yo era el traidor. Hoy me quedé frente a la puerta de tu cuarto." Se ríe, medio llorando. "Parezco mi abuelo, Mada."

"Pareces alguien que se quedó frente a la puerta", dices. Te quitas la campera y se la pones sobre los hombros. "Nadie en esta Base lo va a olvidar."

Apoya la cabeza en tu hombro. Por primera vez desde que llegó de la Formiga, duerme de verdad.`))+bond('tuninho',2)+calm(3)})},
    {label:L('Voltar ao quadro','Back to the board','Volver al mural'),main:true,run:()=>{dia();return {go:'a5c_hub'}}}
  ]},

a5f_quadro:{act:KI,title:L('Quem espera','Who waits','Quien espera'),
  text:()=>P(L(`A Base inteira na sala de reunião, de novo. Desta vez ninguém olha para as fotos dos outros. Todo mundo olha para a folha em branco no centro do quadro.

Você pega a caneta.

<b>Quem é o Comprador?</b>`,`The whole Base in the meeting room, again. This time nobody looks at anyone else's photo. Everyone looks at the blank sheet in the center of the board.

You pick up the pen.

<b>Who is the Buyer?</b>`,`Toda la Base en la sala de reuniones, otra vez. Esta vez nadie mira las fotos de los demás. Todos miran la hoja en blanco en el centro del mural.

Agarras la birome.

<b>¿Quién es el Comprador?</b>`))+hints([
    ['a5ficha',L('A ficha do seu pai foi assinada por "L. Mercer", que escreveu "o do meio" ao lado do seu nome.','Your father\'s file was signed by "L. Mercer", who wrote "the middle one" beside your name.','La ficha de tu padre la firmó "L. Mercer", que escribió "el del medio" al lado de tu nombre.')],
    ['a5fundacao',L('A Fundação Solar pagou o "Projeto Lázaro": um corpo que não morre.','The Solar Foundation paid for "Project Lazarus": a body that doesn\'t die.','La Fundación Solar pagó el "Proyecto Lázaro": un cuerpo que no muere.')],
    ['a5sussurro',L('O arauto disse: "Lázaro espera por você."','The herald said: "Lazarus is waiting for you."','El heraldo dijo: "Lázaro te espera."')],
    ['a5doente',L('O patrão do Brenner está morrendo há vinte anos e não morre.','Brenner\'s boss has been dying for twenty years and doesn\'t die.','El patrón de Brenner se está muriendo hace veinte años y no se muere.')],
    ['a5tatuagem',L('"O velho espera. Ele esperou vinte anos por você."','"The old man waits. He waited twenty years for you."','"El viejo espera. Te esperó veinte años."')]
  ]),
  choices:()=>[
    {label:L('Roger, o antigo líder da Ordem','Roger, the Order\'s old leader','Roger, el antiguo líder de la Orden'),run:()=>{S.flags.a5q1='roger';return {go:'a5f_q2'}}},
    {label:'Leon Silva',run:()=>{S.flags.a5q1='leon';return {go:'a5f_q2'}}},
    {label:'Kadu',run:()=>{S.flags.a5q1='kadu';return {go:'a5f_q2'}}},
    {label:'Lázaro Mercer',run:()=>{S.flags.a5q1='mercer';return {go:'a5f_q2'}}}
  ]},

a5f_q2:{act:KI,title:L('Onde ele espera','Where he waits','Dónde espera'),
  text:()=>P(L(`Você escreve o nome. A mão treme um pouco.

<b>Onde ele está esperando?</b>`,`You write the name. Your hand shakes a little.

<b>Where is he waiting?</b>`,`Escribes el nombre. La mano te tiembla un poco.

<b>¿Dónde está esperando?</b>`))+hints([
    ['a5clinica',L('O sedativo do café do Tuninho só foi para a clínica Solar dos Ipês, na serra.','The sedative in Tuninho\'s coffee only went to the Solar dos Ipês clinic, in the hills.','El sedante del café de Tuninho solo fue a la clínica Solar dos Ipês, en la sierra.')],
    ['a5sussurro',L('"No sol. Onde os ipês caem."','"In the sun. Where the ipê trees shed."','"En el sol. Donde caen los ipês."')],
    ['a5empresa',L('A Fundação Solar é uma instituição de cuidados paliativos.','The Solar Foundation is a palliative care institution.','La Fundación Solar es una institución de cuidados paliativos.')],
    ['a5tatuagem',L('A tatuagem dos homens dele: uma espiral com um sol no meio.','His men\'s tattoo: a spiral with a sun in the middle.','El tatuaje de sus hombres: una espiral con un sol en el medio.')]
  ]),
  choices:()=>[
    {label:L('Clínica Solar dos Ipês','Solar dos Ipês Clinic','Clínica Solar dos Ipês'),run:()=>{S.flags.a5q2='solar';return {go:'a5f_resultado'}}},
    {label:L('Estúdio Imperial','Imperial Studio','Estudio Imperial'),run:()=>{S.flags.a5q2='estudio';return {go:'a5f_resultado'}}},
    {label:L('Usina Velha','Old Plant','Usina Vieja'),run:()=>{S.flags.a5q2='usina';return {go:'a5f_resultado'}}},
    {label:L('Fórum Velho','Old Courthouse','Foro Viejo'),run:()=>{S.flags.a5q2='forum';return {go:'a5f_resultado'}}}
  ]},

a5f_resultado:{act:KI,title:L('O nome no quadro','The name on the board','El nombre en el mural'),
  text:()=>{const q1=S.flags.a5q1==='mercer',q2=S.flags.a5q2==='solar';S.flags.a5acertos=(q1?1:0)+(q2?1:0);
    return (q1?P(L(`LÁZARO MERCER.

O Derick digita o nome. Em três minutos, a tela está cheia. Produtor de cinema em Atlanta. Filantropo. Fundador da Fundação Solar. Diagnosticado com câncer terminal há vinte e dois anos. Nenhuma foto pública desde então.

O Kavyur olha para o nome por muito tempo. Depois tira a foto dos irmãos do bolso e prende no quadro, do lado do nome, com um alfinete.`,`LAZARUS MERCER.

Derick types the name. In three minutes, the screen is full. Film producer in Atlanta. Philanthropist. Founder of the Solar Foundation. Diagnosed with terminal cancer twenty-two years ago. No public photo since.

Kavyur looks at the name for a long time. Then he takes the photo of his brothers out of his pocket and pins it to the board, beside the name.`,`LÁZARO MERCER.

Derick escribe el nombre. En tres minutos, la pantalla está llena. Productor de cine en Atlanta. Filántropo. Fundador de la Fundación Solar. Diagnosticado con cáncer terminal hace veintidós años. Ninguna foto pública desde entonces.

Kavyur mira el nombre mucho tiempo. Después saca la foto de sus hermanos del bolsillo y la clava en el mural, al lado del nombre.`)):P(L(`Você escreve um nome, e o Derick passa a noite procurando. Nada fecha. Às cinco da manhã, ele entra no seu quarto com o notebook: "Não é ele, Mada. Mas olha isso." Na tela, a ficha do seu pai, a Fundação Solar, e um nome que aparece nas duas: Lázaro Mercer.

Você perdeu uma noite. O relógio não perdoa.`,`You write a name, and Derick spends the night searching. Nothing fits. At five in the morning, he comes into your room with the laptop: "It's not him, Mada. But look at this." On the screen, your father's file, the Solar Foundation, and a name that shows up in both: Lazarus Mercer.

You lost a night. The watch doesn't forgive.`,`Escribes un nombre, y Derick pasa la noche buscando. Nada cierra. A las cinco de la mañana, entra en tu cuarto con la notebook: "No es él, Mada. Pero mira esto." En la pantalla, la ficha de tu padre, la Fundación Solar, y un nombre que aparece en las dos: Lázaro Mercer.

Perdiste una noche. El reloj no perdona.`))+loseSan('1d4',L('a noite perdida','the lost night','la noche perdida')))+
    (q2?P(L(`E o lugar. A clínica Solar dos Ipês fica na serra, a duas horas daqui. Nas fotos do site, uma alameda de ipês amarelos, as flores caindo no chão como chuva.

"Onde os ipês caem", diz a Koranna, baixinho.

O relógio no seu pulso marca ${falta()}. Vocês vão amanhã, ao nascer do sol.`,`And the place. The Solar dos Ipês clinic is in the hills, two hours from here. In the photos on its website, an avenue of yellow ipê trees, their flowers falling to the ground like rain.

"Where the ipê trees shed," Koranna says quietly.

The watch on your wrist reads ${falta()}. You go tomorrow, at sunrise.`,`Y el lugar. La clínica Solar dos Ipês está en la sierra, a dos horas de acá. En las fotos del sitio web, una alameda de ipês amarillos, con las flores cayendo al piso como lluvia.

"Donde caen los ipês", dice Koranna, bajito.

El reloj en tu muñeca marca ${falta()}. Van mañana, al amanecer.`)):P(L(`O lugar que você escreveu parece certo. Parece. Vocês vão amanhã, ao nascer do sol. O relógio no seu pulso marca ${falta()}.`,`The place you wrote down feels right. It feels that way. You go tomorrow, at sunrise. The watch on your wrist reads ${falta()}.`,`El lugar que escribiste parece correcto. Parece. Van mañana, al amanecer. El reloj en tu muñeca marca ${falta()}.`)))},
  choices:()=>[{label:L('A última noite antes','The last night before','La última noche antes'),main:true,run:()=>({go:'a5g_noite'})}]},

a5g_noite:{act:K,title:L('A mesa posta','The table set','La mesa puesta'),
  text:()=>P(L(`Você dorme. Pela primeira vez em dias, você dorme.

E sonha com a cozinha da vó. A mesa posta para o almoço de domingo. O vô na cabeceira, a vó trazendo o feijão. A sua mãe dançando sozinha perto do fogão. O seu pai rindo de alguma coisa que o Bob disse. O Thomas, com o relógio no pulso, puxando uma cadeira vazia para você.

"Senta, Adam", diz o Thomas. "Tá esfriando."

Você quer sentar. Você quer tanto sentar.

Então você vê. O Thomas não tem rosto. No lugar do rosto, uma espiral que gira devagar. E a voz não é dele.

"Você fugiu de mim três vezes. Senta. Tem lugar."

Você acorda gritando. A Koranna já está acordada, segurando o seu rosto com as duas mãos, dizendo o seu nome. O seu nome de verdade. "Adam. Adam. Tô aqui. Olha para mim."`,
`You sleep. For the first time in days, you sleep.

And you dream of Grandma's kitchen. The table set for Sunday lunch. Grandpa at the head, Grandma bringing the beans. Your mother dancing alone by the stove. Your father laughing at something Bob said. Thomas, the watch on his wrist, pulling out an empty chair for you.

"Sit down, Adam," says Thomas. "It's getting cold."

You want to sit. You want to sit so much.

Then you see it. Thomas has no face. Where his face should be, a spiral turns slowly. And the voice isn't his.

"You ran from me three times. Sit. There's room."

You wake up screaming. Koranna is already awake, holding your face in both hands, saying your name. Your real name. "Adam. Adam. I'm here. Look at me."`,
`Duermes. Por primera vez en días, duermes.

Y sueñas con la cocina de la abuela. La mesa puesta para el almuerzo del domingo. El abuelo en la cabecera, la abuela trayendo los porotos. Tu madre bailando sola al lado de la cocina. Tu padre riéndose de algo que dijo Bob. Thomas, con el reloj en la muñeca, corriendo una silla vacía para ti.

"Siéntate, Adam", dice Thomas. "Se está enfriando."

Quieres sentarte. Quieres tanto sentarte.

Entonces lo ves. Thomas no tiene cara. En lugar de la cara, una espiral que gira despacio. Y la voz no es la suya.

"Te escapaste de mí tres veces. Siéntate. Hay lugar."

Te despiertas gritando. Koranna ya está despierta, sosteniéndote la cara con las dos manos, diciendo tu nombre. Tu nombre verdadero. "Adam. Adam. Estoy aquí. Mírame."`))+loseSan('2d4',L('a mesa posta','the table set','la mesa puesta')),
  choices:()=>[
    {once:'sonho5',label:L('Contar o sonho para ela','Tell her the dream','Contarle el sueño'),
      run:()=>({text:P(L(`Você conta tudo. A mesa, o feijão, a cadeira vazia. A voz. Você nunca falou tanto da sua família para ninguém, nem para o Thomas, porque o Thomas estava lá.

A Koranna escuta até o fim. Depois deita do seu lado e segura a sua mão em cima da cicatriz.

"Eles não iam querer que você sentasse", ela diz. "Não ainda. A sua mãe ia te mandar levantar da mesa e ir dançar."

Você ri. Um riso molhado, esquisito. É a primeira vez que você ri pensando neles.`,`You tell her everything. The table, the beans, the empty chair. The voice. You've never talked this much about your family to anyone, not even Thomas, because Thomas was there.

Koranna listens to the end. Then she lies down beside you and holds your hand on top of the scar.

"They wouldn't want you to sit," she says. "Not yet. Your mother would tell you to get up from the table and go dance."

You laugh. A wet, strange laugh. It's the first time you've laughed thinking about them.`,`Le cuentas todo. La mesa, los porotos, la silla vacía. La voz. Nunca hablaste tanto de tu familia con nadie, ni con Thomas, porque Thomas estaba ahí.

Koranna escucha hasta el final. Después se acuesta a tu lado y te sostiene la mano encima de la cicatriz.

"No querrían que te sentaras", dice. "Todavía no. Tu madre te mandaría levantarte de la mesa e ir a bailar."

Te ríes. Una risa mojada, rara. Es la primera vez que te ríes pensando en ellos.`))+calm(6)+bond('koranna')})},
    {label:L('Tirar o anel da corrente','Take the ring off the chain','Sacar el anillo de la cadena'),main:true,
      run:()=>{S.flags.a5pedido=true;return {text:P(L(`Você não planejou. Se tivesse planejado, não ia conseguir.

Você tira a corrente do pescoço, solta o fecho e deixa o anel da sua mãe cair na palma da mão. É pequeno demais para o seu dedo. Sempre foi.

"Koranna."

Ela vê o anel e para de respirar.

"Eu não sei o que vai acontecer amanhã", você diz. "Eu nunca soube. Mas eu sei o que eu quero depois. Uma casa com quintal. Um papagaio falando besteira. Cachorro, gato, todos os bichos que você quiser. Você." A voz falha. Você deixa falhar. "Casa comigo."

Ela fecha a sua mão em volta do anel, com as duas mãos dela por cima. Os olhos dela estão cheios.

"Sim", ela diz, antes de você terminar de respirar. Ela ri e chora ao mesmo tempo. "Sim, seu idiota. Sim."

Você coloca o anel no dedo dela. Serve perfeito, como se tivesse esperado a vida inteira por aquela mão.

Ela te puxa pela nuca e te beija. Um beijo longo, sem pressa, com gosto de sal. Quando vocês se separam, ela encosta a testa na sua.

"Agora você tem que voltar", ela sussurra. "Você me deve um casamento."`,`You didn't plan it. If you had planned it, you wouldn't have been able to.

You take the chain from your neck, undo the clasp and let your mother's ring drop into your palm. It's too small for your finger. It always was.

"Koranna."

She sees the ring and stops breathing.

"I don't know what's going to happen tomorrow," you say. "I never knew. But I know what I want after. A house with a backyard. A parrot saying ridiculous things. Dogs, cats, every animal you want. You." Your voice breaks. You let it break. "Marry me."

She closes your hand around the ring, both of her hands over it. Her eyes are full.

"Yes," she says, before you've finished breathing. She laughs and cries at the same time. "Yes, you idiot. Yes."

You slide the ring onto her finger. It fits perfectly, as if it had waited its whole life for that hand.

She pulls you in by the back of the neck and kisses you. A long kiss, unhurried, tasting of salt. When you part, she rests her forehead against yours.

"Now you have to come back," she whispers. "You owe me a wedding."`,`No lo planeaste. Si lo hubieras planeado, no habrías podido.

Te quitas la cadena del cuello, abres el broche y dejas que el anillo de tu madre caiga en la palma de la mano. Es demasiado chico para tu dedo. Siempre lo fue.

"Koranna."

Ve el anillo y deja de respirar.

"No sé qué va a pasar mañana", dices. "Nunca lo supe. Pero sé lo que quiero después. Una casa con patio. Un loro diciendo tonterías. Perros, gatos, todos los animales que quieras. A ti." La voz se te quiebra. La dejas quebrarse. "Cásate conmigo."

Te cierra la mano alrededor del anillo, con sus dos manos encima. Tiene los ojos llenos.

"Sí", dice, antes de que termines de respirar. Se ríe y llora al mismo tiempo. "Sí, tonto. Sí."

Le pones el anillo en el dedo. Le queda perfecto, como si hubiera esperado toda la vida por esa mano.

Te tira de la nuca y te besa. Un beso largo, sin apuro, con gusto a sal. Cuando se separan, apoya la frente contra la tuya.

"Ahora tienes que volver", susurra. "Me debes un casamiento."`))+bond('koranna',3)+calm(8),go:S.flags.a5q2==='solar'?'a5h_clinica':'a5h_errado'}}},
    {label:L('Só abraçar ela até o sol nascer','Just hold her until sunrise','Solo abrazarla hasta que salga el sol'),
      run:()=>({text:P(L(`Você não diz nada. Você puxa a Koranna para perto e fica com o rosto no cabelo dela até a janela clarear. O anel da sua mãe pesa na corrente, em cima do seu peito. Ainda não. Quando voltar.`,`You say nothing. You pull Koranna close and keep your face in her hair until the window grows light. Your mother's ring hangs heavy on the chain, on your chest. Not yet. When you come back.`,`No dices nada. Atraes a Koranna y te quedas con la cara en su pelo hasta que la ventana se aclara. El anillo de tu madre pesa en la cadena, sobre tu pecho. Todavía no. Cuando vuelvas.`))+calm(5),go:S.flags.a5q2==='solar'?'a5h_clinica':'a5h_errado'})}
  ]},

a5h_errado:{act:KC,title:L('O lugar errado','The wrong place','El lugar equivocado'),
  text:()=>P(L(`O lugar está vazio. Poeira, silêncio, e nenhum homem de espiral no pulso. Vocês perdem a manhã inteira revirando cada sala.

No meio da tarde, o relógio no seu pulso desce para o último número. Todos os pássaros do telhado caem ao mesmo tempo. A Koranna segura o seu braço: você tem mais fios brancos do que ontem. Muitos mais.

É o Kavyur que acha, no celular, as fotos do site da clínica. "Solar dos Ipês", ele lê. "Onde os ipês caem. Mada, é lá. Sempre foi lá."

Vocês correm para a serra com o sol se pondo.`,`The place is empty. Dust, silence, and no men with spirals on their wrists. You waste the whole morning turning every room over.

In the middle of the afternoon, the watch on your wrist drops to the last number. Every bird on the roof falls at the same time. Koranna grabs your arm: you have more white strands than yesterday. Many more.

It's Kavyur who finds, on his phone, the photos on the clinic's website. "Solar dos Ipês," he reads. "Where the ipê trees shed. Mada, it's there. It was always there."

You race to the hills as the sun goes down.`,`El lugar está vacío. Polvo, silencio, y ningún hombre con espiral en la muñeca. Pierden toda la mañana revolviendo cada sala.

A media tarde, el reloj de tu muñeca baja al último número. Todos los pájaros del techo caen al mismo tiempo. Koranna te agarra del brazo: tienes más hebras blancas que ayer. Muchas más.

Es Kavyur quien encuentra, en el celular, las fotos del sitio de la clínica. "Solar dos Ipês", lee. "Donde caen los ipês. Mada, es ahí. Siempre fue ahí."

Corren hacia la sierra con el sol poniéndose.`))+loseSan('2d6',L('o tempo perdido','the lost time','el tiempo perdido'))+safePv('3d10',L('o tempo no seu corpo','time in your body','el tiempo en tu cuerpo')),
  choices:()=>[{label:L('Subir a serra','Drive up into the hills','Subir a la sierra'),main:true,run:()=>({go:'a5h_clinica'})}]},

a5h_clinica:{act:KC,title:L('Solar dos Ipês','Solar dos Ipês','Solar dos Ipês'),checkpoint:true,
  text:()=>P(L(`A alameda de ipês amarelos sobe até um casarão branco no alto da serra. As flores caem sem parar, cobrindo o chão, o capô do carro, os seus ombros. É bonito. É a coisa mais bonita que você viu em meses, e isso te dá medo.
