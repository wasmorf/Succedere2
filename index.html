Object.assign(CLUES,{
  fotos:c(L('As fotos dos Hoff','The Hoff photos','Las fotos de los Hoff'),L('Pablo, Emily e o pequeno Derick em aniversários, praias, um Natal. A partir de uma certa data, Emily some das fotos. Derick para de sorrir. Pablo aparece cada vez mais magro.','Pablo, Emily and little Derick at birthdays, beaches, one Christmas. From a certain date on, Emily vanishes from the photos. Derick stops smiling. Pablo looks thinner in each one.','Pablo, Emily y el pequeño Derick en cumpleaños, playas, una Navidad. A partir de cierta fecha, Emily desaparece de las fotos. Derick deja de sonreír. Pablo sale cada vez más flaco.')),
  obito:c(L('O atestado de Emily','Emily\'s death certificate','El certificado de Emily'),L('Emily Hoff. Causa da morte: desconhecida. Atrás, na letra de Pablo, repetido até rasgar o papel: "Ela ainda está lá. O sangue dele é o mesmo que o dela. O sangue dele abre a porta."','Emily Hoff. Cause of death: unknown. On the back, in Pablo\'s handwriting, repeated until the paper tears: "She\'s still there. His blood is the same as hers. His blood opens the door."','Emily Hoff. Causa de muerte: desconocida. Atrás, con la letra de Pablo, repetido hasta romper el papel: "Ella sigue ahí. Su sangre es la misma que la de ella. Su sangre abre la puerta."'))
});
const K=L('Ato I · Cap. 4 · A Ordem','Act I · Ch. 4 · The Order','Acto I · Cap. 4 · La Orden');
const KH=L('Ato I · Cap. 4 · Hoff','Act I · Ch. 4 · Hoff','Acto I · Cap. 4 · Hoff');
Object.assign(SCENES,{
c4a_roger:{act:K,title:'Roger',checkpoint:true,
  text:()=>P(L(`O caso Karlovski chegou em ouvidos que vocês não conheciam. Numa manhã de chuva, um homem de terno escuro e cabelo raspado desce do elevador de carga como se o hangar fosse dele.

"Roger", ele diz. Ex-militar: dá para ver no jeito de parar em pé. Fala rápido e não pisca. "Eu dirijo uma organização chamada Ordo Realitas. A gente faz o que vocês fizeram na oficina. Só que em todo lugar, com gente, dinheiro e arquivo." Ele olha para vocês três. "Eu quero os Zart."

VT está encostado na parede, de braços cruzados. Não diz nada. Ainda.`,
`The Karlovski case reached ears you didn't know existed. One rainy morning, a man in a dark suit with a shaved head steps off the freight elevator as if he owned the hangar.

"Roger," he says. Ex-military: you can tell from the way he stands. He talks fast and doesn't blink. "I run an organization called Ordo Realitas. We do what you did at that workshop. Only everywhere, with people, money and archives." He looks at the three of you. "I want the Zarts."

VT is leaning against the wall with his arms crossed. He says nothing. Yet.`,
`El caso Karlovski llegó a oídos que ustedes no conocían. Una mañana de lluvia, un hombre de traje oscuro y cabeza rapada baja del montacargas como si el hangar fuera suyo.

"Roger", dice. Exmilitar: se nota en la forma de pararse. Habla rápido y no parpadea. "Dirijo una organización llamada Ordo Realitas. Hacemos lo que ustedes hicieron en el taller. Solo que en todas partes, con gente, dinero y archivos." Los mira a los tres. "Quiero a los Zart."

VT está apoyado en la pared, con los brazos cruzados. No dice nada. Todavía.`)),
  choices:()=>[
    {once:'ouvroger',label:L('Ouvir a proposta do Roger','Hear Roger\'s offer','Escuchar la propuesta de Roger'),
      run:()=>({text:P(L(`"Vocês três e um hangar contra o Outro Lado inteiro? Vão morrer em dois anos." Ele não fala como ameaça. Fala como quem leu um relatório. "Na Ordem, quando um de vocês cair, tem alguém para levantar. Tem médico. Tem arsenal. Tem gente estudando o que vocês só enfrentam." Ele deixa um cartão em cima da mesa. Não tem nome, só um símbolo.`,`"The three of you and a hangar against the entire Other Side? You'll be dead in two years." He doesn't say it as a threat. He says it like someone who's read a report. "In the Order, when one of you goes down, there's someone to pick you up. There are doctors. An armory. People studying what you only fight." He leaves a card on the table. No name, just a symbol.`,`"¿Ustedes tres y un hangar contra todo el Otro Lado? Van a estar muertos en dos años." No lo dice como amenaza. Lo dice como quien leyó un informe. "En la Orden, cuando uno de ustedes caiga, hay alguien que lo levanta. Hay médicos. Arsenal. Gente estudiando lo que ustedes solo enfrentan." Deja una tarjeta sobre la mesa. Sin nombre, solo un símbolo.`))+bond('roger')})},
    {once:'ouvvt',label:L('Ouvir o VT','Hear VT out','Escuchar a VT'),
      run:()=>({text:P(L(`VT fala sem tirar os olhos do Roger. "Eu achei vocês num galpão com um pé de cabra. Eu dei teto, comida e uma katana. A Ordem vai dar um crachá e uma pasta com o nome de vocês dentro." Ele finalmente olha para você. "Eles vão usar vocês, Adam. Mas vocês já são grandes. A escolha é de vocês." É a coisa mais difícil que você já viu ele dizer.`,`VT speaks without taking his eyes off Roger. "I found you in a warehouse with a crowbar. I gave you a roof, food and a katana. The Order will give you a badge and a folder with your names in it." He finally looks at you. "They're going to use you, Adam. But you're grown now. It's your choice." It's the hardest thing you've ever seen him say.`,`VT habla sin sacarle los ojos de encima a Roger. "Los encontré en un galpón con una palanca. Les di techo, comida y una katana. La Orden les va a dar una credencial y una carpeta con sus nombres adentro." Por fin te mira. "Los van a usar, Adam. Pero ya son grandes. La decisión es de ustedes." Es lo más difícil que le viste decir.`))+bond('vt')})},
    {once:'irmaos4',label:L('Perguntar aos seus irmãos','Ask your brothers','Preguntarles a tus hermanos'),
      run:()=>({text:P(L(`Thomas já decidiu. Dá para ver no jeito que ele guardou o cartão no bolso. "Arquivo, Adam. Eles têm arquivo. Tudo o que a gente descobriu com um mural de cortiça, eles já têm catalogado." Bob dá de ombros. "Eu vou para onde vocês forem." Ele tem dezesseis anos e diz isso como se fosse óbvio.`,`Thomas has already decided. You can tell from the way he pocketed the card. "Archives, Adam. They have archives. Everything we figured out with a corkboard, they already have catalogued." Bob shrugs. "I go where you go." He's sixteen and says it like it's obvious.`,`Thomas ya decidió. Se nota en cómo se guardó la tarjeta en el bolsillo. "Archivo, Adam. Tienen archivo. Todo lo que descubrimos con un corcho, ellos ya lo tienen catalogado." Bob se encoge de hombros. "Yo voy adonde vayan ustedes." Tiene dieciséis años y lo dice como si fuera obvio.`))+bond('thomas')+bond('bob')})},
    {label:L('Aceitar a proposta','Accept the offer','Aceptar la propuesta'),main:true,
      run:()=>({text:P(L(`Você pega o cartão. Roger balança a cabeça uma vez, como se já soubesse. Atrás dele, VT se vira e desce para o porão sem dizer nada.`,`You pick up the card. Roger nods once, as if he already knew. Behind him, VT turns and goes down to the basement without a word.`,`Agarras la tarjeta. Roger asiente una vez, como si ya lo supiera. Detrás de él, VT se da vuelta y baja al sótano sin decir nada.`)),go:'c4b_despedida'})}
  ]},

c4b_despedida:{act:K,title:L('A despedida','The goodbye','La despedida'),
  text:()=>P(L(`Três mochilas no chão do hangar. As correntes do Bob, o fuzil do Thomas, a Raijin nas suas costas. O carro da Ordem espera lá fora com o motor ligado.

Kavyur está parado na porta do elevador com uma garrafa térmica de café. "Eu fico", ele diz antes que alguém pergunte. "Alguém tem que ficar com ele." Ele aponta com a cabeça para o porão. A porta do quarto do VT está fechada.`,
`Three backpacks on the hangar floor. Bob's chains, Thomas's rifle, Raijin on your back. The Order's car waits outside with the engine running.

Kavyur stands at the elevator door holding a thermos of coffee. "I'm staying," he says before anyone asks. "Someone has to stay with him." He nods toward the basement. VT's bedroom door is shut.`,
`Tres mochilas en el piso del hangar. Las cadenas de Bob, el fusil de Thomas, la Raijin en tu espalda. El auto de la Orden espera afuera con el motor en marcha.

Kavyur está parado en la puerta del montacargas con un termo de café. "Yo me quedo", dice antes de que alguien pregunte. "Alguien tiene que quedarse con él." Señala el sótano con la cabeza. La puerta del cuarto de VT está cerrada.`)),
  choices:()=>[
    {once:'kavtchau',label:L('Abraçar o Kavyur','Hug Kavyur','Abrazar a Kavyur'),
      run:()=>({text:P(L(`Ele fica rígido, depois devolve o abraço de um jeito desajeitado. "Me liga se precisar de alguém que saiba ler ritual", ele diz. "Mesmo que ele diga que não."`,`He goes stiff, then hugs you back awkwardly. "Call me if you need someone who can read rituals," he says. "Even if he says not to."`,`Se pone rígido, después te devuelve el abrazo con torpeza. "Llámame si necesitas a alguien que sepa leer rituales", dice. "Aunque él diga que no."`))+bond('kavyur')})},
    {once:'portavt',label:L('Bater na porta do VT','Knock on VT\'s door','Golpear la puerta de VT'),test:{sk:'Vontade',dt:14},
      ok:()=>{S.flags.vtfalou=true;return {text:P(L(`Você bate até ele abrir. VT fica parado na porta, sem camisa, com os olhos vermelhos que ele finge que são de sono. Vocês não falam nada por um tempo. Então ele te puxa pela nuca e encosta a testa na sua. "Volta inteiro. Sempre." Depois fecha a porta. É o suficiente.`,`You knock until he opens. VT stands in the doorway, shirtless, with red eyes he pretends are from sleep. Neither of you speaks for a while. Then he pulls you in by the back of the neck and rests his forehead against yours. "Come back in one piece. Always." Then he shuts the door. It's enough.`,`Golpeas hasta que abre. VT se queda en la puerta, sin remera, con los ojos rojos que finge que son de sueño. No hablan por un rato. Entonces te agarra de la nuca y apoya la frente contra la tuya. "Vuelve entero. Siempre." Después cierra la puerta. Alcanza.`))+bond('vt')+calm(2)}},
      fail:()=>({text:P(L(`Você bate três vezes. A porta não abre. Do outro lado, você ouve a TV aumentar de volume. Você encosta a mão na madeira por um segundo e vai embora.`,`You knock three times. The door doesn't open. On the other side, you hear the TV get louder. You rest your hand on the wood for a second and walk away.`,`Golpeas tres veces. La puerta no se abre. Del otro lado, oyes que sube el volumen de la tele. Apoyas la mano en la madera un segundo y te vas.`))+loseSan('1d2',L('a porta fechada','the closed door','la puerta cerrada'))})},
    {label:L('Entrar no carro da Ordem','Get in the Order\'s car','Subir al auto de la Orden'),main:true,run:()=>({go:'c4c_base'})}
  ]},

c4c_base:{act:K,title:L('A Base','The Base','La Base'),checkpoint:true,
  text:()=>P(L(`A Base da Ordem é um prédio comercial sem nome, com três andares para cima e cinco para baixo. Tem refeitório, enfermaria, uma biblioteca de arquivos que faz Thomas ficar em silêncio por dez minutos, e um garoto sério, filho do Roger, que organiza pastas no corredor como se fosse adulto.

Dois anos passam. Thomas vira analista e depois ninguém toma decisão sem falar com ele. Bob treina com os outros recrutas e odeia cada minuto. Você vira o agente que o Roger chama quando precisa de alguém que entre, resolva e saia.

Numa sexta à noite, Roger te chama na sala dele. Sozinho.`,
`The Order's Base is a nameless office building, three floors up and five down. It has a cafeteria, an infirmary, an archive library that leaves Thomas silent for ten minutes, and a serious boy, Roger's son, who files folders in the hallway as if he were a grown-up.

Two years go by. Thomas becomes an analyst, and soon nobody makes a decision without talking to him. Bob trains with the other recruits and hates every minute. You become the agent Roger calls when he needs someone to go in, handle it and get out.

One Friday night, Roger calls you into his office. Alone.`,
`La Base de la Orden es un edificio de oficinas sin nombre, con tres pisos hacia arriba y cinco hacia abajo. Tiene comedor, enfermería, una biblioteca de archivos que deja a Thomas en silencio diez minutos, y un chico serio, hijo de Roger, que ordena carpetas en el pasillo como si fuera adulto.

Pasan dos años. Thomas se vuelve analista y pronto nadie decide nada sin hablar con él. Bob entrena con los otros reclutas y odia cada minuto. Tú te vuelves el agente al que Roger llama cuando necesita a alguien que entre, lo resuelva y salga.

Un viernes a la noche, Roger te llama a su oficina. Solo.`)),
  choices:()=>[
    {once:'briefing',label:L('"Quem é o alvo?"','"Who\'s the target?"','"¿Quién es el objetivo?"'),
      run:()=>({text:P(L(`Roger desliza uma pasta pela mesa. Pablo Hoff, quarenta e poucos anos, professor de química aposentado. Viúvo. Um filho de doze anos. "Compra de sangue em hospital clandestino. Livros que só três pessoas no país deveriam ter. E faz um mês que o menino não aparece na escola." Ele não pisca. "Vai sozinho. Discreto. Se ele estiver fazendo o que eu acho, resolve."`,`Roger slides a folder across the desk. Pablo Hoff, early forties, retired chemistry teacher. Widower. A twelve-year-old son. "Blood purchases from an underground clinic. Books only three people in this country should own. And the boy hasn't been to school in a month." He doesn't blink. "Go alone. Quiet. If he's doing what I think he is, deal with it."`,`Roger desliza una carpeta por el escritorio. Pablo Hoff, cuarenta y pocos, profesor de química jubilado. Viudo. Un hijo de doce años. "Compras de sangre a una clínica clandestina. Libros que solo tres personas en el país deberían tener. Y hace un mes que el chico no va a la escuela." No parpadea. "Ve solo. Discreto. Si está haciendo lo que creo, resuélvelo."`))+bond('roger')})},
    {once:'thomas4',label:L('Passar na sala do Thomas antes de sair','Stop by Thomas\'s office before leaving','Pasar por la oficina de Thomas antes de salir'),
      run:()=>({text:P(L(`Thomas já leu a pasta. Claro que já. "Doze anos, Adam." Ele não diz mais nada. Não precisa. Os dois pensam na mesma pessoa: um menino de doze anos querendo ver o vídeo de uma queda três vezes.`,`Thomas has already read the folder. Of course he has. "Twelve years old, Adam." He says nothing else. He doesn't have to. You're both thinking of the same person: a twelve-year-old who wanted to watch the video of a fall three times.`,`Thomas ya leyó la carpeta. Claro que sí. "Doce años, Adam." No dice nada más. No hace falta. Los dos piensan en la misma persona: un chico de doce años que quería ver el video de una caída tres veces.`))+bond('thomas')+bond('bob')})},
    {label:L('Passar no arsenal da Ordem','Stop by the Order\'s armory','Pasar por el arsenal de la Orden'),main:true,
      run:()=>({text:P(L(`Roger te promoveu a Operador no mês passado. O arsenal agora abre um pouco mais para você.`,`Roger promoted you to Operator last month. The armory opens up a little more for you now.`,`Roger te ascendió a Operador el mes pasado. El arsenal ahora se abre un poco más para ti.`)),arsenal:{next:'c4d_casa',patente:'operador'}})}
  ]},

c4d_casa:{act:KH,title:L('A casa dos Hoff','The Hoff house','La casa de los Hoff'),checkpoint:true,
  text:()=>P(L(`Uma casa grande num bairro tranquilo, com a grama alta demais e todas as cortinas fechadas. A porta dos fundos está destrancada. Lá dentro, cheiro de desinfetante por cima de outra coisa.

Não tem ninguém na sala. Mas de algum lugar embaixo dos seus pés vem um som baixo, ritmado. Alguém cantando.`,
`A big house in a quiet neighborhood, the grass too long and every curtain drawn. The back door is unlocked. Inside, the smell of disinfectant over something else.

There's nobody in the living room. But from somewhere beneath your feet comes a low, rhythmic sound. Someone chanting.`,
`Una casa grande en un barrio tranquilo, con el pasto demasiado alto y todas las cortinas cerradas. La puerta de atrás está sin llave. Adentro, olor a desinfectante encima de otra cosa.

No hay nadie en la sala. Pero de algún lugar bajo tus pies llega un sonido bajo, rítmico. Alguien cantando.`)),
  choices:()=>[
    {once:'fotos',label:L('Olhar os porta-retratos da sala','Look at the picture frames in the living room','Mirar los portarretratos de la sala'),test:{sk:'Percepção',dt:12},
      ok:()=>({text:P(L(`Você reconstrói a família inteira pelas fotos. E percebe o momento exato em que ela quebrou.`,`You piece the whole family together from the photos. And you notice the exact moment it broke.`,`Reconstruyes a toda la familia por las fotos. Y notas el momento exacto en que se rompió.`))+addClue('fotos')}),
      fail:()=>({text:P(L(`Rostos sorrindo numa praia. Você não consegue olhar para fotos de família por muito tempo.`,`Smiling faces on a beach. You can't look at family photos for long.`,`Caras sonriendo en una playa. No puedes mirar fotos de familia mucho tiempo.`))})},
    {once:'escritorio4',label:L('Revistar o escritório do Pablo','Search Pablo\'s study','Revisar el estudio de Pablo'),test:{sk:'Investigação',dt:13},
      ok:()=>({text:P(L(`Numa pasta junto das contas da casa, o atestado de óbito de Emily. Você vira o papel. Fica gelado.`,`In a folder with the household bills, Emily's death certificate. You turn the paper over. You go cold.`,`En una carpeta junto a las cuentas de la casa, el certificado de defunción de Emily. Das vuelta el papel. Te quedas helado.`))+addClue('obito')+loseSan('1d2',L('o atestado','the certificate','el certificado'))}),
      fail:()=>({text:P(L(`Contas, recibos, livros em línguas que você não reconhece. O canto lá embaixo fica mais alto.`,`Bills, receipts, books in languages you don't recognize. The chanting below gets louder.`,`Cuentas, recibos, libros en idiomas que no reconoces. El canto de abajo se hace más fuerte.`))})},
    {once:'quarto4',label:L('Abrir o quarto do menino','Open the boy\'s room','Abrir el cuarto del chico'),
      run:()=>({text:P(L(`Pôsteres de futebol, uma bola murcha, desenhos de robôs presos na parede com fita. O trinco da porta está do lado de fora. Na parede ao lado da cama, riscos a lápis contando dias. Trinta e um.

Você fecha a porta devagar. Suas mãos estão fechadas de novo.`,`Soccer posters, a deflated ball, robot drawings taped to the wall. The door latch is on the outside. On the wall next to the bed, pencil tally marks counting days. Thirty-one.

You close the door slowly. Your hands are clenched again.`,`Pósters de fútbol, una pelota desinflada, dibujos de robots pegados en la pared con cinta. El cerrojo de la puerta está del lado de afuera. En la pared junto a la cama, rayas de lápiz contando días. Treinta y uno.

Cierras la puerta despacio. Tienes los puños cerrados otra vez.`))+loseSan('1d2',L('o quarto','the room','el cuarto'))+bond('bob')})},
    {label:L('Ir até a porta do porão','Head to the basement door','Ir hacia la puerta del sótano'),main:true,run:()=>({go:'c4d_escada'})}
  ]},

c4d_escada:{act:KH,title:'Tobi',
  text:()=>P(L(`Na frente da porta do porão, deitado como um cachorro de guarda, está uma coisa que já foi um cachorro de guarda. Ela levanta a cabeça devagar quando você chega. A plaquinha da coleira bate no chão: Tobi.`,`In front of the basement door, lying like a guard dog, is something that used to be a guard dog. It lifts its head slowly as you approach. The collar tag clinks on the floor: Tobi.`,`Frente a la puerta del sótano, echado como un perro guardián, hay algo que alguna vez fue un perro guardián. Levanta la cabeza despacio cuando llegas. La placa del collar golpea el piso: Tobi.`)),
  choices:()=>[
    {label:L('Passar por ele em silêncio','Slip past it silently','Pasar a su lado en silencio'),test:{sk:'Furtividade',dt:15},
      ok:()=>({text:P(L(`Você espera ele baixar a cabeça, conta até dez e passa colado na parede, como numa cena de fuga ensaiada. Ele não se mexe.`,`You wait for it to lower its head, count to ten and slip by pressed against the wall, like a rehearsed escape scene. It doesn't move.`,`Esperas que baje la cabeza, cuentas hasta diez y pasas pegado a la pared, como en una escena de huida ensayada. No se mueve.`)),go:'c4e_sala'}),
      fail:()=>({text:P(L(`O assoalho range. Tobi se levanta inteiro, rosnando sangue.`,`The floorboard creaks. Tobi rises to its full height, growling blood.`,`El piso cruje. Tobi se levanta entero, gruñendo sangre.`)),combat:{id:'cao',after:'c4e_sala',enemyFirst:true,winText:L('Tobi cai de lado e se desfaz. Só a coleira fica no chão.','Tobi falls on its side and comes apart. Only the collar is left on the floor.','Tobi cae de costado y se deshace. Solo queda el collar en el piso.')}})},
    {label:L('Acabar com ele antes que acorde de vez','Put it down before it fully wakes','Acabar con él antes de que despierte del todo'),main:true,
      run:()=>({text:P(L(`Você saca a Raijin sem fazer barulho.`,`You draw Raijin without a sound.`,`Desenvainas la Raijin sin hacer ruido.`)),combat:{id:'cao',after:'c4e_sala',surprise:true,winText:L('Tobi cai de lado e se desfaz. Só a coleira fica no chão.','Tobi falls on its side and comes apart. Only the collar is left on the floor.','Tobi cae de costado y se deshace. Solo queda el collar en el piso.')}})}
  ]},

c4e_sala:{act:KH,title:L('O porão','The basement','El sótano'),
  text:()=>P(L(`O porão foi transformado num laboratório. No centro, um círculo pintado no chão, e dentro dele uma cadeira de dentista com correias de couro.

Na cadeira, um menino de doze anos, muito magro, com tubos saindo dos dois braços. O sangue dele desce pelos tubos até o círculo, e o círculo bebe.

Pablo Hoff está de costas para você, lendo em voz alta de um caderno. Ao lado dele, no ar, uma forma de sangue começa a se desenhar. Tem o contorno de uma mulher.

O menino vira a cabeça e olha para você. Não pede ajuda. Parece que já parou de pedir.`,
`The basement has been turned into a laboratory. In the middle, a circle painted on the floor, and inside it a dentist's chair with leather straps.

In the chair, a twelve-year-old boy, very thin, with tubes coming out of both arms. His blood runs down the tubes into the circle, and the circle drinks.

Pablo Hoff has his back to you, reading aloud from a notebook. Beside him, in the air, a shape of blood is starting to form. It has the outline of a woman.

The boy turns his head and looks at you. He doesn't ask for help. It looks like he's stopped asking.`,
`El sótano fue convertido en un laboratorio. En el centro, un círculo pintado en el piso, y adentro un sillón de dentista con correas de cuero.

En el sillón, un chico de doce años, muy flaco, con tubos saliendo de los dos brazos. Su sangre baja por los tubos hasta el círculo, y el círculo bebe.

Pablo Hoff está de espaldas, leyendo en voz alta de un cuaderno. A su lado, en el aire, una forma de sangre empieza a dibujarse. Tiene el contorno de una mujer.

El chico gira la cabeza y te mira. No pide ayuda. Parece que ya dejó de pedir.`))+loseSan('1d3',L('o porão','the basement','el sótano')),
  choices:()=>[
    {label:L('Arrancar os tubos do menino primeiro','Rip the tubes out of the boy first','Arrancarle los tubos al chico primero'),test:{sk:'Reflexos',dt:14},
      ok:()=>{S.flags.tubos=true;return {text:P(L(`Você atravessa o círculo e arranca os tubos com uma mão só. A forma de mulher no ar se desfaz numa chuva vermelha. Pablo se vira gritando o nome de Emily.`,`You cross the circle and yank out the tubes in one motion. The woman-shaped form in the air collapses into a red rain. Pablo spins around screaming Emily's name.`,`Cruzas el círculo y arrancas los tubos con una sola mano. La forma de mujer en el aire se deshace en una lluvia roja. Pablo se da vuelta gritando el nombre de Emily.`))+bond('derick'),combat:{id:'pablo',after:'c4f_derick',surprise:true,weak:true,script:'pablo'}}},
      fail:()=>({text:P(L(`Um dos tubos sai. O outro não. Pablo se vira antes que você consiga puxar de novo.`,`One tube comes out. The other doesn't. Pablo turns before you can pull again.`,`Un tubo sale. El otro no. Pablo se da vuelta antes de que puedas tirar de nuevo.`)),combat:{id:'pablo',after:'c4f_derick',enemyFirst:true,script:'pablo'}})},
    {label:L('Partir para cima do Pablo','Go straight for Pablo','Ir directo por Pablo'),main:true,
      run:()=>({text:P(L(`Você não pensa. Nunca pensa quando alguém está em perigo. E ali está uma criança numa cadeira.`,`You don't think. You never think when someone is in danger. And there's a child in a chair.`,`No piensas. Nunca piensas cuando alguien está en peligro. Y ahí hay un chico en un sillón.`)),combat:{id:'pablo',after:'c4f_derick',script:'pablo'}})}
  ]},

c4f_derick:{act:KH,title:'Derick',
  text:()=>P(L(`Pablo Hoff está no chão, dentro do próprio círculo, e não se mexe mais. O caderno dele caiu aberto numa página com o nome de Emily escrito cem vezes.

O menino viu tudo. Não chorou. Continua olhando para você.

Você solta as correias uma por uma. Tira os tubos com cuidado, como a sua mãe faria. Tira a sua jaqueta e coloca nos ombros dele.`,
`Pablo Hoff lies on the floor, inside his own circle, and doesn't move anymore. His notebook fell open to a page with Emily's name written a hundred times.

The boy saw everything. He didn't cry. He's still looking at you.

You undo the straps one by one. You take out the tubes carefully, the way your mother would have. You take off your jacket and put it over his shoulders.`,
`Pablo Hoff está en el piso, dentro de su propio círculo, y ya no se mueve. Su cuaderno cayó abierto en una página con el nombre de Emily escrito cien veces.

El chico vio todo. No lloró. Sigue mirándote.

Sueltas las correas una por una. Le sacas los tubos con cuidado, como lo habría hecho tu madre. Te sacas la chaqueta y se la pones sobre los hombros.`)),
  choices:()=>[
    {once:'nome',label:L('Dizer o seu nome','Tell him your name','Decirle tu nombre'),
      run:()=>({text:P(L(`"Mada." Ele franze a testa. "Que nome é esse?" "É Adam ao contrário." Ele pensa por um segundo. "Então eu sou Kcired." É a primeira vez que ele quase sorri. "Derick", ele corrige. "Derick Hoff."`,`"Mada." He frowns. "What kind of name is that?" "It's Adam backwards." He thinks for a second. "Then I'm Kcired." It's the first time he almost smiles. "Derick," he corrects himself. "Derick Hoff."`,`"Mada." Frunce el ceño. "¿Qué nombre es ese?" "Es Adam al revés." Piensa un segundo. "Entonces yo soy Kcired." Es la primera vez que casi sonríe. "Derick", se corrige. "Derick Hoff."`))+bond('derick')+calm(2)})},
    {once:'volta',label:L('"Ele não vai voltar."','"He\'s not coming back."','"No va a volver."'),
      run:()=>({text:P(L(`Derick olha para o corpo do pai. "Promete?" Você pensa na noite do aniversário do vô. Em quanto você queria que alguém tivesse te prometido alguma coisa. "Prometo." Ele segura a manga da sua camiseta e não solta mais.`,`Derick looks at his father's body. "Promise?" You think of the night of Grandpa's birthday. Of how much you wanted someone to promise you something. "I promise." He grabs your shirt sleeve and doesn't let go.`,`Derick mira el cuerpo de su padre. "¿Prometes?" Piensas en la noche del cumpleaños del abuelo. En cuánto querías que alguien te prometiera algo. "Lo prometo." Te agarra la manga de la remera y ya no la suelta.`))+bond('derick')+bond('adriana')})},
    {label:L('Levar o Derick para a Base','Take Derick to the Base','Llevar a Derick a la Base'),main:true,run:()=>({go:'c4g_ordem'})}
  ]},

c4g_ordem:{act:KH,title:L('Problema seu','Your problem','Tu problema'),
  text:()=>P(L(`Roger lê o relatório inteiro em pé, na enfermaria, enquanto os médicos cuidam dos braços do Derick. Depois fecha a pasta.

"Serviço social amanhã cedo. Tem famílias que..."

"Não", você diz. "Ele fica comigo."

Roger te encara. Não pisca. Você também não. Do outro lado do vidro, Derick está sentado na maca segurando a sua jaqueta.

"Então ele é problema seu", Roger diz, e sai. Da porta, sem se virar: "Bom trabalho, Zart."`,
`Roger reads the whole report standing up in the infirmary, while the doctors tend to Derick's arms. Then he closes the folder.

"Social services first thing tomorrow. There are families who..."

"No," you say. "He stays with me."

Roger stares at you. He doesn't blink. Neither do you. On the other side of the glass, Derick sits on the gurney holding your jacket.

"Then he's your problem," Roger says, and walks out. From the door, without turning around: "Good work, Zart."`,
`Roger lee todo el informe de pie, en la enfermería, mientras los médicos le curan los brazos a Derick. Después cierra la carpeta.

"Servicio social mañana temprano. Hay familias que..."

"No", dices. "Se queda conmigo."

Roger te mira fijo. No parpadea. Tú tampoco. Del otro lado del vidrio, Derick está sentado en la camilla abrazando tu chaqueta.

"Entonces es tu problema", dice Roger, y se va. Desde la puerta, sin darse vuelta: "Buen trabajo, Zart."`))+bond('roger'),
  choices:()=>[
    {once:'bobderick',label:L('Apresentar o Derick para o Bob','Introduce Derick to Bob','Presentarle Derick a Bob'),
      run:()=>({text:P(L(`Bob olha para o menino magro com a jaqueta grande demais e, sem dizer nada, puxa um colchão para o meio do quarto. "Ombro, costas, quadril, nunca a cabeça", ele diz. Derick cai quarenta vezes seguidas. Na quadragésima, ri. Você fica encostado na porta, sem entrar, para não estragar.`,`Bob looks at the skinny kid in the oversized jacket and, without a word, drags a mattress into the middle of the room. "Shoulder, back, hip, never the head," he says. Derick falls forty times in a row. On the fortieth, he laughs. You lean in the doorway without coming in, so you don't ruin it.`,`Bob mira al chico flaco con la chaqueta demasiado grande y, sin decir nada, arrastra un colchón al medio del cuarto. "Hombro, espalda, cadera, nunca la cabeza", dice. Derick se cae cuarenta veces seguidas. En la cuadragésima, se ríe. Tú te quedas apoyado en la puerta, sin entrar, para no arruinarlo.`))+bond('bob')+bond('derick')+calm(2)})},
    {once:'thoderick',label:L('Conversar com o Thomas','Talk to Thomas','Hablar con Thomas'),
      run:()=>({text:P(L(`"Você sabe o que acabou de fazer, né?" Thomas está sorrindo, o que é raro. "Virou o pai de alguém. Igual a gente virou do Bob." Ele coloca a mão no seu ombro. "Eu cuido da papelada. Você cuida do resto."`,`"You know what you just did, right?" Thomas is smiling, which is rare. "You became someone's father. Like we did for Bob." He puts a hand on your shoulder. "I'll handle the paperwork. You handle the rest."`,`"¿Sabes lo que acabas de hacer, no?" Thomas está sonriendo, lo cual es raro. "Te volviste el padre de alguien. Como nosotros con Bob." Te pone la mano en el hombro. "Yo me encargo de los papeles. Tú del resto."`))+bond('thomas')})},
    {label:L('Encerrar o Capítulo 4','End Chapter 4','Terminar el Capítulo 4'),main:true,run:()=>({levelup:'c4_fim'})}
  ]},

c4_fim:{act:KH,title:L('Fim do Capítulo 4','End of Chapter 4','Fin del Capítulo 4'),
  text:()=>P(L(`Derick ganha um quarto na Base, do lado do seu. Nas primeiras semanas, dorme com a porta aberta, igual o Bob fazia no hangar.

Você ensina tudo o que sabe. Como cair. Como levantar. Como olhar em volta antes. E, quando ele pergunta por que você faz isso tudo por ele, você não sabe responder. Só sabe que ninguém mais vai passar pelo que vocês passaram. Não enquanto você estiver de pé.`,
`Derick gets a room at the Base, next to yours. The first few weeks, he sleeps with the door open, just like Bob did at the hangar.

You teach him everything you know. How to fall. How to get up. How to look around first. And when he asks why you do all this for him, you don't know how to answer. You just know that no one else is going to go through what you went through. Not while you're still standing.`,
`Derick recibe un cuarto en la Base, al lado del tuyo. Las primeras semanas duerme con la puerta abierta, igual que Bob en el hangar.

Le enseñas todo lo que sabes. Cómo caer. Cómo levantarse. Cómo mirar alrededor antes. Y cuando te pregunta por qué haces todo esto por él, no sabes qué responder. Solo sabes que nadie más va a pasar por lo que ustedes pasaron. No mientras tú sigas de pie.`)),
  choices:()=>[{label:L('Ver o relatório','See the report','Ver el informe'),main:true,run:()=>({end:true})}]}
});
SCENES.c3_fim.choices=()=>[{label:L('Começar o Capítulo 4','Begin Chapter 4','Comenzar el Capítulo 4'),main:true,run:()=>({go:'c4a_roger'})}];
}

Object.assign(ENEMIES,{
  porteiro:{human:true,eyes:true,name:L('Motoqueiro da portaria','Doorman biker','Motoquero de la entrada'),kind:L('Humano','Human','Humano'),el:null,pv:16,def:11,atk:3,dmg:'1d6+1',res:2,init:1,presence:null,
    desc:L('Colete de couro com um corvo bordado nas costas, barriga de cerveja e um soco-inglês que ele claramente nunca usou de verdade.','A leather vest with a crow stitched on the back, a beer belly and brass knuckles he has clearly never really used.','Chaleco de cuero con un cuervo bordado en la espalda, panza de cerveza y una manopla que claramente nunca usó de verdad.')},
  membros:{human:true,eyes:true,name:L('Corvos de Ferro','Iron Crows','Cuervos de Hierro'),kind:L('Humanos · grupo','Humans · group','Humanos · grupo'),el:null,pv:34,def:12,atk:5,dmg:'1d8+1',res:2,init:3,presence:null,
    desc:L('Quatro membros do moto clube, de corrente, taco e chave de roda na mão. Nenhum deles sabe direito o que o Kadu anda procurando. Mas todos fazem o que ele manda.','Four members of the bike club, with chains, bats and tire irons. None of them really knows what Kadu has been looking for. But they all do what he says.','Cuatro miembros del moto club, con cadenas, bates y llaves de rueda. Ninguno sabe bien qué anda buscando Kadu. Pero todos hacen lo que él dice.')},
  kadu:{human:true,eyes:true,name:'Kadu',kind:L('Líder dos Corvos de Ferro','Leader of the Iron Crows','Líder de los Cuervos de Hierro'),el:null,pv:48,def:14,atk:6,dmg:'1d10+2',res:4,init:4,presence:null,
    special:{every:3,kind:'atk',name:L('Luva de Faísca','Spark Glove','Guante de Chispa'),text:L('A luva de metal na mão esquerda dele estala com uma Energia que não devia existir, e ele acerta com ela aberta.','The metal glove on his left hand crackles with an Energy that shouldn\'t exist, and he strikes with it open.','El guante de metal en su mano izquierda chisporrotea con una Energía que no debería existir, y golpea con la mano abierta.'),dmg:'2d8'},
    desc:L('Barba grisalha, jaqueta de couro gasta, uma luva de metal cheia de fios na mão esquerda. Ele não parece bravo. Parece animado. "Vocês vieram da Ordem? Ótimo. Vocês sabem onde ela está."','Grey beard, worn leather jacket, a wire-covered metal glove on his left hand. He doesn\'t look angry. He looks excited. "You\'re from the Order? Great. You know where it is."','Barba canosa, chaqueta de cuero gastada, un guante de metal lleno de cables en la mano izquierda. No parece enojado. Parece entusiasmado. "¿Vienen de la Orden? Genial. Ustedes saben dónde está."')}
});

  ryan:{name:'Ryan',atk:5,dmg:'1d8+2',verb:L('acerta com a chave de roda','hits with the tire iron','golpea con la llave de rueda')}
});

Object.assign(CLUES,{
  reliquias:c(L('As Relíquias da Calamidade','The Relics of Calamity','Las Reliquias de la Calamidad'),L('Recortes, fotocópias de livros proibidos e um mapa cheio de alfinetes. As Relíquias da Calamidade: quatro objetos que são a encarnação pura de cada elemento do Outro Lado na realidade. Sangue, o Diabo. Energia, o Anfitrião. Conhecimento, a Magistrada. Morte, o Deus da Morte. Quem porta uma tem controle quase total sobre as leis do seu elemento. E uma relíquia só pode ser destruída pela força do elemento que a oprime.','Clippings, photocopies of forbidden books and a map full of pins. The Relics of Calamity: four objects that are the pure incarnation of each element of the Other Side in reality. Blood, the Devil. Energy, the Host. Knowledge, the Magistrate. Death, the God of Death. Whoever bears one has almost total control over the laws of its element. And a relic can only be destroyed by the force of the element that oppresses it.','Recortes, fotocopias de libros prohibidos y un mapa lleno de alfileres. Las Reliquias de la Calamidad: cuatro objetos que son la encarnación pura de cada elemento del Otro Lado en la realidad. Sangre, el Diablo. Energía, el Anfitrión. Conocimiento, la Magistrada. Muerte, el Dios de la Muerte. Quien porta una tiene control casi total sobre las leyes de su elemento. Y una reliquia solo puede ser destruida por la fuerza del elemento que la oprime.')),
  anfitriao:c(L('O caderno do Kadu','Kadu\'s notebook','El cuaderno de Kadu'),L('Letra grande, inclinada, empolgada. "A Relíquia de Energia não tem portador faz tempo. Quando não tem ninguém, ela é só chama e raio, esperando. Quem chegar primeiro vira o novo Anfitrião." Embaixo, sublinhado duas vezes: "Eu."','Big, slanted, excited handwriting. "The Energy Relic hasn\'t had a bearer in a long time. With no one, it\'s just flame and lightning, waiting. Whoever gets there first becomes the new Host." Below, underlined twice: "Me."','Letra grande, inclinada, entusiasmada. "La Reliquia de Energía no tiene portador hace tiempo. Sin nadie, es solo llama y rayo, esperando. El que llegue primero se vuelve el nuevo Anfitrión." Abajo, subrayado dos veces: "Yo."'))
});

Object.assign(SCENES,{
c5a_missao:{act:K,title:L('Mada e Derick','Mada and Derick','Mada y Derick'),checkpoint:true,
  text:()=>P(L(`Dois anos depois, Derick tem catorze anos, já é mais alto que o Bob foi nessa idade e treina todo dia no tatame da Base como se a vida dependesse disso. Às vezes você acha que depende.

Roger joga uma pasta em cima da sua mesa. "Um moto clube na zona norte, os Corvos de Ferro. Roubo de carga, receptação, o de sempre. Só que nos últimos meses eles começaram a comprar livros. Do tipo que a gente queima." Ele olha para Derick, parado na porta. "Leva o garoto. Já passou da hora."`,
`Two years later, Derick is fourteen, already taller than Bob was at that age, and trains every day on the Base mats as if his life depended on it. Sometimes you think it does.

Roger drops a folder on your desk. "A bike club up north, the Iron Crows. Cargo theft, fencing, the usual. Except in the last few months they've started buying books. The kind we burn." He looks at Derick, standing in the doorway. "Take the kid. It's about time."`,
`Dos años después, Derick tiene catorce, ya es más alto de lo que era Bob a esa edad y entrena todos los días en el tatami de la Base como si le fuera la vida. A veces crees que le va.

Roger tira una carpeta sobre tu escritorio. "Un moto club en la zona norte, los Cuervos de Hierro. Robo de carga, reducción, lo de siempre. Solo que en los últimos meses empezaron a comprar libros. De los que nosotros quemamos." Mira a Derick, parado en la puerta. "Llévate al chico. Ya era hora."`)),
  choices:()=>[
    {once:'derickmissao',label:L('Conversar com o Derick antes de sair','Talk to Derick before you leave','Hablar con Derick antes de salir'),
      run:()=>({text:P(L(`Ele está ajustando as fivelas do colete pela terceira vez. "Regra de ouro", você diz. Ele completa antes de você terminar: "Ninguém se machuca na sua missão. Nem eu, nem o cara do meu lado." Ele revira os olhos. Igualzinho ao Bob.`,`He's adjusting his vest buckles for the third time. "Golden rule," you say. He finishes it before you do: "Nobody gets hurt on your mission. Not me, not the guy next to me." He rolls his eyes. Just like Bob.`,`Está ajustando las hebillas del chaleco por tercera vez. "Regla de oro", dices. Él la termina antes que tú: "Nadie se lastima en tu misión. Ni yo, ni el que está a mi lado." Pone los ojos en blanco. Igualito a Bob.`))+bond('derick')+bond('bob')})},
    {once:'thomas5',label:L('Pedir o arquivo do moto clube ao Thomas','Ask Thomas for the bike club file','Pedirle a Thomas el archivo del moto club'),
      run:()=>({text:P(L(`Thomas já tem tudo impresso. "Líder: Carlos Eduardo, o Kadu. Mecânico, cinquenta anos, nunca matou ninguém que a gente saiba. Mas faz seis meses que ele não aparece em lugar nenhum sem uma luva de metal na mão esquerda." Ele fecha a pasta. "E um dos membros sumiu faz três semanas. Ryan. Ninguém do clube foi à polícia."`,`Thomas already has everything printed out. "Leader: Carlos Eduardo, called Kadu. Mechanic, fifty, never killed anyone that we know of. But for six months he hasn't shown up anywhere without a metal glove on his left hand." He closes the folder. "And one of the members disappeared three weeks ago. Ryan. Nobody from the club went to the police."`,`Thomas ya tiene todo impreso. "Líder: Carlos Eduardo, alias Kadu. Mecánico, cincuenta años, nunca mató a nadie que sepamos. Pero hace seis meses que no aparece en ningún lado sin un guante de metal en la mano izquierda." Cierra la carpeta. "Y uno de los miembros desapareció hace tres semanas. Ryan. Nadie del club fue a la policía."`))+bond('thomas')})},
    {label:L('Ir até o moto clube','Head to the bike club','Ir al moto club'),main:true,run:()=>({go:'c5b_portao'})}
  ]},

c5b_portao:{act:K,title:L('A portaria','The door','La entrada'),
  text:()=>P(L(`Um galpão de tijolo com uma placa de lata: CORVOS DE FERRO · MC. Uma fileira de motos na frente, todas com o tanque pintado de preto. Na porta, sentado numa cadeira de plástico, um cara de colete de couro.

Você para na frente dele. "Quero falar com o líder."

"O líder não tá no momento." Ele nem levanta.

Você olha por cima do ombro dele, para dentro. Mesa de sinuca, bar, jukebox apagada. Ninguém. Ele está sozinho.`,
`A brick warehouse with a tin sign: IRON CROWS · MC. A row of motorcycles out front, all with black-painted tanks. At the door, sitting on a plastic chair, a guy in a leather vest.

You stop in front of him. "I want to talk to the leader."

"The leader's not here right now." He doesn't even get up.

You look over his shoulder, inside. Pool table, bar, a dark jukebox. Nobody. He's alone.`,
`Un galpón de ladrillo con un cartel de chapa: CUERVOS DE HIERRO · MC. Una fila de motos al frente, todas con el tanque pintado de negro. En la puerta, sentado en una silla de plástico, un tipo con chaleco de cuero.

Te paras delante de él. "Quiero hablar con el líder."

"El líder no está ahora." Ni se levanta.

Miras por encima de su hombro, hacia adentro. Mesa de pool, barra, rockola apagada. Nadie. Está solo.`)),
  choices:()=>[
    {label:L('Apagar o cara, rapidinho','Knock him out, quick','Dormirlo, rapidito'),main:true,test:{sk:'Luta',dt:12},
      ok:()=>({text:P(L(`Ele ainda está abrindo a boca para dizer mais alguma coisa quando o seu antebraço fecha no pescoço dele. Quatro segundos. Você deita ele de volta na cadeira de plástico como se estivesse dormindo. Derick olha para você, depois para o cara, depois para você de novo. "Isso foi muito rápido." "Foi o suficiente."`,`He's still opening his mouth to say something else when your forearm closes around his neck. Four seconds. You settle him back in the plastic chair as if he were asleep. Derick looks at you, then at the guy, then at you again. "That was really fast." "It was enough."`,`Todavía está abriendo la boca para decir algo más cuando tu antebrazo se cierra en su cuello. Cuatro segundos. Lo acomodas otra vez en la silla de plástico como si estuviera dormido. Derick te mira, después al tipo, después a ti otra vez. "Eso fue muy rápido." "Fue suficiente."`))+bond('derick'),go:'c5c_sede'}),
      fail:()=>({text:P(L(`Ele é mais rápido do que parece. Se joga para trás da cadeira e já sai com o soco-inglês na mão.`,`He's quicker than he looks. He throws himself behind the chair and comes up with the brass knuckles on.`,`Es más rápido de lo que parece. Se tira detrás de la silla y sale con la manopla puesta.`)),combat:{id:'porteiro',after:'c5c_sede',allies:['derick'],winText:L('O motoqueiro apaga no chão da portaria. Ninguém lá dentro ouviu nada.','The biker goes out cold on the entry floor. Nobody inside heard a thing.','El motoquero queda tendido en el piso de la entrada. Nadie adentro oyó nada.')}})}
  ]},

c5c_sede:{act:K,title:L('A sede','The clubhouse','La sede'),checkpoint:true,
  text:()=>P(L(`Cheiro de óleo, cerveja choca e fumo. Nas paredes, fotos de viagens de moto, coletes antigos pendurados e uma bandeira do clube. No fundo, uma porta com cadeado novo. Um cadeado caro demais para um lugar desses.`,
`The smell of oil, stale beer and smoke. On the walls, photos of bike trips, old vests hung up and a club flag. At the back, a door with a new padlock. A padlock far too expensive for a place like this.`,
`Olor a aceite, cerveza rancia y humo. En las paredes, fotos de viajes en moto, chalecos viejos colgados y una bandera del club. Al fondo, una puerta con un candado nuevo. Un candado demasiado caro para un lugar así.`)),
  choices:()=>[
    {once:'mapa',label:L('Examinar a mesa de sinuca coberta de papéis','Examine the pool table covered in papers','Examinar la mesa de pool cubierta de papeles'),test:{sk:'Investigação',dt:12},
      ok:()=>({text:P(L(`Derick lê em voz alta por cima do seu ombro e para no meio de uma frase. "Mada... isso é de verdade?" Você não responde. Guarda as fotocópias na mochila.`,`Derick reads aloud over your shoulder and stops mid-sentence. "Mada... is this real?" You don't answer. You put the photocopies in your backpack.`,`Derick lee en voz alta por encima de tu hombro y se detiene a mitad de una frase. "Mada... ¿esto es de verdad?" No respondes. Guardas las fotocopias en la mochila.`))+addClue('reliquias')}),
      fail:()=>({text:P(L(`Papel demais, em ordem nenhuma. Derick junta as fotocópias num bolo só. "Depois o Thomas lê", ele diz. Tem razão.`,`Too many papers, in no order at all. Derick gathers the photocopies into a single pile. "Thomas can read them later," he says. He's right.`,`Demasiados papeles, sin ningún orden. Derick junta las fotocopias en una sola pila. "Después las lee Thomas", dice. Tiene razón.`))+addClue('reliquias')})},
    {once:'escritorio5',label:L('Revirar o escritório atrás do bar','Search the office behind the bar','Revisar la oficina detrás de la barra'),test:{sk:'Percepção',dt:13},
      ok:()=>({text:P(L(`Debaixo de uma pilha de notas fiscais de peça de moto, um caderno de capa preta. A letra é empolgada demais para o que está escrito.`,`Under a stack of motorcycle part receipts, a black-covered notebook. The handwriting is far too excited for what it says.`,`Debajo de una pila de facturas de repuestos de moto, un cuaderno de tapa negra. La letra es demasiado entusiasta para lo que dice.`))+addClue('anfitriao')}),
      fail:()=>({text:P(L(`Notas fiscais, uma arma sem munição, fotos de família. Nada que explique o cadeado.`,`Receipts, an unloaded gun, family photos. Nothing that explains the padlock.`,`Facturas, un arma sin balas, fotos de familia. Nada que explique el candado.`))})},
    {label:L('Arrombar a porta do cadeado','Break open the padlocked door','Forzar la puerta del candado'),main:true,run:()=>({go:'c5d_cela'})}
  ]},

c5d_cela:{act:K,title:'Ryan',
  text:()=>P(L(`Uma escada estreita desce para um porão com três jaulas de ferro soldadas à mão. Duas estão vazias. Na terceira, sentado no chão com as costas na parede, um rapaz de barba por fazer, cabelo raspado dos lados, um olho roxo quase fechado. Ainda com o colete do clube.

Ele levanta a cabeça devagar. "Se o Kadu mandou vocês, pode avisar que eu continuo achando ele um maluco."`,
`A narrow staircase goes down to a basement with three hand-welded iron cages. Two are empty. In the third, sitting on the floor with his back to the wall, a young man with stubble, the sides of his head shaved, one black eye nearly swollen shut. Still wearing the club vest.

He lifts his head slowly. "If Kadu sent you, you can tell him I still think he's a lunatic."`,
`Una escalera angosta baja a un sótano con tres jaulas de hierro soldadas a mano. Dos están vacías. En la tercera, sentado en el piso con la espalda contra la pared, un chico con barba de días, el pelo rapado a los costados, un ojo morado casi cerrado. Todavía con el chaleco del club.

Levanta la cabeza despacio. "Si los mandó Kadu, pueden avisarle que sigo pensando que está loco."`)),
  choices:()=>[
    {once:'ryanhist',label:L('"Por que você está preso?"','"Why are you locked up?"','"¿Por qué estás preso?"'),
      run:()=>({text:P(L(`"Porque eu disse não." Ryan conta tudo sem rodeio. Entrou no clube com dezessete anos, porque era o mais perto de família que ele tinha. O Kadu ensinou ele a desmontar um motor. Até que, seis meses atrás, o Kadu achou uma luva numa carga roubada e começou a ouvir coisas. "Ele quer a Relíquia de Energia. Quer virar o novo Anfitrião. Diz que vai dar poder para o clube inteiro." Ryan ri sem graça nenhuma. "Eu disse que isso ia matar todo mundo. Ele me trancou aqui para eu pensar melhor."`,`"Because I said no." Ryan tells it straight. He joined the club at seventeen, because it was the closest thing to family he had. Kadu taught him to take apart an engine. Then, six months ago, Kadu found a glove in a stolen shipment and started hearing things. "He wants the Energy Relic. Wants to become the new Host. Says it'll give power to the whole club." Ryan laughs without any humor. "I said it would get everybody killed. He locked me in here to think it over."`,`"Porque dije que no." Ryan lo cuenta sin rodeos. Entró al club a los diecisiete, porque era lo más parecido a una familia que tenía. Kadu le enseñó a desarmar un motor. Hasta que, hace seis meses, Kadu encontró un guante en una carga robada y empezó a oír cosas. "Quiere la Reliquia de Energía. Quiere volverse el nuevo Anfitrión. Dice que le va a dar poder a todo el club." Ryan se ríe sin ninguna gracia. "Le dije que eso iba a matar a todos. Me encerró acá para que lo pensara mejor."`))+bond('ryan')})},
    {once:'ryanderick',label:L('Deixar o Derick falar com ele','Let Derick talk to him','Dejar que Derick hable con él'),
      run:()=>({text:P(L(`"Ele te trancou porque você disse não?" Derick agacha na frente da jaula. "Meu pai me trancou também." Ryan olha para o garoto por um tempo. Depois para você. "E cadê o seu pai?" Derick aponta o queixo na sua direção. "Ele resolveu." Ryan solta um assobio baixo.`,`"He locked you up because you said no?" Derick crouches in front of the cage. "My dad locked me up too." Ryan looks at the kid for a while. Then at you. "And where's your dad now?" Derick juts his chin toward you. "He took care of it." Ryan lets out a low whistle.`,`"¿Te encerró porque dijiste que no?" Derick se agacha frente a la jaula. "Mi papá también me encerró." Ryan mira al chico un rato. Después a ti. "¿Y dónde está tu papá ahora?" Derick señala hacia ti con el mentón. "Él se encargó." Ryan suelta un silbido bajo.`))+bond('derick')+bond('ryan')})},
    {label:L('Soltar o Ryan','Let Ryan out','Soltar a Ryan'),main:true,
      run:()=>({text:P(L(`Você arranca a solda da porta com a Raijin. Ryan se levanta com as pernas bambas, alonga o pescoço e pega uma chave de roda encostada na parede. "O Kadu volta toda noite às dez. Com os outros." Ele olha para você. "Vocês vão ficar para receber ele, né?"`,`You break the weld on the door with Raijin. Ryan gets up on shaky legs, stretches his neck and picks up a tire iron leaning against the wall. "Kadu comes back every night at ten. With the others." He looks at you. "You're staying to welcome him, right?"`,`Rompes la soldadura de la puerta con la Raijin. Ryan se levanta con las piernas flojas, estira el cuello y agarra una llave de rueda apoyada en la pared. "Kadu vuelve todas las noches a las diez. Con los demás." Te mira. "Se van a quedar a recibirlo, ¿no?"`)),go:'c5e_espera'})}
  ]},

c5e_espera:{act:K,title:L('Dez da noite','Ten o\'clock','Las diez'),checkpoint:true,
  text:()=>P(L(`Vocês apagam as luzes do galpão e esperam. Ryan no bar, Derick atrás da mesa de sinuca, você do lado da porta.

Às dez e cinco, o ronco de seis motos enche a rua. Faróis varrem as janelas. Kadu entra primeiro, rindo de alguma coisa, com a luva de metal soltando faíscas azuis na mão esquerda.`,
`You turn off the warehouse lights and wait. Ryan at the bar, Derick behind the pool table, you beside the door.

At five past ten, the roar of six motorcycles fills the street. Headlights sweep across the windows. Kadu walks in first, laughing at something, the metal glove sparking blue on his left hand.`,
`Apagan las luces del galpón y esperan. Ryan en la barra, Derick detrás de la mesa de pool, tú al lado de la puerta.

A las diez y cinco, el rugido de seis motos llena la calle. Los faros barren las ventanas. Kadu entra primero, riéndose de algo, con el guante de metal soltando chispas azules en la mano izquierda.`)),
  choices:()=>[
    {label:L('Acender as luzes e ir para cima deles','Hit the lights and go at them','Prender las luces e ir por ellos'),main:true,
      run:()=>({text:P(L(`Derick acende a luz. Kadu vê o Ryan fora da jaula e para de rir. "Pega eles", ele diz, e dá um passo para trás. Os membros do clube vêm primeiro.`,`Derick flips on the light. Kadu sees Ryan out of the cage and stops laughing. "Get them," he says, and takes a step back. The club members come first.`,`Derick prende la luz. Kadu ve a Ryan fuera de la jaula y deja de reírse. "Agárrenlos", dice, y da un paso atrás. Los miembros del club vienen primero.`)),combat:{id:'membros',after:'c5e_kadu',allies:['derick','ryan'],winText:L('O último Corvo cai em cima da mesa de sinuca, que racha ao meio. Sobrou o Kadu.','The last Crow falls on the pool table, which cracks in half. Only Kadu is left.','El último Cuervo cae sobre la mesa de pool, que se parte al medio. Solo queda Kadu.')}})}
  ]},

c5e_kadu:{act:K,title:'Kadu',
  text:()=>P(L(`Kadu tira a jaqueta devagar e joga no chão. A luva na mão esquerda zumbe, e as lâmpadas do galpão piscam junto.

"Ryan, Ryan." Ele balança a cabeça. "Eu ia te dar o mundo, moleque."

"Você ia dar um enterro para a gente", Ryan responde, e aperta a chave de roda.`,
`Kadu slowly takes off his jacket and tosses it on the floor. The glove on his left hand hums, and the warehouse bulbs flicker along with it.

"Ryan, Ryan." He shakes his head. "I was going to give you the world, kid."

"You were going to give us a funeral," Ryan answers, tightening his grip on the tire iron.`,
`Kadu se saca la chaqueta despacio y la tira al piso. El guante de la mano izquierda zumba, y las lámparas del galpón parpadean con él.

"Ryan, Ryan." Niega con la cabeza. "Te iba a dar el mundo, pibe."

"Nos ibas a dar un entierro", responde Ryan, apretando la llave de rueda.`)),
  choices:()=>[
    {label:L('Enfrentar o Kadu','Face Kadu','Enfrentar a Kadu'),main:true,
      run:()=>({combat:{id:'kadu',after:'c5f_ryan',allies:['derick','ryan'],winText:L('Kadu cai de joelhos. A luva solta uma última faísca e apaga. Ryan arranca ela da mão dele e joga longe.','Kadu drops to his knees. The glove lets off one last spark and goes dark. Ryan rips it off his hand and throws it away.','Kadu cae de rodillas. El guante suelta una última chispa y se apaga. Ryan se lo arranca de la mano y lo tira lejos.')}})}
  ]},

c5f_ryan:{act:K,title:L('Um convite','An invitation','Una invitación'),
  text:()=>P(L(`Kadu está algemado no chão do próprio galpão, e o carro da Ordem vem buscar ele e a luva. Os outros Corvos estão amarrados em fila ao lado das motos.

Ryan está sentado no meio-fio, olhando para o colete do clube na mão. Depois de um tempo, tira e deixa no chão.

"E agora?" ele pergunta, sem olhar para ninguém.`,
`Kadu is handcuffed on the floor of his own warehouse, and the Order's car is coming for him and the glove. The other Crows are tied up in a row next to the bikes.

Ryan sits on the curb, staring at the club vest in his hand. After a while, he takes it off and leaves it on the ground.

"Now what?" he asks, without looking at anyone.`,
`Kadu está esposado en el piso de su propio galpón, y el auto de la Orden viene a buscarlo a él y al guante. Los otros Cuervos están atados en fila junto a las motos.

Ryan está sentado en el cordón, mirando el chaleco del club en la mano. Después de un rato, se lo saca y lo deja en el piso.

"¿Y ahora?", pregunta, sin mirar a nadie.`)),
  choices:()=>[
    {once:'ryansenta',label:L('Sentar do lado dele','Sit down next to him','Sentarte a su lado'),
      run:()=>({text:P(L(`Você senta. Não fala nada por um tempo, como fez com o Thomas num posto de gasolina, muitos anos atrás. "Eu perdi a minha família numa noite", você diz por fim. "Arrumei outra. Dá para arrumar." Ryan olha para você de lado. "Você fala pouco, né?" "Só com quem eu confio." Ele entende.`,`You sit. You say nothing for a while, like you did with Thomas at a gas station, many years ago. "I lost my family in one night," you finally say. "I found another one. You can find another one." Ryan glances at you sideways. "You don't talk much, huh?" "Only with people I trust." He understands.`,`Te sientas. No dices nada por un rato, como hiciste con Thomas en una estación de servicio, hace muchos años. "Perdí a mi familia en una noche", dices al fin. "Encontré otra. Se puede encontrar otra." Ryan te mira de reojo. "Hablas poco, ¿eh?" "Solo con la gente en la que confío." Entiende.`))+bond('ryan')+calm(2)})},
    {label:L('"Vem para a Ordem."','"Come to the Order."','"Vente a la Orden."'),main:true,
      run:()=>({text:P(L(`Ryan pensa por um segundo. Depois levanta, bate a poeira da calça e pega a chave de roda. "Tem mecânico lá?" "Agora tem." Derick sorri pela primeira vez na noite inteira.`,`Ryan thinks for a second. Then he gets up, dusts off his pants and picks up the tire iron. "You got a mechanic there?" "You do now." Derick smiles for the first time all night.`,`Ryan lo piensa un segundo. Después se levanta, se sacude el pantalón y agarra la llave de rueda. "¿Tienen mecánico allá?" "Ahora sí." Derick sonríe por primera vez en toda la noche.`))+bond('ryan'),go:'c5g_reuniao'})}
  ]},

c5g_reuniao:{act:KE,title:L('A reunião','The meeting','La reunión'),checkpoint:true,
  text:()=>P(L(`Uma semana depois, Roger reúne todos os agentes na sala grande da Base. Ele não senta. Nunca senta.

"A Ordem cresceu. Não dá mais para eu mandar gente solta atrás de cada problema. A partir de hoje, vocês trabalham em equipe. Fixa." Ele liga o projetor.`,
`A week later, Roger gathers every agent in the Base's main room. He doesn't sit. He never sits.

"The Order has grown. I can't keep sending people out one by one after every problem. Starting today, you work in teams. Fixed ones." He turns on the projector.`,
`Una semana después, Roger reúne a todos los agentes en la sala grande de la Base. No se sienta. Nunca se sienta.

"La Orden creció. Ya no puedo mandar gente suelta detrás de cada problema. Desde hoy, trabajan en equipo. Fijo." Prende el proyector.`))+
  team(L('Equipe Mada','Team Mada','Equipo Mada'),L('Mada · Derick · Jon Cordeiro, ex-militar e sniper, que fala pouco e nunca fica de costas para ninguém · Leon Silva, ex-militar, de soco, escudo e pistola, que sempre vai na frente','Mada · Derick · Jon Cordeiro, ex-soldier and sniper, who says little and never turns his back on anyone · Leon Silva, ex-soldier, fists, shield and pistol, always first in','Mada · Derick · Jon Cordeiro, exmilitar y francotirador, que habla poco y nunca le da la espalda a nadie · Leon Silva, exmilitar, puños, escudo y pistola, siempre al frente'))+
  team(L('Equipe Thomas','Team Thomas','Equipo Thomas'),L('Thomas · Roger Jr, o filho do líder, sempre organizando tudo · Jade, ocultista · Lipe, combatente, que salvou a Jade de uma criatura','Thomas · Roger Jr, the leader\'s son, always organizing everything · Jade, occultist · Lipe, combatant, who saved Jade from a creature','Thomas · Roger Jr, el hijo del líder, siempre organizándolo todo · Jade, ocultista · Lipe, combatiente, que salvó a Jade de una criatura'))+
  team(L('Equipe Bob','Team Bob','Equipo Bob'),L('Bob · Ryan · Luna · <i>vaga em aberto</i>','Bob · Ryan · Luna · <i>one open spot</i>','Bob · Ryan · Luna · <i>un lugar libre</i>')),
  choices:()=>[
    {once:'jonleon',label:L('Cumprimentar Jon e Leon','Greet Jon and Leon','Saludar a Jon y Leon'),
      run:()=>({text:P(L(`Leon aperta a sua mão com força demais e diz que já ouviu falar do galpão do Karlovski. Jon só balança a cabeça, encostado na parede, de onde consegue ver a porta. Derick cochicha: "O Jon me dá medo." "Que bom", você responde. "Ele está do nosso lado."`,`Leon shakes your hand too hard and says he's heard about the Karlovski workshop. Jon just nods, leaning against the wall where he can see the door. Derick whispers: "Jon scares me." "Good," you answer. "He's on our side."`,`Leon te aprieta la mano demasiado fuerte y dice que ya oyó hablar del taller Karlovski. Jon solo asiente, apoyado en la pared, desde donde ve la puerta. Derick susurra: "Jon me da miedo." "Bien", respondes. "Está de nuestro lado."`))})},
    {once:'equipebob',label:L('Ver o Bob com a equipe nova','Watch Bob with his new team','Ver a Bob con su equipo nuevo'),
      run:()=>({text:P(L(`Bob está no canto da sala com Ryan e com Luna, uma moça de voz baixa que segura a mão de quem está nervoso sem nem perceber que faz isso. Ryan já está explicando como vai deixar a moto do Bob mais rápida. Bob olha para você do outro lado da sala e levanta o polegar. Tem vinte anos e uma equipe com o nome dele. Você não sabe explicar o que sente. Então só levanta o polegar de volta.`,`Bob is in a corner of the room with Ryan and with Luna, a soft-spoken woman who holds the hand of anyone who's nervous without even noticing she does it. Ryan is already explaining how he's going to make Bob's bike faster. Bob looks at you from across the room and gives a thumbs-up. He's twenty and has a team with his name on it. You can't explain what you feel. So you just give him a thumbs-up back.`,`Bob está en un rincón de la sala con Ryan y con Luna, una chica de voz baja que le toma la mano a quien esté nervioso sin darse cuenta de que lo hace. Ryan ya le está explicando cómo va a hacer más rápida la moto de Bob. Bob te mira desde el otro lado de la sala y levanta el pulgar. Tiene veinte años y un equipo con su nombre. No sabes explicar lo que sientes. Así que solo le levantas el pulgar de vuelta.`))+bond('bob')+bond('ryan')+calm(2)})},
    {label:L('Encerrar o Capítulo 5','End Chapter 5','Terminar el Capítulo 5'),main:true,run:()=>({levelup:'c5_fim'})}
  ]},

c5_fim:{act:KE,title:L('Fim do Capítulo 5','End of Chapter 5','Fin del Capítulo 5'),
  text:()=>P(L(`A luva do Kadu foi para um cofre da Ordem, cinco andares abaixo da terra. Os arquivos sobre as Relíquias da Calamidade foram para a mesa do Thomas, e ele não dorme direito há três noites.

A Relíquia de Energia continua em algum lugar, sem portador. Chama e raio, esperando.

E a Equipe Bob ainda tem uma vaga em aberto.`,
`Kadu's glove went into an Order vault, five floors underground. The files on the Relics of Calamity went to Thomas's desk, and he hasn't slept properly in three nights.

The Energy Relic is still out there somewhere, without a bearer. Flame and lightning, waiting.

And Team Bob still has one open spot.`,
`El guante de Kadu fue a una bóveda de la Orden, cinco pisos bajo tierra. Los archivos sobre las Reliquias de la Calamidad fueron al escritorio de Thomas, y hace tres noches que no duerme bien.

La Reliquia de Energía sigue en algún lugar, sin portador. Llama y rayo, esperando.

Y el Equipo Bob todavía tiene un lugar libre.`)),
  choices:()=>[{label:L('Ver o relatório','See the report','Ver el informe'),main:true,run:()=>({end:true})}]}
});
SCENES.c4_fim.choices=()=>[{label:L('Começar o Capítulo 5','Begin Chapter 5','Comenzar el Capítulo 5'),main:true,run:()=>({go:'c5a_missao'})}];
