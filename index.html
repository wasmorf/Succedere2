const KS=L('Ato II · Cap. 2 · Coroa Vermelha','Act II · Ch. 2 · Red Crown','Acto II · Cap. 2 · Corona Roja');
Object.assign(SCENES,{
a2c2a_sala:{act:K,title:L('A sala de interrogatório','The interrogation room','La sala de interrogatorio'),checkpoint:true,
  text:()=>P(L(`O Logan costurou o pulso do Sílvio e disse que ele vai viver, "infelizmente". O círculo riscado não brilha mais. Sem ele, o Sílvio parece o que é: um homem de cinquenta e poucos anos, cansado, sentado numa cadeira de metal.

Ele fala sem você precisar perguntar duas vezes.

"O Brenner não é só um velho com dinheiro e um ritual. Faz vinte anos que ele alimenta uma coisa. A Relíquia de Sangue." Ele olha para as próprias mãos. "Quando não tem portador, ela vira um trono. De carne. Quem senta e sobrevive vira o novo Diabo. Cada rua que eu limpei foi comida para o trono. Para ele aguentar sentar."

"O seu pai viu o trono em Atlanta. É por isso."`,
`Logan stitched up Sílvio's wrist and said he'll live, "unfortunately". The scratched circle doesn't glow anymore. Without it, Sílvio looks like what he is: a tired man in his early fifties, sitting on a metal chair.

He talks without you having to ask twice.

"Brenner isn't just an old man with money and a ritual. For twenty years he's been feeding something. The Blood Relic." He looks at his own hands. "When it has no bearer, it becomes a throne. Of flesh. Whoever sits and survives becomes the new Devil. Every street I cleaned was food for the throne. So he could survive sitting on it."

"Your father saw the throne in Atlanta. That's why."`,
`Logan le cosió la muñeca a Sílvio y dijo que va a vivir, "lamentablemente". El círculo rayado ya no brilla. Sin él, Sílvio parece lo que es: un hombre cansado de cincuenta y pocos, sentado en una silla de metal.

Habla sin que tengas que preguntar dos veces.

"Brenner no es solo un viejo con plata y un ritual. Hace veinte años que alimenta algo. La Reliquia de Sangre." Se mira las manos. "Cuando no tiene portador, se vuelve un trono. De carne. Quien se sienta y sobrevive se vuelve el nuevo Diablo. Cada calle que limpié fue comida para el trono. Para que él aguante sentarse."

"Tu padre vio el trono en Atlanta. Por eso."`))+addClue('trono')+loseSan('1d4',L('o trono','the throne','el trono')),
  choices:()=>[
    {once:'filme',label:L('"Onde está o trono agora?"','"Where is the throne now?"','"¿Dónde está el trono ahora?"'),
      run:()=>({text:P(L(`"Embaixo do palco." Sílvio quase ri. "O filme se chama Coroa Vermelha. A última cena é num teatro antigo, o Estúdio Imperial. Quarenta figurantes. Nenhum volta para casa. A cena final é ele sentando." Ele levanta os olhos. "Eles ainda estão contratando dublês. O Brenner gosta de dublês. Diz que eles sabem cair do jeito certo."`,`"Under the stage." Sílvio almost laughs. "The movie is called Red Crown. The last scene is in an old theater, the Imperial Studio. Forty extras. None of them go home. The final scene is him sitting down." He looks up. "They're still hiring stunt performers. Brenner likes stunt performers. Says they know how to fall the right way."`,`"Debajo del escenario." Sílvio casi se ríe. "La película se llama Corona Roja. La última escena es en un teatro viejo, el Estudio Imperial. Cuarenta extras. Ninguno vuelve a casa. La escena final es él sentándose." Levanta la vista. "Todavía están contratando dobles. A Brenner le gustan los dobles. Dice que saben caer de la forma correcta."`))})},
    {once:'maite',label:L('Perguntar à Maitê como se enfrenta uma relíquia','Ask Maitê how you fight a relic','Preguntarle a Maitê cómo se enfrenta una reliquia'),
      run:()=>({text:P(L(`A Maitê retoca o batom na frente do vidro da sala de interrogatório antes de responder, como se fosse uma aula. "Historiadora que nunca foi, lembra?" Ela vira. "Relíquia não se mata. Se contém. E só com o elemento que oprime o dela. Sangue cede à Morte. Vocês precisam de Morte pura." Ela olha para o Flavio, parado na porta. O Flavio suspira. "Eu sabia que um dia alguém ia pedir aquilo."`,`Maitê touches up her lipstick in the interrogation room glass before answering, as if giving a lecture. "The historian I never became, remember?" She turns. "You don't kill a relic. You contain it. And only with the element that oppresses its own. Blood yields to Death. You need pure Death." She looks at Flavio, standing at the door. Flavio sighs. "I knew someday someone would ask for that."`,`Maitê se retoca el labial frente al vidrio de la sala de interrogatorio antes de responder, como si diera una clase. "La historiadora que nunca fui, ¿te acuerdas?" Se da vuelta. "Una reliquia no se mata. Se contiene. Y solo con el elemento que oprime al suyo. La Sangre cede ante la Muerte. Necesitan Muerte pura." Mira a Flavio, parado en la puerta. Flavio suspira. "Sabía que algún día alguien iba a pedir eso."`))+addClue('opressor')})},
    {once:'korvai',label:L('"Eu vou sozinho."','"I\'m going alone."','"Voy solo."'),
      run:()=>({text:P(L(`A Koranna nem responde. Pega a lança da parede e começa a trançar o cabelo para caber embaixo de uma peruca de figurante. "Quarenta figurantes", ela diz. "Alguém tem que estar lá dentro quando começar." Ela para na sua frente. "E eu não vou ficar esperando no bar de novo, Adam."`,`Koranna doesn't even answer. She takes her spear off the wall and starts braiding her hair to fit under an extra's wig. "Forty extras," she says. "Someone has to be inside when it starts." She stops in front of you. "And I'm not waiting at the bar again, Adam."`,`Koranna ni responde. Descuelga la lanza de la pared y empieza a trenzarse el pelo para que quepa bajo una peluca de extra. "Cuarenta extras", dice. "Alguien tiene que estar adentro cuando empiece." Se detiene frente a ti. "Y no voy a quedarme esperando en el bar otra vez, Adam."`))+bond('koranna',2)})},
    {label:L('Buscar o que o Flavio guardou no cofre','Get what Flavio kept in the vault','Buscar lo que Flavio guardó en la bóveda'),main:true,
      run:()=>({text:P(L(`Cinco andares abaixo, atrás de três portas, o Flavio abre uma caixa de chumbo. Dentro, um punhal de lâmina cinzenta que esfarela nas bordas e nunca termina de esfarelar. O ar em volta fica frio. "Não é para lutar", ele diz. "É para conter. Crava no trono e sai de perto."`,`Five floors down, behind three doors, Flavio opens a lead box. Inside, a grey-bladed dagger that crumbles at the edges and never finishes crumbling. The air around it turns cold. "It's not for fighting," he says. "It's for containing. Drive it into the throne and get clear."`,`Cinco pisos más abajo, detrás de tres puertas, Flavio abre una caja de plomo. Adentro, un puñal de hoja gris que se desmorona en los bordes y nunca termina de desmoronarse. El aire alrededor se enfría. "No es para pelear", dice. "Es para contener. Clávalo en el trono y aléjate."`))+ashDagger()+bond('flavio'),go:'a2c2b_teste'})}
  ]},

a2c2b_teste:{act:KS,title:L('O teste de dublê','The stunt audition','La prueba de doble'),checkpoint:true,
  text:()=>P(L(`Um estacionamento cercado nos fundos do Estúdio Imperial, com rampas, carros velhos e colchões de ar. Uns vinte dublês fazendo fila. O coordenador grita nomes numa prancheta.

Numa cadeira de diretor, na sombra, de terno de linho e chapéu, um homem de setenta anos assiste a tudo tomando água com gás. Otto Brenner.

"Zart", o coordenador chama. Você tirou a proteção pesada e deixou a Raijin com o Derick, na van. É a primeira vez em anos que você entra num lugar desarmado. Você entra mesmo assim.`,
`A fenced lot behind the Imperial Studio, with ramps, old cars and air mattresses. About twenty stunt performers in line. The coordinator shouts names off a clipboard.

In a director's chair, in the shade, wearing a linen suit and a hat, a seventy-year-old man watches it all while sipping sparkling water. Otto Brenner.

"Zart," the coordinator calls. You took off your heavy armor and left Raijin with Derick, in the van. It's the first time in years you've walked in somewhere unarmed. You walk in anyway.`,
`Un estacionamiento cercado detrás del Estudio Imperial, con rampas, autos viejos y colchones de aire. Unos veinte dobles haciendo fila. El coordinador grita nombres de una planilla.

En una silla de director, a la sombra, con traje de lino y sombrero, un hombre de setenta años mira todo tomando agua con gas. Otto Brenner.

"Zart", llama el coordinador. Te sacaste la protección pesada y dejaste la Raijin con Derick, en la camioneta. Es la primera vez en años que entras desarmado a un lugar. Entras igual.`)),
  choices:()=>[
    {label:L('Capotar o carro na rampa','Roll the car off the ramp','Volcar el auto en la rampa'),main:true,test:{sk:'Pilotagem',dt:20},
      ok:()=>({text:P(L(`Acelerar reto, não frear, confiar no carro. O carro sobe na rampa, gira duas vezes no ar e cai de rodas exatamente na marca. Você sai pela janela antes da poeira baixar. Ninguém aplaude. Todo mundo fica em silêncio.

O Brenner abaixa o copo. Levanta, anda até você devagar e te olha de perto por muito tempo. "Você me lembra alguém", ele diz. "Um americano. Trabalhou comigo uma vez. Caía igual a você." Ele sorri. "Está contratado, senhor Zart."`,`Floor it straight, don't brake, trust the car. The car climbs the ramp, spins twice in the air and lands on its wheels exactly on the mark. You climb out the window before the dust settles. Nobody applauds. Everyone goes silent.

Brenner lowers his glass. He gets up, walks over to you slowly and looks at you up close for a long time. "You remind me of someone," he says. "An American. Worked with me once. Fell just like you." He smiles. "You're hired, Mr. Zart."`,`Acelerar derecho, no frenar, confiar en el auto. El auto sube la rampa, gira dos veces en el aire y cae sobre las ruedas exactamente en la marca. Sales por la ventana antes de que baje el polvo. Nadie aplaude. Todos se quedan en silencio.

Brenner baja el vaso. Se levanta, camina hasta ti despacio y te mira de cerca un largo rato. "Me recuerdas a alguien", dice. "Un estadounidense. Trabajó conmigo una vez. Caía igual que tú." Sonríe. "Está contratado, señor Zart."`))+bond('maxwel')+loseSan('1d3',L('o sorriso do Brenner','Brenner\'s smile','la sonrisa de Brenner')),go:'a2c2c_estudio'}),
      fail:()=>{S.flags.suspeita=true;return {text:P(L(`O carro gira uma vez a mais do que devia e cai de lado. Você sai pela janela com o ombro sangrando. O coordenador já está riscando o seu nome quando uma voz educada o interrompe.

"Contrata." O Brenner está de pé, olhando para você. "Ele caiu errado, mas levantou certo." Ele inclina a cabeça. "Zart. Eu conheço esse nome." Não é uma pergunta. Você sabe que, a partir de agora, ele está de olho.`,`The car spins once too many and lands on its side. You climb out the window with your shoulder bleeding. The coordinator is already crossing out your name when a polite voice interrupts.

"Hire him." Brenner is standing, looking at you. "He fell wrong, but he got up right." He tilts his head. "Zart. I know that name." It isn't a question. You know that from now on, he's watching.`,`El auto gira una vez de más y cae de costado. Sales por la ventana con el hombro sangrando. El coordinador ya está tachando tu nombre cuando una voz educada lo interrumpe.

"Contrátalo." Brenner está de pie, mirándote. "Cayó mal, pero se levantó bien." Inclina la cabeza. "Zart. Conozco ese nombre." No es una pregunta. Sabes que, desde ahora, te está vigilando.`))+losePv('3d6',L('a capotagem','the rollover','el vuelco')),go:'a2c2c_estudio'}}}
  ]},

a2c2c_estudio:{act:KS,title:L('O Estúdio Imperial','The Imperial Studio','El Estudio Imperial'),checkpoint:true,
  text:()=>P(L(`Noite da cena final. O Estúdio Imperial é um teatro de 1920 com a plateia arrancada e o palco transformado num cenário de salão de baile. Quarenta figurantes de roupa de época esperam em fila, bebendo um chá que a produção serve em copos de papel. A Koranna está entre eles, de peruca e vestido, com a lança escondida num suporte de cenário.

Pelo rádio, a voz do Derick, da van: "Tô com a sua proteção e a Raijin. Dois minutos até a porta dos fundos."

Nos bastidores, você vê seguranças de camiseta preta fechando as saídas uma por uma.`,
`Night of the final scene. The Imperial Studio is a 1920s theater with its seats torn out and the stage turned into a ballroom set. Forty extras in period costume wait in line, drinking a tea the production serves in paper cups. Koranna is among them, in a wig and dress, her spear hidden inside a set stand.

Over the radio, Derick's voice from the van: "I've got your armor and Raijin. Two minutes to the back door."

Backstage, you see security in black T-shirts closing the exits one by one.`,
`Noche de la escena final. El Estudio Imperial es un teatro de 1920 con la platea arrancada y el escenario convertido en un salón de baile. Cuarenta extras con ropa de época esperan en fila, tomando un té que la producción sirve en vasos de papel. Koranna está entre ellos, con peluca y vestido, la lanza escondida en un soporte de escenografía.

Por la radio, la voz de Derick, desde la camioneta: "Tengo tu protección y la Raijin. Dos minutos hasta la puerta de atrás."

Tras bastidores, ves a los guardias de remera negra cerrando las salidas una por una.`)),
  choices:()=>[
    {once:'cha',label:L('Cheirar o chá dos figurantes','Smell the extras\' tea','Oler el té de los extras'),test:{sk:'Percepção',dt:16},
      ok:()=>({text:P(L(`Doce demais. Com um fundo de ferro. Você derruba o copo da mão da Koranna antes que ela beba, fingindo que tropeçou. Ela entende na hora. Três figurantes perto dela já estão com os olhos pesados.`,`Too sweet. With a hint of iron underneath. You knock the cup out of Koranna's hand before she drinks, pretending to trip. She gets it immediately. Three extras near her already have heavy eyes.`,`Demasiado dulce. Con un fondo de hierro. Le tiras el vaso de la mano a Koranna antes de que beba, fingiendo que tropezaste. Ella entiende al instante. Tres extras cerca de ella ya tienen los ojos pesados.`))+bond('koranna')}),
      fail:()=>({text:P(L(`Chá de set. Você não pensa mais nisso até ver os primeiros figurantes cambaleando.`,`Set tea. You don't think about it again until you see the first extras staggering.`,`Té de set. No vuelves a pensar en eso hasta ver a los primeros extras tambalearse.`))})},
    {once:'fichas',label:L('Olhar as fichas dos figurantes na mesa da produção','Check the extras\' forms on the production desk','Mirar las fichas de los extras en la mesa de producción'),test:{sk:'Investigação',dt:14},
      ok:()=>({text:P(L(`Você lê três fichas e para. Não precisa ler as outras trinta e sete.`,`You read three forms and stop. You don't need to read the other thirty-seven.`,`Lees tres fichas y te detienes. No necesitas leer las otras treinta y siete.`))+addClue('contratos')+loseSan('1d3',L('as fichas','the forms','las fichas'))}),
      fail:()=>({text:P(L(`Papelada de produção. Um segurança te olha torto e você se afasta da mesa.`,`Production paperwork. A guard gives you a look and you step away from the desk.`,`Papelería de producción. Un guardia te mira mal y te alejas de la mesa.`))})},
    {label:L('Buscar a Raijin com o Derick na porta dos fundos','Get Raijin from Derick at the back door','Buscar la Raijin con Derick en la puerta de atrás'),main:true,
      run:()=>({text:P(L(`O Derick te entrega a proteção e a Raijin pela fresta da porta. Você veste tudo em quarenta segundos, como antes de uma cena. Quando vira, seis seguranças de camiseta preta já estão no corredor, e nenhum deles está segurando crachá.`,`Derick hands you the armor and Raijin through the gap in the door. You gear up in forty seconds, like before a take. When you turn, six guards in black T-shirts are already in the hallway, and none of them is holding a badge.`,`Derick te pasa la protección y la Raijin por la rendija de la puerta. Te equipas en cuarenta segundos, como antes de una toma. Cuando te das vuelta, seis guardias de remera negra ya están en el pasillo, y ninguno sostiene una credencial.`)),combat:{id:'colheiteiros',after:'a2c2d_trono',allies:['derick16'],enemyFirst:!!S.flags.suspeita,winText:L('O último colheiteiro cai contra um cenário de papelão pintado. Do palco, vem o som de quarenta pessoas caindo ao mesmo tempo.','The last harvester falls against a painted cardboard set piece. From the stage comes the sound of forty people collapsing at once.','El último cosechador cae contra una escenografía de cartón pintado. Desde el escenario llega el sonido de cuarenta personas desplomándose a la vez.')}})}
  ]},

a2c2d_trono:{act:KS,title:L('Embaixo do palco','Beneath the stage','Debajo del escenario'),
  text:()=>P(L(`O alçapão do palco está aberto. Lá embaixo, onde deveria haver só madeira e poeira, o chão é carne.

No centro, o trono. Alto, torto, feito de algo que já foi gente. Pulsa como um coração. Dele saem correntes de veias que descem até os figurantes desacordados, deitados em volta como pétalas, e bebem devagar.

A Koranna já está lá, de lança em punho, com a peruca no chão. O Derick desce atrás de você.

O Brenner está de pé na frente do trono, de costas. Metade do braço dele já entrou no encosto. Ele fala sem se virar.

"Eu esperei vinte anos, senhor Zart. O seu pai me custou uma década. Não vai ser o filho que me custa o resto."`,
`The stage trapdoor is open. Down below, where there should be only wood and dust, the floor is flesh.

In the center, the throne. Tall, crooked, made of something that used to be people. It pulses like a heart. From it run chains of veins down to the unconscious extras, lying around it like petals, drinking slowly.

Koranna is already there, spear in hand, her wig on the floor. Derick comes down behind you.

Brenner stands in front of the throne, back turned. Half his arm has already sunk into the backrest. He speaks without turning around.

"I waited twenty years, Mr. Zart. Your father cost me a decade. His son won't cost me the rest."`,
`La trampilla del escenario está abierta. Abajo, donde solo debería haber madera y polvo, el piso es carne.

En el centro, el trono. Alto, torcido, hecho de algo que alguna vez fue gente. Late como un corazón. De él salen cadenas de venas que bajan hasta los extras inconscientes, tendidos alrededor como pétalos, y beben despacio.

Koranna ya está ahí, lanza en mano, con la peluca en el piso. Derick baja detrás de ti.

Brenner está de pie frente al trono, de espaldas. La mitad de su brazo ya se hundió en el respaldo. Habla sin darse vuelta.

"Esperé veinte años, señor Zart. Tu padre me costó una década. No va a ser el hijo el que me cueste el resto."`))+loseSan('1d4',L('o trono','the throne','el trono')),
  choices:()=>[
    {label:L('Ficar entre o Brenner e os figurantes','Put yourself between Brenner and the extras','Ponerte entre Brenner y los extras'),main:true,
      run:()=>({text:P(L(`"Koranna, as correntes. Derick, comigo." Você não pensa. Nunca pensa quando alguém está em perigo. E ali tem quarenta.`,`"Koranna, the chains. Derick, with me." You don't think. You never think when someone is in danger. And there are forty of them.`,`"Koranna, las cadenas. Derick, conmigo." No piensas. Nunca piensas cuando alguien está en peligro. Y ahí hay cuarenta.`)),combat:{id:'brenner',after:'a2c2e_conter',allies:['koranna','derick16'],script:'trono'}})}
  ]},

a2c2e_conter:{act:KS,title:L('O Punhal de Cinzas','The Ash Dagger','El Puñal de Cenizas'),
  text:()=>P(L(`O Brenner cai de joelhos na frente do trono. Sem os figurantes, o trono não tem mais o que beber. E, sem ele, o corpo do Brenner não aguenta o que já é do trono.

Ele se arrasta os últimos dois metros e põe a mão no braço do assento. "Só... sentar..." O trono se abre. E fecha.

Não sobra nada do Otto Brenner. O trono pulsa mais forte, satisfeito, procurando a próxima pessoa. Você sente ele te olhando.

O Punhal de Cinzas pesa no seu cinto.`,
`Brenner drops to his knees in front of the throne. Without the extras, the throne has nothing left to drink. And without it, Brenner's body can't hold what already belongs to the throne.

He drags himself the last two meters and puts his hand on the armrest. "Just... sit..." The throne opens. And closes.

Nothing is left of Otto Brenner. The throne pulses harder, satisfied, searching for the next person. You feel it looking at you.

The Ash Dagger weighs on your belt.`,
`Brenner cae de rodillas frente al trono. Sin los extras, el trono ya no tiene qué beber. Y sin él, el cuerpo de Brenner no aguanta lo que ya es del trono.

Se arrastra los últimos dos metros y pone la mano en el apoyabrazos. "Solo... sentarme..." El trono se abre. Y se cierra.

No queda nada de Otto Brenner. El trono late más fuerte, satisfecho, buscando a la siguiente persona. Sientes que te mira.

El Puñal de Cenizas te pesa en el cinturón.`))+loseSan('1d6',L('o fim do Brenner','Brenner\'s end','el final de Brenner')),
  choices:()=>[
    {label:L('Cravar o punhal no trono','Drive the dagger into the throne','Clavar el puñal en el trono'),main:true,test:{sk:'Vontade',dt:18},
      ok:()=>({text:P(L(`O trono te chama. Não com palavras. Com a voz do seu pai, da sua mãe, do Thomas, do Bob. Prometendo que, se você sentar, nunca mais ninguém que você ama vai morrer.

Você crava o punhal no centro do encosto.

A carne vira cinza. Cinza vira pedra. O pulso desacelera até parar. O Trono de Sangue continua ali, mas dormindo, contido, cinza como uma estátua velha.

Atrás de você, a Koranna está segurando a sua mão. Você nem viu quando ela pegou.`,`The throne calls you. Not with words. With the voices of your father, your mother, Thomas, Bob. Promising that if you sit, no one you love will ever die again.

You drive the dagger into the center of the backrest.

The flesh turns to ash. Ash turns to stone. The pulse slows until it stops. The Throne of Blood is still there, but asleep, contained, grey as an old statue.

Behind you, Koranna is holding your hand. You didn't even see when she took it.`,`El trono te llama. No con palabras. Con la voz de tu padre, de tu madre, de Thomas, de Bob. Prometiéndote que, si te sientas, nadie que ames volverá a morir.

Clavas el puñal en el centro del respaldo.

La carne se vuelve ceniza. La ceniza se vuelve piedra. El pulso se hace más lento hasta detenerse. El Trono de Sangre sigue ahí, pero dormido, contenido, gris como una estatua vieja.

Detrás de ti, Koranna te está tomando la mano. Ni viste cuándo la tomó.`))+bond('koranna',2),go:'a2c2f_telhado'}),
      fail:()=>({text:P(L(`O trono te chama com a voz da sua mãe. Você dá um passo na direção dele sem querer. Depois outro.

A mão da Koranna fecha no seu pulso. Ela não diz nada. Só segura, com força, até você voltar a si. Juntos, vocês cravam o punhal no centro do encosto.

A carne vira cinza. Cinza vira pedra. O Trono de Sangue continua ali, mas dormindo, contido. Você não solta a mão dela por muito tempo.`,`The throne calls you with your mother's voice. You take a step toward it without meaning to. Then another.

Koranna's hand closes around your wrist. She says nothing. She just holds on, hard, until you come back to yourself. Together, you drive the dagger into the center of the backrest.

The flesh turns to ash. Ash turns to stone. The Throne of Blood is still there, but asleep, contained. You don't let go of her hand for a long time.`,`El trono te llama con la voz de tu madre. Das un paso hacia él sin querer. Después otro.

La mano de Koranna se cierra en tu muñeca. No dice nada. Solo sostiene, fuerte, hasta que vuelves en ti. Juntos, clavan el puñal en el centro del respaldo.

La carne se vuelve ceniza. La ceniza se vuelve piedra. El Trono de Sangre sigue ahí, pero dormido, contenido. No le sueltas la mano por mucho tiempo.`))+loseSan('2d4',L('o chamado do trono','the throne\'s call','el llamado del trono'))+bond('koranna',3),go:'a2c2f_telhado'})}
  ]},

a2c2f_telhado:{act:KS,title:L('O telhado','The roof','El techo'),
  text:()=>P(L(`Amanhece quando a última ambulância leva o último figurante. Quarenta. Todos vivos. O Derick está lá embaixo, falando com a Olívia pelo telefone, contando tudo rápido demais.

Você sobe no telhado do Estúdio Imperial para respirar. A Koranna já está lá, sentada na beirada, com os pés balançando sobre a rua. Ainda tem sangue seco no vestido de figurante. Ela chega para o lado, deixando espaço.`,
`Dawn breaks as the last ambulance takes the last extra away. Forty. All alive. Derick is downstairs, on the phone with Olívia, telling her everything too fast.

You climb onto the roof of the Imperial Studio to breathe. Koranna is already there, sitting on the edge, feet dangling over the street. There's still dried blood on her extra's dress. She scoots over, making room.`,
`Amanece cuando la última ambulancia se lleva al último extra. Cuarenta. Todos vivos. Derick está abajo, hablando por teléfono con Olívia, contándole todo demasiado rápido.

Subes al techo del Estudio Imperial a respirar. Koranna ya está ahí, sentada en el borde, con los pies colgando sobre la calle. Todavía tiene sangre seca en el vestido de extra. Se corre para un costado, dejándote lugar.`)),
  choices:()=>[
    {label:L('Sentar ao lado da Koranna','Sit beside Koranna','Sentarte al lado de Koranna'),main:true,
      run:()=>{S.flags.beijo=true;return {text:P(L(`Você senta do lado dela, na beirada, com os pés balançando sobre a rua. Os ombros de vocês se encostam. Por um tempo, nenhum dos dois fala. A cidade acorda lá embaixo, buzina por buzina.

"Sabe uma coisa sobre mim?", ela diz, sem olhar para você. "Eu sou meio impulsiva. Às vezes."

"Às vezes", você repete.

"Tá, quase sempre." Ela ri, baixinho, e finalmente vira o rosto para você. Tem poeira na bochecha dela e sangue seco no vestido de figurante, e ela nunca esteve tão bonita. "Posso ser impulsiva agora?"

Você abre a boca para responder. Não dá tempo.

Ela segura o seu rosto com as duas mãos e te beija. Um beijo curto, cansado, com gosto de poeira e de amanhecer. Quando ela se afasta, está rindo, com a testa encostada na sua.

"Demorou", ela diz.

"Eu nem respondi."

"Eu sei. Por isso eu não esperei."

Lá embaixo, o Derick grita alguma coisa que parece "FINALMENTE", e vocês dois fingem que não ouviram.`,`You sit down beside her, on the edge, feet dangling over the street. Your shoulders touch. For a while, neither of you speaks. The city wakes up below, one car horn at a time.

"You know something about me?" she says, without looking at you. "I'm a little impulsive. Sometimes."

"Sometimes," you repeat.

"Okay, almost always." She laughs quietly and finally turns her face to you. There's dust on her cheek and dried blood on her extra's dress, and she has never looked so beautiful. "Can I be impulsive now?"

You open your mouth to answer. There's no time.

She takes your face in both hands and kisses you. A short kiss, tired, tasting of dust and dawn. When she pulls back, she's laughing, her forehead against yours.

"Took you long enough," she says.

"I didn't even answer."

"I know. That's why I didn't wait."

Down below, Derick yells something that sounds like "FINALLY", and you both pretend not to hear.`,`Te sientas a su lado, en el borde, con los pies colgando sobre la calle. Sus hombros se tocan. Por un rato, ninguno de los dos habla. La ciudad se despierta abajo, bocinazo por bocinazo.

"¿Sabes algo de mí?", dice, sin mirarte. "Soy medio impulsiva. A veces."

"A veces", repites.

"Bueno, casi siempre." Se ríe bajito y por fin gira la cara hacia ti. Tiene polvo en la mejilla y sangre seca en el vestido de extra, y nunca estuvo tan linda. "¿Puedo ser impulsiva ahora?"

Abres la boca para responder. No hay tiempo.

Te toma la cara con las dos manos y te besa. Un beso corto, cansado, con gusto a polvo y a amanecer. Cuando se aparta, se está riendo, con la frente apoyada en la tuya.

"Tardaste", dice.

"Ni siquiera respondí."

"Lo sé. Por eso no esperé."

Abajo, Derick grita algo que suena como "¡POR FIN!", y los dos fingen no haberlo oído.`))+bond('koranna',2)+calm(6),go:'a2c2g_fim'}}}
  ]},

a2c2g_fim:{act:K,title:L('Fim do Capítulo 2','End of Chapter 2','Fin del Capítulo 2'),
  text:()=>P(L(`A Ordem lacrou o Estúdio Imperial. Embaixo do palco, o Trono de Sangue dorme, cinza, com o Punhal de Cinzas cravado no peito. Contido. Não destruído. A Maitê diz que nunca vai ser destruído enquanto existir sangue no mundo.

De volta à Base, o Derick espalha na mesa o que achou no escritório do Brenner: um celular, e nele, uma única conversa com um número sem nome. Anos de mensagens. Perguntas sobre o trono. E, nas últimas semanas, perguntas sobre outra coisa.

"Alguma notícia da luva do Anfitrião?"

Você lembra de uma luva de metal num cofre, cinco andares abaixo da antiga Base. Uma Base que não existe mais.`,
`The Order sealed the Imperial Studio. Beneath the stage, the Throne of Blood sleeps, grey, with the Ash Dagger driven into its chest. Contained. Not destroyed. Maitê says it will never be destroyed as long as there's blood in the world.

Back at the Base, Derick spreads out on the table what he found in Brenner's office: a phone, and on it, a single conversation with an unnamed number. Years of messages. Questions about the throne. And, in the last few weeks, questions about something else.

"Any news about the Host's glove?"

You remember a metal glove in a vault, five floors beneath the old Base. A Base that no longer exists.`,
`La Orden selló el Estudio Imperial. Debajo del escenario, el Trono de Sangre duerme, gris, con el Puñal de Cenizas clavado en el pecho. Contenido. No destruido. Maitê dice que nunca va a ser destruido mientras exista sangre en el mundo.

De vuelta en la Base, Derick despliega sobre la mesa lo que encontró en la oficina de Brenner: un celular, y en él, una única conversación con un número sin nombre. Años de mensajes. Preguntas sobre el trono. Y, en las últimas semanas, preguntas sobre otra cosa.

"¿Alguna noticia del guante del Anfitrión?"

Recuerdas un guante de metal en una bóveda, cinco pisos debajo de la antigua Base. Una Base que ya no existe.`)),
  choices:()=>[{label:L('Ver o relatório','See the report','Ver el informe'),main:true,run:()=>({end:true})}]}
});

function ashDagger(){if(S.inv.some(i=>i.id==='cinzas'))return '';S.inv.push(newInst('cinzas'));return `<p class="gain">+ ${ITEMS.cinzas.name}</p>`}

function buildAct2C3(){
Object.assign(ENEMIES,{
  eco:{eyes:false,name:L('Eco Elétrico','Electric Echo','Eco Eléctrico'),kind:L('Criatura de Energia','Energy Creature','Criatura de Energía'),el:'energia',pv:110,def:21,atk:14,dmg:'2d10+4',res:6,init:6,
    presence:{dt:17,san:'1d4'},desc:L('O que sobrou da fuga do Kadu. Um emaranhado de raios presos no corredor das celas, com o formato das grades que derreteram. Ele não tem rosto. Tem o barulho de uma lâmpada prestes a queimar.','What\'s left of Kadu\'s escape. A tangle of lightning trapped in the cell corridor, shaped like the bars that melted. It has no face. It has the sound of a bulb about to burn out.','Lo que quedó de la fuga de Kadu. Una maraña de rayos atrapada en el pasillo de las celdas, con la forma de los barrotes que se derritieron. No tiene cara. Tiene el sonido de una bombilla a punto de quemarse.')},
  corvos2:{human:true,eyes:true,name:L('Corvos leais ao Kadu','Crows loyal to Kadu','Cuervos leales a Kadu'),kind:L('Humanos · grupo','Humans · group','Humanos · grupo'),el:null,pv:120,def:21,atk:14,dmg:'2d8+6',res:6,init:5,presence:null,
    desc:L('Três Corvos que ficaram vigiando o clube. Cada um usa uma pulseira de cobre que faísca quando eles fecham o punho. Presente do Kadu.','Three Crows left guarding the clubhouse. Each wears a copper bracelet that sparks when they make a fist. A gift from Kadu.','Tres Cuervos que quedaron vigilando el club. Cada uno lleva una pulsera de cobre que chispea cuando cierran el puño. Regalo de Kadu.')},
  corvos3:{human:true,eyes:true,name:L('Corvos na represa','Crows on the dam','Cuervos en la represa'),kind:L('Humanos · grupo','Humans · group','Humanos · grupo'),el:null,pv:160,def:22,atk:15,dmg:'2d10+6',res:7,init:5,presence:null,
    desc:L('Uma dúzia de motoqueiros espalhados pela crista da represa, com correntes de cobre enroladas nos braços e os olhos brilhando azul. Eles já não parecem totalmente humanos.','A dozen bikers spread along the crest of the dam, copper chains wrapped around their arms and their eyes glowing blue. They no longer look entirely human.','Una docena de motoqueros repartidos por la cresta de la represa, con cadenas de cobre enrolladas en los brazos y los ojos brillando azul. Ya no parecen del todo humanos.')},
  kadu2:{eyes:true,name:L('Kadu, o Quase-Anfitrião','Kadu, the Almost-Host','Kadu, el Casi-Anfitrión'),kind:L('Humano tomado pela Energia','Human seized by Energy','Humano tomado por la Energía'),el:'energia',pv:250,def:24,atk:17,dmg:'3d10+5',res:9,init:7,
    presence:{dt:20,san:'1d6'},special:{every:3,kind:'atk',name:L('Raio','Lightning','Rayo'),text:L('Ele aponta a luva, e o raio vem antes do barulho.','He points the glove, and the lightning comes before the sound.','Apunta el guante, y el rayo llega antes que el ruido.'),dmg:'4d8+6'},
    desc:L('A barba grisalha está chamuscada. A luva de metal subiu pelo braço inteiro até o ombro, costurada na pele com fios de cobre. Acima dele, no teto da casa de turbinas, uma coisa feita de chama e raio gira devagar, esperando. Ele ri. "Olha só. O Zart que me tirou a luva da primeira vez."','His grey beard is singed. The metal glove has crept up his whole arm to the shoulder, stitched into the skin with copper wire. Above him, at the ceiling of the turbine hall, something made of flame and lightning turns slowly, waiting. He laughs. "Look at that. The Zart who took my glove the first time."','La barba canosa está chamuscada. El guante de metal le subió por todo el brazo hasta el hombro, cosido a la piel con hilos de cobre. Encima de él, en el techo de la sala de turbinas, algo hecho de llama y rayo gira despacio, esperando. Se ríe. "Mira nada más. El Zart que me sacó el guante la primera vez."')}
});

Object.assign(CLUES,{
  a3comprador:c(L('O Comprador','The Buyer','El Comprador'),L('O Sílvio nunca viu o dono do número. O Brenner chamava de "o Comprador". Paga em ouro, nunca aparece e, segundo o Brenner, quer as quatro relíquias. Não para portar. Para ter.','Sílvio never saw the number\'s owner. Brenner called him "the Buyer". Pays in gold, never shows up and, according to Brenner, wants all four relics. Not to bear them. To own them.','Sílvio nunca vio al dueño del número. Brenner lo llamaba "el Comprador". Paga en oro, nunca aparece y, según Brenner, quiere las cuatro reliquias. No para portarlas. Para tenerlas.')),
  a3opressor:c(L('Energia e Conhecimento','Energy and Knowledge','Energía y Conocimiento'),L('A Maitê desenha o ciclo num guardanapo: Sangue cede à Morte, Morte cede à Energia, Energia cede ao Conhecimento, Conhecimento cede ao Sangue. "Para conter o Anfitrião, vocês precisam de alguém que saiba escrever Conhecimento."','Maitê draws the cycle on a napkin: Blood yields to Death, Death yields to Energy, Energy yields to Knowledge, Knowledge yields to Blood. "To contain the Host, you need someone who can write Knowledge."','Maitê dibuja el ciclo en una servilleta: la Sangre cede ante la Muerte, la Muerte ante la Energía, la Energía ante el Conocimiento, el Conocimiento ante la Sangre. "Para contener al Anfitrión, necesitan a alguien que sepa escribir Conocimiento."')),
  a3video:c(L('O vídeo do cofre','The vault footage','El video de la bóveda'),L('Câmera do corredor do cofre, noite do massacre. Um homem grande, de escudo nas costas, digita o código, pega a caixa da luva e desce até as celas. É o Leon. Ele abre a cela do Kadu e entrega a caixa. Os lábios dele dizem: "Presente do Comprador."','Vault corridor camera, the night of the massacre. A big man with a shield on his back types in the code, takes the glove\'s case and goes down to the cells. It\'s Leon. He opens Kadu\'s cell and hands over the case. His lips say: "A gift from the Buyer."','Cámara del pasillo de la bóveda, noche de la masacre. Un hombre grande, con un escudo en la espalda, marca el código, agarra la caja del guante y baja a las celdas. Es Leon. Abre la celda de Kadu y le entrega la caja. Sus labios dicen: "Regalo del Comprador."')),
  a3escudo:c(L('A silhueta do escudo','The shield silhouette','La silueta del escudo'),L('A gravação está corrompida. Só dá para ver, por três segundos, uma silhueta grande abrindo o cofre, com alguma coisa redonda e pesada presa nas costas. Um escudo.','The recording is corrupted. All you can see, for three seconds, is a big silhouette opening the vault, with something round and heavy strapped to its back. A shield.','La grabación está dañada. Solo se ve, durante tres segundos, una silueta grande abriendo la bóveda, con algo redondo y pesado atado a la espalda. Un escudo.')),
  a3cela:c(L('A cela do Kadu','Kadu\'s cell','La celda de Kadu'),L('As grades derreteram de dentro para fora. O Kadu não foi solto. Ele saiu. A luva já estava com ele antes de a porta abrir.','The bars melted from the inside out. Kadu wasn\'t released. He got out. The glove was already on him before the door opened.','Los barrotes se derritieron de adentro hacia afuera. Kadu no fue liberado. Salió. El guante ya lo tenía antes de que se abriera la puerta.')),
  a3usina:c(L('A Usina Velha','The Old Plant','La Usina Vieja'),L('O Beto confessa: o Kadu levou os Corvos para a Usina Velha, uma hidrelétrica abandonada há trinta anos na serra. "Ele disse que vai acender ela de novo. Com uma coisa que não é luz."','Beto confesses: Kadu took the Crows to the Old Plant, a hydroelectric station abandoned thirty years ago in the hills. "He said he\'s going to light it up again. With something that isn\'t light."','Beto confiesa: Kadu se llevó a los Cuervos a la Usina Vieja, una hidroeléctrica abandonada hace treinta años en la sierra. "Dijo que la va a encender de nuevo. Con algo que no es luz."')),
  a3cobre:c(L('Cobre e um gerador','Copper and a generator','Cobre y un generador'),L('O Beto não entrega o lugar. Mas conta que os Corvos roubaram toneladas de cabo de cobre e um gerador industrial, coisa grande demais para o galpão do clube. "Coisa de usina", ele diz, e se arrepende na hora.','Beto won\'t give up the place. But he says the Crows stole tons of copper cable and an industrial generator, far too big for the clubhouse. "Power-plant stuff," he says, and regrets it instantly.','Beto no entrega el lugar. Pero cuenta que los Cuervos robaron toneladas de cable de cobre y un generador industrial, algo demasiado grande para el galpón del club. "Cosa de usina", dice, y se arrepiente al instante.')),
  a3data:c(L('O desligamento','The shutdown','El apagón'),L('O Tuninho rastreia o número até uma conta que pagou a Subestação Serra Alta por um "desligamento programado" amanhã, à meia-noite. A subestação alimenta uma única instalação fora da rede da cidade: a Usina Velha, desativada há trinta anos.','Tuninho traces the number to an account that paid the Serra Alta Substation for a "scheduled shutdown" tomorrow at midnight. The substation feeds a single facility off the city grid: the Old Plant, shut down thirty years ago.','Tuninho rastrea el número hasta una cuenta que le pagó a la Subestación Serra Alta un "corte programado" mañana a medianoche. La subestación alimenta una sola instalación fuera de la red de la ciudad: la Usina Vieja, desactivada hace treinta años.'))
});
const K=L('Ato II · Cap. 3 · O Anfitrião','Act II · Ch. 3 · The Host','Acto II · Cap. 3 · El Anfitrión');
const KI=L('Ato II · Cap. 3 · Investigação','Act II · Ch. 3 · Investigation','Acto II · Cap. 3 · Investigación');
const KU=L('Ato II · Cap. 3 · A Usina Velha','Act II · Ch. 3 · The Old Plant','Acto II · Cap. 3 · La Usina Vieja');
