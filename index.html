ITEMS.raijin=Object.assign({},ITEMS.katana,{name:L('Katana: Raijin','Katana: Raijin','Katana: Raijin'),special:true,desc:L('Originária do Japão, esta espada longa e levemente curvada transcendeu os séculos. É uma arma ágil. Se você for veterano em Luta, pode usá-la como uma arma de uma mão. Sua lâmina tem um raio cravado, e a base tem um tom avermelhado que lembra sangue.','Originating in Japan, this long, slightly curved sword has endured for centuries. It is an agile weapon. If you are a veteran in Fighting, you can wield it one-handed. Its blade has a lightning bolt engraved on it, and its base has a reddish tone that resembles blood.','Originaria de Japón, esta espada larga y levemente curva ha trascendido los siglos. Es un arma ágil. Si eres veterano en Lucha, puedes usarla a una mano. Su hoja tiene un rayo grabado, y su base tiene un tono rojizo que recuerda a la sangre.')});
const c=(t,x)=>({t,x});
Object.assign(CLUES,{
  recortes:c(L('O mural de recortes','The clippings board','El mural de recortes'),L('Três "surtos" em três bairros da cidade em um ano. Em todos, a polícia fala em briga, droga ou incêndio. Em dois, uma testemunha falou de um desenho vermelho num portão.','Three "outbreaks" in three neighborhoods in one year. Each time the police blame a fight, drugs or a fire. In two of them, a witness mentioned a red drawing on a gate.','Tres "brotes" en tres barrios de la ciudad en un año. En todos, la policía habla de peleas, drogas o incendios. En dos, un testigo mencionó un dibujo rojo en un portón.')),
  tinta:c(L('Tinta fresca','Fresh paint','Pintura fresca'),L('Alguém pintou de branco por cima do símbolo no portão da vó. A tinta ainda está mole. Quem fez isso voltou à rua depois que a polícia foi embora.','Someone painted white over the symbol on Grandma\'s gate. The paint is still soft. Whoever did it came back after the police left.','Alguien pintó de blanco encima del símbolo en el portón de la abuela. La pintura todavía está blanda. Quien lo hizo volvió después de que se fue la policía.')),
  cartao:c(L('Galpão 9','Warehouse 9','Galpón 9'),L('Um cartão de papelão com o círculo riscado e, atrás, a lápis: "Galpão 9 · Cais · sexta". A mesma zona portuária onde você filmou a sua primeira cena.','A cardboard card with the scratched circle and, on the back, in pencil: "Warehouse 9 · Docks · Friday". The same port district where you shot your first scene.','Una tarjeta de cartón con el círculo rayado y, atrás, en lápiz: "Galpón 9 · Muelle · viernes". La misma zona portuaria donde filmaste tu primera escena.')),
  elementos:c(L('O Outro Lado','The Other Side','El Otro Lado'),L('VT desenha cinco símbolos num quadro sujo: Sangue, Morte, Conhecimento, Energia e Medo. "O que matou a sua família é Sangue. Sangue quer sentir. Dor, fome, raiva. E alguém ensinou aquela gente a chamar isso."','VT draws five symbols on a dirty board: Blood, Death, Knowledge, Energy and Fear. "What killed your family is Blood. Blood wants to feel. Pain, hunger, rage. And someone taught those people how to call it."','VT dibuja cinco símbolos en una pizarra sucia: Sangre, Muerte, Conocimiento, Energía y Miedo. "Lo que mató a tu familia es Sangre. La Sangre quiere sentir. Dolor, hambre, rabia. Y alguien le enseñó a esa gente a llamarla."'))
});
const K=L('Ato I · Cap. 2 · Rastros','Act I · Ch. 2 · Traces','Acto I · Cap. 2 · Rastros');
const KV=L('Ato I · Cap. 2 · O hangar','Act I · Ch. 2 · The hangar','Acto I · Cap. 2 · El hangar');
Object.assign(SCENES,{
c2a_pensao:{act:K,title:L('O quarto da pensão','The boarding house room','El cuarto de la pensión'),checkpoint:true,
  text:()=>P(L(`Seis meses depois, o quarto da pensão tem três colchões, uma panela elétrica e um mural de cortiça que a dona da pensão acha que é trabalho de escola.

Thomas trabalha de dia numa oficina e estuda à noite quando dá. Você pega todo bico de dublê que aparece: quedas, capotagens, um comercial de pneu. Bob vai para a escola e volta direto, porque vocês combinaram assim, e ele não discute.

Quando Bob dorme, você e Thomas abrem o mural. Ninguém explicou o que aconteceu naquela rua. Então vocês mesmos vão descobrir.`,
`Six months later, the boarding house room has three mattresses, an electric pot and a corkboard the landlady thinks is a school project.

Thomas works at a garage during the day and studies at night when he can. You take every stunt gig that comes up: falls, rollovers, a tire commercial. Bob goes to school and comes straight home, because that's the deal, and he doesn't argue.

When Bob falls asleep, you and Thomas open up the board. Nobody explained what happened on that street. So you'll find out yourselves.`,
`Seis meses después, el cuarto de la pensión tiene tres colchones, una olla eléctrica y un corcho que la dueña cree que es un trabajo de la escuela.

Thomas trabaja de día en un taller y estudia de noche cuando puede. Tú agarras cada changa de doble que aparece: caídas, vuelcos, una publicidad de neumáticos. Bob va a la escuela y vuelve directo, porque así lo acordaron, y no discute.

Cuando Bob se duerme, tú y Thomas abren el corcho. Nadie explicó lo que pasó en esa calle. Así que lo van a descubrir ustedes.`)),
  choices:()=>[
    {once:'mural',label:L('Estudar o mural de recortes com Thomas','Go over the clippings board with Thomas','Estudiar el corcho de recortes con Thomas'),test:{sk:'Investigação',dt:12},
      ok:()=>({text:P(L(`Thomas separa as notícias por data, você por bairro. Às duas da manhã, os dois veem ao mesmo tempo: não foi só a rua da vó.`,`Thomas sorts the articles by date, you sort them by neighborhood. At two in the morning, you both see it at the same time: it wasn't just Grandma's street.`,`Thomas ordena las noticias por fecha, tú por barrio. A las dos de la mañana, los dos lo ven al mismo tiempo: no fue solo la calle de la abuela.`))+addClue('recortes')+bond('thomas')}),
      fail:()=>({text:P(L(`As letras começam a dançar no papel. Thomas tira o recorte da sua mão. "Vai dormir. Amanhã eu te mostro o que achei." De manhã, ele mostra.`,`The words start swimming on the page. Thomas takes the clipping from your hand. "Go to sleep. I'll show you what I found tomorrow." In the morning, he does.`,`Las letras empiezan a bailar en el papel. Thomas te saca el recorte de la mano. "Anda a dormir. Mañana te muestro lo que encontré." A la mañana, te lo muestra.`))+addClue('recortes')})},
    {once:'bico',label:L('Aceitar um bico perigoso para pagar o aluguel','Take a dangerous gig to pay the rent','Aceptar una changa peligrosa para pagar el alquiler'),test:{sk:'Acrobacia',dt:14},
      ok:()=>({text:P(L(`Uma queda de três andares numa caçamba de papelão. O coordenador não conhece você, mas conhecia o seu pai. Depois da cena, ele paga em dinheiro e diz: "Maxwel caía igualzinho." Você não responde. Guarda o dinheiro e vai embora antes que ele veja o seu rosto.`,`A three-story fall into a dumpster full of cardboard. The coordinator doesn't know you, but he knew your father. After the take, he pays in cash and says, "Maxwel fell just like that." You don't answer. You pocket the money and leave before he can see your face.`,`Una caída de tres pisos a un contenedor lleno de cartón. El coordinador no te conoce, pero conocía a tu padre. Después de la toma, te paga en efectivo y dice: "Maxwel caía igualito." No respondes. Guardas la plata y te vas antes de que te vea la cara.`))+bond('maxwel')+calm(1)}),
      fail:()=>({text:P(L(`Você cai meio metro fora da caçamba. O ombro estala. Você termina a diária mesmo assim, porque o aluguel vence sexta.`,`You land half a meter outside the dumpster. Your shoulder pops. You finish the day anyway, because rent is due Friday.`,`Caes medio metro fuera del contenedor. El hombro cruje. Terminas la jornada igual, porque el alquiler vence el viernes.`))+losePv('1d6',L('a queda','the fall','la caída'))})},
    {once:'bob',label:L('Ajudar Bob com a lição de casa','Help Bob with his homework','Ayudar a Bob con la tarea'),
      run:()=>({text:P(L(`É uma redação: "Minha família". Bob escreveu três linhas e parou. Você senta do lado dele. Ele escreve sobre a mangueira, sobre a vó gritando da calçada, sobre o pai que pegava fogo nos filmes. No final, escreve: "Agora são meus irmãos." Não apaga.`,`It's an essay: "My family". Bob wrote three lines and stopped. You sit next to him. He writes about the mango tree, about Grandma shouting from the sidewalk, about the dad who caught fire in movies. At the end he writes: "Now it's my brothers." He doesn't erase it.`,`Es una redacción: "Mi familia". Bob escribió tres líneas y se detuvo. Te sientas a su lado. Escribe sobre el mango, sobre la abuela gritando desde la vereda, sobre el papá que se prendía fuego en las películas. Al final escribe: "Ahora son mis hermanos." No lo borra.`))+bond('bob')+calm(1)})},
    {label:L('Voltar à rua da vó, de noite','Go back to Grandma\'s street at night','Volver a la calle de la abuela, de noche'),main:true,run:()=>({go:'c2b_rua'})}
  ]},

c2b_rua:{act:K,title:L('A rua interditada','The sealed street','La calle clausurada'),
  text:()=>P(L(`A fita da polícia ainda está lá, desbotada pelo sol. As casas estão vazias, com as janelas cobertas de tábua. Uma viatura passa devagar a cada vinte minutos. Thomas ficou na pensão com o Bob; se você não voltar até as três, ele vem atrás.

O portão da vó está do mesmo jeito. Quase.`,
`The police tape is still there, faded by the sun. The houses are empty, their windows boarded up. A patrol car rolls by slowly every twenty minutes. Thomas stayed at the boarding house with Bob; if you're not back by three, he's coming after you.

Grandma's gate is just the same. Almost.`,
`La cinta policial sigue ahí, desteñida por el sol. Las casas están vacías, con las ventanas tapiadas. Un patrullero pasa despacio cada veinte minutos. Thomas se quedó en la pensión con Bob; si no vuelves antes de las tres, viene a buscarte.

El portón de la abuela está igual. Casi.`)),
  choices:()=>[
    {once:'portao2',label:L('Examinar o portão','Examine the gate','Examinar el portón'),test:{sk:'Percepção',dt:12},
      ok:()=>({text:P(L(`Você passa o dedo no ferro. Branco, grudento. Alguém pintou por cima do símbolo, e faz pouco tempo.`,`You run a finger over the iron. White, sticky. Someone painted over the symbol, and not long ago.`,`Pasas el dedo por el hierro. Blanco, pegajoso. Alguien pintó encima del símbolo, y hace poco.`))+addClue('tinta')}),
      fail:()=>({text:P(L(`Está escuro demais. Você só nota que o portão está mais limpo do que deveria.`,`It's too dark. You only notice that the gate is cleaner than it should be.`,`Está demasiado oscuro. Solo notas que el portón está más limpio de lo que debería.`))})},
    {label:L('Pular o muro, como no primeiro dia','Climb over the wall, like on the first day','Saltar el muro, como el primer día'),main:true,test:{sk:'Acrobacia',dt:11},
      ok:()=>({text:P(L(`Mangueira, muro, quintal. O corpo lembra do caminho antes de você.`,`Mango tree, wall, backyard. Your body remembers the way before you do.`,`Mango, muro, patio. El cuerpo recuerda el camino antes que tú.`)),go:'c2c_casa'}),
      fail:()=>({text:P(L(`Você escorrega no musgo e cai no quintal de lado. Fica parado, ouvindo. A viatura não para.`,`You slip on the moss and land sideways in the backyard. You stay still, listening. The patrol car doesn't stop.`,`Resbalas en el musgo y caes de costado en el patio. Te quedas quieto, escuchando. El patrullero no se detiene.`))+losePv('1d3',L('o muro','the wall','el muro')),go:'c2c_casa'})}
  ]},

c2c_casa:{act:K,title:L('A casa da vó','Grandma\'s house','La casa de la abuela'),checkpoint:true,
  text:()=>P(L(`A porta da cozinha está só encostada. Lá dentro, tudo está onde ficou: a mesa posta, a toalha de aniversário, o bolo que virou pó. Alguém limpou o chão. Mal.

Na sala, alguma coisa se mexe debaixo do sofá. E, do andar de cima, você ouve o barulho de uma escova raspando parede.`,
`The kitchen door is just pushed shut. Inside, everything is where it was left: the set table, the birthday tablecloth, the cake turned to dust. Someone cleaned the floor. Badly.

In the living room, something moves under the couch. And from upstairs, you hear a brush scraping a wall.`,
`La puerta de la cocina está apenas entornada. Adentro, todo está donde quedó: la mesa puesta, el mantel de cumpleaños, la torta hecha polvo. Alguien limpió el piso. Mal.

En la sala, algo se mueve debajo del sillón. Y desde arriba, oyes un cepillo raspando una pared.`))+loseSan('1d2',L('a casa','the house','la casa')),
  choices:()=>[
    {once:'coagulo',label:L('Ver o que está debaixo do sofá','See what\'s under the couch','Ver qué hay debajo del sillón'),
      run:()=>({text:P(L(`Você empurra o sofá com o pé. A coisa se desenrola.`,`You shove the couch with your foot. The thing uncurls.`,`Empujas el sillón con el pie. La cosa se desenrolla.`)),combat:{id:'rastejante',after:'c2c_casa',winText:L('O coágulo se desfaz numa poça que para de se mexer. Lá em cima, a escova também parou.','The clot comes apart into a puddle that stops moving. Upstairs, the brush has stopped too.','El coágulo se deshace en un charco que deja de moverse. Arriba, el cepillo también se detuvo.')}})},
    {once:'foto',label:L('Pegar o porta-retrato da estante','Take the picture frame from the shelf','Agarrar el portarretratos de la repisa'),test:{sk:'Vontade',dt:12},
      ok:()=>({text:P(L(`A foto de Natal: os cinco Zart, a vó e o vô, todo mundo de gorro. Você tira do vidro, dobra com cuidado e guarda no bolso de dentro da jaqueta. Vai ficar ali por anos.`,`The Christmas photo: the five Zarts, Grandma and Grandpa, everyone in Santa hats. You take it out of the frame, fold it carefully and tuck it into your jacket's inside pocket. It will stay there for years.`,`La foto de Navidad: los cinco Zart, la abuela y el abuelo, todos con gorro. La sacas del marco, la doblas con cuidado y la guardas en el bolsillo interior de la chaqueta. Va a quedarse ahí por años.`))+calm(2)+bond('adriana')}),
      fail:()=>({text:P(L(`Você olha para o rosto da sua mãe e as pernas falham. Senta no chão da sala por muito tempo, com o porta-retrato no colo, até lembrar onde está.`,`You look at your mother's face and your legs give out. You sit on the living room floor for a long time, the frame in your lap, until you remember where you are.`,`Miras la cara de tu madre y las piernas te fallan. Te sientas en el piso de la sala mucho tiempo, con el portarretratos en el regazo, hasta que recuerdas dónde estás.`))+loseSan('1d3',L('a foto','the photo','la foto'))})},
    {label:L('Subir a escada, atrás do barulho','Go up the stairs, toward the noise','Subir la escalera, hacia el ruido'),main:true,
      run:()=>({text:P(L(`No corredor de cima, um homem de capa de chuva esfrega a parede com uma escova e um balde de tinta. Ele está apagando alguma coisa. Quando te vê, larga tudo e corre para a janela do seu quarto, a que dá para o telhado da garagem.`,`In the upstairs hallway, a man in a raincoat is scrubbing the wall with a brush and a bucket of paint. He's erasing something. When he sees you, he drops everything and runs for your bedroom window, the one that opens onto the garage roof.`,`En el pasillo de arriba, un hombre con impermeable frota la pared con un cepillo y un balde de pintura. Está borrando algo. Cuando te ve, suelta todo y corre hacia la ventana de tu cuarto, la que da al techo del garaje.`)),go:'c2c_fuga'})}
  ]},

c2c_fuga:{act:K,title:L('Pelos telhados','Over the rooftops','Por los techos'),
  text:()=>P(L(`Ele pula para o telhado da garagem, depois para o muro do vizinho, depois para o telhado seguinte. Ele sabe o caminho.

Você também. Você fez essa fuga com o Bob no colo.`,
`He jumps onto the garage roof, then the neighbor's wall, then the next roof. He knows the way.

So do you. You made this escape with Bob in your arms.`,
`Salta al techo del garaje, después al muro del vecino, después al techo siguiente. Conoce el camino.

Tú también. Hiciste esta huida con Bob en brazos.`)),
  choices:()=>[
    {label:L('Ir atrás dele pelos telhados','Chase him across the rooftops','Perseguirlo por los techos'),main:true,test:{sk:'Acrobacia',dt:15},
      ok:()=>{S.flags.pegou=true;return {text:P(L(`Telha, calha, muro, telha. No quarto telhado você cai em cima dele e os dois rolam até a beira. Você segura o braço dele. Na manga arregaçada, o mesmo círculo riscado, tatuado no pulso. Ele te acerta com o cotovelo, se solta e pula para a rua de trás. Na sua mão ficou o que caiu do bolso dele: um cartão.`,`Tile, gutter, wall, tile. On the fourth roof you land on top of him and you both roll to the edge. You grab his arm. On his pushed-up sleeve, the same scratched circle, tattooed on his wrist. He elbows you, breaks free and jumps into the street behind. In your hand is what fell out of his pocket: a card.`,`Teja, canaleta, muro, teja. En el cuarto techo caes encima de él y los dos ruedan hasta el borde. Le agarras el brazo. En la manga arremangada, el mismo círculo rayado, tatuado en la muñeca. Te da un codazo, se suelta y salta a la calle de atrás. En tu mano quedó lo que se le cayó del bolsillo: una tarjeta.`))+addClue('cartao')+bond('maxwel'),go:'c2d_galpao'}},
      fail:()=>({text:P(L(`No terceiro telhado uma telha solta vira debaixo do seu pé. Você desliza, se agarra na calha e fica pendurado vendo ele sumir. Quando consegue subir, só acha o que ele deixou cair no pulo: um cartão.`,`On the third roof a loose tile flips under your foot. You slide, grab the gutter and hang there watching him disappear. When you finally climb back up, all you find is what he dropped when he jumped: a card.`,`En el tercer techo una teja suelta se da vuelta bajo tu pie. Resbalas, te agarras de la canaleta y quedas colgado viéndolo desaparecer. Cuando logras subir, solo encuentras lo que se le cayó al saltar: una tarjeta.`))+losePv('1d6',L('a queda','the fall','la caída'))+addClue('cartao'),go:'c2d_galpao'})}
  ]},

c2d_galpao:{act:K,title:L('Galpão 9','Warehouse 9','Galpón 9'),checkpoint:true,
  text:()=>P(L(`Sexta-feira. Thomas deixou o Bob dormindo na casa da dona da pensão, com a desculpa de um turno extra, e trouxe um pé de cabra da oficina. "Não vou deixar você ir sozinho", ele disse, e não houve discussão.

O cais à noite cheira a ferrugem e a óleo. O Galpão 9 fica a duas quadras do galpão onde você rolou aquela escada, um ano e meio atrás. Tem luz lá dentro, uma luz vermelha. E alguém de guarda na porta lateral, com uma faca.`,
`Friday. Thomas left Bob asleep at the landlady's, with the excuse of an extra shift, and brought a crowbar from the garage. "I'm not letting you go alone," he said, and there was no argument.

The docks at night smell of rust and oil. Warehouse 9 is two blocks from the warehouse where you rolled down those stairs, a year and a half ago. There's light inside, red light. And someone guarding the side door, with a knife.`,
`Viernes. Thomas dejó a Bob dormido en lo de la dueña de la pensión, con la excusa de un turno extra, y trajo una palanca del taller. "No te voy a dejar ir solo", dijo, y no hubo discusión.

El muelle de noche huele a óxido y aceite. El Galpón 9 queda a dos cuadras del galpón donde rodaste por aquella escalera, hace un año y medio. Hay luz adentro, una luz roja. Y alguien vigilando la puerta lateral, con un cuchillo.`)),
  choices:()=>[
    {label:L('Chegar por trás dele, sem barulho','Sneak up behind him','Acercarte por detrás, sin ruido'),main:true,test:{sk:'Furtividade',dt:14},
      ok:()=>({text:P(L(`Você contorna os contêineres pela sombra. Ele só percebe quando você já está em cima dele.`,`You circle the containers through the shadows. He only notices when you're already on him.`,`Rodeas los contenedores por la sombra. Solo se da cuenta cuando ya estás encima.`)),combat:{id:'cultista',after:'c2e_ritual',allies:['thomas2'],surprise:true,winText:L('O cultista cai contra a porta de metal e não levanta. Lá dentro, ninguém ouviu. Ainda.','The cultist slumps against the metal door and stays down. Inside, nobody heard. Yet.','El cultista cae contra la puerta de metal y no se levanta. Adentro, nadie oyó. Todavía.')}}),
      fail:()=>({text:P(L(`Uma lata rola debaixo do seu pé. Ele se vira com a faca já levantada.`,`A can rolls under your foot. He turns with the knife already raised.`,`Una lata rueda bajo tu pie. Se da vuelta con el cuchillo ya en alto.`)),combat:{id:'cultista',after:'c2e_ritual',allies:['thomas2'],enemyFirst:true,winText:L('O cultista cai contra a porta de metal e não levanta.','The cultist slumps against the metal door and stays down.','El cultista cae contra la puerta de metal y no se levanta.')}})},
    {label:L('Ir direto para cima dele','Go straight at him','Ir directo hacia él'),
      run:()=>({text:P(L(`Você não espera. Nunca espera.`,`You don't wait. You never wait.`,`No esperas. Nunca esperas.`)),combat:{id:'cultista',after:'c2e_ritual',allies:['thomas2'],winText:L('O cultista cai contra a porta de metal e não levanta.','The cultist slumps against the metal door and stays down.','El cultista cae contra la puerta de metal y no se levanta.')}})}
  ]},

c2e_ritual:{act:K,title:L('Os tambores','The drums','Los tambores'),
  text:()=>P(L(`Lá dentro, doze tambores de metal em círculo, pintados com o mesmo símbolo. Cheios até a boca de sangue escuro. Três pessoas de capa ajoelhadas no meio, cantando alguma coisa que não é língua nenhuma.

Thomas lê a etiqueta num dos tambores e fica branco. É o nome da sua rua.

O sangue dentro dos tambores começa a subir. A se juntar. A levantar.`,
`Inside, twelve metal drums in a circle, painted with the same symbol. Filled to the brim with dark blood. Three people in cloaks kneeling in the middle, chanting something that isn't any language.

Thomas reads the label on one of the drums and goes pale. It's the name of your street.

The blood in the drums starts to rise. To gather. To stand up.`,
`Adentro, doce tambores de metal en círculo, pintados con el mismo símbolo. Llenos hasta el borde de sangre oscura. Tres personas con capa arrodilladas en el medio, cantando algo que no es ningún idioma.

Thomas lee la etiqueta de uno de los tambores y se pone pálido. Es el nombre de tu calle.

La sangre de los tambores empieza a subir. A juntarse. A levantarse.`))+loseSan('1d3',L('os tambores','the drums','los tambores')),
  choices:()=>[
    {label:L('Ficar na frente do Thomas','Stand in front of Thomas','Ponerte delante de Thomas'),main:true,
      run:()=>({text:P(L(`Os cultistas fogem pelos fundos, rindo. O que sobrou dos tambores vem na sua direção.`,`The cultists flee out the back, laughing. What's left of the drums comes at you.`,`Los cultistas huyen por atrás, riendo. Lo que quedó de los tambores viene hacia ti.`)),combat:{id:'cria',after:'c2f_vt',allies:['thomas2'],script:'vt'}})}
  ]},

c2f_vt:{act:K,title:'VT',
  text:()=>P(L(`O homem desce da passarela de metal pela escada, sem pressa. Loiro, de bermuda e chinelo, um fuzil M4 no ombro como quem carrega uma vara de pescar. Ele chuta um dos tambores vazios, olha para você, olha para o Thomas, olha para o pé de cabra.

"Vocês são os garotos da rua do aniversário", ele diz. Não é uma pergunta. "Faz seis meses que eu estou atrás desse pessoal. Vocês acharam eles em uma semana, com um pé de cabra." Ele ri. "Eu sou o VT."`,
`The man comes down the stairs from the metal catwalk, in no hurry. Blond, in shorts and flip-flops, an M4 rifle on his shoulder like someone carrying a fishing rod. He kicks one of the empty drums, looks at you, looks at Thomas, looks at the crowbar.

"You're the kids from the birthday street," he says. It isn't a question. "I've been after these people for six months. You found them in a week, with a crowbar." He laughs. "I'm VT."`,
`El hombre baja de la pasarela de metal por la escalera, sin apuro. Rubio, de bermudas y ojotas, un fusil M4 al hombro como quien lleva una caña de pescar. Patea uno de los tambores vacíos, te mira, mira a Thomas, mira la palanca.

"Ustedes son los chicos de la calle del cumpleaños", dice. No es una pregunta. "Hace seis meses que estoy detrás de esta gente. Ustedes los encontraron en una semana, con una palanca." Se ríe. "Yo soy VT."`)),
  choices:()=>[
    {once:'pergunta',label:L('"O que era aquilo?"','"What was that thing?"','"¿Qué era eso?"'),
      run:()=>({text:P(L(`VT senta num tambor e acende um cigarro. Fala por uma hora. Sobre um lado que não é este. Sobre gente que abre a porta para ele. Sobre o que entra quando a porta abre. Quando termina, Thomas está sentado no chão e você ainda está de pé, com as mãos fechadas.`,`VT sits on a drum and lights a cigarette. He talks for an hour. About a side that isn't this one. About people who open the door to it. About what comes through when the door opens. When he's done, Thomas is sitting on the floor and you're still standing, fists clenched.`,`VT se sienta en un tambor y prende un cigarrillo. Habla una hora. De un lado que no es este. De gente que le abre la puerta. De lo que entra cuando la puerta se abre. Cuando termina, Thomas está sentado en el piso y tú sigues de pie, con los puños cerrados.`))+bond('vt')})},
    {once:'desconfia',label:L('Deixar Thomas fazer as perguntas difíceis','Let Thomas ask the hard questions','Dejar que Thomas haga las preguntas difíciles'),
      run:()=>({text:P(L(`"Por que você ajudaria a gente?", pergunta Thomas. VT dá de ombros. "Porque vocês vão continuar procurando de qualquer jeito. E eu prefiro que vocês saibam o que estão fazendo quando acharem." Thomas não confia nele. Mas não diz não.`,`"Why would you help us?" Thomas asks. VT shrugs. "Because you're going to keep looking either way. And I'd rather you knew what you were doing when you find it." Thomas doesn't trust him. But he doesn't say no.`,`"¿Por qué nos ayudarías?", pregunta Thomas. VT se encoge de hombros. "Porque van a seguir buscando de todas formas. Y prefiero que sepan lo que hacen cuando lo encuentren." Thomas no confía en él. Pero no dice que no.`))+bond('thomas')})},
    {label:L('"Me ensina."','"Teach me."','"Enséñame."'),main:true,
      run:()=>({text:P(L(`VT olha para você por um tempo. Depois sorri. "Tem um irmão menor, né? Traz ele também. Lá em casa tem quarto."`,`VT looks at you for a while. Then he smiles. "You've got a little brother, right? Bring him too. There's room at my place."`,`VT te mira un rato. Después sonríe. "Tienes un hermano menor, ¿no? Tráelo también. En casa hay lugar."`))+bond('vt'),go:'c2g_hangar'})}
  ]},

c2g_hangar:{act:KV,title:L('O hangar','The hangar','El hangar'),checkpoint:true,
  text:()=>P(L(`"Lá em casa" é um hangar desativado na beira de um aeroporto de terra. Um elevador de carga desce para um porão cheio de caixas de munição, beliches e uma cozinha que só tem café e pão de queijo congelado. Bob ganha um quarto com tranca e uma TV velha. Nas primeiras noites, dorme com a porta aberta.

VT acorda vocês às cinco. Todo dia. Por meses.

Você aprende que existe um Outro Lado. Aprende o que o Sangue quer. Aprende a cair de um jeito diferente de como seu pai ensinou: não para a câmera, para levantar e continuar lutando.`,
`"My place" is a decommissioned hangar at the edge of a dirt airstrip. A freight elevator goes down to a basement full of ammo crates, bunk beds and a kitchen with nothing but coffee and frozen cheese bread. Bob gets a room with a lock and an old TV. The first few nights, he sleeps with the door open.

VT wakes you at five. Every day. For months.

You learn that there is an Other Side. You learn what Blood wants. You learn to fall differently from how your father taught you: not for the camera, but to get back up and keep fighting.`,
`"En casa" es un hangar abandonado al borde de una pista de tierra. Un montacargas baja a un sótano lleno de cajas de munición, cuchetas y una cocina que solo tiene café y pan de queso congelado. Bob recibe un cuarto con cerrojo y una tele vieja. Las primeras noches, duerme con la puerta abierta.

VT los despierta a las cinco. Todos los días. Durante meses.

Aprendes que existe un Otro Lado. Aprendes lo que quiere la Sangre. Aprendes a caer de una forma distinta a la que te enseñó tu padre: no para la cámara, sino para levantarte y seguir peleando.`)),
  choices:()=>[
    {once:'quadro',label:L('A aula do quadro sujo','The dirty-board lesson','La clase de la pizarra sucia'),
      run:()=>({text:P(L(`Thomas enche um caderno inteiro. Você presta atenção numa coisa só: como se mata o que é Sangue.`,`Thomas fills an entire notebook. You pay attention to one thing only: how you kill what is Blood.`,`Thomas llena un cuaderno entero. Tú prestas atención a una sola cosa: cómo se mata lo que es Sangre.`))+addClue('elementos')})},
    {once:'luta',label:L('Treinar luta com VT','Spar with VT','Entrenar pelea con VT'),test:{sk:'Luta',dt:15},
      ok:()=>({text:P(L(`Na sexta semana, você derruba ele pela primeira vez. VT fica no chão rindo, com a mão no queixo. "Seu pai te ensinou a cair. Quem te ensinou a bater assim?" "Ninguém", você diz. "Pois agora sou eu."`,`In the sixth week, you knock him down for the first time. VT lies on the floor laughing, hand on his jaw. "Your dad taught you how to fall. Who taught you to hit like that?" "Nobody," you say. "Well, now it's me."`,`En la sexta semana, lo tiras al piso por primera vez. VT se queda en el suelo riendo, con la mano en la mandíbula. "Tu papá te enseñó a caer. ¿Quién te enseñó a pegar así?" "Nadie", dices. "Bueno, ahora soy yo."`))+bond('vt')}),
      fail:()=>({text:P(L(`Você vai para o chão quarenta vezes numa manhã. Na quadragésima primeira, levanta de novo. VT para. "Tá bom. Isso aí não dá para ensinar."`,`You hit the floor forty times in one morning. On the forty-first, you get up again. VT stops. "All right. That part can't be taught."`,`Vas al piso cuarenta veces en una mañana. En la cuadragésima primera, te levantas otra vez. VT se detiene. "Está bien. Eso no se enseña."`))+losePv('1d6',L('o treino','training','el entrenamiento'))+bond('vt')})},
    {once:'tiro',label:L('Aprender a atirar com o M4','Learn to shoot the M4','Aprender a disparar el M4'),test:{sk:'Pontaria',dt:13},
      ok:()=>({text:P(L(`Três latas, três tiros. VT assobia. "Leva jeito. Mas você não gosta, né?" Não gosta. Arma de fogo te deixa longe demais de quem você está protegendo.`,`Three cans, three shots. VT whistles. "You've got a knack. But you don't like it, huh?" You don't. A gun keeps you too far from the people you're protecting.`,`Tres latas, tres tiros. VT silba. "Tienes mano. Pero no te gusta, ¿eh?" No te gusta. Un arma de fuego te deja demasiado lejos de quien estás protegiendo.`))}),
      fail:()=>({text:P(L(`O coice te acerta o ombro ruim. VT pega o fuzil de volta. "Você é de perto, garoto. Eu vi no galpão."`,`The recoil slams your bad shoulder. VT takes the rifle back. "You're a close-range guy, kid. I saw it at the warehouse."`,`El retroceso te golpea el hombro malo. VT te saca el fusil. "Tú eres de cerca, chico. Lo vi en el galpón."`))})},
    {once:'bob3',label:L('Bob quer treinar também','Bob wants to train too','Bob también quiere entrenar'),
      run:()=>({text:P(L(`Ele tem catorze anos e aparece no tatame de tênis e punho fechado. Você olha para o VT. VT olha para você. "Ainda não", você diz. Bob vai embora batendo a porta. À noite, você ensina ele a cair no colchão, como antes. Só isso. Por enquanto.`,`He's fourteen and shows up on the mat in sneakers with his fists up. You look at VT. VT looks at you. "Not yet," you say. Bob storms off slamming the door. That night, you teach him to fall on the mattress, like before. Just that. For now.`,`Tiene catorce años y aparece en el tatami con zapatillas y los puños cerrados. Miras a VT. VT te mira. "Todavía no", dices. Bob se va dando un portazo. A la noche, le enseñas a caer en el colchón, como antes. Solo eso. Por ahora.`))+bond('bob')})},
    {label:L('A prova de VT','VT\'s test','La prueba de VT'),main:true,run:()=>({go:'c2g_armas'})}
  ]},

c2g_armas:{act:KV,title:L('O arsenal','The armory','El arsenal'),
  text:()=>P(L(`Na véspera da prova, VT chama os três irmãos ao fundo do porão e abre um armário de metal trancado com dois cadeados. "Ninguém sai daqui para lutar de mão vazia."

Para Thomas, um fuzil de assalto, desmontado em peças sobre um pano. "Você pensa antes de agir. Então vai ficar atrás, vendo tudo, e cobrindo esse aí." Thomas monta a arma em quatro minutos, sem olhar o manual.

Para Bob, um par de correntes grossas, com elos gravados com símbolos que brilham fraco quando ele encosta. Energia. Você olha para o VT. VT não desvia o olhar. "Não é para ele usar agora. É para o dia em que você não estiver lá."

Para você, uma caixa comprida de madeira.`,
`The night before the test, VT calls the three brothers to the back of the basement and opens a metal locker secured with two padlocks. "Nobody leaves here to fight empty-handed."

For Thomas, an assault rifle, stripped into parts on a cloth. "You think before you act. So you'll stay back, seeing everything, and covering this one." Thomas puts the gun together in four minutes without looking at the manual.

For Bob, a pair of heavy chains, their links engraved with symbols that glow faintly when he touches them. Energy. You look at VT. VT doesn't look away. "It's not for him to use now. It's for the day you're not there."

For you, a long wooden box.`,
`La víspera de la prueba, VT llama a los tres hermanos al fondo del sótano y abre un armario de metal cerrado con dos candados. "Nadie sale de acá a pelear con las manos vacías."

Para Thomas, un fusil de asalto, desarmado en piezas sobre un paño. "Tú piensas antes de actuar. Así que vas a quedarte atrás, viéndolo todo, y cubriendo a este." Thomas arma el fusil en cuatro minutos, sin mirar el manual.

Para Bob, un par de cadenas gruesas, con eslabones grabados con símbolos que brillan débilmente cuando las toca. Energía. Miras a VT. VT no aparta la mirada. "No es para que las use ahora. Es para el día en que tú no estés."

Para ti, una caja larga de madera.`)),
  choices:()=>[
    {label:L('Abrir a caixa','Open the box','Abrir la caja'),main:true,
      run:()=>{S.flags.armas=true;return {text:P(L(`Uma katana. A lâmina tem um raio cravado de ponta a ponta, e a base puxa para um vermelho escuro, como sangue seco. "Raijin", diz VT. "O deus do trovão. Veio do Japão há mais tempo do que qualquer um de nós vai viver. Ela não é leve. Ela é rápida. É diferente." Você fecha a mão no cabo. Encaixa como as luvas do seu pai.`,`A katana. A lightning bolt is engraved along the whole blade, and the base shades into a dark red, like dried blood. "Raijin," says VT. "The thunder god. It came from Japan longer ago than any of us will live. It isn't light. It's fast. That's different." You close your hand around the grip. It fits like your father's gloves.`,`Una katana. La hoja tiene un rayo grabado de punta a punta, y la base tira a un rojo oscuro, como sangre seca. "Raijin", dice VT. "El dios del trueno. Vino de Japón hace más tiempo del que cualquiera de nosotros va a vivir. No es liviana. Es rápida. Es distinto." Cierras la mano en la empuñadura. Encaja como los guantes de tu padre.`))+raijin()+bond('vt')}}},
    {once:'bobcor',label:L('Falar com Bob sobre as correntes','Talk to Bob about the chains','Hablar con Bob sobre las cadenas'),
      run:()=>({text:P(L(`Ele está sentado na beliche, passando os elos de uma mão para a outra, vendo eles acenderem. "Eu não vou usar", ele diz antes de você abrir a boca. "Prometo. Só quero saber que tenho." Você senta do lado dele. Pela primeira vez, entende o VT.`,`He's sitting on the bunk, passing the links from one hand to the other, watching them light up. "I won't use them," he says before you can open your mouth. "Promise. I just want to know I have them." You sit down next to him. For the first time, you understand VT.`,`Está sentado en la cucheta, pasando los eslabones de una mano a la otra, viéndolos encenderse. "No las voy a usar", dice antes de que abras la boca. "Prometo. Solo quiero saber que las tengo." Te sientas a su lado. Por primera vez, entiendes a VT.`))+bond('bob')})},
    {once:'thofuz',label:L('Ver Thomas no estande de tiro','Watch Thomas at the firing range','Ver a Thomas en el polígono'),
      run:()=>({text:P(L(`Rajada curta, rajada curta, rajada curta. Três alvos, três buracos no mesmo lugar. Ele abaixa o fuzil e olha para você. "Alguém nessa família tem que ficar atrás pensando", diz. É o mesmo tom de quando ele falava do emprego que não terminava no hospital.`,`Short burst, short burst, short burst. Three targets, three holes in the same spot. He lowers the rifle and looks at you. "Someone in this family has to stay back and think," he says. It's the same tone he used about the job that didn't end at the hospital.`,`Ráfaga corta, ráfaga corta, ráfaga corta. Tres blancos, tres agujeros en el mismo lugar. Baja el fusil y te mira. "Alguien en esta familia tiene que quedarse atrás pensando", dice. Es el mismo tono de cuando hablaba del trabajo que no terminaba en el hospital.`))+bond('thomas')})}
  ].filter(ch=>ch.main?!S.flags.armas:true).concat(S.flags.armas?[{label:L('Entrar na jaula','Step into the cage','Entrar en la jaula'),main:true,
      run:()=>({text:P(L(`VT abre a jaula no fundo do hangar e dá dois passos para trás. Thomas fica na passarela com o fuzil apontado para o chão, pronto. Bob assiste da escada.`,`VT opens the cage at the back of the hangar and takes two steps back. Thomas stays on the catwalk with the rifle pointed at the floor, ready. Bob watches from the stairs.`,`VT abre la jaula al fondo del hangar y da dos pasos atrás. Thomas se queda en la pasarela con el fusil apuntando al piso, listo. Bob mira desde la escalera.`)),combat:{id:'enjaulado',after:'c2h_fim',winText:L('A criatura cai. VT não aplaude. Só balança a cabeça, uma vez. Igual ao seu pai.','The creature falls. VT doesn\'t applaud. He just nods, once. Just like your father.','La criatura cae. VT no aplaude. Solo asiente, una vez. Igual que tu padre.')}})}]:[])},
c2h_fim:{act:KV,title:L('Dezoito','Eighteen','Dieciocho'),
  text:()=>P(L(`Você faz dezoito anos no porão do hangar. VT compra um bolo de padaria e erra o seu nome na cobertura: "ADAN". Bob ri tanto que engasga. Thomas acende a vela.

Ninguém fala da última vez que teve bolo e vela. Ninguém precisa.

Você sopra. Pela primeira vez em um ano e meio, não fica olhando para a porta.`,
`You turn eighteen in the hangar basement. VT buys a bakery cake and misspells your name in the frosting: "ADAN". Bob laughs so hard he chokes. Thomas lights the candle.

Nobody mentions the last time there was cake and a candle. Nobody has to.

You blow it out. For the first time in a year and a half, you don't keep watching the door.`,
`Cumples dieciocho años en el sótano del hangar. VT compra una torta de panadería y escribe mal tu nombre en el glaseado: "ADAN". Bob se ríe tanto que se atraganta. Thomas prende la vela.

Nadie habla de la última vez que hubo torta y vela. Nadie lo necesita.

Soplas. Por primera vez en un año y medio, no te quedas mirando la puerta.`))+calm(2),
  choices:()=>[{label:L('Encerrar o Capítulo 2','End Chapter 2','Terminar el Capítulo 2'),main:true,run:()=>({levelup:'c2_fim'})}]},

c2_fim:{act:KV,title:L('Fim do Capítulo 2','End of Chapter 2','Fin del Capítulo 2'),
  text:()=>P(L(`Os três Zart têm um teto, um professor e um nome para o que tirou tudo deles. O culto do galpão sumiu da cidade. Mas o homem da tatuagem no pulso continua em algum lugar, e você lembra do rosto dele.

VT diz que vocês ainda não estão prontos. Você acredita nele. Por enquanto.`,
`The three Zarts have a roof, a teacher and a name for what took everything from them. The warehouse cult has vanished from the city. But the man with the wrist tattoo is still out there somewhere, and you remember his face.

VT says you're not ready yet. You believe him. For now.`,
`Los tres Zart tienen un techo, un maestro y un nombre para lo que les quitó todo. El culto del galpón desapareció de la ciudad. Pero el hombre del tatuaje en la muñeca sigue en algún lado, y recuerdas su cara.

VT dice que todavía no están listos. Le crees. Por ahora.`)),
  choices:()=>[{label:L('Ver o relatório','See the report','Ver el informe'),main:true,run:()=>({end:true})}]}
});
// Cap. 1 agora segue para o Cap. 2
SCENES.a1_fim.choices=()=>[{label:L('Começar o Capítulo 2','Begin Chapter 2','Comenzar el Capítulo 2'),main:true,run:()=>({go:'c2a_pensao'})}];
}

function raijin(){if(S.inv.some(i=>i.id==='raijin'))return '';const i=newInst('raijin');S.inv.push(i);S.equip=i.uid;return `<p class="gain">+ ${ITEMS.raijin.name}</p>`}
function buildCap3(){
Object.assign(ENEMIES,{
  ciborgue:{eyes:true,name:L('Ciborgue','Cyborg','Ciborg'),kind:L('Criatura de Energia','Energy Creature','Criatura de Energía'),el:'energia',pv:70,def:17,atk:5,dmg:'1d8+2',res:4,init:3,
    presence:{dt:14,san:'1d4'},
    desc:L('Um aglomerado de partes mecânicas e orgânicas, costuradas por fios que soltam faíscas. Braços que não são braços. Uma serra onde deveria haver uma mão. A Energia corre pela carcaça como sangue, e o ar em volta dele cheira a queimado.','A mass of mechanical and organic parts, stitched together by sparking wires. Arms that aren\'t arms. A saw where a hand should be. Energy runs through the carcass like blood, and the air around it smells burnt.','Un amasijo de partes mecánicas y orgánicas, cosidas con cables que chispean. Brazos que no son brazos. Una sierra donde debería haber una mano. La Energía corre por la carcasa como sangre, y el aire a su alrededor huele a quemado.')}
});
ALLIES.bob={name:'Bob',atk:4,dmg:'1d8+1',verb:L('gira as correntes de Energia','swings the Energy chains','hace girar las cadenas de Energía')};
BOND_NAME.kavyur='Kavyur';
const c=(t,x)=>({t,x});
Object.assign(CLUES,{
  karlovski:c(L('Os documentos Karlovski','The Karlovski files','Los documentos Karlovski'),L('Relatórios assinados por Gustavo Karlovski. Os irmãos dele, Matheus e Marcos, aparecem como assistentes. Um quarto nome, Kavyur, aparece no fim, em letra diferente: "Isso não é ciência. A gente tem que parar." O objetivo está sublinhado três vezes: criar uma criatura.','Reports signed by Gustavo Karlovski. His brothers, Matheus and Marcos, are listed as assistants. A fourth name, Kavyur, appears at the end in different handwriting: "This isn\'t science. We have to stop." The goal is underlined three times: create a creature.','Informes firmados por Gustavo Karlovski. Sus hermanos, Matheus y Marcos, figuran como asistentes. Un cuarto nombre, Kavyur, aparece al final con otra letra: "Esto no es ciencia. Tenemos que parar." El objetivo está subrayado tres veces: crear una criatura.')),
  projeto:c(L('Anotações dos protótipos','Prototype notes','Notas de los prototipos'),L('Uma folha rasgada com os testes dos protótipos. "Teste 3: sobrecarga elétrica, a água derrubou tudo. Teste 5: a carcaça blindada corroeu com ácido. Teste 7: a serra só travou com um golpe muito forte, de uma vez só."','A torn page with the prototype tests. "Test 3: electrical overload, water shut it all down. Test 5: the armored shell corroded with acid. Test 7: the saw only jammed after one very hard blow, all at once."','Una hoja arrancada con las pruebas de los prototipos. "Prueba 3: sobrecarga eléctrica, el agua lo apagó todo. Prueba 5: la carcasa blindada se corroyó con ácido. Prueba 7: la sierra solo se trabó con un golpe muy fuerte, de una sola vez."')),
  endereco:c(L('O endereço da oficina','The workshop address','La dirección del taller'),L('Um recibo de ferro-velho com um endereço escrito atrás: uma oficina mecânica fechada há anos, na saída da cidade. Embaixo, na letra de Gustavo: "Transferir a cápsula hoje."','A scrapyard receipt with an address on the back: a garage closed for years, on the way out of the city. Below it, in Gustavo\'s handwriting: "Move the capsule today."','Un recibo de chatarrería con una dirección atrás: un taller mecánico cerrado hace años, a la salida de la ciudad. Abajo, con la letra de Gustavo: "Trasladar la cápsula hoy."'))
});
const K=L('Ato I · Cap. 3 · Karlovski','Act I · Ch. 3 · Karlovski','Acto I · Cap. 3 · Karlovski');
const KO=L('Ato I · Cap. 3 · A oficina','Act I · Ch. 3 · The workshop','Acto I · Cap. 3 · El taller');
Object.assign(SCENES,{
c3a_missao:{act:K,title:L('A primeira missão','The first mission','La primera misión'),checkpoint:true,
  text:()=>P(L(`Um ano depois, VT joga uma pasta em cima da mesa da cozinha do porão.

"Uma boate abandonada no centro. Tem gente entrando e saindo de madrugada, carregando caixas. Os vizinhos falam de luz roxa e barulho de máquina. Pode ser um grupo de ocultistas fazendo besteira. Pode não ser nada." Ele olha para os três. "Vocês vão descobrir. Sozinhos."

Os três. Thomas, com o fuzil. Você, com a Raijin. E Bob, quinze anos, com as correntes enroladas no braço.`,
`A year later, VT tosses a folder onto the basement kitchen table.

"An abandoned nightclub downtown. People going in and out at dawn, carrying boxes. The neighbors talk about purple light and machine noise. Could be a group of occultists messing around. Could be nothing." He looks at the three of you. "You're going to find out. On your own."

All three. Thomas, with the rifle. You, with Raijin. And Bob, fifteen, with the chains wrapped around his arm.`,
`Un año después, VT tira una carpeta sobre la mesa de la cocina del sótano.

"Un boliche abandonado en el centro. Hay gente que entra y sale de madrugada, cargando cajas. Los vecinos hablan de luz violeta y ruido de máquinas. Puede ser un grupo de ocultistas haciendo tonterías. Puede no ser nada." Los mira a los tres. "Ustedes lo van a averiguar. Solos."

Los tres. Thomas, con el fusil. Tú, con la Raijin. Y Bob, quince años, con las cadenas enrolladas en el brazo.`)),
  choices:()=>[
    {once:'vtbob',label:L('"O Bob não vai."','"Bob isn\'t going."','"Bob no va."'),
      run:()=>({text:P(L(`VT nem levanta os olhos da pasta. "Você tinha dezessete quando tirou os dois daquela casa. Ele tem quinze e treina todo dia há um ano. Ele vai. E você vai estar do lado dele." Bob não diz nada. Mas fica mais reto na cadeira.`,`VT doesn't even look up from the folder. "You were seventeen when you got those two out of that house. He's fifteen and he's trained every day for a year. He's going. And you'll be right beside him." Bob says nothing. But he sits up straighter.`,`VT ni levanta la vista de la carpeta. "Tenías diecisiete cuando sacaste a esos dos de esa casa. Él tiene quince y entrena todos los días hace un año. Va. Y tú vas a estar a su lado." Bob no dice nada. Pero se sienta más derecho.`))+bond('vt')})},
    {once:'bobpromessa',label:L('Conversar com Bob antes de sair','Talk to Bob before you leave','Hablar con Bob antes de salir'),
      run:()=>({text:P(L(`"Regra de ouro", você diz, ajustando a correia do colete dele como seu pai fazia com você. "Ninguém se machuca na minha missão. Nem você, nem o cara do seu lado." Bob revira os olhos. Depois repete, baixinho, palavra por palavra.`,`"Golden rule," you say, adjusting his vest strap the way your father used to do with you. "Nobody gets hurt on my mission. Not you, not the guy next to you." Bob rolls his eyes. Then he repeats it quietly, word for word.`,`"Regla de oro", dices, ajustándole la correa del chaleco como tu padre hacía contigo. "Nadie se lastima en mi misión. Ni tú, ni el que está a tu lado." Bob pone los ojos en blanco. Después lo repite en voz baja, palabra por palabra.`))+bond('bob')+bond('maxwel')})},
    {once:'plano',label:L('Revisar o plano com Thomas','Go over the plan with Thomas','Repasar el plan con Thomas'),test:{sk:'Percepção',dt:12},
      ok:()=>({text:P(L(`Thomas abriu a planta da boate em cima do capô do carro. Entrada pelos fundos, pista de dança, escritório no mezanino, porão. "Eu fico onde enxergo tudo. Vocês dois nunca ficam longe um do outro." Você vê uma coisa que ele não viu: uma segunda escada no porão, para a rua de trás. Ele anota.`,`Thomas has spread the club's floor plan on the car hood. Back entrance, dance floor, manager's office on the mezzanine, basement. "I stay where I can see everything. You two never get far from each other." You spot something he missed: a second staircase in the basement, to the back street. He writes it down.`,`Thomas desplegó el plano del boliche sobre el capó del auto. Entrada por atrás, pista de baile, oficina en el entrepiso, sótano. "Yo me quedo donde veo todo. Ustedes dos nunca se alejan uno del otro." Tú ves algo que él no vio: una segunda escalera en el sótano, hacia la calle de atrás. Lo anota.`))+bond('thomas')}),
      fail:()=>({text:P(L(`Thomas explica o plano duas vezes. Você concorda com a cabeça nas duas, pensando no Bob.`,`Thomas explains the plan twice. You nod both times, thinking about Bob.`,`Thomas explica el plan dos veces. Asientes las dos veces, pensando en Bob.`))})},
    {label:L('Ir para a boate','Head to the nightclub','Ir al boliche'),main:true,run:()=>({go:'c3b_boate'})}
  ]},

c3b_boate:{act:K,title:L('A boate','The nightclub','El boliche'),
  text:()=>P(L(`O letreiro de neon está apagado há anos. Lá dentro, a pista de dança está coberta de caixas vazias de equipamento eletrônico, cabos arrancados das paredes e círculos riscados a giz no chão. Tem uma mancha escura no meio do maior deles.

Não tem ninguém. Mas do porão vem um barulho de alguma coisa arranhando uma porta de metal.`,
`The neon sign has been dark for years. Inside, the dance floor is covered in empty electronics boxes, cables ripped out of the walls and circles scratched in chalk on the floor. There's a dark stain in the middle of the biggest one.

Nobody's here. But from the basement comes the sound of something scratching at a metal door.`,
`El cartel de neón está apagado hace años. Adentro, la pista de baile está cubierta de cajas vacías de equipos electrónicos, cables arrancados de las paredes y círculos trazados con tiza en el piso. Hay una mancha oscura en el medio del más grande.

No hay nadie. Pero desde el sótano llega el ruido de algo arañando una puerta de metal.`)),
  choices:()=>[
    {once:'escritorio',label:L('Revirar o escritório do mezanino','Search the mezzanine office','Revisar la oficina del entrepiso'),test:{sk:'Investigação',dt:12},
      ok:()=>({text:P(L(`Numa gaveta trancada com fita, uma pasta de relatórios. Você lê em voz alta para os outros dois. Quando chega no último parágrafo, na letra diferente, Bob pergunta: "Então um deles não queria?"`,`In a drawer taped shut, a folder of reports. You read it aloud to the other two. When you reach the last paragraph, the one in different handwriting, Bob asks: "So one of them didn't want to?"`,`En un cajón cerrado con cinta, una carpeta de informes. La lees en voz alta para los otros dos. Cuando llegas al último párrafo, el de otra letra, Bob pregunta: "¿Entonces uno de ellos no quería?"`))+addClue('karlovski')}),
      fail:()=>({text:P(L(`Você revira papel por papel e não acha nada. Thomas sobe, abre a gaveta de baixo com a coronha e tira uma pasta inteira. "Às vezes é só olhar embaixo."`,`You go through every sheet and find nothing. Thomas comes up, pries open the bottom drawer with the rifle butt and pulls out a whole folder. "Sometimes you just look underneath."`,`Revisas hoja por hoja y no encuentras nada. Thomas sube, abre el cajón de abajo con la culata y saca una carpeta entera. "A veces solo hay que mirar abajo."`))+addClue('karlovski')+bond('thomas')})},
    {once:'banheiro',label:L('Checar o banheiro dos fundos','Check the back bathroom','Revisar el baño del fondo'),test:{sk:'Percepção',dt:13},
      ok:()=>({text:P(L(`No lixo do banheiro, uma folha amassada e manchada de óleo, com desenhos de uma máquina que parece um homem. E anotações sobre como os protótipos quebravam.`,`In the bathroom trash, a crumpled, oil-stained page with drawings of a machine shaped like a man. And notes on how the prototypes broke down.`,`En la basura del baño, una hoja arrugada y manchada de aceite, con dibujos de una máquina con forma de hombre. Y notas sobre cómo se rompían los prototipos.`))+addClue('projeto')}),
      fail:()=>({text:P(L(`Só azulejo quebrado e cheiro de mofo.`,`Just broken tiles and the smell of mildew.`,`Solo azulejos rotos y olor a humedad.`))})},
    {label:L('Descer para o porão','Go down to the basement','Bajar al sótano'),main:true,
      run:()=>({text:P(L(`A porta de metal cede antes de você encostar nela. Eles estavam esperando.`,`The metal door gives way before you touch it. They were waiting.`,`La puerta de metal cede antes de que la toques. Estaban esperando.`)),combat:{id:'zumbi',after:'c3c_endereco',allies:['thomas3','bob'],winText:L('O último zumbi cai de joelhos no pé da escada. Bob está parado, com as correntes ainda acesas, respirando rápido.','The last zombie drops to its knees at the foot of the stairs. Bob stands frozen, chains still glowing, breathing fast.','El último zombi cae de rodillas al pie de la escalera. Bob está quieto, con las cadenas todavía encendidas, respirando rápido.')}})}
  ]},

c3c_endereco:{act:K,title:L('Ninguém','Nobody','Nadie'),
  text:()=>P(L(`O porão está vazio. Macas, correntes presas na parede, uma geladeira industrial desligada. Seja quem for que estava aqui, saiu com pressa e levou alguma coisa grande: tem marcas de rodas no chão até a escada dos fundos.

Pregado na porta da geladeira, um recibo de ferro-velho.`,
`The basement is empty. Gurneys, chains fixed to the wall, an industrial fridge switched off. Whoever was here left in a hurry and took something big: there are wheel marks on the floor all the way to the back stairs.

Pinned to the fridge door, a scrapyard receipt.`,
`El sótano está vacío. Camillas, cadenas fijadas a la pared, una heladera industrial apagada. Quien sea que estaba acá se fue apurado y se llevó algo grande: hay marcas de ruedas en el piso hasta la escalera de atrás.

Clavado en la puerta de la heladera, un recibo de chatarrería.`))+addClue('endereco'),
  choices:()=>[
    {once:'bobok',label:L('Ver se o Bob está bem','Check that Bob is okay','Ver si Bob está bien'),
      run:()=>({text:P(L(`As mãos dele tremem. "Eu acertei um", ele diz. "Eu acertei de verdade." Você não sabe se ele está orgulhoso ou apavorado. Ele também não. Você coloca a mão na nuca dele, como sua mãe fazia, até a respiração dele desacelerar.`,`His hands are shaking. "I hit one," he says. "I really hit one." You can't tell if he's proud or terrified. Neither can he. You put your hand on the back of his neck, the way your mother used to, until his breathing slows down.`,`Le tiemblan las manos. "Le pegué a uno", dice. "Le pegué de verdad." No sabes si está orgulloso o aterrado. Él tampoco. Le pones la mano en la nuca, como hacía tu madre, hasta que la respiración se le calma.`))+bond('bob')+bond('adriana')+calm(2)})},
    {once:'vtligar',label:L('Ligar para o VT','Call VT','Llamar a VT'),
      run:()=>({text:P(L(`"Oficina na saída da cidade?" Silêncio do outro lado. "Vão. Mas se algo parecer errado antes de entrar, vocês saem. Entendeu, Adam?" É a primeira vez que ele te chama assim.`,`"A garage on the way out of the city?" Silence on the other end. "Go. But if anything feels wrong before you go in, you get out. Understood, Adam?" It's the first time he's called you that.`,`"¿Un taller a la salida de la ciudad?" Silencio del otro lado. "Vayan. Pero si algo parece mal antes de entrar, se van. ¿Entendido, Adam?" Es la primera vez que te llama así.`))+bond('vt')})},
    {label:L('Ir para a oficina','Head to the workshop','Ir al taller'),main:true,run:()=>({go:'c3d_oficina'})}
  ]},

c3d_oficina:{act:KO,title:L('A oficina','The workshop','El taller'),checkpoint:true,
  text:()=>P(L(`Vocês sentem antes de ver. O rádio do carro começa a chiar a duas quadras. Os pelos do braço levantam. O ar tem gosto de moeda.

A oficina está com o portão de ferro entortado de dentro para fora. Lá dentro, Matheus e Marcos Karlovski estão no chão, perto de uma cápsula de vidro e metal do tamanho de um carro. Ela está aberta. Não aberta: rasgada. Alguma coisa grande saiu dali.`,
`You feel it before you see it. The car radio starts crackling two blocks away. The hair on your arms stands up. The air tastes like coins.

The workshop's iron gate is bent from the inside out. Inside, Matheus and Marcos Karlovski lie on the floor, next to a glass-and-metal capsule the size of a car. It's open. Not open: torn. Something big came out of it.`,
`Lo sienten antes de verlo. La radio del auto empieza a chisporrotear a dos cuadras. Se les eriza el vello de los brazos. El aire sabe a moneda.

El portón de hierro del taller está doblado de adentro hacia afuera. Adentro, Matheus y Marcos Karlovski están en el piso, junto a una cápsula de vidrio y metal del tamaño de un auto. Está abierta. No abierta: desgarrada. Algo grande salió de ahí.`))+loseSan('1d2',L('a oficina','the workshop','el taller')),
  choices:()=>[
    {once:'capsula',label:L('Examinar a cápsula','Examine the capsule','Examinar la cápsula'),test:{sk:'Percepção',dt:13},
      ok:()=>({text:P(L(`Na etiqueta, "Voluntário 01". Dentro, restos de pele presos em pedaços de metal soldados. Quem entrou aqui entrou inteiro. O que saiu não estava.`,`On the label, "Volunteer 01". Inside, scraps of skin stuck to welded pieces of metal. Whoever went in went in whole. What came out wasn't.`,`En la etiqueta, "Voluntario 01". Adentro, restos de piel pegados a pedazos de metal soldados. Quien entró, entró entero. Lo que salió no.`))+loseSan('1d2',L('a cápsula','the capsule','la cápsula'))}),
      fail:()=>({text:P(L(`Vidro, cabos queimados, cheiro de carne. Você não consegue olhar por muito tempo.`,`Glass, burnt cables, the smell of meat. You can't look for long.`,`Vidrio, cables quemados, olor a carne. No puedes mirar mucho tiempo.`))+loseSan('1d3',L('a cápsula','the capsule','la cápsula'))})},
    {once:'recursos',label:L('Olhar em volta da oficina','Look around the workshop','Mirar alrededor del taller'),test:{sk:'Percepção',dt:11},
      ok:()=>({text:P(L(`Uma mangueira de lava-rápido de alta pressão, ligada. Uma pilha de baterias de caminhão, algumas vazando ácido. Você guarda as duas coisas na cabeça. Seu pai sempre dizia: olhe em volta antes.`,`A high-pressure car-wash hose, still hooked up. A stack of truck batteries, some leaking acid. You file both away. Your father always said: look around first.`,`Una manguera de lavadero de alta presión, conectada. Una pila de baterías de camión, algunas perdiendo ácido. Guardas las dos cosas en la cabeza. Tu padre siempre decía: mira alrededor antes.`))+bond('maxwel')}),
      fail:()=>({text:P(L(`Ferramentas, peças, óleo. Nada que pareça importar agora.`,`Tools, parts, oil. Nothing that seems to matter right now.`,`Herramientas, repuestos, aceite. Nada que parezca importar ahora.`))})},
    {label:L('Seguir o barulho até a sala dos fundos','Follow the noise to the back room','Seguir el ruido hasta la sala del fondo'),main:true,run:()=>({go:'c3e_sala'})}
  ]},

c3e_sala:{act:KO,title:L('A sala dos fundos','The back room','La sala del fondo'),
  text:()=>P(L(`A porta está aberta. Lá dentro, uma coisa enorme de metal e carne está curvada sobre Gustavo Karlovski. Ele ainda está vivo. Por pouco tempo.

Atrás de uma estante de peças caída, um rapaz moreno, com a camisa rasgada, tenta ficar o menor possível. Ele te vê. Não grita. Só balança a cabeça: não.

A coisa para de comer. As luzes da sala piscam todas ao mesmo tempo.`,
`The door is open. Inside, a huge thing of metal and flesh is hunched over Gustavo Karlovski. He's still alive. Not for long.

Behind a toppled shelf of parts, a dark-haired young man in a torn shirt is trying to make himself as small as possible. He sees you. He doesn't scream. He just shakes his head: no.

The thing stops eating. Every light in the room flickers at once.`,
`La puerta está abierta. Adentro, una cosa enorme de metal y carne está encorvada sobre Gustavo Karlovski. Todavía está vivo. Por poco tiempo.

Detrás de una estantería de repuestos caída, un chico moreno, con la camisa rota, intenta hacerse lo más chico posible. Te ve. No grita. Solo niega con la cabeza: no.

La cosa deja de comer. Todas las luces de la sala parpadean al mismo tiempo.`))+loseSan('1d2',L('Gustavo','Gustavo','Gustavo')),
  choices:()=>[
    {label:L('Tirar o rapaz de lá antes de tudo','Get the young man out first','Sacar al chico antes que nada'),test:{sk:'Acrobacia',dt:14},
      ok:()=>{S.flags.kavsalvo=true;return {text:P(L(`Você cruza a sala por cima da bancada, pega ele pelo braço e joga os dois para trás de uma coluna de concreto. A serra da criatura passa onde a sua cabeça estava. "Kavyur", ele diz, sem fôlego. "Meu nome é Kavyur."`,`You cross the room over the workbench, grab him by the arm and throw you both behind a concrete pillar. The creature's saw passes where your head was. "Kavyur," he says, out of breath. "My name is Kavyur."`,`Cruzas la sala por encima del banco de trabajo, lo agarras del brazo y los tiras a los dos detrás de una columna de concreto. La sierra de la criatura pasa donde estaba tu cabeza. "Kavyur", dice, sin aliento. "Me llamo Kavyur."`))+bond('kavyur'),combat:{id:'ciborgue',after:'c3f_kavyur',allies:['thomas3','bob'],script:'ciborgue'}}},
      fail:()=>({text:P(L(`Você pula a bancada, mas o chão está molhado de óleo. Você cai no meio da sala, entre o rapaz e a criatura. Pelo menos agora ela está olhando para você.`,`You vault the workbench, but the floor is slick with oil. You land in the middle of the room, between the young man and the creature. At least now it's looking at you.`,`Saltas el banco de trabajo, pero el piso está resbaloso de aceite. Caes en el medio de la sala, entre el chico y la criatura. Al menos ahora te está mirando a ti.`))+losePv('1d4',L('a queda','the fall','la caída')),combat:{id:'ciborgue',after:'c3f_kavyur',allies:['thomas3','bob'],script:'ciborgue',enemyFirst:true}})},
    {label:L('Atacar a criatura','Attack the creature','Atacar a la criatura'),main:true,
      run:()=>({text:P(L(`"Thomas, cobre! Bob, comigo!" Você entra na sala com a Raijin já fora da bainha.`,`"Thomas, cover! Bob, with me!" You enter the room with Raijin already drawn.`,`"¡Thomas, cúbreme! ¡Bob, conmigo!" Entras en la sala con la Raijin ya desenvainada.`)),combat:{id:'ciborgue',after:'c3f_kavyur',allies:['thomas3','bob'],script:'ciborgue'}})}
  ]},

c3f_kavyur:{act:KO,title:'Kavyur',
  text:()=>P(L(`O Ciborgue está no chão, soltando fumaça e faíscas cada vez mais fracas. Gustavo não resistiu.

O rapaz sai de trás da estante com as mãos levantadas. Magro, moreno, os óculos quebrados pendurados numa orelha. "Eu tentei fazer eles pararem", ele diz. "Eu juro que tentei."`,
`The Cyborg lies on the floor, giving off smoke and weaker and weaker sparks. Gustavo didn't make it.

The young man comes out from behind the shelf with his hands raised. Thin, dark-haired, his broken glasses hanging from one ear. "I tried to make them stop," he says. "I swear I tried."`,
`El Ciborg está en el piso, largando humo y chispas cada vez más débiles. Gustavo no resistió.

El chico sale de detrás de la estantería con las manos en alto. Flaco, moreno, los anteojos rotos colgando de una oreja. "Intenté que pararan", dice. "Te juro que lo intenté."`)),
  choices:()=>[
    {once:'kavhist',label:L('"Quem é você?"','"Who are you?"','"¿Quién eres?"'),
      run:()=>({text:P(L(`Kavyur estudava o paranormal na mesma faculdade que Gustavo. No começo era só curiosidade: livros, símbolos, teorias. Depois Gustavo trouxe os irmãos e a cápsula. E um voluntário que ninguém sabia de onde tinha vindo. "Quando eu vi o que eles iam fazer, eu quis ir embora. Eles não deixaram." Ele olha para os corpos. "Agora eu não tenho para onde ir."`,`Kavyur studied the paranormal at the same college as Gustavo. At first it was just curiosity: books, symbols, theories. Then Gustavo brought in his brothers and the capsule. And a volunteer nobody knew where he'd come from. "When I saw what they were going to do, I wanted to leave. They didn't let me." He looks at the bodies. "Now I have nowhere to go."`,`Kavyur estudiaba lo paranormal en la misma facultad que Gustavo. Al principio era solo curiosidad: libros, símbolos, teorías. Después Gustavo trajo a sus hermanos y la cápsula. Y un voluntario que nadie sabía de dónde había salido. "Cuando vi lo que iban a hacer, quise irme. No me dejaron." Mira los cuerpos. "Ahora no tengo adónde ir."`))+bond('kavyur')})},
    {once:'thodesc',label:L('Deixar Thomas decidir se confia nele','Let Thomas decide whether to trust him','Dejar que Thomas decida si confía en él'),
      run:()=>({text:P(L(`Thomas mostra a pasta da boate e aponta a última frase. "Foi você que escreveu isso?" Kavyur confirma com a cabeça. Thomas fecha a pasta. "Então ele vem com a gente."`,`Thomas shows him the folder from the club and points to the last line. "Did you write this?" Kavyur nods. Thomas closes the folder. "Then he comes with us."`,`Thomas le muestra la carpeta del boliche y señala la última frase. "¿Tú escribiste esto?" Kavyur asiente. Thomas cierra la carpeta. "Entonces viene con nosotros."`))+bond('thomas')+bond('kavyur')})},
    {label:L('Levar Kavyur para o VT','Take Kavyur to VT','Llevar a Kavyur con VT'),main:true,run:()=>({go:'c3g_base'})}
  ]},

c3g_base:{act:KO,title:L('Mais um no porão','One more in the basement','Uno más en el sótano'),
  text:()=>P(L(`VT escuta a história inteira em silêncio, encostado na parede do porão, com os braços cruzados. Olha para Kavyur por muito tempo. Kavyur aguenta o olhar.

"Tem uma beliche sobrando", VT diz por fim. "Você cozinha? Porque esses três só sabem esquentar pão de queijo."

Depois, quando os outros vão dormir, VT para do seu lado. "Você trouxe os dois de volta inteiros. E ainda trouxe mais um." Ele não diz que está orgulhoso. Não precisa.`,
`VT listens to the whole story in silence, leaning against the basement wall with his arms crossed. He looks at Kavyur for a long time. Kavyur holds his gaze.

"There's a spare bunk," VT says at last. "Can you cook? Because these three only know how to heat up cheese bread."

Later, when the others go to bed, VT stops beside you. "You brought both of them back in one piece. And you brought one more." He doesn't say he's proud. He doesn't need to.`,
`VT escucha toda la historia en silencio, apoyado en la pared del sótano, con los brazos cruzados. Mira a Kavyur un largo rato. Kavyur le sostiene la mirada.

"Sobra una cucheta", dice VT al fin. "¿Sabes cocinar? Porque estos tres solo saben calentar pan de queso."

Después, cuando los demás se van a dormir, VT se detiene a tu lado. "Trajiste a los dos de vuelta enteros. Y encima trajiste uno más." No dice que está orgulloso. No hace falta.`))+bond('vt')+calm(2),
  choices:()=>[{label:L('Encerrar o Capítulo 3','End Chapter 3','Terminar el Capítulo 3'),main:true,run:()=>({levelup:'c3_fim'})}]},

c3_fim:{act:KO,title:L('Fim do Capítulo 3','End of Chapter 3','Fin del Capítulo 3'),
  text:()=>P(L(`Os Karlovski estão mortos. A cápsula foi desmontada e queimada no quintal do hangar. Kavyur dorme na beliche de baixo e acorda antes de todo mundo para fazer café.

Ele não fala muito sobre aquela noite. Mas toda vez que um de vocês três sai em missão, ele fica acordado até ouvir o elevador de carga descer de novo.`,
`The Karlovskis are dead. The capsule was taken apart and burned in the hangar yard. Kavyur sleeps on the bottom bunk and wakes up before everyone to make coffee.

He doesn't talk much about that night. But every time one of you three goes out on a mission, he stays up until he hears the freight elevator come back down.`,
`Los Karlovski están muertos. La cápsula fue desarmada y quemada en el patio del hangar. Kavyur duerme en la cucheta de abajo y se levanta antes que todos para hacer café.

No habla mucho de esa noche. Pero cada vez que alguno de ustedes tres sale a una misión, se queda despierto hasta oír bajar de nuevo el montacargas.`)),
  choices:()=>[{label:L('Ver o relatório','See the report','Ver el informe'),main:true,run:()=>({end:true})}]}
});
SCENES.c2_fim.choices=()=>[{label:L('Começar o Capítulo 3','Begin Chapter 3','Comenzar el Capítulo 3'),main:true,run:()=>({go:'c3a_missao'})}];
}


function buildCap4(){
Object.assign(ENEMIES,{
  cao:{eyes:true,name:L('Cão de Sangue','Blood Hound','Perro de Sangre'),kind:L('Criatura de Sangue','Blood Creature','Criatura de Sangre'),el:'sangue',pv:24,def:13,atk:5,dmg:'1d8+2',res:2,init:4,
    presence:{dt:12,san:'1d2'},desc:L('Já foi o cachorro da família. A coleira ainda tem a plaquinha: "Tobi". O resto é sangue e dentes, deitado na frente da porta do porão como se estivesse de guarda.','It used to be the family dog. The collar still has the tag: "Tobi". The rest is blood and teeth, lying across the basement door as if on guard.','Fue el perro de la familia. El collar todavía tiene la placa: "Tobi". Lo demás es sangre y dientes, echado frente a la puerta del sótano como de guardia.')},
  pablo:{human:true,eyes:true,name:'Pablo Hoff',kind:L('Ocultista · Sangue','Occultist · Blood','Ocultista · Sangre'),el:null,pv:42,def:13,atk:6,dmg:'2d6',res:4,init:3,presence:null,
    special:{every:3,kind:'atk',name:L('Agulhas de Sangue','Blood Needles','Agujas de Sangre'),text:L('Ele abre a mão, e o sangue dos tubos voa na sua direção como agulhas.','He opens his hand, and the blood in the tubes flies at you like needles.','Abre la mano, y la sangre de los tubos vuela hacia ti como agujas.'),dmg:'3d6'},
    desc:L('Camisa social manchada, olheiras fundas, a aliança ainda no dedo. Ele fala com você com a calma de um professor. "Você não entende. Ela está do outro lado. O sangue dele é o mesmo que o dela."','A stained dress shirt, deep dark circles, his wedding ring still on. He talks to you with a teacher\'s calm. "You don\'t understand. She\'s on the other side. His blood is the same as hers."','Camisa manchada, ojeras profundas, la alianza todavía en el dedo. Te habla con la calma de un profesor. "No entiendes. Ella está del otro lado. Su sangre es la misma que la de ella."')}
});
BOND_NAME.derick='Derick';BOND_NAME.roger='Roger';
