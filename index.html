function buildAct2C1(){
Object.assign(ENEMIES,{
  horda:{eyes:true,name:L('Horda de Sangue','Blood Horde','Horda de Sangre'),kind:L('Criaturas de Sangue','Blood Creatures','Criaturas de Sangre'),el:'sangue',pv:150,def:21,atk:15,dmg:'2d8+6',res:6,init:4,
    presence:{dt:18,san:'1d4'},special:{every:3,kind:'atk',name:L('Maré Vermelha','Red Tide','Marea Roja'),text:L('Eles vêm todos de uma vez, como uma onda.','They all come at once, like a wave.','Vienen todos a la vez, como una ola.'),dmg:'4d8+6'},
    desc:L('Uma rua inteira de gente que ontem estava viva. Ainda de pijama, de avental, de uniforme de escola. O sangue escorre deles para o mesmo lado: o portão com o símbolo.','A whole street of people who were alive yesterday. Still in pajamas, aprons, school uniforms. The blood runs off them in the same direction: toward the gate with the symbol.','Una calle entera de gente que ayer estaba viva. Todavía en pijama, delantal, uniforme de escuela. La sangre les chorrea hacia el mismo lado: el portón con el símbolo.')},
  segurancas:{human:true,eyes:true,name:L('Seguranças da clínica','Clinic guards','Guardias de la clínica'),kind:L('Humanos · grupo','Humans · group','Humanos · grupo'),el:null,pv:130,def:22,atk:15,dmg:'2d10+5',res:5,init:5,presence:null,
    desc:L('Cinco homens de colete, pistola e rádio. Profissionais. Nenhum deles pergunta o que tem nas bolsas que eles guardam.','Five men in vests with pistols and radios. Professionals. None of them asks what\'s in the bags they guard.','Cinco hombres con chaleco, pistola y radio. Profesionales. Ninguno pregunta qué hay en las bolsas que custodian.')},
  limpador:{human:true,eyes:true,name:L('Sílvio, o Limpador','Sílvio, the Cleaner','Sílvio, el Limpiador'),kind:L('Humano · marcado pelo Sangue','Human · marked by Blood','Humano · marcado por la Sangre'),el:null,pv:300,def:24,atk:17,dmg:'3d8+7',res:8,init:6,presence:null,
    special:{every:3,kind:'atk',name:L('Tinta de Sangue','Blood Paint','Pintura de Sangre'),text:L('Ele passa o pincel no ar, e a tinta vermelha vira lâmina.','He sweeps the brush through the air, and the red paint becomes a blade.','Pasa el pincel por el aire, y la pintura roja se vuelve filo.'),dmg:'6d8+6'},
    desc:L('Cinquenta e poucos anos, capa de chuva, balde de tinta branca. O círculo riscado no pulso brilha como brasa. Ele não sente dor. O Sangue que o marcou não deixa.','Early fifties, raincoat, a bucket of white paint. The scratched circle on his wrist glows like an ember. He feels no pain. The Blood that marked him won\'t let him.','Cincuenta y pocos, impermeable, balde de pintura blanca. El círculo rayado en la muñeca brilla como brasa. No siente dolor. La Sangre que lo marcó no lo deja.')}
});
ALLIES.derick16={name:'Derick',atk:11,dmg:'2d8+4',verb:L('entra por baixo e acerta','ducks in low and hits','entra por abajo y golpea')};
BOND_NAME.koranna='Koranna';
const c=(t,x)=>({t,x});
Object.assign(CLUES,{
  a2simbolo:c(L('O mesmo símbolo','The same symbol','El mismo símbolo'),L('O círculo riscado, pintado em vermelho no portão de uma rua inteira que "pegou fogo". Nove anos depois. Mesmo traço, mesma tinta.','The scratched circle, painted red on the gate of a whole street that "caught fire". Nine years later. Same stroke, same paint.','El círculo rayado, pintado en rojo en el portón de una calle entera que "se incendió". Nueve años después. Mismo trazo, misma pintura.')),
  a2thomas:c(L('A pasta do Thomas','Thomas\'s folder','La carpeta de Thomas'),L('Na letra do Thomas: "Rua da vó". Nove anos de recortes, mapas e nomes. Todos os "surtos" ligados a uma organização que colhe sangue rua por rua: A Colheita. E uma última folha, com a letra tremida: "O fogo em Atlanta não foi acidente. Adam precisa saber. Não sei como contar."','In Thomas\'s handwriting: "Grandma\'s street". Nine years of clippings, maps and names. Every "outbreak" linked to an organization that harvests blood street by street: The Harvest. And one last page, the handwriting shaky: "The fire in Atlanta wasn\'t an accident. Adam needs to know. I don\'t know how to tell him."','Con la letra de Thomas: "Calle de la abuela". Nueve años de recortes, mapas y nombres. Todos los "brotes" ligados a una organización que cosecha sangre calle por calle: La Cosecha. Y una última hoja, con la letra temblorosa: "El fuego en Atlanta no fue un accidente. Adam tiene que saberlo. No sé cómo decírselo."')),
  a2atlanta:c(L('Atlanta','Atlanta','Atlanta'),L('A ficha técnica de um filme de ação americano. Coordenador de dublês: Maxwel Zart. Produtor: Otto Brenner. Uma nota de jornal: "Dublê sofre queimaduras em set; produção fala em falha técnica." Na margem, o Thomas escreveu: "O pai sempre contava rindo. Ele nunca riu com os olhos."','The credits of an American action movie. Stunt coordinator: Maxwel Zart. Producer: Otto Brenner. A news clipping: "Stuntman burned on set; production cites technical failure." In the margin, Thomas wrote: "Dad always told it laughing. He never laughed with his eyes."','La ficha técnica de una película de acción estadounidense. Coordinador de dobles: Maxwel Zart. Productor: Otto Brenner. Una nota de diario: "Doble sufre quemaduras en set; la producción habla de falla técnica." En el margen, Thomas escribió: "Papá siempre lo contaba riendo. Nunca se reía con los ojos."')),
  a2livro:c(L('O livro da clínica','The clinic ledger','El libro de la clínica'),L('Entregas de sangue anotadas à mão por nove anos. Uma coluna diz "P. Hoff". Outra, bem maior, diz "Colheita". E uma linha que se repete todo ano, sempre no mesmo dia, o dia do aniversário do vô: "S. — retoque do portão."','Blood deliveries logged by hand for nine years. One column says "P. Hoff". Another, much bigger, says "Harvest". And one line repeated every year, always on the same day, Grandpa\'s birthday: "S. — gate touch-up."','Entregas de sangre anotadas a mano durante nueve años. Una columna dice "P. Hoff". Otra, mucho más grande, dice "Cosecha". Y una línea que se repite cada año, siempre el mismo día, el cumpleaños del abuelo: "S. — retoque del portón."'))
});
const K=L('Ato II · Cap. 1 · O Limpador','Act II · Ch. 1 · The Cleaner','Acto II · Cap. 1 · El Limpiador');
const KV=L('Ato II · Cap. 1 · A verdade','Act II · Ch. 1 · The truth','Acto II · Cap. 1 · La verdad');
Object.assign(SCENES,{
a2a_base:{act:K,title:L('O relógio do Thomas','Thomas\'s watch','El reloj de Thomas'),checkpoint:true,
  text:()=>P(L(`A Base está quieta demais. Tinha quarenta pessoas. Agora tem cinco.

Na sala de treino, a Koranna corrige a guarda do Tuninho pela décima vez, enquanto a Maitê retoca o batom vinho entre um exercício e outro. O Derick, dezesseis anos, cuida da logística, das contas e dos relatórios que ninguém mais sobrou para fazer. Você usa o relógio do Thomas no pulso esquerdo. Ainda não conseguiu tirar.

Você está saindo para uma viagem de recrutamento quando a TV do refeitório mostra um incêndio. Uma rua inteira, de madrugada. Os bombeiros falam em "surto". A câmera passa rápido por um portão. Tem alguma coisa pintada nele.

E atrás dos bombeiros, de capa de chuva, com um balde de tinta na mão, um homem de cinquenta e poucos anos olha direto para a câmera.

Você conhece aquele rosto. Faz nove anos que conhece.`,
`The Base is too quiet. It had forty people. Now it has five.

In the training room, Koranna corrects Tuninho's guard for the tenth time, while Maitê touches up her wine lipstick between drills. Derick, sixteen, handles the logistics, the accounts and the reports nobody else is left to write. You wear Thomas's watch on your left wrist. You still haven't been able to take it off.

You're heading out on a recruiting trip when the cafeteria TV shows a fire. A whole street, before dawn. The firefighters say "outbreak". The camera sweeps past a gate. Something is painted on it.

And behind the firefighters, in a raincoat, holding a bucket of paint, a man in his early fifties looks straight into the camera.

You know that face. You've known it for nine years.`,
`La Base está demasiado callada. Tenía cuarenta personas. Ahora tiene cinco.

En la sala de entrenamiento, Koranna le corrige la guardia a Tuninho por décima vez, mientras Maitê se retoca el labial color vino entre un ejercicio y otro. Derick, dieciséis años, se ocupa de la logística, las cuentas y los informes que ya no queda nadie para hacer. Tú llevas el reloj de Thomas en la muñeca izquierda. Todavía no pudiste sacártelo.

Estás saliendo para un viaje de reclutamiento cuando la tele del comedor muestra un incendio. Una calle entera, de madrugada. Los bomberos hablan de "brote". La cámara pasa rápido por un portón. Hay algo pintado en él.

Y detrás de los bomberos, con impermeable y un balde de pintura en la mano, un hombre de cincuenta y pocos mira directo a la cámara.

Conoces esa cara. La conoces hace nueve años.`))+loseSan('1d3',L('o rosto','the face','la cara')),
  choices:()=>[
    {once:'koranna',label:L('Falar com a Koranna','Talk to Koranna','Hablar con Koranna'),
      run:()=>({text:P(L(`Ela viu a sua cara antes de ver a TV. "Quem é?" Você conta. Pouco, do seu jeito. Ela escuta sem interromper, apoiada na lança. "Vai", ela diz no fim. "A Base fica comigo. Mas leva o Derick. Você não pode fazer isso sozinho, e ele não vai te deixar mesmo."`,`She saw your face before she saw the TV. "Who is he?" You tell her. Briefly, your way. She listens without interrupting, leaning on her spear. "Go," she says at the end. "The Base stays with me. But take Derick. You can't do this alone, and he won't let you anyway."`,`Te vio la cara antes de ver la tele. "¿Quién es?" Le cuentas. Poco, a tu manera. Escucha sin interrumpir, apoyada en la lanza. "Ve", dice al final. "La Base queda conmigo. Pero llévate a Derick. No puedes hacer esto solo, y él no te va a dejar de todos modos."`))+bond('koranna')})},
    {once:'derick',label:L('Tentar ir sem o Derick','Try to leave without Derick','Intentar ir sin Derick'),
      run:()=>({text:P(L(`Ele já está na porta da garagem com a mochila nas costas. "Regra de ouro", ele diz. "Ninguém se machuca na sua missão. Nem você." Você abre a boca para discutir. Ele entra no carro primeiro.`,`He's already at the garage door with his backpack on. "Golden rule," he says. "Nobody gets hurt on your mission. Not even you." You open your mouth to argue. He gets in the car first.`,`Ya está en la puerta del garaje con la mochila puesta. "Regla de oro", dice. "Nadie se lastima en tu misión. Ni siquiera tú." Abres la boca para discutir. Él sube al auto primero.`))+bond('derick')})},
    {label:L('Ir até a rua do incêndio','Head to the burning street','Ir a la calle del incendio'),main:true,run:()=>({go:'a2b_rua'})}
  ]},

a2b_rua:{act:K,title:L('Outra rua','Another street','Otra calle'),checkpoint:true,
  text:()=>P(L(`Quando vocês chegam, os bombeiros já foram embora, e a polícia fechou os dois lados da rua com fita. Algumas casas ainda soltam fumaça. Não tem ninguém na calçada.

No meio da rua, parados, virados para o mesmo portão, estão os moradores. Dezenas. Pingando.

No portão, em vermelho vivo, o círculo riscado.`,
`By the time you arrive, the firefighters are gone and the police have taped off both ends of the street. A few houses are still smoking. There's no one on the sidewalk.

In the middle of the street, standing still, all facing the same gate, are the residents. Dozens of them. Dripping.

On the gate, in bright red, the scratched circle.`,
`Cuando llegan, los bomberos ya se fueron, y la policía cerró los dos extremos de la calle con cinta. Algunas casas todavía humean. No hay nadie en la vereda.

En medio de la calle, quietos, mirando hacia el mismo portón, están los vecinos. Decenas. Chorreando.

En el portón, en rojo vivo, el círculo rayado.`))+addClue('a2simbolo'),
  choices:()=>[
    {label:L('Limpar a rua','Clear the street','Limpiar la calle'),main:true,
      run:()=>({text:P(L(`Você desembainha a Raijin. Derick fica do seu lado esquerdo, como você ensinou.`,`You draw Raijin. Derick takes your left side, the way you taught him.`,`Desenvainas la Raijin. Derick se pone a tu izquierda, como le enseñaste.`)),combat:{id:'horda',after:'a2b_fuga',allies:['derick16'],winText:L('O último deles cai de joelhos na frente do portão. A rua fica em silêncio.','The last of them drops to its knees in front of the gate. The street goes silent.','El último cae de rodillas frente al portón. La calle queda en silencio.')}})}
  ]},

a2b_fuga:{act:K,title:L('Duas portas','Two doors','Dos puertas'),
  text:()=>P(L(`No fim da rua, um motor liga. Uma van branca, sem placa na frente. O homem de capa de chuva está entrando no banco do motorista.

Ao mesmo tempo, de dentro de uma casa ainda em chamas, uma criança grita.

Nove anos. Você esperou nove anos por esse rosto.`,
`At the end of the street, an engine starts. A white van, no front plate. The man in the raincoat is climbing into the driver's seat.

At the same time, from inside a house still on fire, a child screams.

Nine years. You've waited nine years for that face.`,
`Al final de la calle, un motor arranca. Una camioneta blanca, sin patente adelante. El hombre del impermeable está subiendo al asiento del conductor.

Al mismo tiempo, desde adentro de una casa todavía en llamas, un chico grita.

Nueve años. Esperaste nueve años por esa cara.`)),
  choices:()=>[
    {label:L('Entrar na casa atrás da criança','Go into the house for the child','Entrar en la casa por el chico'),main:true,test:{sk:'Atletismo',dt:18},
      ok:()=>{S.flags.salvou=true;return {text:P(L(`Você nem pensa. Nunca pensa. Atravessa a porta com o ombro, sobe a escada no meio da fumaça e acha uma menina de seis anos embaixo da cama, abraçada num cachorro de pelúcia. Quando você sai com ela no colo, a van já sumiu.

Derick está parado na calçada, ofegante. "Eu vi a placa de trás", ele diz. "E vi o adesivo no vidro. Uma clínica." Ele te olha. "Você fez a escolha certa."`,`You don't even think. You never do. You go through the door shoulder-first, up the stairs through the smoke, and find a six-year-old girl under the bed, hugging a stuffed dog. By the time you come out with her in your arms, the van is gone.

Derick is standing on the sidewalk, out of breath. "I saw the back plate," he says. "And the sticker on the window. A clinic." He looks at you. "You made the right call."`,`Ni lo piensas. Nunca lo piensas. Atraviesas la puerta con el hombro, subes la escalera entre el humo y encuentras a una nena de seis años debajo de la cama, abrazada a un perro de peluche. Cuando sales con ella en brazos, la camioneta ya desapareció.

Derick está parado en la vereda, sin aliento. "Vi la patente de atrás", dice. "Y la calcomanía en el vidrio. Una clínica." Te mira. "Tomaste la decisión correcta."`))+bond('derick')+calm(3),go:'a2c_arquivo'}},
      fail:()=>{S.flags.salvou=true;return {text:P(L(`Você tira a menina de lá, mas o teto da escada desaba no caminho de volta e você carrega ela os últimos metros com as costas queimando. A van sumiu. Derick viu a placa e um adesivo de clínica no vidro.`,`You get the girl out, but the stairwell ceiling collapses on the way back and you carry her the last few meters with your back burning. The van is gone. Derick saw the plate and a clinic sticker on the window.`,`Sacas a la nena, pero el techo de la escalera se derrumba al volver y la cargas los últimos metros con la espalda ardiendo. La camioneta desapareció. Derick vio la patente y una calcomanía de clínica en el vidrio.`))+losePv('3d6',L('o fogo','the fire','el fuego'))+bond('derick'),go:'a2c_arquivo'}}},
    {label:L('Ir atrás da van','Go after the van','Ir tras la camioneta'),test:{sk:'Pilotagem',dt:20},
      ok:()=>{S.flags.perseguiu=true;return {text:P(L(`"Derick, a criança!" Você já está no carro. Três quarteirões, dois sinais vermelhos, uma curva que o seu pai faria rindo. Você bate na lateral da van e ela capota. Quando você chega, a porta do motorista está aberta e ele sumiu. No banco, um recibo de uma clínica.

De volta à rua, Derick está sentado no meio-fio, com a roupa chamuscada e uma menina de seis anos no colo. Ele entrou sozinho. Você sente uma coisa gelada no estômago que não sentia desde os dezessete.`,`"Derick, the kid!" You're already in the car. Three blocks, two red lights, a turn your father would've taken laughing. You slam into the side of the van and it rolls. When you reach it, the driver's door is open and he's gone. On the seat, a receipt from a clinic.

Back on the street, Derick is sitting on the curb, clothes singed, a six-year-old girl in his lap. He went in alone. You feel something cold in your stomach you haven't felt since you were seventeen.`,`"¡Derick, el chico!" Ya estás en el auto. Tres cuadras, dos semáforos en rojo, una curva que tu padre habría tomado riendo. Chocas el costado de la camioneta y vuelca. Cuando llegas, la puerta del conductor está abierta y él ya no está. En el asiento, un recibo de una clínica.

De vuelta en la calle, Derick está sentado en el cordón, con la ropa chamuscada y una nena de seis años en el regazo. Entró solo. Sientes algo helado en el estómago que no sentías desde los diecisiete.`))+loseSan('1d6',L('o Derick no fogo','Derick in the fire','Derick en el fuego')),go:'a2c_arquivo'}},
      fail:()=>{S.flags.perseguiu=true;return {text:P(L(`Você perde a van no segundo quarteirão. Quando volta, Derick está no meio-fio com uma menina no colo e a roupa chamuscada. Ele entrou sozinho. Ele viu a placa. Você não diz nada no caminho de volta. Ele também não.`,`You lose the van on the second block. When you come back, Derick is on the curb with a little girl in his lap and his clothes singed. He went in alone. He saw the plate. You don't say anything on the way back. Neither does he.`,`Pierdes la camioneta en la segunda cuadra. Cuando vuelves, Derick está en el cordón con una nena en el regazo y la ropa chamuscada. Entró solo. Vio la patente. No dices nada en el camino de vuelta. Él tampoco.`))+loseSan('1d6',L('o Derick no fogo','Derick in the fire','Derick en el fuego')),go:'a2c_arquivo'}}}
  ]},

a2c_arquivo:{act:K,title:L('O armário do Thomas','Thomas\'s locker','El casillero de Thomas'),checkpoint:true,
  text:()=>P(L(`De volta à Base, você tira o relógio do Thomas pela primeira vez em meses. Na parte de trás, colada com fita, uma chavinha. Você sabe de onde é.

O armário dele na sala de análise ninguém abriu desde o massacre. Lá dentro, pastas empilhadas até o teto. Na frente de todas, uma com etiqueta na letra dele: "Rua da vó".`,
`Back at the Base, you take off Thomas's watch for the first time in months. On the back, taped down, a tiny key. You know where it goes.

His locker in the analysis room hasn't been opened since the massacre. Inside, folders stacked to the top. In front of all of them, one labeled in his handwriting: "Grandma's street".`,
`De vuelta en la Base, te sacas el reloj de Thomas por primera vez en meses. Atrás, pegada con cinta, una llavecita. Sabes de dónde es.

Nadie abrió su casillero en la sala de análisis desde la masacre. Adentro, carpetas apiladas hasta arriba. Delante de todas, una con una etiqueta con su letra: "Calle de la abuela".`)),
  choices:()=>[
    {once:'pasta',label:L('Ler a pasta "Rua da vó"','Read the "Grandma\'s street" folder','Leer la carpeta "Calle de la abuela"'),
      run:()=>({text:P(L(`Você lê tudo sentado no chão, com as costas no armário. O Thomas nunca parou. Nove anos investigando sozinho, sem contar para ninguém. Nem para você.`,`You read all of it sitting on the floor, your back against the locker. Thomas never stopped. Nine years investigating alone, without telling anyone. Not even you.`,`Lo lees todo sentado en el piso, con la espalda contra el casillero. Thomas nunca paró. Nueve años investigando solo, sin decírselo a nadie. Ni siquiera a ti.`))+addClue('a2thomas')+bond('thomas')+loseSan('1d4',L('a letra do Thomas','Thomas\'s handwriting','la letra de Thomas'))})},
    {once:'atlanta',label:L('Abrir o envelope marcado "Atlanta"','Open the envelope marked "Atlanta"','Abrir el sobre marcado "Atlanta"'),test:{sk:'Vontade',dt:16},
      ok:()=>({text:P(L(`Você lembra do almoço de aniversário do vô. O seu pai contando a história do fogo, e a sua mãe corrigindo cada detalhe. Todo mundo rindo. Você lê a nota de jornal duas vezes, dobra e guarda junto com a foto de Natal.`,`You remember Grandpa's birthday lunch. Your father telling the fire story, your mother correcting every detail. Everyone laughing. You read the clipping twice, fold it and put it away with the Christmas photo.`,`Recuerdas el almuerzo de cumpleaños del abuelo. Tu padre contando la historia del fuego, y tu madre corrigiendo cada detalle. Todos riendo. Lees la nota dos veces, la doblas y la guardas junto a la foto de Navidad.`))+addClue('a2atlanta')+bond('maxwel')}),
      fail:()=>({text:P(L(`Você lê o nome do seu pai ao lado do nome de um estranho e precisa sair da sala. Derick te acha dez minutos depois, sentado na escada de incêndio, e senta do seu lado sem dizer nada. Como você fez com o Thomas, anos atrás.`,`You read your father's name next to a stranger's name and have to leave the room. Derick finds you ten minutes later, sitting on the fire escape, and sits beside you without a word. The way you did with Thomas, years ago.`,`Lees el nombre de tu padre al lado del de un desconocido y tienes que salir de la sala. Derick te encuentra diez minutos después, sentado en la escalera de incendio, y se sienta a tu lado sin decir nada. Como hiciste tú con Thomas, hace años.`))+addClue('a2atlanta')+loseSan('1d4',L('Atlanta','Atlanta','Atlanta'))+bond('derick')})},
    {label:L('Ir até a clínica do adesivo','Go to the clinic from the sticker','Ir a la clínica de la calcomanía'),main:true,run:()=>({go:'a2d_clinica'})}
  ]},

a2d_clinica:{act:K,title:L('A clínica','The clinic','La clínica'),
  text:()=>P(L(`Uma clínica de exames num prédio baixo, com letreiro de farmácia e vidro fumê. Durante o dia, tira sangue de gente comum. De noite, as luzes do subsolo continuam acesas, e uma van branca estaciona nos fundos.

Pela janela do subsolo, você vê geladeiras. Dezenas. E cinco homens armados.`,
`A lab clinic in a low building, with a pharmacy sign and tinted glass. By day, it draws blood from ordinary people. At night, the basement lights stay on, and a white van parks out back.

Through the basement window, you see refrigerators. Dozens. And five armed men.`,
`Una clínica de análisis en un edificio bajo, con cartel de farmacia y vidrio polarizado. De día, le saca sangre a gente común. De noche, las luces del subsuelo siguen prendidas, y una camioneta blanca estaciona atrás.

Por la ventana del subsuelo ves heladeras. Decenas. Y cinco hombres armados.`)),
  choices:()=>[
    {label:L('Entrar pela porta da frente','Walk in the front door','Entrar por la puerta principal'),main:true,
      run:()=>({text:P(L(`Você não é um agente discreto. Nunca foi. Derick suspira e tira as armas da mochila.`,`You're not a subtle agent. You never were. Derick sighs and takes his weapons out of the backpack.`,`No eres un agente discreto. Nunca lo fuiste. Derick suspira y saca sus armas de la mochila.`)),combat:{id:'segurancas',after:'a2d_livro',allies:['derick16'],winText:L('O último segurança larga a pistola e levanta as mãos. O subsolo cheira a pólvora e a sangue gelado.','The last guard drops his pistol and raises his hands. The basement smells of gunpowder and cold blood.','El último guardia suelta la pistola y levanta las manos. El subsuelo huele a pólvora y sangre fría.')}})},
    {label:L('Descer pelo duto dos fundos','Go down the back vent','Bajar por el conducto de atrás'),test:{sk:'Furtividade',dt:16},
      ok:()=>({text:P(L(`Com a proteção pesada, é um milagre que você caiba. Você cai atrás das geladeiras e derruba dois antes de alguém entender o barulho.`,`In heavy armor, it's a miracle you fit. You drop behind the fridges and take down two before anyone understands the noise.`,`Con la protección pesada, es un milagro que quepas. Caes detrás de las heladeras y derribas a dos antes de que alguien entienda el ruido.`)),combat:{id:'segurancas',after:'a2d_livro',allies:['derick16'],surprise:true,weak:true,winText:L('O último segurança larga a pistola e levanta as mãos.','The last guard drops his pistol and raises his hands.','El último guardia suelta la pistola y levanta las manos.')}}),
      fail:()=>({text:P(L(`O duto range e cede. Você cai no meio do subsolo, com cinco pistolas apontadas.`,`The vent creaks and gives way. You land in the middle of the basement, five pistols pointed at you.`,`El conducto cruje y cede. Caes en medio del subsuelo, con cinco pistolas apuntándote.`)),combat:{id:'segurancas',after:'a2d_livro',allies:['derick16'],enemyFirst:true,winText:L('O último segurança larga a pistola e levanta as mãos.','The last guard drops his pistol and raises his hands.','El último guardia suelta la pistola y levanta las manos.')}})}
  ]},

a2d_livro:{act:K,title:L('As geladeiras','The refrigerators','Las heladeras'),
  text:()=>P(L(`Bolsas de sangue etiquetadas por rua e por data. Você reconhece o nome da rua do incêndio. E, na última geladeira, no fundo, uma prateleira com etiquetas velhas, amareladas. O nome da rua da vó. A data do aniversário.

Numa mesa, um livro de capa dura aberto.`,
`Blood bags labeled by street and by date. You recognize the name of the burned street. And in the last refrigerator, at the back, a shelf with old, yellowed labels. The name of Grandma's street. The date of the birthday.

On a desk, an open hardcover ledger.`,
`Bolsas de sangre etiquetadas por calle y por fecha. Reconoces el nombre de la calle del incendio. Y en la última heladera, al fondo, un estante con etiquetas viejas, amarillentas. El nombre de la calle de la abuela. La fecha del cumpleaños.

Sobre una mesa, un libro de tapas duras abierto.`))+loseSan('1d4',L('as etiquetas','the labels','las etiquetas'))+addClue('a2livro'),
  choices:()=>[
    {once:'hoff',label:L('Mostrar a coluna "P. Hoff" ao Derick','Show Derick the "P. Hoff" column','Mostrarle a Derick la columna "P. Hoff"'),
      run:()=>({text:P(L(`Ele lê o nome do pai e fica muito quieto. "Então foi daqui que ele comprava." Ele fecha o livro com cuidado. "A mesma gente que matou a sua família vendeu o sangue que ele usou em mim." Não é uma pergunta. Você coloca a mão na nuca dele, como a sua mãe fazia.`,`He reads his father's name and goes very still. "So this is where he bought it." He closes the ledger carefully. "The same people who killed your family sold the blood he used on me." It isn't a question. You put your hand on the back of his neck, the way your mother used to.`,`Lee el nombre de su padre y se queda muy quieto. "Así que de acá la compraba." Cierra el libro con cuidado. "La misma gente que mató a tu familia vendió la sangre que él usó conmigo." No es una pregunta. Le pones la mano en la nuca, como hacía tu madre.`))+bond('derick')+bond('adriana')})},
    {label:L('Usar o telefone de emergência do VT','Use VT\'s emergency phone','Usar el teléfono de emergencia de VT'),main:true,run:()=>({go:'a2e_vt'})}
  ]},

a2e_vt:{act:K,title:L('Telefone de emergência','Emergency phone','Teléfono de emergencia'),
  text:()=>P(L(`Ele disse para nunca mais pedir ajuda. Para nada.

Você liga mesmo assim. Toca cinco vezes. Na sexta, alguém atende e não diz nada. Você ouve a respiração. Ouve, no fundo, o barulho do elevador de carga.

"...Fala."`,
`He said never to ask for help again. For anything.

You call anyway. It rings five times. On the sixth, someone picks up and says nothing. You hear breathing. You hear, in the background, the freight elevator.

"...Talk."`,
`Dijo que nunca más le pidieran ayuda. Para nada.

Llamas igual. Suena cinco veces. A la sexta, alguien atiende y no dice nada. Oyes la respiración. Oyes, de fondo, el ruido del montacargas.

"...Habla."`)),
  choices:()=>[
    {label:L('Contar tudo, do seu jeito','Tell him everything, your way','Contarle todo, a tu manera'),main:true,test:{sk:'Diplomacia',dt:15},
      ok:()=>{S.flags.vtdica=true;return {text:P(L(`Você conta. Pouco, mas tudo. Quando termina, o silêncio dura tanto que você acha que ele desligou.

"Eu disse pra não me ligar." Pausa. "Você tá inteiro?"

"Tô."

"O cara da capa." A voz dele muda. "Eu caçava ele antes de achar vocês no galpão. Ele é marcado. O círculo no pulso é o que segura ele de pé: ele não sente dor enquanto aquilo brilhar. Acerta o pulso primeiro, Adam." Outra pausa. Do fundo, a voz do Kavyur: "Fala pra ele que a gente tá aqui." VT desliga sem responder.`,`You tell him. Briefly, but everything. When you finish, the silence lasts so long you think he's hung up.

"I told you not to call me." A pause. "Are you in one piece?"

"Yeah."

"The guy in the raincoat." His voice changes. "I was hunting him before I found you in that warehouse. He's marked. The circle on his wrist is what keeps him standing: he feels no pain while it glows. Go for the wrist first, Adam." Another pause. In the background, Kavyur's voice: "Tell him we're here." VT hangs up without answering.`,`Le cuentas. Poco, pero todo. Cuando terminas, el silencio dura tanto que crees que cortó.

"Te dije que no me llamaras." Pausa. "¿Estás entero?"

"Sí."

"El tipo del impermeable." Le cambia la voz. "Lo cazaba antes de encontrarlos en el galpón. Está marcado. El círculo de la muñeca es lo que lo mantiene de pie: no siente dolor mientras eso brille. Pégale a la muñeca primero, Adam." Otra pausa. De fondo, la voz de Kavyur: "Dile que estamos acá." VT corta sin responder.`))+bond('vt',2)+bond('kavyur')+calm(3),go:'a2f_portao'}},
      fail:()=>({text:P(L(`Você não consegue achar as palavras. Fica em silêncio tempo demais. Do outro lado, ele desliga.

Dois minutos depois, chega uma mensagem de um número que você não conhece. É do Kavyur: "O círculo no pulso segura ele de pé. Ele disse pra acertar ali. Ele não vai admitir que disse."`,`You can't find the words. You stay silent too long. On the other end, he hangs up.

Two minutes later, a text arrives from a number you don't know. It's from Kavyur: "The circle on his wrist keeps him standing. He said to hit it there. He won't admit he said it."`,`No encuentras las palabras. Te quedas callado demasiado tiempo. Del otro lado, corta.

Dos minutos después llega un mensaje de un número que no conoces. Es de Kavyur: "El círculo de la muñeca lo mantiene de pie. Dijo que le pegues ahí. No va a admitir que lo dijo."`))+bond('kavyur'),go:'a2f_portao'})}
  ]},

a2f_portao:{act:KV,title:L('O portão da vó','Grandma\'s gate','El portón de la abuela'),checkpoint:true,
  text:()=>P(L(`O dia do aniversário do vô. Faz nove anos.

A rua voltou a ter gente: casas pintadas, carros novos, um mercadinho na esquina. Só a casa da vó continua fechada, com a mangueira do quintal morta e as janelas de tábua. Ninguém nunca quis comprar.

Na frente do portão, de capa de chuva, um homem passa tinta branca no ferro com um pincel largo. Devagar. Com cuidado. Como quem faz isso todo ano.

Ele sente você antes de se virar. "Achei que você ia demorar mais", ele diz.`,
`Grandpa's birthday. Nine years to the day.

The street has people again: painted houses, new cars, a corner store. Only Grandma's house is still shut, the backyard mango tree dead, the windows boarded. Nobody ever wanted to buy it.

In front of the gate, in a raincoat, a man is brushing white paint onto the iron with a wide brush. Slowly. Carefully. Like someone who does it every year.

He senses you before he turns around. "I thought you'd take longer," he says.`,
`El cumpleaños del abuelo. Nueve años exactos.

La calle volvió a tener gente: casas pintadas, autos nuevos, un almacén en la esquina. Solo la casa de la abuela sigue cerrada, con el mango del patio muerto y las ventanas tapiadas. Nadie quiso comprarla nunca.

Frente al portón, con impermeable, un hombre pasa pintura blanca sobre el hierro con un pincel ancho. Despacio. Con cuidado. Como quien lo hace todos los años.

Te siente antes de darse vuelta. "Pensé que ibas a tardar más", dice.`))+loseSan('1d3',L('o portão','the gate','el portón')),
  choices:()=>[
    {once:'nome',label:L('"Adam Zart."','"Adam Zart."','"Adam Zart."'),
      run:()=>({text:P(L(`Ele larga o pincel no balde e te olha de cima a baixo. "O menino do telhado." Ele sorri, cansado. "Você pulou do telhado da garagem com o pequeno no colo. Eu vi. Eu devia ter ido atrás." Ele puxa a manga da capa. O círculo no pulso acende, vermelho. "Todo ano eu venho aqui e penso nisso."`,`He drops the brush into the bucket and looks you up and down. "The boy on the roof." He smiles, tired. "You jumped off the garage roof with the little one in your arms. I saw. I should've gone after you." He pulls back his raincoat sleeve. The circle on his wrist lights up, red. "Every year I come here and think about that."`,`Suelta el pincel en el balde y te mira de arriba abajo. "El chico del techo." Sonríe, cansado. "Saltaste del techo del garaje con el chiquito en brazos. Te vi. Debí haber ido tras ustedes." Se sube la manga del impermeable. El círculo de la muñeca se enciende, rojo. "Cada año vengo acá y pienso en eso."`))+loseSan('1d3',L('o menino do telhado','the boy on the roof','el chico del techo'))})},
    {label:L('Sacar a Raijin','Draw Raijin','Desenvainar la Raijin'),main:true,
      run:()=>({text:P(L(`Derick se posiciona do seu lado esquerdo. O homem suspira, pega o pincel de volta, e a tinta branca na ponta fica vermelha.`,`Derick takes your left side. The man sighs, picks the brush back up, and the white paint on its tip turns red.`,`Derick se pone a tu izquierda. El hombre suspira, vuelve a agarrar el pincel, y la pintura blanca de la punta se vuelve roja.`))+(S.flags.vtdica?P(L(`Você lembra da voz do VT: acerta o pulso primeiro.`,`You remember VT's voice: go for the wrist first.`,`Recuerdas la voz de VT: pégale a la muñeca primero.`)):''),combat:{id:'limpador',after:'a2g_verdade',allies:['derick16'],weak:!!S.flags.vtdica,winText:L('A Raijin corta o pulso dele. O círculo apaga. De repente, nove anos de dor chegam todos de uma vez, e ele cai sentado na calçada, encostado no portão da vó.','Raijin cuts across his wrist. The circle goes dark. Suddenly nine years of pain arrive all at once, and he drops to the sidewalk, slumped against Grandma\'s gate.','La Raijin le corta la muñeca. El círculo se apaga. De repente, nueve años de dolor llegan todos juntos, y cae sentado en la vereda, apoyado contra el portón de la abuela.')}})}
  ]},

a2g_verdade:{act:KV,title:L('Por quê','Why','Por qué'),
  text:()=>P(L(`"Sílvio", ele diz, sem você perguntar. "O meu nome é Sílvio. Achei que você ia querer saber."

Ele fala olhando para a casa, não para você.

"Seu pai trabalhou num filme em Atlanta. O produtor era um homem chamado Otto Brenner. Uma noite, depois da gravação, o seu pai voltou no set para buscar as luvas e viu o Brenner fazendo um ritual com os figurantes. Com o sangue deles." Ele respira fundo. "O fogo no dia seguinte era para matar o seu pai. Ele sobreviveu. Rindo, dizem."

"Então o Brenner esperou. Esperou ele vir para o Brasil. Esperou o dia em que ele estivesse em casa com todo mundo que ele amava, com todo mundo para quem ele podia ter contado." Sílvio olha para você finalmente. "E me mandou limpar a rua inteira. Ninguém sabia de nada, Adam. Nem a sua mãe. O seu pai nunca contou para ninguém. Morreu por uma coisa que ele guardou sozinho para proteger vocês."`,
`"Sílvio," he says, without you asking. "My name is Sílvio. I figured you'd want to know."

He talks looking at the house, not at you.

"Your father worked on a movie in Atlanta. The producer was a man named Otto Brenner. One night, after the shoot, your father went back to the set to get his gloves and saw Brenner performing a ritual on the extras. With their blood." He takes a deep breath. "The fire the next day was meant to kill your father. He survived. Laughing, they say."

"So Brenner waited. Waited for him to come to Brazil. Waited for the day he'd be home with everyone he loved, everyone he might have told." Sílvio finally looks at you. "And sent me to clean the whole street. Nobody knew anything, Adam. Not even your mother. Your father never told anyone. He died for something he kept to himself to protect all of you."`,
`"Sílvio", dice, sin que le preguntes. "Me llamo Sílvio. Pensé que ibas a querer saberlo."

Habla mirando la casa, no a ti.

"Tu padre trabajó en una película en Atlanta. El productor era un hombre llamado Otto Brenner. Una noche, después del rodaje, tu padre volvió al set a buscar sus guantes y vio a Brenner haciendo un ritual con los extras. Con su sangre." Respira hondo. "El fuego del día siguiente era para matar a tu padre. Sobrevivió. Riéndose, dicen."

"Entonces Brenner esperó. Esperó que viniera a Brasil. Esperó el día en que estuviera en casa con todos los que amaba, con todos a los que podría haberles contado." Sílvio por fin te mira. "Y me mandó limpiar la calle entera. Nadie sabía nada, Adam. Ni tu madre. Tu padre nunca le contó a nadie. Murió por algo que guardó solo para protegerlos."`))+loseSan('2d4',L('a verdade','the truth','la verdad'))+bond('maxwel',2),
  choices:()=>[
    {once:'luvas',label:L('Olhar para as luvas nas suas mãos','Look at the gloves on your hands','Mirar los guantes en tus manos'),
      run:()=>({text:P(L(`Couro gasto, "M.Z." bordado no punho. As luvas que o seu pai voltou para buscar naquele set. As luvas que ele jogou no seu colo no carro, rindo: "Agora quem cai é você." Você não sabe quanto tempo fica olhando para elas. Derick não te apressa.`,`Worn leather, "M.Z." stitched on the cuff. The gloves your father went back to that set for. The gloves he tossed in your lap in the car, laughing: "Now you're the one falling." You don't know how long you stare at them. Derick doesn't rush you.`,`Cuero gastado, "M.Z." bordado en el puño. Los guantes que tu padre volvió a buscar a ese set. Los guantes que te tiró en el regazo en el auto, riendo: "Ahora el que cae eres tú." No sabes cuánto tiempo te quedas mirándolos. Derick no te apura.`))+bond('maxwel')+calm(3)})},
    {label:L('Levar o Sílvio vivo para a Ordem','Take Sílvio to the Order alive','Llevar a Sílvio vivo a la Orden'),main:true,
      run:()=>{S.flags.poupou=true;return {text:P(L(`Por um segundo, a Raijin fica no alto. Nove anos pedem para você descer ela de uma vez. A sua mão treme. Então você lembra de tudo o que ele sabe. Você abaixa devagar. "Você vai contar tudo o que sabe sobre o Brenner. Para a Ordem. Por quantos anos precisar."

Sílvio te olha como se não entendesse. Derick também. Depois, Derick entende primeiro. "Foi a escolha que o meu pai nunca te deu", ele diz baixinho. "E a que você nunca teve naquela noite."

Você algema o Sílvio no portão. Depois pega o pincel e termina de pintar. De branco.`,`For a second, Raijin stays raised. Nine years are begging you to bring it down all at once. Your hand shakes. Then you remember everything he knows. You lower it slowly. "You're going to tell everything you know about Brenner. To the Order. For as many years as it takes."

Sílvio looks at you as if he doesn't understand. So does Derick. Then Derick understands first. "It's the choice my father never gave you," he says quietly. "And the one you never had that night."

You cuff Sílvio to the gate. Then you pick up the brush and finish painting. White.`,`Por un segundo, la Raijin queda en alto. Nueve años te piden que la bajes de una vez. Te tiembla la mano. Entonces recuerdas todo lo que él sabe. La bajas despacio. "Vas a contar todo lo que sabes sobre Brenner. A la Orden. Por los años que haga falta."

Sílvio te mira como si no entendiera. Derick también. Después, Derick entiende primero. "Es la elección que mi padre nunca te dio", dice bajito. "Y la que tú nunca tuviste esa noche."

Esposas a Sílvio al portón. Después agarras el pincel y terminas de pintar. De blanco.`))+bond('derick',2)+calm(3),go:'a2h_fim'}}}
  ]},

a2h_fim:{act:KV,title:L('Fim do Capítulo 1','End of Chapter 1','Fin del Capítulo 1'),
  text:()=>P(L(`No caminho de volta, Derick dirige. Você fica olhando pela janela, girando o relógio do Thomas no pulso.

"Otto Brenner", Derick diz, sem tirar os olhos da estrada. "Eu pesquisei enquanto você pintava. Ele ainda produz filmes. Tem um sendo gravado aqui no Brasil agora." Ele faz uma pausa. "Precisa de dublês."

Você para de girar o relógio.`,
`On the way back, Derick drives. You stare out the window, turning Thomas's watch around your wrist.

"Otto Brenner," Derick says, eyes on the road. "I looked him up while you were painting. He still produces movies. He's got one shooting here in Brazil right now." He pauses. "It needs stunt performers."

You stop turning the watch.`,
`De regreso, maneja Derick. Tú miras por la ventana, girando el reloj de Thomas en la muñeca.

"Otto Brenner", dice Derick, sin sacar los ojos de la ruta. "Lo busqué mientras pintabas. Todavía produce películas. Tiene una rodándose acá en Brasil ahora mismo." Hace una pausa. "Necesita dobles de riesgo."

Dejas de girar el reloj.`)),
  choices:()=>[{label:L('Ver o relatório','See the report','Ver el informe'),main:true,run:()=>({end:true})}]}
});
}

function buildAct2C1b(){
Object.assign(BOND_NAME,{juliana:'Juliana',logan:'Logan',flavio:'Flavio',ohana:'Olívia'});
const K=L('Ato II · Cap. 1 · O Limpador','Act II · Ch. 1 · The Cleaner','Acto II · Cap. 1 · El Limpiador');
const KV=L('Ato II · Cap. 1 · A verdade','Act II · Ch. 1 · The truth','Acto II · Cap. 1 · La verdad');
SCENES.a2a_base.text=()=>`<div class="profile" style="margin:0 0 16px;border-left:3px solid var(--accent)"><p class="hint" style="margin:0 0 4px">${L('Antes de começar','Before you begin','Antes de empezar')}</p><p style="margin:0">${L('Esta história continua depois dos acontecimentos de <b>Succedere: a história de Koranna Wezen</b>.','This story continues after the events of <b>Succedere: the story of Koranna Wezen</b>.','Esta historia continúa después de los acontecimientos de <b>Succedere: la historia de Koranna Wezen</b>.')}</p></div>`+P(L(`A Base fica embaixo de um bar. Lá em cima, a Juliana abre às seis, limpa o balcão, serve cerveja para quem não faz ideia do que existe cinco andares abaixo e avisa pelo interfone quando alguém estranho entra.

Aqui embaixo, ainda é quieto demais. Tinha quarenta pessoas. Agora tem dez. O Logan, médico, e a Iris, assistente dele, reconstruíram a enfermaria quase do zero. O Flavio cuida do arsenal como se cada arma fosse dele. Na sala de treino, a Koranna corrige a guarda do Tuninho pela décima vez, enquanto a Maitê retoca o batom vinho entre um exercício e outro. A Maitê chegou pelas mãos da Olívia, a agente que estava longe da Ordem na noite do massacre e voltou. E que amanhã vai embora de novo, em outra missão.

O Derick, dezesseis anos, cuida das contas e dos relatórios que ninguém mais sobrou para fazer. Você usa o relógio do Thomas no pulso esquerdo. Ainda não conseguiu tirar.

Você está saindo para uma viagem de recrutamento quando a TV do refeitório mostra um incêndio. Uma rua inteira, de madrugada. Os bombeiros falam em "surto". A câmera passa rápido por um portão. Tem alguma coisa pintada nele.

E atrás dos bombeiros, de capa de chuva, com um balde de tinta na mão, um homem de cinquenta e poucos anos olha direto para a câmera.

Você conhece aquele rosto. Faz nove anos que conhece.`,
`The Base sits beneath a bar. Upstairs, Juliana opens at six, wipes down the counter, serves beer to people who have no idea what exists five floors below, and calls down on the intercom when a stranger walks in.

Down here, it's still too quiet. There were forty people. Now there are ten. Logan, the doctor, and Iris, his assistant, rebuilt the infirmary almost from scratch. Flavio runs the armory as if every weapon were his own. In the training room, Koranna corrects Tuninho's guard for the tenth time, while Maitê touches up her wine lipstick between drills. Maitê came in through Olívia, the agent who was far from the Order the night of the massacre and came back. And who's leaving again tomorrow, on another mission.

Derick, sixteen, handles the accounts and the reports nobody else is left to write. You wear Thomas's watch on your left wrist. You still haven't been able to take it off.

You're heading out on a recruiting trip when the cafeteria TV shows a fire. A whole street, before dawn. The firefighters say "outbreak". The camera sweeps past a gate. Something is painted on it.

And behind the firefighters, in a raincoat, holding a bucket of paint, a man in his early fifties looks straight into the camera.

You know that face. You've known it for nine years.`,
`La Base está debajo de un bar. Arriba, Juliana abre a las seis, limpia la barra, les sirve cerveza a quienes no tienen idea de lo que existe cinco pisos más abajo, y avisa por el interfono cuando entra alguien extraño.

Acá abajo, todavía está demasiado callado. Había cuarenta personas. Ahora hay diez. Logan, el médico, e Iris, su asistente, reconstruyeron la enfermería casi desde cero. Flavio cuida el arsenal como si cada arma fuera suya. En la sala de entrenamiento, Koranna le corrige la guardia a Tuninho por décima vez, mientras Maitê se retoca el labial color vino entre un ejercicio y otro. Maitê llegó de la mano de Olívia, la agente que estaba lejos de la Orden la noche de la masacre y volvió. Y que mañana se va otra vez, a otra misión.

Derick, dieciséis años, se ocupa de las cuentas y los informes que ya no queda nadie para hacer. Tú llevas el reloj de Thomas en la muñeca izquierda. Todavía no pudiste sacártelo.

Estás saliendo para un viaje de reclutamiento cuando la tele del comedor muestra un incendio. Una calle entera, de madrugada. Los bomberos hablan de "brote". La cámara pasa rápido por un portón. Hay algo pintado en él.

Y detrás de los bomberos, con impermeable y un balde de pintura en la mano, un hombre de cincuenta y pocos mira directo a la cámara.

Conoces esa cara. La conoces hace nueve años.`))+loseSan('1d3',L('o rosto','the face','la cara'));
SCENES.a2a_base.choices=()=>[
  {once:'koranna',label:L('Falar com a Koranna','Talk to Koranna','Hablar con Koranna'),
    run:()=>({text:P(L(`Ela viu a sua cara antes de ver a TV. "Quem é?" Você conta. Pouco, do seu jeito. Ela escuta sem interromper, apoiada na lança. Quando você termina, ela ajeita a gola do seu colete, que estava torta, e deixa a mão ali um segundo a mais do que precisava.

"Vai", ela diz. "A Base fica comigo. Mas leva o Derick. E volta."

Não é uma ordem. Também não é um pedido. Você não sabe o que é. Você só sabe que, pela primeira vez em muito tempo, alguém vai ficar esperando.`,`She saw your face before she saw the TV. "Who is he?" You tell her. Briefly, your way. She listens without interrupting, leaning on her spear. When you finish, she straightens the collar of your vest, which was crooked, and leaves her hand there a second longer than she needs to.

"Go," she says. "The Base stays with me. But take Derick. And come back."

It isn't an order. It isn't a request either. You don't know what it is. You only know that, for the first time in a long time, someone is going to be waiting.`,`Te vio la cara antes de ver la tele. "¿Quién es?" Le cuentas. Poco, a tu manera. Escucha sin interrumpir, apoyada en la lanza. Cuando terminas, te acomoda el cuello del chaleco, que estaba torcido, y deja la mano ahí un segundo más de lo necesario.

"Ve", dice. "La Base queda conmigo. Pero llévate a Derick. Y vuelve."

No es una orden. Tampoco es un pedido. No sabes qué es. Solo sabes que, por primera vez en mucho tiempo, alguien va a quedarse esperando.`))+bond('koranna',2)})},
  {once:'ohana',label:L('Despedir-se da Olívia','Say goodbye to Olívia','Despedirte de Olívia'),
    run:()=>({text:P(L(`Ela está fechando a mochila na garagem. "Eu trouxe a Maitê e já estou indo de novo, eu sei." Ela dá um meio sorriso. "Tem gente lá fora que ainda não sabe que a Ordem existe, Mada. Alguém tem que ir buscar." Você aperta a mão dela. Depois, sem saber bem por quê, dá um abraço. Ela não esperava. "Volta inteira", você diz. As palavras do VT saem da sua boca antes que você perceba.`,`She's zipping her backpack in the garage. "I brought Maitê and I'm already leaving again, I know." She gives a half smile. "There are people out there who still don't know the Order exists, Mada. Someone has to go get them." You shake her hand. Then, without quite knowing why, you hug her. She didn't expect it. "Come back in one piece," you say. VT's words leave your mouth before you notice.`,`Está cerrando la mochila en el garaje. "Traje a Maitê y ya me voy otra vez, lo sé." Sonríe a medias. "Hay gente allá afuera que todavía no sabe que la Orden existe, Mada. Alguien tiene que ir a buscarla." Le das la mano. Después, sin saber bien por qué, la abrazas. No lo esperaba. "Vuelve entera", dices. Las palabras de VT te salen de la boca antes de que te des cuenta.`))+bond('ohana')})},
  {once:'enfermaria',label:L('Passar na enfermaria do Logan','Stop by Logan\'s infirmary','Pasar por la enfermería de Logan'),
    run:()=>({text:P(L(`O Logan nem levanta os olhos do microscópio. "Se for sair, leva isso." A Iris já está enfiando dois tubos de cicatrizante no bolso do seu colete antes que você responda. "E volta com o mesmo número de braços", ela diz. O Logan concorda com a cabeça. É o mais perto de carinho que você vai ouvir daqueles dois.`,`Logan doesn't even look up from the microscope. "If you're heading out, take these." Iris is already tucking two tubes of healing spray into your vest pocket before you can answer. "And come back with the same number of arms," she says. Logan nods. It's the closest thing to affection you'll hear from those two.`,`Logan ni levanta la vista del microscopio. "Si vas a salir, llévate esto." Iris ya te está metiendo dos tubos de cicatrizante en el bolsillo del chaleco antes de que respondas. "Y vuelve con la misma cantidad de brazos", dice. Logan asiente. Es lo más parecido a cariño que vas a oír de esos dos.`))+addLoot('cicatrizante')+addLoot('cicatrizante')+bond('logan')})},
  {once:'flavio',label:L('Passar no arsenal do Flavio','Stop by Flavio\'s armory','Pasar por el arsenal de Flavio'),
    run:()=>({text:P(L(`O Flavio está polindo uma escopeta que ninguém usa há anos. "Raijin afiada, proteção revisada", ele diz sem você perguntar. "Quer levar mais alguma coisa? Eu separo."`,`Flavio is polishing a shotgun nobody has used in years. "Raijin sharpened, armor checked," he says before you ask. "Want to take anything else? I'll set it aside."`,`Flavio está puliendo una escopeta que nadie usa hace años. "Raijin afilada, protección revisada", dice antes de que preguntes. "¿Quieres llevar algo más? Te lo separo."`))+bond('flavio'),arsenal:{next:'a2a_base',patente:'elite'}})},
  {once:'juliana',label:L('Subir no bar da Juliana','Go up to Juliana\'s bar','Subir al bar de Juliana'),
    run:()=>({text:P(L(`O bar ainda está vazio. A Juliana te serve um café sem você pedir, forte, do jeito que você gosta. "Vi a TV lá de baixo pelo interfone", ela diz, secando um copo. "Não vou perguntar. Mas quando você voltar, o bar fica aberto até mais tarde." Ela olha para a escada. "A Koranna também vai estar acordada. Só pra você saber."`,`The bar is still empty. Juliana pours you a coffee without being asked, strong, the way you like it. "Saw the TV from downstairs on the intercom," she says, drying a glass. "I won't ask. But when you get back, the bar stays open late." She glances toward the stairs. "Koranna will be up too. Just so you know."`,`El bar todavía está vacío. Juliana te sirve un café sin que lo pidas, fuerte, como te gusta. "Vi la tele de abajo por el interfono", dice, secando un vaso. "No voy a preguntar. Pero cuando vuelvas, el bar queda abierto hasta tarde." Mira hacia la escalera. "Koranna también va a estar despierta. Solo para que lo sepas."`))+bond('juliana')+calm(2)})},
  {once:'derick',label:L('Tentar ir sem o Derick','Try to leave without Derick','Intentar ir sin Derick'),
    run:()=>({text:P(L(`Ele já está na porta da garagem com a mochila nas costas. "Regra de ouro", ele diz. "Ninguém se machuca na sua missão. Nem você." Você abre a boca para discutir. Ele entra no carro primeiro.`,`He's already at the garage door with his backpack on. "Golden rule," he says. "Nobody gets hurt on your mission. Not even you." You open your mouth to argue. He gets in the car first.`,`Ya está en la puerta del garaje con la mochila puesta. "Regla de oro", dice. "Nadie se lastima en tu misión. Ni siquiera tú." Abres la boca para discutir. Él sube al auto primero.`))+bond('derick')})},
  {label:L('Ir até a rua do incêndio','Head to the burning street','Ir a la calle del incendio'),main:true,run:()=>({go:'a2b_rua'})}
];

  {once:'korarq',label:L('Deixar a Koranna entrar','Let Koranna in','Dejar entrar a Koranna'),
    run:()=>({text:P(L(`Ela bate na porta da sala de análise com dois cafés. Não pergunta nada. Senta no chão do seu lado, encostada no armário do Thomas, e fica ali enquanto você lê. Quando a sua mão para em cima de uma folha e não vira mais a página, ela coloca a mão dela em cima da sua. Não aperta. Só deixa ali.

Você pensa em tirar. Faz nove anos que você não deixa ninguém chegar tão perto. Todo mundo que chegou, você perdeu.

Você não tira.`,`She knocks on the analysis room door with two coffees. She doesn't ask anything. She sits on the floor next to you, leaning against Thomas's locker, and stays there while you read. When your hand stops on a page and doesn't turn it anymore, she puts her hand over yours. She doesn't squeeze. She just leaves it there.

You think about pulling away. For nine years you haven't let anyone get this close. Everyone who did, you lost.

You don't pull away.`,`Golpea la puerta de la sala de análisis con dos cafés. No pregunta nada. Se sienta en el piso a tu lado, apoyada en el casillero de Thomas, y se queda ahí mientras lees. Cuando tu mano se detiene sobre una hoja y ya no da vuelta la página, ella pone su mano sobre la tuya. No aprieta. Solo la deja ahí.

Piensas en sacarla. Hace nueve años que no dejas que nadie se acerque tanto. A todos los que se acercaron, los perdiste.

No la sacas.`))+bond('koranna',2)+calm(3)})});return ch};

SCENES.a2i_bar={act:KV,title:L('Depois de fechar','After closing','Después del cierre'),
  text:()=>P(L(`Passa das três da manhã quando vocês chegam. O bar está com as cadeiras em cima das mesas, mas uma luz ainda está acesa atrás do balcão. A Juliana deixou dois copos e uma garrafa, e um bilhete: "Fui dormir. Tranca quando sair. — J."

A Koranna está sentada no último banco do balcão, de moletom, com a lança encostada na parede. Ela não finge que estava fazendo outra coisa. Estava esperando.

O Derick olha para ela, olha para você, e diz que vai dormir com uma rapidez suspeita.`,
`It's past three in the morning when you get back. The chairs are up on the tables, but one light is still on behind the counter. Juliana left two glasses, a bottle and a note: "Went to bed. Lock up when you leave. — J."

Koranna is sitting on the last stool at the counter, in a hoodie, her spear leaning against the wall. She doesn't pretend she was doing something else. She was waiting.

Derick looks at her, looks at you, and announces he's going to bed with suspicious speed.`,
`Pasan las tres de la mañana cuando llegan. El bar tiene las sillas arriba de las mesas, pero una luz sigue prendida detrás de la barra. Juliana dejó dos vasos, una botella y una nota: "Me fui a dormir. Cierra cuando salgas. — J."

Koranna está sentada en el último banco de la barra, con un buzo, la lanza apoyada en la pared. No finge que estaba haciendo otra cosa. Estaba esperando.

Derick la mira, te mira, y dice que se va a dormir con una rapidez sospechosa.`)),
  choices:()=>[
    {once:'contar',label:L('Contar sobre o seu pai','Tell her about your father','Contarle sobre tu padre'),
      run:()=>({text:P(L(`Você fala mais naquela meia hora do que falou no mês inteiro. Atlanta. As luvas. O Brenner. O seu pai rindo no aniversário do vô enquanto guardava tudo sozinho. A Koranna não interrompe nenhuma vez.

"Ele fez o que você faz", ela diz no fim. "Carregou tudo sozinho para ninguém mais precisar carregar." Ela te olha. "Você não precisa fazer igual, Adam."

Ninguém além do seu pai e do VT te chama assim. Você não corrige.`,`You talk more in that half hour than you have all month. Atlanta. The gloves. Brenner. Your father laughing at Grandpa's birthday while keeping it all to himself. Koranna doesn't interrupt once.

"He did what you do," she says at the end. "Carried it all alone so no one else would have to." She looks at you. "You don't have to do the same, Adam."

Nobody but your father and VT calls you that. You don't correct her.`,`Hablas más en esa media hora que en todo el mes. Atlanta. Los guantes. Brenner. Tu padre riéndose en el cumpleaños del abuelo mientras lo guardaba todo solo. Koranna no te interrumpe ni una vez.

"Hizo lo que haces tú", dice al final. "Cargó todo solo para que nadie más tuviera que cargarlo." Te mira. "No tienes que hacer lo mismo, Adam."

Nadie además de tu padre y de VT te llama así. No la corriges.`))+bond('koranna',2)+calm(3)})},
    {once:'porque',label:L('"Por que você ficou acordada?"','"Why did you stay up?"','"¿Por qué te quedaste despierta?"'),
      run:()=>({text:P(L(`Ela gira o copo no balcão. "Porque você disse que ia voltar." Pausa. "E eu queria ver se era verdade." Ela não sorri. Você também não. Mas nenhum dos dois desvia o olhar.`,`She turns the glass on the counter. "Because you said you'd come back." A pause. "And I wanted to see if it was true." She doesn't smile. Neither do you. But neither of you looks away.`,`Gira el vaso sobre la barra. "Porque dijiste que ibas a volver." Pausa. "Y quería ver si era verdad." No sonríe. Tú tampoco. Pero ninguno aparta la mirada.`))+bond('koranna')})},
    {label:L('Ficar','Stay','Quedarte'),main:true,test:{sk:'Vontade',dt:16},
      ok:()=>{S.flags.romance=true;return {text:P(L(`Você senta no banco do lado. Por um tempo, os dois só ficam ali, ouvindo a geladeira do bar. Depois, devagar, ela encosta a cabeça no seu ombro.

Uma parte de você quer levantar. Quer lembrar que todo mundo de quem você gostou está enterrado. Quer ser disciplinado, como sempre.

Você fica. Encosta o rosto no cabelo dela. Não diz nada. Ela sorri como se tivesse ouvido mesmo assim.

Amanhã, o Brenner. Hoje, não.`,`You sit on the stool beside her. For a while, you both just stay there, listening to the bar fridge hum. Then, slowly, she rests her head on your shoulder.

Part of you wants to get up. Wants to remember that everyone you ever cared about is buried. Wants to be disciplined, as always.

You stay. You rest your cheek against her hair. You say nothing. She smiles as if she heard you anyway.

Tomorrow, Brenner. Not tonight.`,`Te sientas en el banco de al lado. Por un rato, los dos solo se quedan ahí, escuchando la heladera del bar. Después, despacio, ella apoya la cabeza en tu hombro.

Una parte de ti quiere levantarse. Quiere recordar que todos los que quisiste están enterrados. Quiere ser disciplinado, como siempre.

Te quedas. Apoyas la cara en su pelo. No dices nada. Ella sonríe como si te hubiera oído igual.

Mañana, Brenner. Esta noche, no.`))+bond('koranna',2)+calm(4),end:true}},
      fail:()=>({text:P(L(`Você senta do lado dela. Ela encosta a cabeça no seu ombro, e o seu corpo inteiro endurece antes que você consiga evitar. Ela percebe. Levanta a cabeça devagar, sem mágoa.

"Tá tudo bem", ela diz. "Eu espero."

Ela pega a lança, te dá um beijo rápido na testa e desce a escada. Você fica sozinho no bar até o dia clarear, girando o relógio do Thomas no pulso.

Amanhã, o Brenner.`,`You sit down beside her. She rests her head on your shoulder, and your whole body stiffens before you can stop it. She notices. She lifts her head slowly, without hurt.

"It's okay," she says. "I'll wait."

She picks up her spear, gives you a quick kiss on the forehead and heads downstairs. You stay alone in the bar until dawn, turning Thomas's watch around your wrist.

Tomorrow, Brenner.`,`Te sientas a su lado. Ella apoya la cabeza en tu hombro, y todo tu cuerpo se tensa antes de que puedas evitarlo. Lo nota. Levanta la cabeza despacio, sin rencor.

"Está bien", dice. "Yo espero."

Agarra la lanza, te da un beso rápido en la frente y baja la escalera. Te quedas solo en el bar hasta que amanece, girando el reloj de Thomas en la muñeca.

Mañana, Brenner.`))+bond('koranna'),end:true})}
  ]};
}

  colheiteiros:{human:true,eyes:true,name:L('Colheiteiros','Harvesters','Cosechadores'),kind:L('Humanos · grupo','Humans · group','Humanos · grupo'),el:null,pv:140,def:22,atk:15,dmg:'2d10+5',res:6,init:5,presence:null,
    desc:L('Seguranças de set, de camiseta preta e crachá da produção. Por baixo da manga, todos têm o círculo riscado no pulso. Nenhum deles brilha como o do Sílvio. Ainda.','Set security in black T-shirts and production badges. Under their sleeves, every one of them has the scratched circle on the wrist. None of them glows like Sílvio\'s. Yet.','Seguridad de set, con remera negra y credencial de producción. Bajo la manga, todos tienen el círculo rayado en la muñeca. Ninguno brilla como el de Sílvio. Todavía.')},
  brenner:{eyes:true,name:L('Otto Brenner, o Aspirante','Otto Brenner, the Aspirant','Otto Brenner, el Aspirante'),kind:L('Humano fundido ao Sangue','Human fused with Blood','Humano fundido con la Sangre'),el:'sangue',pv:270,def:24,atk:17,dmg:'3d8+6',res:9,init:6,
    presence:{dt:20,san:'1d6'},special:{every:3,kind:'atk',name:L('Chamado do Trono','Call of the Throne','Llamado del Trono'),text:L('O trono atrás dele pulsa, e o sangue do chão sobe pelas suas pernas como mãos.','The throne behind him pulses, and the blood on the floor climbs your legs like hands.','El trono detrás de él late, y la sangre del piso te sube por las piernas como manos.'),dmg:'5d8+6'},
    desc:L('Setenta anos, cabelo branco penteado para trás, terno de linho. Ou era, cinco minutos atrás. Agora metade do corpo dele já é do trono: a pele do braço direito se abre em veias que descem até o chão e sobem pelo encosto de carne. Ele sorri com educação. "O seu pai também não soube a hora de ir embora."','Seventy, white hair combed back, a linen suit. Or he was, five minutes ago. Now half his body already belongs to the throne: the skin of his right arm splits into veins that run down to the floor and up the backrest of flesh. He smiles politely. "Your father didn\'t know when to leave either."','Setenta años, pelo blanco peinado hacia atrás, traje de lino. O lo era, hace cinco minutos. Ahora la mitad de su cuerpo ya es del trono: la piel del brazo derecho se abre en venas que bajan al piso y suben por el respaldo de carne. Sonríe con educación. "Tu padre tampoco supo cuándo irse."')}
});

ITEMS.cinzas=Object.assign({},ITEMS.punhal,{dmg:undefined,kind:'op',name:L('Punhal de Cinzas','Ash Dagger','Puñal de Cenizas'),special:true,cat:3,sp:1,desc:L('Um punhal de lâmina cinzenta que esfarela nas bordas e nunca termina de esfarelar. Morte pura, guardada no cofre da Ordem há décadas. Não serve para lutar. Serve para conter.','A grey-bladed dagger that crumbles at the edges and never finishes crumbling. Pure Death, kept in the Order\'s vault for decades. It\'s not for fighting. It\'s for containing.','Un puñal de hoja gris que se desmorona en los bordes y nunca termina de desmoronarse. Muerte pura, guardada en la bóveda de la Orden hace décadas. No sirve para pelear. Sirve para contener.')});

Object.assign(CLUES,{
  trono:c(L('O Trono de Sangue','The Throne of Blood','El Trono de Sangre'),L('A Relíquia de Sangue, sem portador, se manifesta como um trono de carne e sangue. Quem sentar nele e sobreviver vira o novo Diabo. Há vinte anos, a Colheita alimenta o trono rua por rua, para que o Brenner aguente sentar.','The Blood Relic, without a bearer, manifests as a throne of flesh and blood. Whoever sits on it and survives becomes the new Devil. For twenty years, the Harvest has been feeding the throne street by street, so Brenner can survive sitting on it.','La Reliquia de Sangre, sin portador, se manifiesta como un trono de carne y sangre. Quien se siente en él y sobreviva se vuelve el nuevo Diablo. Hace veinte años que la Cosecha alimenta el trono calle por calle, para que Brenner aguante sentarse.')),
  opressor:c(L('O elemento opressor','The oppressing element','El elemento opresor'),L('Uma relíquia só pode ser destruída ou contida pela força do elemento que a oprime. O Sangue cede à Morte. Para conter o trono, é preciso Morte pura.','A relic can only be destroyed or contained by the force of the element that oppresses it. Blood yields to Death. To contain the throne, you need pure Death.','Una reliquia solo puede ser destruida o contenida por la fuerza del elemento que la oprime. La Sangre cede ante la Muerte. Para contener el trono, hace falta Muerte pura.')),
  contratos:c(L('Os contratos dos figurantes','The extras\' contracts','Los contratos de los extras'),L('Quarenta figurantes contratados para "a cena final". Em cada ficha, o tipo sanguíneo circulado em vermelho. Nenhum deles tem data de volta para casa.','Forty extras hired for "the final scene". On every form, the blood type circled in red. None of them has a date to go home.','Cuarenta extras contratados para "la escena final". En cada ficha, el grupo sanguíneo marcado en rojo. Ninguno tiene fecha de regreso a casa.'))
});
