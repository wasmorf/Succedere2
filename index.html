No banco de trás, o Derick segura a caixa de chumbo no colo. A esfera de Energia, lá dentro, zumbe. A Maitê insistiu. "Morte cede à Energia. Se ela vier, você vai precisar disso." O Kavyur confere o pente da pistola do VT pela décima vez. A Koranna aperta a lança com uma mão e o seu joelho com a outra.

Na porta do casarão, dois homens de branco, como enfermeiros. Os jalecos não escondem direito os fuzis. Numa placa de bronze, o sol dentro da espiral.`,`The avenue of yellow ipê trees climbs to a white mansion at the top of the hill. The flowers fall without stopping, covering the ground, the hood of the car, your shoulders. It's beautiful. It's the most beautiful thing you've seen in months, and that scares you.

In the back seat, Derick holds the lead box in his lap. The Energy sphere, inside, hums. Maitê insisted. "Death yields to Energy. If she comes, you'll need this." Kavyur checks the magazine of VT's pistol for the tenth time. Koranna grips her spear with one hand and your knee with the other.

At the mansion door, two men in white, like nurses. Their coats don't quite hide the rifles. On a bronze plaque, the sun inside the spiral.`,`La alameda de ipês amarillos sube hasta una casona blanca en lo alto de la sierra. Las flores caen sin parar, cubriendo el piso, el capó del auto, tus hombros. Es hermoso. Es lo más hermoso que viste en meses, y eso te da miedo.

En el asiento de atrás, Derick sostiene la caja de plomo en el regazo. La esfera de Energía, adentro, zumba. Maitê insistió. "La Muerte cede ante la Energía. Si viene, vas a necesitar esto." Kavyur revisa el cargador de la pistola de VT por décima vez. Koranna aprieta la lanza con una mano y tu rodilla con la otra.

En la puerta de la casona, dos hombres de blanco, como enfermeros. Las batas no alcanzan a esconder los fusiles. En una placa de bronce, el sol dentro de la espiral.`)),
  choices:()=>[
    {once:'entrada5',label:L('Entrar pela lavanderia','Go in through the laundry','Entrar por la lavandería'),test:{sk:'Furtividade',dt:17},
      ok:()=>{S.flags.a5furtivo=true;return {text:P(L(`Você dá a volta pelo mato, pula o muro baixo dos fundos e entra pela porta da lavanderia, entre lençóis brancos pendurados. Dois guardas fumam no corredor de trás. Você passa a um metro deles. Quando eles perceberem, metade da equipe vai estar lá dentro.`,`You circle through the brush, hop the low back wall and slip in through the laundry door, between hanging white sheets. Two guards are smoking in the back corridor. You pass a meter from them. By the time they notice, half the team will be inside.`,`Rodeas por el monte, saltas el muro bajo de atrás y entras por la puerta de la lavandería, entre sábanas blancas colgadas. Dos guardias fuman en el pasillo de atrás. Pasas a un metro de ellos. Cuando se den cuenta, medio equipo va a estar adentro.`))}},
      fail:()=>({text:P(L(`Um lençol molhado cai do varal em cima de você. Um guarda vira a cabeça. O rádio dele chia. Dentro do casarão, alguém grita uma ordem. Eles sabem que vocês chegaram.`,`A wet sheet falls off the line on top of you. A guard turns his head. His radio crackles. Inside the mansion, someone shouts an order. They know you're here.`,`Una sábana mojada se cae del tendedero encima de ti. Un guardia gira la cabeza. Su radio chirría. Dentro de la casona, alguien grita una orden. Saben que llegaron.`))})},
    {label:L('Entrar','Go in','Entrar'),main:true,
      run:()=>({text:P(L(`Os homens de branco saem de todas as portas ao mesmo tempo. Eles não gritam. Eles só apontam e esperam o primeiro passo de vocês.

O Kavyur dá o primeiro passo.`,`The men in white come out of every door at once. They don't shout. They just aim and wait for your first step.

Kavyur takes the first step.`,`Los hombres de blanco salen de todas las puertas a la vez. No gritan. Solo apuntan y esperan su primer paso.

Kavyur da el primer paso.`)),combat:{id:'guardaslz',after:'a5i_corredor',allies:['koranna','derick16','kavyur'],weak:!!S.flags.a5furtivo,winText:L('O último homem de branco cai de costas numa maca, que sai rodando pelo corredor até bater na parede. Silêncio. Só as flores de ipê batendo nas janelas.','The last man in white falls backward onto a gurney, which rolls down the corridor until it hits the wall. Silence. Only the ipê flowers tapping on the windows.','El último hombre de blanco cae de espaldas sobre una camilla, que sale rodando por el pasillo hasta chocar contra la pared. Silencio. Solo las flores de ipê golpeando las ventanas.')}})}
  ]},

a5i_corredor:{act:KC,title:L('Os que esperam','Those who wait','Los que esperan'),
  text:()=>P(L(`O corredor do Solar é comprido e branco, com quartos dos dois lados. Em cada quarto, uma cama. Em cada cama, um velho ligado a máquinas. Nenhum deles se mexe. Nenhum deles morre. Os relógios na parede de cada quarto estão parados, todos, na mesma hora: 3h17.

"Ele guarda gente morrendo", sussurra o Derick. "Para quê?"

"Para ela achar o caminho", diz o Kavyur. "Isso aqui é uma isca. A casa inteira é uma isca."

No fim do corredor, uma porta dupla de madeira escura. Do lado, uma sala de vidro, iluminada como um museu.`,`The Solar's corridor is long and white, with rooms on both sides. In each room, a bed. In each bed, an old person hooked up to machines. None of them move. None of them die. The clocks on the wall of every room have stopped, all of them, at the same time: 3:17.

"He keeps dying people," Derick whispers. "What for?"

"So she finds the way," says Kavyur. "This place is bait. The whole house is bait."

At the end of the corridor, a double door of dark wood. Beside it, a glass room, lit like a museum.`,`El pasillo del Solar es largo y blanco, con cuartos a los dos lados. En cada cuarto, una cama. En cada cama, un viejo conectado a máquinas. Ninguno se mueve. Ninguno se muere. Los relojes en la pared de cada cuarto están detenidos, todos, en la misma hora: 3:17.

"Guarda gente que se está muriendo", susurra Derick. "¿Para qué?"

"Para que ella encuentre el camino", dice Kavyur. "Esto es una carnada. Toda la casa es una carnada."

Al final del pasillo, una puerta doble de madera oscura. Al lado, una sala de vidrio, iluminada como un museo.`))+loseSan('1d4',L('os que esperam','those who wait','los que esperan')),
  choices:()=>[
    {once:'vitrine5',label:L('Entrar na sala de vidro','Go into the glass room','Entrar en la sala de vidrio'),
      run:()=>({text:P(L(`Quatro pedestais vazios com plaquinhas de bronze: SANGUE. ENERGIA. CONHECIMENTO. MORTE. Três deles têm um X riscado na plaquinha, fresco, com raiva.

Na parede do fundo, fotos. Centenas. Você aos nove anos, no aeroporto, com a mochila maior que você. Você aos dezesseis, no primeiro trabalho de dublê. Você na rua da vó, na noite do fogo, com dezessete anos, sujo de sangue, carregando o Bob. Você no enterro do Thomas. Você no telhado do Estúdio Imperial, beijando a Koranna.

Vinte anos da sua vida, emoldurados. Alguém assistiu a tudo.

A Koranna arranca a última foto da parede e rasga em quatro. Ninguém impede.`,`Four empty pedestals with little bronze plaques: BLOOD. ENERGY. KNOWLEDGE. DEATH. Three of them have an X scratched on the plaque, fresh, angry.

On the back wall, photos. Hundreds. You at nine, at the airport, your backpack bigger than you. You at sixteen, on your first stunt job. You on Grandma's street, the night of the fire, seventeen, covered in blood, carrying Bob. You at Thomas's funeral. You on the roof of the Imperial Studio, kissing Koranna.

Twenty years of your life, framed. Someone watched all of it.

Koranna rips the last photo off the wall and tears it into four. Nobody stops her.`,`Cuatro pedestales vacíos con plaquitas de bronce: SANGRE. ENERGÍA. CONOCIMIENTO. MUERTE. Tres tienen una X rayada en la plaquita, fresca, con rabia.

En la pared del fondo, fotos. Cientos. Tú a los nueve años, en el aeropuerto, con la mochila más grande que tú. Tú a los dieciséis, en tu primer trabajo de doble. Tú en la calle de la abuela, la noche del fuego, con diecisiete años, manchado de sangre, cargando a Bob. Tú en el entierro de Thomas. Tú en el techo del Estudio Imperial, besando a Koranna.

Veinte años de tu vida, enmarcados. Alguien lo miró todo.

Koranna arranca la última foto de la pared y la rompe en cuatro. Nadie se lo impide.`))+loseSan('1d6',L('vinte anos vigiado','twenty years watched','veinte años vigilado'))})},
    {label:L('Abrir a porta dupla','Open the double door','Abrir la puerta doble'),main:true,run:()=>({go:'a5j_mercer'})}
  ]},

a5j_mercer:{act:KC,title:L('Lázaro','Lazarus','Lázaro'),
  text:()=>P(L(`O quarto é enorme e escuro, com cortinas pesadas e cheiro de remédio e flores velhas. Em todas as paredes, relógios. Dezenas. Todos parados em 3h17.

No meio do quarto, numa cama de hospital com lençóis de seda, um homem tão velho que parece feito de papel. Um tubo de oxigênio no nariz. Na mão, uma ampulheta vazia, de vidro e prata.

"Adam", ele diz, e a voz é um sopro. "O do meio. Você cresceu bonito. Tem o sorriso da sua mãe, quando sorri. Você quase nunca sorri." Ele tosse. "Eu tenho as fotos."

"Lázaro Mercer", você diz.

"Ninguém me chama assim há vinte anos." Ele sorri, com dentes demais. "Sente-se. Temos alguns minutos. Ela ainda está a caminho."`,`The room is huge and dark, with heavy curtains and a smell of medicine and old flowers. On every wall, clocks. Dozens. All stopped at 3:17.

In the middle of the room, in a hospital bed with silk sheets, a man so old he seems made of paper. An oxygen tube in his nose. In his hand, an empty hourglass of glass and silver.

"Adam," he says, and his voice is a breath. "The middle one. You grew up handsome. You have your mother's smile, when you smile. You almost never smile." He coughs. "I have the photos."

"Lazarus Mercer," you say.

"No one has called me that in twenty years." He smiles, with too many teeth. "Sit. We have a few minutes. She's still on her way."`,`El cuarto es enorme y oscuro, con cortinas pesadas y olor a remedio y a flores viejas. En todas las paredes, relojes. Decenas. Todos detenidos a las 3:17.

En el medio del cuarto, en una cama de hospital con sábanas de seda, un hombre tan viejo que parece hecho de papel. Un tubo de oxígeno en la nariz. En la mano, un reloj de arena vacío, de vidrio y plata.

"Adam", dice, y la voz es un soplo. "El del medio. Creciste lindo. Tienes la sonrisa de tu madre, cuando sonríes. Casi nunca sonríes." Tose. "Tengo las fotos."

"Lázaro Mercer", dices.

"Nadie me llama así hace veinte años." Sonríe, con demasiados dientes. "Siéntate. Tenemos unos minutos. Ella todavía está en camino."`))+loseSan('1d4',L('o velho','the old man','el viejo')),
  choices:()=>[
    {once:'ouvir5',label:L('Deixar ele falar','Let him talk','Dejarlo hablar'),
      run:()=>({text:P(L(`"Eu financiei o filme em Atlanta. O Otto era meu. O sangue dos figurantes era meu. E o seu pai voltou no set para buscar um par de luvas." Ele ri, sem ar. "Mandei queimar o set com ele dentro. Ele saiu andando, com a pele do braço derretida, e riu na minha cara. Riu."

Ele puxa o oxigênio.

"Foi aí que eu entendi. A Morte vem até quem escapa dela. Ela não resiste. E quem estiver esperando do lado quando ela chegar pode pedir. Eu estou morrendo há vinte e dois anos, Adam. Eu queria pedir tempo." Os olhos dele brilham. "Mas o seu pai só escapou uma vez. Eu precisava de alguém que escapasse mais."

"A rua da vó", você diz. A voz sai estranha.

"O Otto queria todos mortos. Eu pedi os meninos vivos. O do meio era o que me interessava." Ele dá de ombros, um movimento mínimo. "Depois, a Base. Um presente para o Kadu, e um massacre de onde você precisava sair vivo. Os outros que sobreviveram foram sorte. Você não. Depois a usina. Três vezes. Eu esperei cada uma."

O relógio no seu pulso faz tic. A sua família inteira. O Thomas. O Bob. Tudo isso para que você fosse uma isca.

Você não sabe que está chorando até a Koranna segurar a sua mão.`,`"I financed the movie in Atlanta. Otto was mine. The extras' blood was mine. And your father went back to the set to get a pair of gloves." He laughs, breathless. "I had the set burned with him inside. He walked out, the skin on his arm melted, and laughed in my face. Laughed."

He pulls at the oxygen.

"That's when I understood. Death comes to whoever escapes her. She can't resist. And whoever is waiting beside them when she arrives can ask. I've been dying for twenty-two years, Adam. I wanted to ask for time." His eyes shine. "But your father only escaped once. I needed someone who escaped more."

"Grandma's street," you say. Your voice comes out strange.

"Otto wanted them all dead. I asked for the boys alive. The middle one was the one I cared about." He shrugs, a tiny movement. "Then the Base. A gift for Kadu, and a massacre you had to walk out of alive. The others who survived were luck. You weren't. Then the plant. Three times. I waited for each one."

The watch on your wrist ticks. Your whole family. Thomas. Bob. All of it so you could be bait.

You don't know you're crying until Koranna takes your hand.`,`"Financié la película en Atlanta. Otto era mío. La sangre de los extras era mía. Y tu padre volvió al set a buscar un par de guantes." Se ríe, sin aire. "Mandé quemar el set con él adentro. Salió caminando, con la piel del brazo derretida, y se me rió en la cara. Se rió."

Tira del oxígeno.

"Ahí lo entendí. La Muerte llega a quien se le escapa. No puede resistirse. Y quien esté esperando al lado cuando ella llegue puede pedir. Me estoy muriendo hace veintidós años, Adam. Quería pedir tiempo." Le brillan los ojos. "Pero tu padre solo se escapó una vez. Necesitaba a alguien que se escapara más."

"La calle de la abuela", dices. La voz te sale rara.

"Otto los quería a todos muertos. Le pedí a los chicos vivos. El del medio era el que me interesaba." Se encoge de hombros, un movimiento mínimo. "Después, la Base. Un regalo para Kadu, y una masacre de la que tenías que salir vivo. Los otros que sobrevivieron fueron suerte. Tú no. Después la usina. Tres veces. Esperé cada una."

El reloj en tu muñeca hace tic. Toda tu familia. Thomas. Bob. Todo eso para que fueras una carnada.

No sabes que estás llorando hasta que Koranna te toma la mano.`))+loseSan('2d6',L('a verdade','the truth','la verdad'))})},
    {once:'nomes5',label:L('Deixar o Kavyur perguntar','Let Kavyur ask','Dejar que Kavyur pregunte'),
      run:()=>({text:P(L(`O Kavyur dá um passo para a frente. A pistola do VT está abaixada, junto da perna.

"Projeto Lázaro", ele diz. "Uma oficina em São Paulo. Três irmãos. Gustavo, Matheus e Marcos Karlovski." Ele tira a foto do bolso e mostra. "Você lembra deles?"

O velho olha a foto com educação, como quem olha o cardápio de um restaurante.

"Não", ele diz.

O Kavyur guarda a foto. As mãos dele não tremem.`,`Kavyur steps forward. VT's pistol hangs down, against his leg.

"Project Lazarus," he says. "A workshop in São Paulo. Three brothers. Gustavo, Matheus and Marcos Karlovski." He takes the photo out of his pocket and shows it. "Do you remember them?"

The old man looks at the photo politely, the way someone looks at a restaurant menu.

"No," he says.

Kavyur puts the photo away. His hands don't shake.`,`Kavyur da un paso adelante. La pistola de VT cuelga, junto a la pierna.

"Proyecto Lázaro", dice. "Un taller en São Paulo. Tres hermanos. Gustavo, Matheus y Marcos Karlovski." Saca la foto del bolsillo y se la muestra. "¿Te acuerdas de ellos?"

El viejo mira la foto con educación, como quien mira el menú de un restaurante.

"No", dice.

Kavyur guarda la foto. No le tiemblan las manos.`))+bond('kavyur')})},
    {once:'segurar5',label:L('Pôr a mão no braço do Kavyur','Put your hand on Kavyur\'s arm','Ponerle la mano en el brazo a Kavyur'),
      run:()=>({text:P(L(`Você segura o braço dele. Não com força. Só para ele saber que você está ali.

O Kavyur olha para a sua mão, e depois para você. "Você fez a sua, Mada. No Fórum. Com a mão que o VT te ensinou." A voz dele quebra só um pouco. "Essa é minha. Pelos meus irmãos. Pelo VT, que ele usou até o fim. Me deixa ter a minha."

Você lembra do estande de tiro. "Quando chegar a hora, a mão é minha." Você disse sim com o silêncio.

Você solta.`,`You take hold of his arm. Not hard. Just so he knows you're there.

Kavyur looks at your hand, then at you. "You did yours, Mada. At the Forum. With the hand VT trained." His voice breaks only a little. "This one is mine. For my brothers. For VT, whom he used to the very end. Let me have mine."

You remember the firing range. "When the time comes, the hand is mine." You said yes with your silence.

You let go.`,`Le agarras el brazo. No con fuerza. Solo para que sepa que estás ahí.

Kavyur mira tu mano, y después a ti. "Tú hiciste la tuya, Mada. En el Foro. Con la mano que VT entrenó." La voz se le quiebra solo un poco. "Esta es mía. Por mis hermanos. Por VT, al que usó hasta el final. Déjame tener la mía."

Recuerdas el polígono. "Cuando llegue la hora, la mano es mía." Dijiste que sí con el silencio.

Sueltas.`))})},
    {label:L('Dar um passo para o lado','Step aside','Hacerte a un lado'),main:true,
      run:()=>{S.flags.kavvinganca=true;return {text:P(L(`Você dá um passo para o lado. É o passo mais difícil da sua vida, e você já caiu de um prédio de nove andares.

O Mercer entende antes de todo mundo. "Não", ele diz. Pela primeira vez, a voz dele tem medo. "Não, não agora, ela está vindo, eu esperei vinte e dois anos, eu só preciso de mais cinco minutos..."

O Kavyur levanta a pistola do VT.

"O VT te mandou um recado", ele diz. "Volta inteiro. Sempre." Ele respira. "Você não vai voltar."

Um tiro. Só um. No meio da testa. Do jeito que o VT ensinou, num estande de tiro, na primeira semana do Kavyur no hangar, quando ele tremia tanto que acertou o teto.

A ampulheta escorrega da mão do Mercer e rola pelo chão.

O Kavyur abaixa a arma. Depois se ajoelha, bem devagar, tira a foto dos irmãos do bolso e deixa no lençol de seda, em cima do peito do velho. E chora. Pela primeira vez desde o enterro, ele chora, e o Derick se ajoelha do lado dele e segura, do jeito que você segurava o Derick quando ele tinha doze anos.`,`You step aside. It's the hardest step of your life, and you've fallen off a nine-story building.

Mercer understands before anyone else. "No," he says. For the first time, his voice is afraid. "No, not now, she's coming, I waited twenty-two years, I only need five more minutes..."

Kavyur raises VT's pistol.

"VT sent you a message," he says. "Come back in one piece. Always." He breathes. "You're not coming back."

One shot. Just one. In the middle of the forehead. The way VT taught him, at a firing range, in Kavyur's first week at the hangar, when he shook so hard he hit the ceiling.

The hourglass slips from Mercer's hand and rolls across the floor.

Kavyur lowers the gun. Then he kneels, very slowly, takes the photo of his brothers out of his pocket and leaves it on the silk sheet, on the old man's chest. And he cries. For the first time since the funeral, he cries, and Derick kneels beside him and holds him, the way you held Derick when he was twelve.`,`Te haces a un lado. Es el paso más difícil de tu vida, y ya te caíste de un edificio de nueve pisos.

Mercer lo entiende antes que nadie. "No", dice. Por primera vez, su voz tiene miedo. "No, ahora no, ella está viniendo, esperé veintidós años, solo necesito cinco minutos más..."

Kavyur levanta la pistola de VT.

"VT te mandó un mensaje", dice. "Vuelve entero. Siempre." Respira. "Tú no vas a volver."

Un disparo. Solo uno. En medio de la frente. Como le enseñó VT, en un polígono, en la primera semana de Kavyur en el hangar, cuando temblaba tanto que le dio al techo.

El reloj de arena se le resbala de la mano a Mercer y rueda por el piso.

Kavyur baja el arma. Después se arrodilla, muy despacio, saca la foto de sus hermanos del bolsillo y la deja sobre la sábana de seda, encima del pecho del viejo. Y llora. Por primera vez desde el entierro, llora, y Derick se arrodilla a su lado y lo sostiene, como tú sostenías a Derick cuando tenía doce años.`))+bond('kavyur',2),go:'a5k_morte'}}}
  ]},

a5k_morte:{act:K,title:L('Ela chega','She arrives','Ella llega'),checkpoint:true,
  text:()=>P(L(`Todos os relógios do quarto voltam a andar ao mesmo tempo. Dezenas de tiques, juntos, como um coração enorme.

O do seu pulso chega no zero.

As cortinas se abrem sozinhas. Lá fora, as flores de ipê param no ar, no meio da queda, como se alguém tivesse pausado o mundo. E pela janela, sem quebrar o vidro, sem pressa, ela entra.

Ela não olha para o corpo do Mercer. Não olha para a ampulheta no chão, nem para o homem que esperou por ela vinte e dois anos. Ela nunca foi dele. Ela olha só para você.

"Adam", ela diz, com a voz de todo mundo que você perdeu.

O Derick abre a caixa de chumbo no chão e empurra para você. A esfera de Energia estala, e a cicatriz no seu peito responde, acendendo como um fio desencapado.

A Koranna se põe do seu lado com a lança. O Kavyur se levanta, com o rosto molhado, e recarrega a pistola do VT.

"Se ela quer você", diz a Koranna, "vai ter que passar pela gente."`,`All the clocks in the room start running at the same time. Dozens of ticks, together, like an enormous heart.

The one on your wrist reaches zero.

The curtains open by themselves. Outside, the ipê flowers stop in midair, mid-fall, as if someone had paused the world. And through the window, without breaking the glass, without hurrying, she comes in.

She doesn't look at Mercer's body. She doesn't look at the hourglass on the floor, or at the man who waited twenty-two years for her. She was never his. She looks only at you.

"Adam," she says, in the voice of everyone you've lost.

Derick opens the lead box on the floor and pushes it toward you. The Energy sphere crackles, and the scar on your chest answers, lighting up like a live wire.

Koranna steps up beside you with her spear. Kavyur gets up, face wet, and reloads VT's pistol.

"If she wants you," says Koranna, "she'll have to get through us."`,`Todos los relojes del cuarto vuelven a andar al mismo tiempo. Decenas de tics, juntos, como un corazón enorme.

El de tu muñeca llega a cero.

Las cortinas se abren solas. Afuera, las flores de ipê se detienen en el aire, a mitad de la caída, como si alguien hubiera pausado el mundo. Y por la ventana, sin romper el vidrio, sin apuro, ella entra.

No mira el cuerpo de Mercer. No mira el reloj de arena en el piso, ni al hombre que la esperó veintidós años. Nunca fue suya. Solo te mira a ti.

"Adam", dice, con la voz de todos los que perdiste.

Derick abre la caja de plomo en el piso y la empuja hacia ti. La esfera de Energía chisporrotea, y la cicatriz en tu pecho responde, encendiéndose como un cable pelado.

Koranna se pone a tu lado con la lanza. Kavyur se levanta, con la cara mojada, y recarga la pistola de VT.

"Si te quiere a ti", dice Koranna, "va a tener que pasar por nosotros."`))+fx(()=>{const b=S.pv,bp=S.pe;S.pv=Math.max(S.pv,Math.round(S.pvMax*.85));S.pe=Math.max(S.pe,Math.round(S.peMax*.6));return `<p class="gain">${L('O tempo parado te dá um fôlego. O Derick passa o spray da Iris nas suas feridas','Stopped time gives you a breath. Derick sprays Iris\'s salve on your wounds','El tiempo detenido te da un respiro. Derick te pasa el spray de Iris en las heridas')}: +${S.pv-b} PV, +${S.pe-bp} PE</p>`}),
  choices:()=>[
    {label:L('Encarar a Morte','Face Death','Enfrentar a la Muerte'),main:true,
      run:()=>({combat:{id:'morte',after:'a5l_oferta',allies:['koranna','derick16','kavyur'],script:'ampulheta'}})}
  ]},

a5l_oferta:{act:K,title:L('Tem lugar','There\'s room','Hay lugar'),
  text:()=>P(L(`A Morte cai de joelhos no meio do quarto, com a cicatriz do raio atravessada no peito de lodo, como uma árvore de luz crescendo por dentro dela. Ela está encolhendo. Virando menor. Virando uma coisa que cabe numa mão.

Mas antes, ela abre uma porta.

Do outro lado, a cozinha da vó. Cheiro de feijão e café. A sua mãe dançando perto do fogão. O seu pai rindo. O vô, a vó. O Thomas com o relógio no pulso. O Bob levantando o polegar. E, encostado na porta dos fundos, de bermuda e chinelo, o VT, com um prato na mão.

Ninguém tem espiral no rosto agora. São eles. São eles de verdade, ou parecem tanto que não faz diferença.

"Tem lugar", diz a Morte, bem baixinho, com a voz da sua mãe. "Você pode descansar, Adam. Você está tão cansado."

Você está. Deus, como você está.`,`Death falls to her knees in the middle of the room, the lightning scar run through her chest of sludge, like a tree of light growing inside her. She's shrinking. Growing smaller. Becoming something that fits in a hand.

But first, she opens a door.

On the other side, Grandma's kitchen. The smell of beans and coffee. Your mother dancing by the stove. Your father laughing. Grandpa, Grandma. Thomas with the watch on his wrist. Bob giving a thumbs-up. And, leaning in the back doorway, in shorts and flip-flops, VT, holding a plate.

No one has a spiral for a face now. It's them. It's really them, or it looks so much like them that it makes no difference.

"There's room," Death says, very softly, in your mother's voice. "You can rest, Adam. You're so tired."

You are. God, you are.`,`La Muerte cae de rodillas en medio del cuarto, con la cicatriz del rayo atravesada en el pecho de lodo, como un árbol de luz creciendo dentro de ella. Se está encogiendo. Haciéndose más chica. Convirtiéndose en algo que cabe en una mano.

Pero antes, abre una puerta.

Del otro lado, la cocina de la abuela. Olor a porotos y café. Tu madre bailando al lado de la cocina. Tu padre riéndose. El abuelo, la abuela. Thomas con el reloj en la muñeca. Bob levantando el pulgar. Y, apoyado en la puerta de atrás, de bermudas y ojotas, VT, con un plato en la mano.

Ya nadie tiene una espiral en la cara. Son ellos. Son ellos de verdad, o se parecen tanto que da igual.

"Hay lugar", dice la Muerte, muy bajito, con la voz de tu madre. "Puedes descansar, Adam. Estás tan cansado."

Lo estás. Dios, cómo lo estás.`))+loseSan('1d6',L('a porta aberta','the open door','la puerta abierta')),
  choices:()=>[
    {label:L('Fechar a porta','Close the door','Cerrar la puerta'),main:true,test:{sk:'Vontade',dt:18},
      ok:()=>{S.flags.a5ficou=true;return {text:P(L(`Você olha para eles uma última vez. Guarda tudo. O jeito que a sua mãe mexe os ombros. O polegar do Bob. O VT de chinelo.

"Ainda não", você diz. "Eu tenho um casamento para ir. E uma casa com quintal."

A sua mãe, do outro lado, para de dançar. E sorri. O sorriso que o Mercer disse que você tem.

Você fecha a porta.

A Morte termina de encolher. No chão, onde ela estava, fica uma ampulheta pequena de vidro preto, com a areia caindo para baixo, do jeito certo. Você pega a ampulheta com a mão que ainda treme e coloca dentro da caixa de chumbo, ao lado da esfera de Energia. Os raios da esfera se enrolam em volta dela, como braços. Morte cede à Energia.

O Derick fecha a tampa. O Kavyur escreve o selo. Acabou.

No seu pulso, o relógio do Thomas faz tic. Para frente.`,`You look at them one last time. You keep all of it. The way your mother moves her shoulders. Bob's thumb. VT in flip-flops.

"Not yet," you say. "I have a wedding to go to. And a house with a backyard."

Your mother, on the other side, stops dancing. And smiles. The smile Mercer said you have.

You close the door.

Death finishes shrinking. On the floor, where she stood, lies a small hourglass of black glass, the sand falling downward, the right way. You pick it up with a hand that's still shaking and place it inside the lead box, beside the Energy sphere. The sphere's lightning coils around it, like arms. Death yields to Energy.

Derick closes the lid. Kavyur writes the seal. It's over.

On your wrist, Thomas's watch ticks. Forward.`,`Los miras una última vez. Te guardas todo. Cómo mueve los hombros tu madre. El pulgar de Bob. VT en ojotas.

"Todavía no", dices. "Tengo un casamiento al que ir. Y una casa con patio."

Tu madre, del otro lado, deja de bailar. Y sonríe. La sonrisa que Mercer dijo que tienes.

Cierras la puerta.

La Muerte termina de encogerse. En el piso, donde estaba, queda un pequeño reloj de arena de vidrio negro, con la arena cayendo hacia abajo, como debe ser. Lo levantas con una mano que todavía tiembla y lo pones dentro de la caja de plomo, al lado de la esfera de Energía. Los rayos de la esfera se enroscan a su alrededor, como brazos. La Muerte cede ante la Energía.

Derick cierra la tapa. Kavyur escribe el sello. Terminó.

En tu muñeca, el reloj de Thomas hace tic. Hacia adelante.`))+calm(8),go:'a5m_fim'}},
      fail:()=>({text:P(L(`Você dá um passo na direção da porta. Depois outro. O cheiro de café. A voz da sua mãe.

Uma mão segura a sua. Firme, calejada de lança.

"Adam." A Koranna está na sua frente, entre você e a porta, com os olhos cheios. "${S.flags.a5pedido?'Você me pediu em casamento ontem. Eu disse sim. Você não vai me deixar sozinha no altar.':'Você me prometeu. No telhado. Você nunca prometeu nada que não cumprisse.'}"

Você olha para ela. Depois para a porta. A sua mãe, do outro lado, parou de dançar e está olhando a Koranna. E sorri. E acena com a cabeça, como quem diz: vai.

"Fica", diz a Koranna. "Só fica."

Você fica.

A porta se fecha sozinha. A Morte termina de encolher e vira uma ampulheta pequena de vidro preto, que a Koranna mesma pega e coloca na caixa de chumbo, ao lado da esfera de Energia. Os raios se enrolam em volta dela como braços. O Kavyur escreve o selo. Acabou.

No seu pulso, o relógio do Thomas faz tic. Para frente.`,`You take one step toward the door. Then another. The smell of coffee. Your mother's voice.

A hand takes yours. Firm, calloused from the spear.

"Adam." Koranna is in front of you, between you and the door, her eyes full. "${S.flags.a5pedido?'You asked me to marry you last night. I said yes. You\'re not leaving me alone at the altar.':'You promised me. On the roof. You\'ve never made a promise you didn\'t keep.'}"

You look at her. Then at the door. Your mother, on the other side, has stopped dancing and is looking at Koranna. And she smiles. And nods, like someone saying: go.

"Stay," says Koranna. "Just stay."

You stay.

The door closes on its own. Death finishes shrinking and becomes a small hourglass of black glass, which Koranna herself picks up and places in the lead box, beside the Energy sphere. The lightning coils around it like arms. Kavyur writes the seal. It's over.

On your wrist, Thomas's watch ticks. Forward.`,`Das un paso hacia la puerta. Después otro. El olor a café. La voz de tu madre.

Una mano toma la tuya. Firme, curtida de lanza.

"Adam." Koranna está frente a ti, entre tú y la puerta, con los ojos llenos. "${S.flags.a5pedido?'Anoche me pediste casamiento. Te dije que sí. No me vas a dejar sola en el altar.':'Me lo prometiste. En el techo. Nunca prometiste nada que no cumplieras.'}"

La miras. Después a la puerta. Tu madre, del otro lado, dejó de bailar y está mirando a Koranna. Y sonríe. Y asiente, como quien dice: ve.

"Quédate", dice Koranna. "Solo quédate."

Te quedas.

La puerta se cierra sola. La Muerte termina de encogerse y se convierte en un pequeño reloj de arena de vidrio negro, que Koranna misma levanta y pone en la caja de plomo, al lado de la esfera de Energía. Los rayos se enroscan a su alrededor como brazos. Kavyur escribe el sello. Terminó.

En tu muñeca, el reloj de Thomas hace tic. Hacia adelante.`))+bond('koranna',3)+loseSan('1d4',L('a porta fechando','the door closing','la puerta cerrándose')),go:'a5m_fim'})}
  ]},

a5m_fim:{act:K,title:L('Fim do Ato II','End of Act II','Fin del Acto II'),
  text:()=>{const sim=!!S.flags.a5pedido;
    return P(L(`Quatro relíquias contidas. A caixa de chumbo fica no cofre novo da Base, com três selos, três fechaduras e o Tuninho de guarda, de cabelo branco, acordado a noite inteira. Ele diz que agora combina com a responsabilidade.

O Kavyur volta ao terreno atrás do hangar numa manhã de domingo. Deixa a pistola do VT enterrada ao lado da cruz, com o pente vazio. Deixa a foto dos irmãos presa na madeira com um prego. Depois volta para a Base, e pela primeira vez pede para dormir no quarto que o Flavio arrumou para ele, em vez de no sofá da sala.

No subsolo, o Kadu e o Sílvio continuam nas celas. Vão ficar lá para sempre. O Sílvio pinta a parede de branco todo dia, por cima do branco de ontem. O Kadu parou de perguntar pela luva.

O bar da Juliana reabre três semanas depois, com espelho novo, garrafas novas e uma placa na porta dos fundos: "ESSA PORTA EMPERRA. É DE PROPÓSITO." A Olívia volta de missão a tempo da festa, e a Maitê retoca o batom vinho a noite inteira.`,
`Four relics contained. The lead box stays in the Base's new vault, with three seals, three locks and Tuninho on guard, white-haired, awake all night. He says it suits the responsibility now.

Kavyur goes back to the plot behind the hangar on a Sunday morning. He leaves VT's pistol buried beside the cross, with the magazine empty. He leaves the photo of his brothers nailed to the wood. Then he goes back to the Base, and for the first time asks to sleep in the room Flavio fixed up for him, instead of on the living room couch.

Down in the basement, Kadu and Sílvio remain in their cells. They'll stay there forever. Sílvio paints the wall white every day, on top of yesterday's white. Kadu has stopped asking about the glove.

Juliana's bar reopens three weeks later, with a new mirror, new bottles and a sign on the back door: "THIS DOOR STICKS. ON PURPOSE." Olívia comes back from her mission in time for the party, and Maitê touches up her wine lipstick all night long.`,
`Cuatro reliquias contenidas. La caja de plomo queda en la bóveda nueva de la Base, con tres sellos, tres cerraduras y Tuninho de guardia, con el pelo blanco, despierto toda la noche. Dice que ahora le combina con la responsabilidad.

Kavyur vuelve al terreno detrás del hangar un domingo a la mañana. Deja la pistola de VT enterrada al lado de la cruz, con el cargador vacío. Deja la foto de sus hermanos clavada en la madera. Después vuelve a la Base, y por primera vez pide dormir en el cuarto que Flavio le arregló, en vez de en el sillón de la sala.

En el subsuelo, Kadu y Sílvio siguen en sus celdas. Se van a quedar ahí para siempre. Sílvio pinta la pared de blanco todos los días, encima del blanco de ayer. Kadu dejó de preguntar por el guante.

El bar de Juliana reabre tres semanas después, con espejo nuevo, botellas nuevas y un cartel en la puerta de atrás: "ESTA PUERTA SE TRABA. A PROPÓSITO." Olívia vuelve de su misión a tiempo para la fiesta, y Maitê se retoca el labial vino toda la noche.`))+
    (sim?P(L(`No meio da festa, a Koranna sobe no balcão, bate uma colher num copo e mostra a mão esquerda para o bar inteiro. O anel da sua mãe está no dedo dela. Serviu perfeito. "Ele me pediu na véspera da clínica", ela anuncia. "Eu disse sim. E ele voltou inteiro, como prometeu." O bar vem abaixo. O Derick diz "Demorou". A Juliana chora atrás do balcão e finge que é a cebola.`,`In the middle of the party, Koranna climbs onto the counter, taps a spoon on a glass and shows her left hand to the whole bar. Your mother's ring is on her finger. It fit perfectly. "He asked me the night before the clinic," she announces. "I said yes. And he came back in one piece, like he promised." The bar goes wild. Derick says "Took long enough." Juliana cries behind the counter and pretends it's the onions.`,`En medio de la fiesta, Koranna se sube a la barra, golpea un vaso con una cuchara y le muestra la mano izquierda a todo el bar. El anillo de tu madre está en su dedo. Le quedó perfecto. "Me lo pidió la noche antes de la clínica", anuncia. "Le dije que sí. Y volvió entero, como prometió." El bar se viene abajo. Derick dice "Tardaron". Juliana llora detrás de la barra y finge que es la cebolla.`))
    :P(L(`No meio da festa, você sobe no balcão. Você, que fala pouco. O bar inteiro fica em silêncio, porque ninguém ali te viu subir em nada que não fosse para cair.

Você tira a corrente do pescoço. O anel da sua mãe balança na luz.

"Koranna", você diz, na frente de todo mundo. "Eu disse que ia pensar no depois. Eu pensei. Casa comigo."

"Sim", ela diz, e sobe no balcão, segura o seu rosto com as duas mãos e te beija, e o anel serve perfeito no dedo dela. O bar vem abaixo. O Derick diz "Demorou". A Juliana chora atrás do balcão e finge que é a cebola.`,`In the middle of the party, you climb onto the counter. You, who say so little. The whole bar goes silent, because nobody there has ever seen you climb anything except to fall off it.

You take the chain off your neck. Your mother's ring swings in the light.

"Koranna," you say, in front of everyone. "I said I'd think about after. I did. Marry me."

"Yes," she says, and climbs onto the counter, holds your face in both hands and kisses you, and the ring fits her finger perfectly. The bar goes wild. Derick says "Took long enough." Juliana cries behind the counter and pretends it's the onions.`,`En medio de la fiesta, te subes a la barra. Tú, que hablas poco. Todo el bar se queda en silencio, porque nadie ahí te vio subirte a algo que no fuera para caerte.

Te quitas la cadena del cuello. El anillo de tu madre se balancea en la luz.

"Koranna", dices, frente a todos. "Te dije que iba a pensar en el después. Lo pensé. Cásate conmigo."

"Sí", dice, y se sube a la barra, te sostiene la cara con las dos manos y te besa, y el anillo le queda perfecto en el dedo. El bar se viene abajo. Derick dice "Tardaron". Juliana llora detrás de la barra y finge que es la cebolla.`)))+
    P(L(`De madrugada, vocês dois sobem no telhado do Estúdio Imperial. O sol nasce devagar. A Koranna dorme no seu ombro, em cima da cicatriz, com a mão do anel aberta no seu peito.

No seu pulso, o relógio do Thomas marca a hora certa. Você não precisa mais olhar para ele para saber que horas são.

Você tem vinte e seis anos. Faz nove anos que você só pensa no dia seguinte.

Hoje, pela primeira vez, você pensa no depois.`,`Before dawn, the two of you climb onto the roof of the Imperial Studio. The sun rises slowly. Koranna falls asleep on your shoulder, on top of the scar, the hand with the ring open on your chest.

On your wrist, Thomas's watch shows the right time. You no longer need to look at it to know what time it is.

You're twenty-six. For nine years, you've only thought about the next day.

Today, for the first time, you think about after.`,`De madrugada, los dos suben al techo del Estudio Imperial. El sol sale despacio. Koranna se duerme en tu hombro, encima de la cicatriz, con la mano del anillo abierta sobre tu pecho.

En tu muñeca, el reloj de Thomas marca la hora correcta. Ya no necesitas mirarlo para saber qué hora es.

Tienes veintiséis años. Hace nueve años que solo piensas en el día siguiente.

Hoy, por primera vez, piensas en el después.`))+calm(10)},
  choices:()=>[{label:L('Ver o relatório','See the report','Ver el informe'),main:true,run:()=>({end:true})}]}

a5n_ano:{act:KA,title:L('Um ano depois','One year later','Un año después'),
  text:()=>P(L(`A Base não cabe mais embaixo do bar.

Faz um ano. A Ordem ocupa agora o prédio inteiro da antiga gráfica do outro lado da rua, ligado ao bar da Juliana por um túnel que o Flavio cavou com três recrutas e muita reclamação. Tem um arsenal de verdade. Uma enfermaria com seis leitos, onde o Logan e a Iris brigam por causa de escala. Uma biblioteca onde a Maitê guarda os cadernos das quatro relíquias, com o batom vinho retocado e um óculos novo que ela jura que é só para leitura, e que ela vive esquecendo na sala de aula do Kavyur.

Eram cinco. Hoje são trinta e dois.

Na sala de treino, o Tuninho, de cabelo branco, corrige a guarda de uma fila de recrutas do mesmo jeito que a Koranna corrigia a dele. O Kavyur dá aula de selos de Conhecimento às terças, com a pistola do VT desenhada na capa do caderno. A Olívia comanda a equipe de campo. E o Derick, dezessete anos, com uma prancheta na mão e uma barba rala que ele se recusa a tirar, organiza tudo, porque alguém tem que organizar.

Você sobe a escada da gráfica devagar, com o relógio do Thomas no pulso, marcando a hora certa. Ninguém te chama de Mada no corredor. Te chamam de chefe. Você ainda não se acostumou.

Amanhã é o seu casamento.`,
`The Base doesn't fit under the bar anymore.

It's been a year. The Order now takes up the whole old print shop across the street, connected to Juliana's bar by a tunnel Flavio dug with three recruits and a lot of complaining. There's a real armory. An infirmary with six beds, where Logan and Iris argue about shifts. A library where Maitê keeps the notebooks on all four relics, her wine lipstick touched up and a new pair of glasses she swears are only for reading, and keeps forgetting in Kavyur's classroom.

There were five. Today there are thirty-two.

In the training room, Tuninho, white-haired, corrects the guard of a line of recruits the same way Koranna used to correct his. Kavyur teaches Knowledge seals on Tuesdays, with VT's pistol drawn on the cover of his notebook. Olívia leads the field team. And Derick, seventeen, with a clipboard in his hand and a thin beard he refuses to shave, organizes everything, because someone has to.

You climb the print shop stairs slowly, Thomas's watch on your wrist, keeping the right time. Nobody calls you Mada in the hallway. They call you boss. You're still not used to it.

Tomorrow is your wedding.`,
`La Base ya no cabe debajo del bar.

Pasó un año. La Orden ocupa ahora todo el edificio de la vieja imprenta de enfrente, unido al bar de Juliana por un túnel que Flavio cavó con tres reclutas y muchas quejas. Hay un arsenal de verdad. Una enfermería con seis camas, donde Logan e Iris discuten por los turnos. Una biblioteca donde Maitê guarda los cuadernos de las cuatro reliquias, con el labial vino retocado y unos anteojos nuevos que jura que son solo para leer, y que siempre se olvida en el aula de Kavyur.

Eran cinco. Hoy son treinta y dos.

En la sala de entrenamiento, Tuninho, con el pelo blanco, corrige la guardia de una fila de reclutas igual que Koranna corregía la suya. Kavyur da clases de sellos de Conocimiento los martes, con la pistola de VT dibujada en la tapa del cuaderno. Olívia dirige el equipo de campo. Y Derick, diecisiete años, con una planilla en la mano y una barba rala que se niega a afeitarse, organiza todo, porque alguien tiene que hacerlo.

Subes despacio la escalera de la imprenta, con el reloj de Thomas en la muñeca, marcando la hora correcta. Nadie te llama Mada en el pasillo. Te llaman jefe. Todavía no te acostumbras.

Mañana es tu boda.`))+calm(6),
  choices:()=>[
    {once:'memorial6',label:L('Parar na parede dos nomes','Stop at the wall of names','Detenerte en la pared de los nombres'),
      run:()=>({text:P(L(`No hall de entrada, a primeira coisa que todo recruta vê: uma parede de madeira escura com nomes gravados. Os trinta e cinco da antiga Base. Os pais e os avós Zart. Gustavo, Matheus e Marcos Karlovski.

Thomas Zart. Bob Zart.

E, desde o mês passado, um nome gravado por último, meio torto, porque foi o Kavyur que gravou com as próprias mãos: VT. Embaixo, em letra pequena, uma frase que ninguém pediu para tirar: "Volta inteiro. Sempre."

Você encosta a mão no nome do Bob, como faz toda manhã.

"Amanhã eu caso, moleque", você diz baixinho. "Você ia fazer piada o dia inteiro."

Um recruta passa atrás de você e para. Você não se vira. Ele espera, respeitoso, e só segue quando você tira a mão da parede.`,`In the entrance hall, the first thing every recruit sees: a dark wooden wall with names carved into it. The thirty-five from the old Base. The Zart parents and grandparents. Gustavo, Matheus and Marcos Karlovski.

Thomas Zart. Bob Zart.

And, since last month, one name carved last, a little crooked, because Kavyur carved it with his own hands: VT. Beneath it, in small letters, a line nobody asked him to remove: "Come back in one piece. Always."

You rest your hand on Bob's name, the way you do every morning.

"I'm getting married tomorrow, kid," you say quietly. "You'd have been cracking jokes all day."

A recruit passes behind you and stops. You don't turn around. He waits, respectfully, and only moves on when you take your hand off the wall.`,`En el hall de entrada, lo primero que ve cada recluta: una pared de madera oscura con nombres grabados. Los treinta y cinco de la vieja Base. Los padres y los abuelos Zart. Gustavo, Matheus y Marcos Karlovski.

Thomas Zart. Bob Zart.

Y, desde el mes pasado, un nombre grabado último, un poco torcido, porque Kavyur lo grabó con sus propias manos: VT. Debajo, en letra pequeña, una frase que nadie le pidió que sacara: "Vuelve entero. Siempre."

Apoyas la mano en el nombre de Bob, como haces cada mañana.

"Mañana me caso, pibe", dices bajito. "Te habrías pasado el día haciendo chistes."

Un recluta pasa detrás de ti y se detiene. No te das vuelta. Espera, respetuoso, y solo sigue cuando sacas la mano de la pared.`))+calm(3)})},
    {once:'recruta6',label:L('Olhar o treino dos recrutas','Watch the recruits train','Mirar el entrenamiento de los reclutas'),
      run:()=>({text:P(L(`Uma menina de quinze anos, recém-chegada, cai do cavalo de salto de mau jeito e bate as costas no tatame. Os outros riem. Ela levanta vermelha, com vontade de chorar.

Você entra na sala. O riso para na hora.

Você não diz nada. Pega um colchão do canto, arrasta para o meio da sala e sobe no cavalo. Pula. Cai de costas no colchão, do jeito certo, rolando o ombro, sem barulho.

"Quarenta vezes", você diz para ela. "O meu irmão caiu quarenta vezes seguidas, rindo, até a minha vó apagar a luz."

Ela sobe no cavalo. Cai. Levanta. Sobe de novo. Na quinta, ela já está rindo.

O Tuninho cruza os braços do seu lado. "Você tá ficando mole, chefe."

"Tô ficando velho", você diz. "Olha o seu cabelo."`,`A fifteen-year-old girl, just arrived, comes off the vaulting horse badly and slams her back on the mat. The others laugh. She gets up red-faced, close to tears.

You walk into the room. The laughter stops at once.

You say nothing. You grab a mattress from the corner, drag it to the middle of the room and climb the horse. You jump. You land on your back on the mattress, the right way, rolling the shoulder, without a sound.

"Forty times," you tell her. "My brother fell forty times in a row, laughing, until my grandma turned off the light."

She climbs the horse. Falls. Gets up. Climbs again. By the fifth time, she's laughing.

Tuninho folds his arms beside you. "You're going soft, boss."

"I'm getting old," you say. "Look at your hair."`,`Una chica de quince años, recién llegada, se cae mal del potro de salto y se golpea la espalda en el tatami. Los demás se ríen. Se levanta colorada, a punto de llorar.

Entras en la sala. La risa se corta de golpe.

No dices nada. Agarras un colchón del rincón, lo arrastras al medio de la sala y te subes al potro. Saltas. Caes de espaldas en el colchón, como se debe, rodando el hombro, sin ruido.

"Cuarenta veces", le dices. "Mi hermano se cayó cuarenta veces seguidas, riéndose, hasta que mi abuela apagó la luz."

Se sube al potro. Se cae. Se levanta. Se sube otra vez. A la quinta, ya se está riendo.

Tuninho se cruza de brazos a tu lado. "Te estás ablandando, jefe."

"Me estoy poniendo viejo", dices. "Mira tu pelo."`))+bond('tuninho')+calm(3)})},
    {once:'kavyur6',label:L('Passar na sala do Kavyur','Stop by Kavyur\'s room','Pasar por el cuarto de Kavyur'),
      run:()=>({text:P(L(`O Kavyur está escrevendo alguma coisa à mão, cercado de rascunhos amassados. Quando você entra, ele cobre a folha com o braço, rápido demais.

"É o texto de amanhã", ele confessa. "A Koranna pediu para eu falar na cerimônia, antes dos votos. Numa igreja, Mada. Eu disse que não sei fazer isso. Ela disse que eu sei escrever selos que prendem relíquias, então sei escrever duas pessoas juntas." Ele passa a mão no cabelo. "Eu já rasguei onze versões, Mada."

"Deixa eu ler."

"Nem pensar. Você vai ouvir amanhã, com todo mundo, e vai chorar na frente dos recrutas." Ele sorri, um sorriso que você não via nele fazia muito tempo. "O VT ia adorar ver isso."

Você aperta o ombro dele. Na parede, presa com fita, a foto dos irmãos Karlovski. Do lado, uma foto nova: o VT, de bermuda e chinelo, com o M4 no ombro e o polegar para cima.

Em cima da mesa, do lado dos rascunhos, duas xícaras de café. Uma delas tem uma marca de batom vinho na borda. E, dobrado no encosto da cadeira, um par de óculos de leitura que definitivamente não é dele.

O Kavyur segue o seu olhar. Fica vermelho até as orelhas.

"Ela veio ajudar com o texto", ele diz, rápido demais.

"Eu não perguntei nada", você diz.

"Você olhou."

"Eu olhei", você concorda, e sai do quarto com o primeiro sorriso de verdade do dia.`,`Kavyur is writing something by hand, surrounded by crumpled drafts. When you come in, he covers the page with his arm, too fast.

"It's for tomorrow," he confesses. "Koranna asked me to speak at the ceremony, before the vows. In a church, Mada. I told her I don't know how. She said I know how to write seals that hold relics, so I know how to write two people together." He runs a hand through his hair. "I've torn up eleven versions, Mada."

"Let me read it."

"No way. You'll hear it tomorrow, with everyone, and you'll cry in front of the recruits." He smiles, a smile you haven't seen on him in a long time. "VT would have loved to see that."

You squeeze his shoulder. On the wall, taped up, the photo of the Karlovski brothers. Next to it, a new photo: VT, in shorts and flip-flops, the M4 on his shoulder and his thumb up.

On the desk, beside the drafts, two coffee cups. One of them has a wine-colored lipstick mark on the rim. And, folded over the back of the chair, a pair of reading glasses that are definitely not his.

Kavyur follows your gaze. He turns red to the ears.

"She came to help with the speech," he says, too fast.

"I didn't ask anything," you say.

"You looked."

"I looked," you agree, and leave the room with the first real smile of the day.`,`Kavyur está escribiendo algo a mano, rodeado de borradores arrugados. Cuando entras, tapa la hoja con el brazo, demasiado rápido.

"Es lo de mañana", confiesa. "Koranna me pidió que hablara en la ceremonia, antes de los votos. En una iglesia, Mada. Le dije que no sé hacer eso. Me dijo que sé escribir sellos que atan reliquias, así que sé escribir a dos personas juntas." Se pasa la mano por el pelo. "Ya rompí once versiones, Mada."

"Déjame leer."

"Ni loco. Lo vas a escuchar mañana, con todos, y vas a llorar delante de los reclutas." Sonríe, una sonrisa que hacía mucho no le veías. "A VT le habría encantado ver eso."

Le aprietas el hombro. En la pared, pegada con cinta, la foto de los hermanos Karlovski. Al lado, una foto nueva: VT, en bermudas y ojotas, con el M4 al hombro y el pulgar para arriba.

Sobre el escritorio, al lado de los borradores, dos tazas de café. Una tiene una marca de labial color vino en el borde. Y, doblados sobre el respaldo de la silla, unos anteojos de lectura que definitivamente no son suyos.

Kavyur sigue tu mirada. Se pone rojo hasta las orejas.

"Vino a ayudarme con el texto", dice, demasiado rápido.

"No pregunté nada", dices.

"Miraste."

"Miré", concedes, y sales del cuarto con la primera sonrisa de verdad del día.`))+bond('kavyur')})},
    {label:L('Dormir a última noite de solteiro','Sleep your last night as a single man','Dormir la última noche de soltero'),main:true,run:()=>({go:'a5o_casamento'})}
  ]},

a5o_casamento:{act:KW,title:L('A igreja','The church','La iglesia'),
  text:()=>P(L(`A igreja fica a três quarteirões da Base. Pequena, de pedra, com um sino que ninguém toca há anos e vitrais que pintam o chão de vermelho e dourado quando o sol da tarde entra. A Koranna passou na frente dela numa noite de chuva, em março, e parou. "É aqui", ela disse. Não explicou. Não precisou.

Hoje os bancos de madeira estão enfeitados com fitas vinho e flores amarelas de ipê. A Juliana cozinha desde as cinco da manhã para a festa, que vai ser no bar. O Frederico, um papagaio-chauá de testa vermelha e temperamento péssimo, que a Koranna resgatou de uma operação contra traficantes de animais, anda pelo encosto dos bancos recebendo os convidados na porta da igreja. Para cada um que chega, um "Oi amor!". Para cada um que senta, um "Tchau!". Para as tias da Juliana, um barulho de beijo estalado que faz as duas rirem até chorar. Alguém amarrou um lacinho vinho no pé dele. Ele odiou.

Ele não é o único. Na casa com quintal que vocês compraram em março, esperam por vocês a Myla, uma salsicha mofada, de pelo preto todo manchado de cinza-prateado, com sobrancelhas e patinhas cor de caramelo, que a Koranna resgatou numa missão e que late para a própria sombra, e o Dodoro, um gato cinza com branco que apareceu no muro numa noite de chuva e nunca mais foi embora. O Dodoro dorme em cima da Myla. A Myla deixa.

E tem a Isha. Uma golden retriever de pelo cor de mel que você adotou sozinho, num abrigo, numa terça-feira qualquer, sem contar para ninguém. Você entrou para doar ração e saiu com ela no banco do carona. Foi a primeira coisa em nove anos que você escolheu só porque quis. Ela te segue pela casa inteira, deita encostada na porta quando você sai em missão e só levanta quando ouve o seu carro. A Koranna jura que foram os bichos que escolheram a casa. Ela também jura que ainda cabe mais um. Sempre cabe mais um.

Você está na sacristia, de terno preto, lutando com uma gravata que não quer dar nó. O relógio do Thomas no pulso esquerdo. As luvas do seu pai no bolso de dentro do paletó, onde ninguém vê.`,
`The church is three blocks from the Base. Small, made of stone, with a bell nobody has rung in years and stained-glass windows that paint the floor red and gold when the afternoon sun comes in. Koranna walked past it one rainy night in March and stopped. "This is the place," she said. She didn't explain. She didn't need to.

Today the wooden pews are decorated with wine-colored ribbons and yellow ipê flowers. Juliana has been cooking since five in the morning for the party, which will be at the bar. Frederico, a red-browed chauá parrot with a terrible temper, whom Koranna rescued during an operation against animal traffickers, walks along the pew backs greeting the guests at the church door. For everyone who arrives, a "Hi, love!". For everyone who sits down, a "Bye!". For Juliana's aunts, a loud smacking kiss sound that makes them both laugh until they cry. Someone tied a little wine-colored bow on his foot. He hated it.

He isn't the only one. At the house with the backyard you bought in March, Myla is waiting for you, a dapple dachshund, black fur speckled all over with silver-gray, with caramel eyebrows and little caramel paws, whom Koranna rescued on a mission and who barks at her own shadow, and Dodoro, a gray-and-white cat who showed up on the wall one rainy night and never left. Dodoro sleeps on top of Myla. Myla lets him.

And there's Isha. A honey-colored golden retriever you adopted on your own, at a shelter, on an ordinary Tuesday, without telling anyone. You went in to donate dog food and came out with her in the passenger seat. It was the first thing in nine years you chose just because you wanted to. She follows you all over the house, lies against the door when you leave on a mission and only gets up when she hears your car. Koranna swears the animals chose the house. She also swears there's room for one more. There's always room for one more.

You're in the sacristy, in a black suit, fighting a tie that won't knot. Thomas's watch on your left wrist. Your father's gloves in the inside pocket of your jacket, where nobody can see.`,
`La iglesia queda a tres cuadras de la Base. Pequeña, de piedra, con una campana que nadie toca hace años y vitrales que pintan el piso de rojo y dorado cuando entra el sol de la tarde. Koranna pasó por delante una noche de lluvia, en marzo, y se detuvo. "Es aquí", dijo. No lo explicó. No hizo falta.

Hoy los bancos de madera están adornados con cintas color vino y flores amarillas de ipê. Juliana cocina desde las cinco de la mañana para la fiesta, que va a ser en el bar. Frederico, un loro chauá de frente roja y un carácter pésimo, que Koranna rescató en un operativo contra traficantes de animales, camina por los respaldos de los bancos recibiendo a los invitados en la puerta de la iglesia. Para cada uno que llega, un "¡Hola, amor!". Para cada uno que se sienta, un "¡Chau!". Para las tías de Juliana, un ruido de beso bien sonoro que las hace reír hasta llorar. Alguien le ató un moñito color vino en la pata. Lo odió.

Y no es el único. En la casa con patio que compraron en marzo, los esperan Myla, una salchicha arlequín, de pelo negro todo manchado de gris plateado, con cejas y patitas color caramelo, que Koranna rescató en una misión y que le ladra a su propia sombra, y Dodoro, un gato gris y blanco que apareció en el muro una noche de lluvia y nunca más se fue. Dodoro duerme encima de Myla. Myla lo deja.

Y está Isha. Una golden retriever de pelo color miel que adoptaste tú solo, en un refugio, un martes cualquiera, sin contárselo a nadie. Entraste a donar alimento y saliste con ella en el asiento del acompañante. Fue lo primero en nueve años que elegiste solo porque quisiste. Te sigue por toda la casa, se acuesta contra la puerta cuando sales de misión y solo se levanta cuando oye tu auto. Koranna jura que fueron los animales los que eligieron la casa. También jura que todavía entra uno más. Siempre entra uno más.

Estás en la sacristía, de traje negro, peleando con una corbata que no quiere anudarse. El reloj de Thomas en la muñeca izquierda. Los guantes de tu padre en el bolsillo interior del saco, donde nadie los ve.`))+calm(6),
  choices:()=>[
    {once:'gravata6',label:L('Deixar o Derick dar o nó','Let Derick tie it','Dejar que Derick haga el nudo'),
      run:()=>({text:P(L(`O Derick entra sem bater, de terno cinza, e tira a gravata da sua mão como quem tira uma arma de uma criança.

"Você cai de prédio e não sabe dar nó em gravata", ele diz, balançando a cabeça. Os dedos dele são rápidos. Firmes. Você lembra de quando esses dedos tremiam segurando um copo de leite, num porão, com doze anos.

"Derick."

"Hum."

"Você é o meu padrinho porque é o meu irmão." Você engole. "Não o menino que eu salvei. O meu irmão. Eu queria que você soubesse isso antes de hoje."

As mãos dele param no nó. Ele não levanta os olhos. Demora um pouco.

"Eu sei, Mada." A voz dele quebra só na última palavra. "Agora fica quieto, que eu não vou refazer esse nó por sua causa."

Ele termina o nó. Depois te abraça, forte, do jeito que ele não abraça ninguém, e sai da sacristia rápido, esfregando o olho com o pulso.`,`Derick walks in without knocking, in a gray suit, and takes the tie out of your hand like someone taking a gun from a child.

"You fall off buildings and you can't tie a tie," he says, shaking his head. His fingers are quick. Steady. You remember when those fingers shook holding a glass of milk, in a basement, at twelve years old.

"Derick."

"Hm."

"You're my best man because you're my brother." You swallow. "Not the kid I saved. My brother. I wanted you to know that before today."

His hands stop on the knot. He doesn't look up. It takes him a moment.

"I know, Mada." His voice breaks only on the last word. "Now stay still, I'm not redoing this knot because of you."

He finishes the knot. Then he hugs you, hard, the way he doesn't hug anyone, and leaves the sacristy quickly, rubbing his eye with his wrist.`,`Derick entra sin golpear, de traje gris, y te saca la corbata de la mano como quien le saca un arma a un chico.

"Te caes de edificios y no sabes hacer un nudo de corbata", dice, negando con la cabeza. Sus dedos son rápidos. Firmes. Recuerdas cuando esos dedos temblaban sosteniendo un vaso de leche, en un sótano, a los doce años.

"Derick."

"Mm."

"Eres mi padrino porque eres mi hermano." Tragas saliva. "No el chico que salvé. Mi hermano. Quería que lo supieras antes de hoy."

Sus manos se detienen en el nudo. No levanta la vista. Tarda un poco.

"Lo sé, Mada." La voz se le quiebra solo en la última palabra. "Ahora quédate quieto, que no voy a rehacer este nudo por tu culpa."

Termina el nudo. Después te abraza, fuerte, como no abraza a nadie, y sale de la sacristía rápido, frotándose el ojo con la muñeca.`))+bond('derick',2)})},
    {once:'cadeiras6',label:L('Espiar os bancos da frente pela porta da sacristia','Peek at the front pews from the sacristy door','Espiar los primeros bancos desde la puerta de la sacristía'),
      run:()=>({text:P(L(`Da porta entreaberta da sacristia, você vê a igreja inteira. E vê o primeiro banco.

A Koranna pediu, e ninguém discutiu. No primeiro banco, dos dois lados do corredor, há lugares reservados com um laço vinho em cada um. Neles, ninguém vai sentar.

Do lado do noivo, no primeiro lugar, uma foto do seu pai e da sua mãe, jovens, rindo em cima de uma moto. No segundo, a do vô e da vó, na cozinha. No terceiro, o boné do Thomas. No quarto, as correntes do Bob, enroladas com cuidado. E no quinto, que o Kavyur colocou sem perguntar a ninguém, um par de chinelos gastos.

Do lado da noiva, mais três lugares com o mesmo laço. Uma foto do pai e da mãe da Koranna, abraçados, sorrindo para quem tirou a foto. E, do lado deles, o lugar do Eros, o irmão dela, com uma foto em que ele está rindo de alguma coisa fora do quadro. A Koranna arrumou esses três sozinha, de manhã cedo, antes de todo mundo chegar. Ninguém perguntou nada. Ninguém precisava.

Oito lugares vazios. Você fica muito tempo parado na porta.

Depois o sol da tarde atravessa os vitrais e pinta os oito lugares de vermelho e dourado, todos ao mesmo tempo, e você sorri. Todo mundo veio.`,`From the half-open sacristy door, you can see the whole church. And you see the front pew.

Koranna asked, and nobody argued. In the front pew, on both sides of the aisle, there are reserved seats with a wine-colored ribbon on each. No one will sit in them.

On the groom's side, in the first seat, a photo of your father and mother, young, laughing on a motorcycle. In the second, Grandpa and Grandma, in the kitchen. In the third, Thomas's cap. In the fourth, Bob's chains, carefully coiled. And in the fifth, which Kavyur set out without asking anyone, a pair of worn flip-flops.

On the bride's side, three more seats with the same ribbon. A photo of Koranna's father and mother, arm in arm, smiling at whoever took the picture. And, beside them, Eros's seat, her brother, with a photo of him laughing at something outside the frame. Koranna arranged those three herself, early in the morning, before anyone arrived. Nobody asked anything. Nobody needed to.

Eight empty seats. You stand in the doorway for a long time.

Then the afternoon sun comes through the stained glass and paints all eight seats red and gold at the same time, and you smile. Everyone came.`,`Desde la puerta entreabierta de la sacristía, ves la iglesia entera. Y ves el primer banco.

Koranna lo pidió, y nadie discutió. En el primer banco, a los dos lados del pasillo, hay lugares reservados con un moño color vino en cada uno. En ellos no se va a sentar nadie.

Del lado del novio, en el primer lugar, una foto de tu padre y tu madre, jóvenes, riéndose sobre una moto. En el segundo, la del abuelo y la abuela, en la cocina. En el tercero, la gorra de Thomas. En el cuarto, las cadenas de Bob, enrolladas con cuidado. Y en el quinto, que Kavyur puso sin preguntarle a nadie, un par de ojotas gastadas.

Del lado de la novia, tres lugares más con el mismo moño. Una foto del padre y la madre de Koranna, abrazados, sonriéndole a quien sacó la foto. Y, a su lado, el lugar de Eros, su hermano, con una foto en la que se está riendo de algo fuera del cuadro. Koranna acomodó esos tres sola, temprano, antes de que llegara nadie. Nadie preguntó nada. No hacía falta.

Ocho lugares vacíos. Te quedas mucho tiempo parado en la puerta.

Después el sol de la tarde atraviesa los vitrales y pinta los ocho lugares de rojo y dorado, todos a la vez, y sonríes. Vinieron todos.`))+calm(4)})},
    {label:L('Esperar por ela no altar','Wait for her at the altar','Esperarla en el altar'),main:true,run:()=>({go:'a5p_altar'})}
  ]},

a5p_altar:{act:KW,title:L('Ela','Her','Ella'),
  text:()=>P(L(`Trinta e dois agentes da Ordem, de terno e vestido, sentados nos bancos de madeira da igrejinha de pedra. A Iris já está chorando e ainda não aconteceu nada. O Logan finge que não, mas também. No altar, o padre Anselmo, de oitenta anos, sorri como quem já viu muitos casamentos e nenhum com tanta gente armada. O Kavyur, no primeiro degrau, segura as folhas do discurso com as duas mãos para elas não tremerem. Do seu lado, o Derick, seu padrinho, com o Frederico empoleirado no ombro do terno cinza. O papagaio se recusou a ficar em qualquer outro lugar. O Derick desistiu de discutir.

A Juliana aperta o play num gravador velho, ligado no som da igreja. Chiado de fita. Depois, um violão, dedilhado devagar.

E a voz do seu pai.

Você não ouve essa voz há dez anos. Ela enche a igreja inteira, ecoando nas paredes de pedra, grave, meio desafinada, cantando em inglês uma música que o Maxwel escreveu para a Adriana antes de vocês nascerem. A música que ele cantava baixinho na cozinha da vó, enquanto ela dançava sozinha perto do fogão.

A fita estava no fundo do envelope de Atlanta, colada no papelão. O Derick passou meses restaurando, escondido. Você não sabia. As suas pernas quase não seguram.

E então as portas da igreja se abrem.

A Koranna entra pelo corredor de vestido branco, simples, sem véu, com o cabelo solto e uma flor amarela de ipê presa atrás da orelha. A Olívia de um lado. A Maitê do outro, com o batom vinho borrado de tanto chorar. O anel da sua mãe brilha na mão dela.

Você já enfrentou uma rua inteira de mortos-vivos. Um trono de sangue. Um raio do tamanho de uma árvore. A própria Morte.

Nada disso te tirou o ar como ela atravessando aquele corredor, devagar, com a luz dos vitrais passando pelo vestido.

Ela para na sua frente, no altar. Olha para você de cima a baixo. E ri, com os olhos cheios.

"Você tá chorando, Zart."

"Tô", você diz. Pela primeira vez na vida, você não tenta esconder.`,
`Thirty-two agents of the Order, in suits and dresses, sitting in the wooden pews of the little stone church. Iris is already crying and nothing has happened yet. Logan pretends he isn't, but he is too. At the altar, Father Anselmo, eighty years old, smiles like someone who has seen many weddings and none with so many armed guests. Kavyur, on the first step, holds the pages of his speech with both hands so they won't shake. Beside you, Derick, your best man, with Frederico perched on the shoulder of his gray suit. The parrot refused to stay anywhere else. Derick gave up arguing.

Juliana presses play on an old tape recorder, hooked up to the church's sound system. Tape hiss. Then a guitar, picked slowly.

And your father's voice.

You haven't heard that voice in ten years. It fills the whole church, echoing off the stone walls, deep, a little off-key, singing in English a song Maxwel wrote for Adriana before you were born. The song he used to sing softly in Grandma's kitchen while she danced alone by the stove.

The tape was at the bottom of the Atlanta envelope, stuck to the cardboard. Derick spent months restoring it, in secret. You didn't know. Your legs barely hold you up.

And then the church doors open.

Koranna comes down the aisle in a white dress, simple, no veil, her hair loose and a yellow ipê flower tucked behind her ear. Olívia on one side. Maitê on the other, her wine lipstick smudged from crying. Your mother's ring shines on her hand.

You've faced a whole street of the walking dead. A throne of blood. A bolt of lightning the size of a tree. Death herself.

None of it took your breath away like her walking down that aisle, slowly, the light from the stained glass passing over her dress.

She stops in front of you, at the altar. Looks you up and down. And laughs, eyes full.

"You're crying, Zart."

"I am," you say. For the first time in your life, you don't try to hide it.`,
`Treinta y dos agentes de la Orden, de traje y vestido, sentados en los bancos de madera de la iglesita de piedra. Iris ya está llorando y todavía no pasó nada. Logan finge que no, pero también. En el altar, el padre Anselmo, de ochenta años, sonríe como quien vio muchas bodas y ninguna con tanta gente armada. Kavyur, en el primer escalón, sostiene las hojas del discurso con las dos manos para que no tiemblen. A tu lado, Derick, tu padrino, con Frederico posado en el hombro del traje gris. El loro se negó a quedarse en cualquier otro lugar. Derick dejó de discutir.

Juliana aprieta play en un grabador viejo, conectado al sonido de la iglesia. Siseo de cinta. Después, una guitarra, punteada despacio.

Y la voz de tu padre.

Hace diez años que no oyes esa voz. Llena toda la iglesia, resonando en las paredes de piedra, grave, un poco desafinada, cantando en inglés una canción que Maxwel escribió para Adriana antes de que ustedes nacieran. La canción que cantaba bajito en la cocina de la abuela, mientras ella bailaba sola junto a la cocina.

La cinta estaba al fondo del sobre de Atlanta, pegada al cartón. Derick pasó meses restaurándola, a escondidas. No lo sabías. Las piernas casi no te sostienen.

Y entonces se abren las puertas de la iglesia.

Koranna entra por el pasillo con un vestido blanco, simple, sin velo, con el pelo suelto y una flor amarilla de ipê detrás de la oreja. Olívia de un lado. Maitê del otro, con el labial vino corrido de tanto llorar. El anillo de tu madre le brilla en la mano.

Enfrentaste una calle entera de muertos vivientes. Un trono de sangre. Un rayo del tamaño de un árbol. A la mismísima Muerte.

Nada de eso te quitó el aire como ella cruzando ese pasillo, despacio, con la luz de los vitrales pasando por el vestido.

Se detiene frente a ti, en el altar. Te mira de arriba abajo. Y se ríe, con los ojos llenos.

"Estás llorando, Zart."

"Sí", dices. Por primera vez en tu vida, no intentas esconderlo.`))+calm(8),
  choices:()=>[
    {once:'kavtexto6',label:L('Ouvir o Kavyur','Listen to Kavyur','Escuchar a Kavyur'),
      run:()=>({text:P(L(`O Kavyur limpa a garganta. As folhas tremem mesmo com as duas mãos.

"Eu passei a vida escrevendo selos", ele diz. "Selos servem para prender coisas que querem escapar. Uma relíquia. Um monstro. Uma dor." Ele olha para vocês dois. "Eu tentei escrever um selo para isso aqui. Onze vezes. Não consegui. E aí eu entendi por quê."

Ele dobra as folhas e guarda no bolso.

"Ninguém precisa prender vocês dois. Vocês escolheram ficar. Todo dia. Na frente de coisas que fariam qualquer um fugir." A voz dele falha. "Um homem de chinelo me ensinou que família não é quem tem o seu sangue. É quem volta. Vocês dois sempre voltam um para o outro. Isso não precisa de selo."

Atrás de você, alguém funga alto. É o Tuninho. Ninguém ri dele.

Do lado da Koranna, a Maitê não tira os olhos do Kavyur. Quando ele termina, ela enxuga o rosto com um lenço. O lenço é dele. Você nem viu quando ele entregou.`,`Kavyur clears his throat. The pages shake even with both hands.

"I've spent my life writing seals," he says. "Seals are for holding things that want to escape. A relic. A monster. A pain." He looks at the two of you. "I tried to write a seal for this. Eleven times. I couldn't. And then I understood why."

He folds the pages and puts them in his pocket.

"Nobody needs to hold you two. You chose to stay. Every day. In front of things that would make anyone run." His voice fails. "A man in flip-flops taught me that family isn't who has your blood. It's who comes back. You two always come back to each other. That doesn't need a seal."

Behind you, someone sniffles loudly. It's Tuninho. Nobody laughs at him.

Beside Koranna, Maitê can't take her eyes off Kavyur. When he finishes, she dries her face with a handkerchief. The handkerchief is his. You didn't even see him hand it over.`,`Kavyur se aclara la garganta. Las hojas tiemblan aun con las dos manos.

"Me pasé la vida escribiendo sellos", dice. "Los sellos sirven para atar cosas que quieren escapar. Una reliquia. Un monstruo. Un dolor." Los mira a los dos. "Intenté escribir un sello para esto. Once veces. No pude. Y ahí entendí por qué."

Dobla las hojas y las guarda en el bolsillo.

"Nadie necesita atarlos a ustedes dos. Eligieron quedarse. Todos los días. Frente a cosas que harían huir a cualquiera." La voz se le quiebra. "Un hombre en ojotas me enseñó que la familia no es quien tiene tu sangre. Es quien vuelve. Ustedes dos siempre vuelven el uno al otro. Eso no necesita sello."

Detrás de ti, alguien se sorbe la nariz fuerte. Es Tuninho. Nadie se ríe de él.

Al lado de Koranna, Maitê no le saca los ojos de encima a Kavyur. Cuando termina, se seca la cara con un pañuelo. El pañuelo es de él. Ni viste cuándo se lo dio.`))+calm(4)})},
    {label:L('"Eu falo pouco. Você sabe."','"I don\'t talk much. You know that."','"Hablo poco. Ya lo sabes."'),main:true,
      run:()=>{S.flags.voto='pouco';return {go:'a5q_votos'}}},
    {label:L('"Eu nunca pensei no depois."','"I never thought about after."','"Nunca pensé en el después."'),
      run:()=>{S.flags.voto='depois';return {go:'a5q_votos'}}},
    {label:L('"Eu prometi que voltava."','"I promised I\'d come back."','"Te prometí que volvía."'),
      run:()=>{S.flags.voto='voltar';return {go:'a5q_votos'}}}
  ]},

a5q_votos:{act:KW,title:L('Os votos','The vows','Los votos'),
  text:()=>{const v=S.flags.voto;
    const V={
      pouco:L(`"Eu falo pouco. Você sabe", você diz. A sua voz sai rouca, e você deixa. "Então eu vou dizer só o que importa.

Eu perdi todo mundo que eu amava. Duas vezes. Eu achei que ia passar a vida inteira sem deixar ninguém chegar perto, porque quem chega perto de mim morre. Você chegou mesmo assim. Você corrigiu a minha guarda, enfaixou a minha cicatriz, dançou comigo sem música e me segurou na frente da porta da Morte.

Eu não sei dizer bonito. Mas eu sei cair. E eu caí por você, Koranna. Do jeito certo. Sem barulho. Para nunca mais levantar."`,`"I don't talk much. You know that," you say. Your voice comes out hoarse, and you let it. "So I'll only say what matters.

I lost everyone I loved. Twice. I thought I'd go my whole life without letting anyone close, because whoever gets close to me dies. You came close anyway. You corrected my guard, bandaged my scar, danced with me without music and held me in front of Death's door.

I don't know how to say it beautifully. But I know how to fall. And I fell for you, Koranna. The right way. Without a sound. Never to get up again."`,`"Hablo poco. Ya lo sabes", dices. La voz te sale ronca, y la dejas. "Así que voy a decir solo lo que importa.

Perdí a todos los que amaba. Dos veces. Creí que iba a pasar la vida entera sin dejar que nadie se acercara, porque quien se acerca a mí se muere. Te acercaste igual. Me corregiste la guardia, me vendaste la cicatriz, bailaste conmigo sin música y me sostuviste frente a la puerta de la Muerte.

No sé decirlo lindo. Pero sé caer. Y caí por ti, Koranna. Como se debe. Sin ruido. Para no volver a levantarme nunca."`),
      depois:L(`"Eu nunca pensei no depois", você diz. "Desde os dezessete, eu só pensava no dia seguinte. Sobreviver até amanhã. Proteger quem sobrou até amanhã. Não tinha depois.

Aí, num telhado, você me perguntou o que eu queria depois de tudo. E eu não soube responder. Você disse que esperava.

Eu pensei, Koranna. Eu pensei todos os dias desde aquela noite. E toda vez que eu penso no depois, eu vejo uma casa com quintal, esse papagaio escandaloso, a Myla latindo para a própria sombra, o Dodoro mandando na casa, a Isha esperando na porta, e você. Sempre você. Você é o meu depois. Você é todos os meus amanhãs."`,`"I never thought about after," you say. "Since I was seventeen, I only thought about the next day. Surviving until tomorrow. Protecting whoever was left until tomorrow. There was no after.

Entonces, en un techo, me preguntaste qué quería después de todo. Y no supe responder. Dijiste que ibas a esperar.

Lo pensé, Koranna. Lo pensé todos los días desde esa noche. Y cada vez que pienso en el después, veo una casa con patio, este loro escandaloso, Myla ladrándole a su propia sombra, Dodoro mandando en la casa, Isha esperando en la puerta, y a ti. Siempre a ti. Tú eres mi después. Eres todos mis mañanas."`),
      voltar:L(`"Eu prometi que voltava", você diz. "No telhado, sem saber se ia conseguir. Foi a primeira promessa que eu fiz sem ter certeza.

Na clínica, a Morte abriu uma porta. Do outro lado estava a minha família inteira. A minha mãe dançando. O Bob rindo. Tinha lugar para mim na mesa. E eu quis sentar, Koranna. Eu quis muito.

Mas eu tinha prometido para você. Então eu voltei. E eu vou voltar sempre. De toda missão, de toda porta, de todo lugar escuro. Eu juro na frente de todo mundo que eu amo, dos vivos e das cadeiras vazias: enquanto você estiver aqui, eu volto inteiro. Sempre."`,`"I promised I'd come back," you say. "On the roof, not knowing if I could. It was the first promise I ever made without being sure.

At the clinic, Death opened a door. On the other side was my whole family. My mother dancing. Bob laughing. There was a place for me at the table. And I wanted to sit, Koranna. I wanted to so much.

But I had promised you. So I came back. And I'll always come back. From every mission, every door, every dark place. I swear it in front of everyone I love, the living and the empty chairs: as long as you're here, I come back in one piece. Always."`,`"Te prometí que volvía", dices. "En el techo, sin saber si iba a poder. Fue la primera promesa que hice sin estar seguro.

En la clínica, la Muerte abrió una puerta. Del otro lado estaba toda mi familia. Mi madre bailando. Bob riéndose. Había un lugar para mí en la mesa. Y quise sentarme, Koranna. Quise muchísimo.

Pero te lo había prometido. Así que volví. Y voy a volver siempre. De cada misión, de cada puerta, de cada lugar oscuro. Lo juro frente a todos los que amo, los vivos y las sillas vacías: mientras estés aquí, vuelvo entero. Siempre."`)

    return P(V[v]||V.pouco)+P(L(`A Koranna não consegue responder de primeira. Ela respira fundo duas vezes, ri de si mesma, enxuga o rosto com as costas da mão, borrando a maquiagem que a Maitê levou uma hora para fazer.

"Adam Zart", ela diz. O seu nome de verdade, na frente de todo mundo. "Eu te vi pela primeira vez num tatame, com a guarda baixa demais e os olhos mais tristes que eu já tinha visto. Eu pensei: esse homem não deixa ninguém entrar. E decidi que ia entrar mesmo assim.

Eu não prometo que vai ser fácil. A gente trabalha com monstros. Mas eu prometo que você nunca mais vai acordar sozinho às três da manhã. Prometo corrigir a sua guarda até a gente ficar velho. Prometo dançar com você na cozinha, todo domingo, mesmo sem música, até a gente ficar velho.
