Você beija. No altar, com as pétalas de ipê que a Olívia joga do corredor caindo em cima de vocês, o sino da igreja tocando pela primeira vez em anos porque o Tuninho subiu escondido na torre, e trinta e duas pessoas de pé, gritando, e o Frederico no ombro do Derick fazendo barulho de beijo, alto, estalado, sem parar, e depois berrando "Oi amor!" bem no ouvido dele, ecoando pela igreja inteira. O padre Anselmo ri tanto que precisa se segurar no altar. O Derick nem reclama. Ele está chorando demais para isso.

No primeiro banco, os oito lugares vazios parecem um pouco menos vazios.`,`Koranna can't answer at first. She takes two deep breaths, laughs at herself, wipes her face with the back of her hand, smudging the makeup Maitê spent an hour on.

"Adam Zart," she says. Your real name, in front of everyone. "I first saw you on a training mat, your guard too low and the saddest eyes I'd ever seen. I thought: this man doesn't let anyone in. And I decided I'd get in anyway.

I don't promise it'll be easy. We work with monsters. But I promise you'll never again wake up alone at three in the morning. I promise to correct your guard until we're old. I promise to dance with you in the kitchen, every Sunday, even without music, until we're old.

Father Anselmo clears his throat, moved, and looks at Kavyur, whose face is still wet. "After that, my son, there's nothing left for me to say." The whole church laughs, crying. The priest opens his arms. "I now pronounce you husband and wife. You may kiss the bride, Mada."

You kiss her. At the altar, with the ipê petals Olívia throws from the aisle falling on you both, the church bell ringing for the first time in years because Tuninho snuck up into the tower, and thirty-two people on their feet, shouting, and Frederico on Derick's shoulder making loud smacking kiss sounds, over and over, and then squawking "Hi, love!" right into his ear, echoing through the whole church. Father Anselmo laughs so hard he has to hold on to the altar. Derick doesn't even complain. He's crying too hard for that.

In the front pew, the eight empty seats seem a little less empty.`,`Koranna no puede responder enseguida. Respira hondo dos veces, se ríe de sí misma, se seca la cara con el dorso de la mano, corriendo el maquillaje que Maitê tardó una hora en hacerle.

"Adam Zart", dice. Tu nombre verdadero, frente a todos. "Te vi por primera vez en un tatami, con la guardia demasiado baja y los ojos más tristes que había visto nunca. Pensé: este hombre no deja entrar a nadie. Y decidí que iba a entrar igual.

El padre Anselmo carraspea, emocionado, y mira a Kavyur, que todavía tiene la cara mojada. "Después de eso, hijo, no me quedó nada por decir." Toda la iglesia se ríe, llorando. El padre abre los brazos. "Los declaro marido y mujer. Puedes besar a la novia, Mada."

La besas. En el altar, con los pétalos de ipê que Olívia tira desde el pasillo cayendo sobre los dos, la campana de la iglesia sonando por primera vez en años porque Tuninho se subió a escondidas a la torre, y treinta y dos personas de pie, gritando, y Frederico en el hombro de Derick haciendo ruido de besos, fuerte, sonoro, sin parar, y después chillando "¡Hola, amor!" justo en su oído, resonando por toda la iglesia. El padre Anselmo se ríe tanto que tiene que agarrarse del altar. Derick ni se queja. Está llorando demasiado para eso.

a5r_festa:{act:KW,title:L('A última música','The last song','La última canción'),
  text:()=>P(L(`A festa é no bar da Juliana, com as luzinhas penduradas no teto e a placa da porta dos fundos enfeitada de fita vinho. A Juliana serviu feijão para trinta e cinco pessoas e ainda sobrou. O Flavio fez um brinde que ninguém entendeu, mas todo mundo aplaudiu. O Frederico subiu no balcão e cantou "Atirei o pau no gato" inteira, desafinado, balançando a cabeça, e os recrutas aplaudiram de pé e pediram bis. Ele cantou de novo. E de novo. A Iris e o Logan dançaram colados a noite inteira, e ninguém comentou, porque todo mundo já sabia faz meses.

Então o Derick bate um garfo num copo e sobe numa cadeira. Ele está de terno cinza, com a gravata frouxa e os olhos vermelhos.

"Eu tinha doze anos", ele diz, e o bar inteiro fica quieto. "Eu tava num porão, e eu achei que ia morrer lá. E um homem que fala menos do que qualquer pessoa que eu conheço desceu a escada, me pegou no colo e disse uma palavra só: 'Acabou.'"

Ele respira.

"Ele mentiu. Não tinha acabado. Tinha começado. Ele me deu um colchão no chão, uma família e um nome para ser alguém." Ele levanta o copo na sua direção. "Hoje ele ganhou uma família também. Koranna, cuida dele. Ele não sabe pedir. Mada..." A voz dele falha. "Obrigado por ter descido aquela escada."

O bar inteiro levanta o copo. Você não consegue levantar o seu. Você só consegue olhar para ele e assentir.

Perto da meia-noite, a Juliana volta ao gravador. Rebobina a fita. O chiado, o violão, e a voz do seu pai de novo, cantando para a sua mãe. A Koranna estende a mão para você no meio do bar, embaixo das luzinhas.`,`The party is at Juliana's bar, with string lights hanging from the ceiling and the sign on the back door decorated with wine-colored ribbon. Juliana served beans for thirty-five people and there were still leftovers. Flavio gave a toast nobody understood, but everybody applauded. Frederico climbed onto the counter and sang "Atirei o pau no gato", the old Brazilian nursery song, all the way through, off-key, bobbing his head, and the recruits gave him a standing ovation and begged for an encore. He sang it again. And again. Iris and Logan danced close all night, and nobody said a thing, because everyone had known for months.

Then Derick taps a fork on a glass and climbs onto a chair. He's in his gray suit, tie loose, eyes red.

"I was twelve," he says, and the whole bar goes quiet. "I was in a basement, and I thought I'd die there. And a man who talks less than anyone I know came down the stairs, picked me up and said one word: 'Over.'"

He breathes.

"He lied. It wasn't over. It had just started. He gave me a mattress on the floor, a family and a name to be somebody." He raises his glass toward you. "Today he got a family too. Koranna, take care of him. He doesn't know how to ask. Mada..." His voice breaks. "Thank you for coming down those stairs."

The whole bar raises their glasses. You can't raise yours. You can only look at him and nod.

Near midnight, Juliana goes back to the tape recorder. Rewinds the tape. The hiss, the guitar, and your father's voice again, singing to your mother. Koranna holds out her hand to you in the middle of the bar, under the string lights.`,`La fiesta es en el bar de Juliana, con lucecitas colgadas del techo y el cartel de la puerta de atrás adornado con cinta color vino. Juliana sirvió porotos para treinta y cinco personas y todavía sobró. Flavio hizo un brindis que nadie entendió, pero todos aplaudieron. Frederico se subió a la barra y cantó "Atirei o pau no gato", la vieja canción infantil brasileña, enterita, desafinado, moviendo la cabeza, y los reclutas lo ovacionaron de pie y pidieron otra. La cantó de nuevo. Y de nuevo. Iris y Logan bailaron pegados toda la noche, y nadie dijo nada, porque todos lo sabían hacía meses.

Entonces Derick golpea un vaso con un tenedor y se sube a una silla. Está de traje gris, con la corbata floja y los ojos rojos.

"Yo tenía doce años", dice, y todo el bar se queda en silencio. "Estaba en un sótano, y creí que iba a morir ahí. Y un hombre que habla menos que cualquier persona que conozco bajó la escalera, me alzó y dijo una sola palabra: 'Terminó.'"

Respira.

"Mintió. No había terminado. Había empezado. Me dio un colchón en el piso, una familia y un nombre para ser alguien." Levanta el vaso hacia ti. "Hoy él también ganó una familia. Koranna, cuídalo. No sabe pedir. Mada..." La voz se le quiebra. "Gracias por bajar esa escalera."

Todo el bar levanta los vasos. No puedes levantar el tuyo. Solo puedes mirarlo y asentir.

Cerca de la medianoche, Juliana vuelve al grabador. Rebobina la cinta. El siseo, la guitarra, y otra vez la voz de tu padre, cantándole a tu madre. Koranna te tiende la mano en medio del bar, debajo de las lucecitas.`))+bond('derick',2),
  choices:()=>[
    {label:L('Dançar com ela','Dance with her','Bailar con ella'),main:true,
      run:()=>{S.flags.casou=true;return {text:P(L(`Você pega a mão dela. Põe a outra na cintura dela. E, pela primeira vez, você não pisa no pé de ninguém.

A Koranna levanta os olhos, surpresa. "Desde quando você sabe dançar?"

"Desde março", você diz. "A Juliana me dá aula na cozinha do bar. Toda quinta, às três da tarde. Ninguém sabia."

Ela ri, com os olhos cheios. Depois encosta a cabeça no seu peito, em cima da cicatriz, e vocês dançam devagar, quase parados, girando no meio do bar, no mesmo lugar onde, um ano antes, ela encostou a cabeça no seu ombro e você chorou pela primeira vez desde o Bob. A voz do seu pai canta no gravador. Por um instante, você jura que ouve, junto com ela, o riso da sua mãe.

Ninguém mais dança. O bar inteiro fica olhando, em silêncio. Em cima do balcão, até o Frederico fica quieto.

A música acaba. O chiado da fita continua. Vocês não param de dançar.

Mais tarde, você percebe que a Maitê e o Kavyur sumiram da festa ao mesmo tempo. Do balcão, o Frederico grita "Tchau!" para as costas dos dois. A Koranna cutuca você. "Você viu?"

"Faz meses", você diz. "Ela retoca o batom antes das aulas de terça."

No seu pulso, o relógio do Thomas marca 3h17 da manhã. A hora em que tudo sempre dava errado.

Hoje, nada dá errado. Hoje, às 3h17, você está dançando com a sua mulher, no bar onde tudo começou, com a sua família em volta. Os que estão aqui e os que ficaram nos oito lugares vazios.

Você tem vinte e sete anos. E, pela primeira vez desde os dezessete, você não tem medo do dia seguinte.`,`You take her hand. Put your other hand on her waist. And, for the first time, you don't step on anyone's foot.

Koranna looks up, surprised. "Since when do you know how to dance?"

"Since March," you say. "Juliana's been teaching me in the bar kitchen. Every Thursday, at three in the afternoon. Nobody knew."

She laughs, eyes full. Then she rests her head on your chest, over the scar, and you dance slowly, barely moving, turning in the middle of the bar, in the same spot where, a year before, she rested her head on your shoulder and you cried for the first time since Bob. Your father's voice sings from the tape recorder. For a moment, you swear you hear, along with it, your mother's laugh.

Nobody else dances. The whole bar watches, in silence. On the counter, even Frederico goes quiet.

The song ends. The tape hiss goes on. You don't stop dancing.

Later, you notice that Maitê and Kavyur disappeared from the party at the same time. From the counter, Frederico shouts "Bye!" at their backs. Koranna nudges you. "Did you see that?"

"For months," you say. "She touches up her lipstick before the Tuesday classes."

On your wrist, Thomas's watch shows 3:17 a.m. The hour when everything always went wrong.

Tonight, nothing goes wrong. Tonight, at 3:17, you're dancing with your wife, in the bar where it all began, with your family around you. The ones who are here and the ones who stayed in the eight empty seats.

You're twenty-seven. And, for the first time since you were seventeen, you're not afraid of the next day.`,`Le tomas la mano. Pones la otra en su cintura. Y, por primera vez, no le pisas el pie a nadie.

Koranna levanta la vista, sorprendida. "¿Desde cuándo sabes bailar?"

"Desde marzo", dices. "Juliana me da clases en la cocina del bar. Todos los jueves, a las tres de la tarde. Nadie lo sabía."

Se ríe, con los ojos llenos. Después apoya la cabeza en tu pecho, encima de la cicatriz, y bailan despacio, casi quietos, girando en medio del bar, en el mismo lugar donde, un año antes, ella apoyó la cabeza en tu hombro y lloraste por primera vez desde Bob. La voz de tu padre canta en el grabador. Por un instante, juras que oyes, junto con ella, la risa de tu madre.

Nadie más baila. Todo el bar mira, en silencio. Sobre la barra, hasta Frederico se queda callado.

La canción termina. El siseo de la cinta sigue. Ustedes no dejan de bailar.

Más tarde, te das cuenta de que Maitê y Kavyur desaparecieron de la fiesta al mismo tiempo. Desde la barra, Frederico les grita "¡Chau!" a las espaldas. Koranna te da un codazo. "¿Viste eso?"

"Hace meses", dices. "Se retoca el labial antes de las clases de los martes."

En tu muñeca, el reloj de Thomas marca las 3:17 de la mañana. La hora en que todo siempre salía mal.

Esta noche, nada sale mal. Esta noche, a las 3:17, estás bailando con tu esposa, en el bar donde todo empezó, con tu familia alrededor. Los que están aquí y los que se quedaron en los ocho lugares vacíos.

Tienes veintisiete años. Y, por primera vez desde los diecisiete, no le tienes miedo al día siguiente.`))+calm(10),end:true}}}

function gloves(){if(S.flags.luvas)return '';S.flags.luvas=true;const i=newInst('vestimenta');i.skill='Acrobacia';i.gift=L('Luvas do pai','Dad\'s gloves','Guantes de papá');S.inv.push(i);return `<p class="gain">+ ${i.gift} (+2 ${sk('Acrobacia')})</p>`}
/* ================= EQUIPAMENTO ================= */
const iname=i=>i.gift||ITEMS[i.id].name;
function catCount(inv,c){return inv.filter(i=>!i.gift&&!ITEMS[i.id].special&&itemCat(i)===c).length}
function critStr(c){const [m,x]=c;return m<20?(x>2?`${m}/x${x}`:`${m}`):`x${x}`}
function modGroup(it){if(it.kind==='arma')return it.fire?'fire':'melee';if(it.kind==='municao')return 'ammo';if(it.kind==='protecao')return 'prot';if(it.kind==='acessorio')return 'acc';return null}
function newInst(id){const it=ITEMS[id];return {uid:Math.random().toString(36).slice(2,9),id,mods:[],
  skill:it.pick==='skill'?'Percepção':null,skill2:null,kitSkill:it.pick==='kit'?'Medicina':null,
  cenas:it.cenas??null,charges:it.charges??null}}
function itemCat(i){return ITEMS[i.id].cat+i.mods.length}
function itemSp(i){const it=ITEMS[i.id];if(!it.sp)return 0;return Math.max(0,it.sp-(i.mods.some(m=>DISCRETE.includes(m))?1:0)+(i.mods.includes('blindada')?1:0)+(i.mods.includes('reforcada')?1:0))}
function spacesUsed(inv){return inv.reduce((s,i)=>s+itemSp(i),0)}
function capacity(){return S&&S.act===2?30:15}
const scenesWord=n=>n>1?L('cenas','scenes','escenas'):L('cena','scene','escena');
function itemStats(it,i){
  if(it.dmg)return `${it.dmg}${it.dmg2?'/'+it.dmg2:''} · ${critStr(it.crit)} · ${it.alc||'—'} · ${it.tipo||''}`;
  if(it.kind==='protecao')return `+${it.def} ${L('Defesa','Defense','Defensa')}${it.rd?' · '+L('RD','DR','RD')+' '+it.rd:''}`;
  if(it.cenas){const n=i?i.cenas:it.cenas;return it.cenas>=99?L('dura a missão','lasts the mission','dura la misión'):`${n} ${scenesWord(n)}`}
  if(it.charges)return `${i?i.charges:it.charges} ${L('usos','uses','usos')}`;
  return '';
}
function armorInfo(inv,cls,grip){
  let def=0,rd=0,heavy=false,nonprof=false;const names=[];const p=PROF[cls]||{};
  inv.forEach(i=>{const it=ITEMS[i.id];if(it.kind!=='protecao')return;
    let dv=it.def+(i.mods.includes('reforcada')?2:0);
    if(it.shield&&grip==='duas')dv=0;
    def+=dv;if(it.rd)rd=Math.max(rd,it.rd);if(i.mods.includes('blindada'))rd=Math.max(rd,5);
    if(it.heavy)heavy=true;
    if(!((i.id==='leve'&&p.leve)||(S&&(S.powers||[]).includes('protpesada'))))nonprof=true;
    names.push(it.name)});
  if(S&&(S.powers||[]).includes('tanque')&&inv.some(i=>i.id==='pesada')){def+=2;rd+=2}
  return {def,rd,heavy,nonprof,names};
}
const hasItem=id=>!!(S&&S.inv)&&S.inv.some(i=>i.id===id);
function unarmed(){return (S&&(S.powers||[]).includes('artista'))?Object.assign({},UNARMED,{name:L('Artista Marcial','Martial Arts','Artes Marciales'),dmg:S.nex>=70?'1d10':S.nex>=35?'1d8':'1d6',agil:true}):UNARMED}
function weaponList(){const drop=(S.combat&&S.combat.dropped)||[];return [...S.inv.filter(i=>ITEMS[i.id].dmg&&!drop.includes(i.uid)).map(i=>({inst:i,it:ITEMS[i.id]})),{inst:{uid:'_desarmado',id:'_desarmado',mods:[]},it:unarmed()}]}
function equipped(){const l=weaponList();return l.find(w=>w.inst.uid===S.equip)||l[0]}
function curArmor(){return armorInfo(S.inv,S.cls,equipped().it.grip)}
function wStats(w,mode='normal'){
  const it=w.it,m=w.inst.mods,coron=mode==='coronhada',o={};
  o.name=coron?`${L('Coronhada','Pistol-whip','Culatazo')} (${it.name})`:(w.inst.gift||it.name);
  o.ranged=!coron&&!!it.ranged;
  o.skill=o.ranged?'Pontaria':'Luta';
  o.attr=o.ranged?'AGI':(it.agil&&!coron&&S.attr.AGI>S.attr.FOR?'AGI':'FOR');
  let base=coron?(it.grip==='duas'?'1d6':'1d4'):it.dmg;
  if(!coron&&it.dmg2&&!S.inv.some(i=>i.id==='escudo'))base=it.dmg2;
  const mm=/(\d+)d(\d+)/.exec(base);o.n=+mm[1];o.s=+mm[2];
  o.margin=coron?20:it.crit[0]-((m.includes('perigosa')||m.includes('laser'))?2:0);
  o.mult=coron?2:it.crit[1];
  o.atk=(!coron&&(m.includes('certeira')||m.includes('alongada')))?2:0;

const d=n=>1+Math.floor(Math.random()*n);
function rollExpr(expr,mult=1,extraDice=0){
  const m=/^(\d+)d(\d+)([+-]\d+)?$/.exec(expr.replace(/\s/g,''));
  const n=(+m[1]+extraDice)*mult, s=+m[2], mod=m[3]?+m[3]:0;
  const rolls=Array.from({length:n},()=>d(s));
  return {total:Math.max(1,rolls.reduce((a,b)=>a+b,0)+mod),rolls,expr:`${n}d${s}${mod?(mod>0?'+':'')+mod:''}`};
}

}

async function test(k,dt,o={}){
  const ak=o.attr||SKILLS[k];const a=S.attr[ak]??1;
  const n=a+(o.diceMod||0),low=n<=0,count=low?2-n:n;
  const dice=Array.from({length:count},()=>d(20));
  const kept=low?Math.min(...dice):Math.max(...dice);
  let bonus=0;const parts=[`${sk(k)} (${ab(ak)} ${a}${o.diceMod?`, ${o.diceMod}d20`:''})`];
  (o.notes||[]).forEach(x=>parts.push(x));

  if((S.powers||[]).includes('destemido')&&['Fortitude','Reflexos','Vontade'].includes(k)){bonus+=5;parts.push(L('Destemido +5','Fearless +5','Intrépido +5'))}
  const g=gearBonus(k,o.ctx||[]);bonus+=g.b;parts.push(...g.parts);

  if(S.nextBonus){bonus+=S.nextBonus;parts.push(`${L('preparo','preparation','preparación')} +${S.nextBonus}`);S.nextBonus=0}

  const label=o.label||`${L('Teste de','Roll:','Tirada de')} ${sk(k)}`;
  await showRoll({label,dice,kept,bonus,total,dt,ok,crit,parts});
  log(`${label}: [${dice.join(', ')}]${bonus?(bonus>0?'+':'')+bonus:''} = ${total}${dt!=null?` vs ${dt} → ${ok?L('sucesso','success','éxito'):L('falha','failure','fallo')}`:''}`);

}

  if(C.script&&SCRIPTS[C.script].check){const r=SCRIPTS[C.script].check(C);if(r){busy=false;winCombat(r);return true}}

function cyStates(){return {
  serra:{name:L('Serra','Saw','Sierra'),look:L('A serra do braço gira até ficar vermelha.','The saw on its arm spins until it glows red.','La sierra del brazo gira hasta ponerse roja.'),weak:L('sofrer 15 ou mais de dano num único golpe','take 15 or more damage in a single blow','recibir 15 o más de daño en un solo golpe'),dmg:'1d10+3'},

  blindagem:{name:L('Blindagem','Armor','Blindaje'),look:L('Placas de metal se fecham sobre a carne. Os golpes batem e voltam.','Metal plates close over the flesh. Blows bounce right off.','Placas de metal se cierran sobre la carne. Los golpes rebotan.'),weak:L('ser atingido por ácido','be hit with acid','ser alcanzado por ácido'),dmg:'1d8+2'}
}}
function cyPanel(C){
  const cy=C.cy,st=cyStates();
  if(!cy.states.length)return `<p class="desc" style="color:var(--gain)"><b>${L('DESATIVADO','DEACTIVATED','DESACTIVADO')}</b> · ${L('Defesa 10. Ele não consegue mais sair do lugar.','Defense 10. It can no longer move.','Defensa 10. Ya no puede moverse.')}</p>`;
  const s=st[cy.cur];
  return `<p class="desc"><b style="color:var(--accent)">${L('Estado','State','Estado')}: ${s.name}.</b> ${s.look}<br><span class="dim">${L('Fraqueza','Weakness','Debilidad')}: ${has('projeto')?s.weak:'?'} · ${L('Estados restantes','States left','Estados restantes')}: ${cy.states.map(k=>st[k].name).join(', ')}</span></p>`;
}
function cyResolve(C,why){
  const cy=C.cy,st=cyStates(),name=st[cy.cur].name;
  cy.states=cy.states.filter(k=>k!==cy.cur);
  cline(`${why} ${L(`O estado ${name} se apaga para sempre.`,`The ${name} state shuts down for good.`,`El estado ${name} se apaga para siempre.`)}`,'good');
  if(!cy.states.length){cy.cur=null;C.e.def=10;cline(L('O Ciborgue trava, soltando fumaça. DESATIVADO: Defesa 10.','The Cyborg locks up, smoking. DEACTIVATED: Defense 10.','El Ciborg se traba, largando humo. DESACTIVADO: Defensa 10.'),'good')}
  else{cy.cur=cy.states[d(cy.states.length)-1];cy.t=0;cline(`${L('Ele muda para','It switches to','Cambia a')} ${st[cy.cur].name}. ${st[cy.cur].look}`,'hit')}
}

      cline(L(`Você arranca a tampa da caixa. A esfera de Energia explode em raios que atravessam o quarto e se cravam na Morte: ${dm} de dano. Ela grita com a voz de todo mundo ao mesmo tempo. O tempo, em volta dela, para de voltar.`,`You tear the lid off the box. The Energy sphere bursts into lightning that crosses the room and drives into Death: ${dm} damage. She screams in everyone\'s voice at once. Time, around her, stops turning back.`,`Arrancas la tapa de la caja. La esfera de Energía estalla en rayos que cruzan el cuarto y se clavan en la Muerte: ${dm} de daño. Grita con la voz de todos a la vez. El tiempo, a su alrededor, deja de volver.`),'good');return true}
    if(S.pe<3){cline(L('Você não tem PE para acender a cicatriz.','You don\'t have the EP to light the scar.','No tienes PE para encender la cicatriz.'));return false}
    S.pe-=3;const r=await test('Vontade',18,{label:L('A cicatriz','The scar','La cicatriz')});
    if(r.ok){const dm=hurt(rollExpr('3d10+6').total);a.block=Math.max(a.block,2);
      cline(L(`A cicatriz acende no seu peito como uma árvore de raios. Você encosta a mão na coisa e a Energia passa por você: ${dm} de dano, e o tempo dela trava.`,`The scar lights up on your chest like a tree of lightning. You press your hand to the thing and the Energy runs through you: ${dm} damage, and her time locks up.`,`La cicatriz se enciende en tu pecho como un árbol de rayos. Apoyas la mano en la cosa y la Energía pasa a través de ti: ${dm} de daño, y su tiempo se traba.`),'good')}
    else{const l=rollExpr('1d8').total;S.pv=Math.max(1,S.pv-l);cline(L(`A cicatriz acende e apaga. A descarga volta para dentro de você: −${l} PV.`,`The scar flares and dies. The discharge turns back into you: −${l} HP.`,`La cicatriz se enciende y se apaga. La descarga vuelve hacia ti: −${l} PV.`),'hit')}
    return true},
  enemyAtk:C=>({dmg:C.e.dmg}),
  end:C=>C.am&&C.am.big?L('A Morte cai de joelhos. A cicatriz do raio atravessa o peito dela como uma árvore de luz.','Death falls to her knees. The lightning scar runs through her chest like a tree of light.','La Muerte cae de rodillas. La cicatriz del rayo le atraviesa el pecho como un árbol de luz.'):L('O arauto se desfaz em lodo, e o lodo vira pó.','The herald comes apart into sludge, and the sludge turns to dust.','El heraldo se deshace en lodo, y el lodo se hace polvo.')
};

function startLevel(next){
  S.lvl={next,stage:'nex',opt:null,sub:null,from:S.nex};
  const old={pv:S.pvMax,pe:S.peMax,san:S.sanMax};
  S.nex+=5;recalcMax();
  const g={pv:S.pvMax-old.pv,pe:S.peMax-old.pe,san:S.sanMax-old.san};
  S.pv+=g.pv;S.pe+=g.pe;S.san+=g.san;S.lvl.gains=g;
  S.screen='levelup';S.outcome=null;save();render();window.scrollTo(0,0);
}

const CHAPTER_START=new Set(['c2a_pensao','c3a_missao','c4a_roger','c5a_missao','a2c2a_sala','a3a_base','a4a_cicatriz','a5a_relogio']);
function restChoice(id){
  S.pe=S.peMax;let t='';
  if(id==='sleep'){const h=healPv(Math.ceil(S.pvMax/2));t=L(`Você dorme, pela primeira vez sem vigiar a porta. +${h} PV.`,`You sleep, for the first time without watching the door. +${h} HP.`,`Duermes, por primera vez sin vigilar la puerta. +${h} PV.`)}
  if(id==='mind'){const b=S.san;S.san=Math.min(S.sanMax,S.san+rollExpr('2d4').total+S.attr.PRE);t=L(`Quedas, rolamentos, flexões. Até a cabeça ficar em silêncio. +${S.san-b} SAN.`,`Falls, rolls, push-ups. Until your head goes quiet. +${S.san-b} SAN.`,`Caídas, rodadas, flexiones. Hasta que la cabeza se calla. +${S.san-b} SAN.`)}
  S.scene=S.lvl.next;S.lvl=null;S.screen='game';S.treatReady=true;
  S.outcome=`<p>${t} ${L('PE restaurados.','EP restored.','PE restaurados.')}</p>`;S.outcomeCls='ok';

}

  Ls.push(L('Você deixou o Sílvio vivo. A escolha que o Pablo nunca deu ao Derick, e que você nunca teve. Na sala de interrogatório da Base, ele já começou a falar do Brenner.','You left Sílvio alive. The choice Pablo never gave Derick, and that you never had. In the Base\'s interrogation room, he has already started talking about Brenner.','Dejaste a Sílvio con vida. La elección que Pablo nunca le dio a Derick, y que tú nunca tuviste. En la sala de interrogatorios de la Base, ya empezó a hablar de Brenner.'));

  Ls.push(L('Na usina, a Relíquia de Energia procurou um corpo e escolheu o Derick. Você ficou na frente. O Kadu, algemado, deixou uma pergunta que não sai da sua cabeça: quem na Base sabia da usina?','At the plant, the Energy Relic searched for a body and chose Derick. You stood in front of him. Kadu, in cuffs, left you with a question you can\'t shake: who at the Base knew about the plant?','En la usina, la Reliquia de Energía buscó un cuerpo y eligió a Derick. Te pusiste delante. Kadu, esposado, te dejó una pregunta que no se te va: ¿quién en la Base sabía de la usina?'));
  Ls.push(S.flags.acusou==='vt'?L('No quadro, todas as linhas levavam ao mesmo nome, e você foi o único com coragem de escrever. VT. A letra do bolo de aniversário. A mão que te ensinou a segurar a Raijin.','On the board, every line led to the same name, and you were the only one brave enough to write it. VT. The handwriting on the birthday cake. The hand that taught you to hold Raijin.','En el mural, todas las líneas llevaban al mismo nombre, y fuiste el único con el coraje de escribirlo. VT. La letra de la torta de cumpleaños. La mano que te enseñó a sostener la Raijin.'):L('Você apontou para a pessoa errada, e viu no rosto dela o que é ser acusado por alguém que você ama. Foi o Kavyur quem ligou com a verdade. Você ainda deve um pedido de desculpas.','You pointed at the wrong person, and saw on their face what it is to be accused by someone you love. It was Kavyur who called with the truth. You still owe an apology.','Señalaste a la persona equivocada, y viste en su cara lo que es ser acusado por alguien que amas. Fue Kavyur quien llamó con la verdad. Todavía debes una disculpa.'));
  Ls.push(S.flags.teamo?L('No hangar vazio, com a cicatriz do raio ainda ardendo, você disse "eu te amo" para a Koranna pela primeira vez. Ela respondeu que também te ama.','In the empty hangar, the lightning scar still burning, you said "I love you" to Koranna for the first time. She said she loves you too.','En el hangar vacío, con la cicatriz del rayo todavía ardiendo, le dijiste "te amo" a Koranna por primera vez. Ella respondió que también te ama.'):L('No hangar vazio, as palavras demoraram a sair. Saíram quebradas, quase sem voz. A Koranna encostou a testa na sua e disse que também te ama.','In the empty hangar, the words took a long time to come. They came out broken, almost voiceless. Koranna rested her forehead on yours and said she loves you too.','En el hangar vacío, las palabras tardaron en salir. Salieron quebradas, casi sin voz. Koranna apoyó la frente en la tuya y dijo que ella también te ama.'));
  Ls.push(L('No Fórum, a tinta do livro subiu até os olhos do VT, e só o sangue dos Zart podia parar. Ele pediu para ser você. "Pés firmes. Não fecha os olhos." Você não fechou. Foi a primeira vez que você disse que o amava.','At the Forum, the book\'s ink climbed to VT\'s eyes, and only Zart blood could stop it. He asked for it to be you. "Feet planted. Don\'t close your eyes." You didn\'t. It was the first time you told him you loved him.','En el Foro, la tinta del libro le subió a VT hasta los ojos, y solo la sangre de los Zart podía detenerla. Pidió que fueras tú. "Pies firmes. No cierres los ojos." No los cerraste. Fue la primera vez que le dijiste que lo querías.'));
  Ls.push(L('O Kavyur enterrou o VT com as próprias mãos, atrás do hangar. No mesmo dia, pediu para entrar na Ordem. Agora ele tem um crachá, uma chave da Base e o mesmo alvo que você: o Comprador.','Kavyur buried VT with his own hands, behind the hangar. That same day, he asked to join the Order. Now he has a badge, a Base key and the same target as you: the Buyer.','Kavyur enterró a VT con sus propias manos, detrás del hangar. Ese mismo día, pidió entrar en la Orden. Ahora tiene una credencial, una llave de la Base y el mismo objetivo que tú: el Comprador.'));

  Ls.push((S.flags.a5acertos||0)===2?L('Você montou o último quadro em seis folhas e um nome: Lázaro Mercer, no Solar dos Ipês, onde os ipês caem. O Thomas teria montado igual.','You built the last board out of six pages and one name: Lazarus Mercer, at the Solar dos Ipês, where the ipê trees shed. Thomas would have built it the same way.','Armaste el último mural con seis hojas y un nombre: Lázaro Mercer, en el Solar dos Ipês, donde caen los ipês. Thomas lo habría armado igual.'):L('O último quadro custou mais do que devia. O relógio não perdoou os erros, e você ainda tem os fios brancos para provar.','The last board cost more than it should have. The watch didn\'t forgive the mistakes, and you still have the white strands to prove it.','El último mural costó más de lo que debía. El reloj no perdonó los errores, y todavía tienes las hebras blancas para probarlo.'));

  Ls.push(S.flags.a5ficou?L('A Morte abriu a porta da cozinha da vó e te ofereceu um lugar à mesa. Você olhou para eles uma última vez e fechou a porta sozinho. A sua mãe sorriu.','Death opened the door to Grandma\'s kitchen and offered you a seat at the table. You looked at them one last time and closed the door yourself. Your mother smiled.','La Muerte abrió la puerta de la cocina de la abuela y te ofreció un lugar en la mesa. Los miraste una última vez y cerraste la puerta tú solo. Tu madre sonrió.'):L('A Morte abriu a porta da cozinha da vó, e você deu dois passos. Foi a mão da Koranna que te trouxe de volta. A sua mãe, do outro lado, acenou para ela.','Death opened the door to Grandma\'s kitchen, and you took two steps. It was Koranna\'s hand that brought you back. Your mother, on the other side, nodded to her.','La Muerte abrió la puerta de la cocina de la abuela, y diste dos pasos. Fue la mano de Koranna la que te trajo de vuelta. Tu madre, del otro lado, le hizo un gesto.'));

  Ls.push(L('O Tuninho ficou na frente da sua porta quando a Morte veio pela primeira vez. Ele tem vinte e três anos e o cabelo todo branco. Diz que combina com a responsabilidade.','Tuninho stood in front of your door the first time Death came. He\'s twenty-three with completely white hair. He says it suits the responsibility.','Tuninho se quedó frente a tu puerta la primera vez que vino la Muerte. Tiene veintitrés años y el pelo completamente blanco. Dice que le combina con la responsabilidad.'));

function renderEnd(){if(S.act===2)return renderEnd2();
  const sanP=S.san/S.sanMax;const B=k=>S.bond[k]||0;
  const bonds=Object.values(S.bond).reduce((a,b)=>a+b,0);
  const score=S.clues.length*2+bonds+(sanP>.5?2:0)+(S.flags.ensaio?2:0)+(S.flags.obedeceu?2:0)+(S.flags.pegou?2:0)+(S.flags.kavsalvo?2:0)+(S.flags.vtfalou?2:0)+(S.flags.tubos?2:0);
  const rank=score>=64?'S':score>=50?'A':score>=33?'B':'C';
  const Ls=[];
  Ls.push(S.flags.obedeceu?L('Você obedeceu. Virou as costas para os seus pais porque eles pediram, e tirou os seus irmãos vivos. Vai passar anos se perguntando se foi coragem ou covardia. Foi coragem.','You obeyed. You turned your back on your parents because they asked you to, and got your brothers out alive. You\'ll spend years wondering if it was courage or cowardice. It was courage.','Obedeciste. Les diste la espalda a tus padres porque te lo pidieron, y sacaste a tus hermanos con vida. Vas a pasar años preguntándote si fue coraje o cobardía. Fue coraje.'):L('Você não conseguiu virar as costas. Voltou para o corredor, como sempre vai voltar quando alguém estiver em perigo. Seus pais fecharam a porta para que você não visse o fim.','You couldn\'t turn your back. You went back into the hallway, like you always will when someone is in danger. Your parents shut the door so you wouldn\'t see the end.','No pudiste darles la espalda. Volviste al pasillo, como siempre vas a volver cuando alguien esté en peligro. Tus padres cerraron la puerta para que no vieras el final.'));
  Ls.push(has('simbolo')&&has('vizinhos')?L('Você viu o símbolo no portão e reconheceu os vizinhos. Não foi azar. Alguém fez isso. Essa certeza vai te empurrar para frente.','You saw the symbol on the gate and recognized the neighbors. It wasn\'t bad luck. Someone did this. That certainty will keep pushing you forward.','Viste el símbolo en el portón y reconociste a los vecinos. No fue mala suerte. Alguien hizo esto. Esa certeza te va a empujar hacia adelante.'):L('A polícia chama de surto. Uma parte de você sabe que não foi.','The police call it an outbreak. Part of you knows it wasn\'t.','La policía lo llama brote. Una parte de ti sabe que no lo fue.'));
  Ls.push(B('thomas')>=2?L('Thomas e você viraram os pais de Bob da noite para o dia, e dividem isso sem precisar falar.','You and Thomas became Bob\'s parents overnight, and you share it without needing to talk about it.','Thomas y tú se volvieron los padres de Bob de un día para el otro, y lo comparten sin necesidad de hablarlo.'):L('Thomas se fecha. Vocês dividem o quarto, mas não o peso.','Thomas shuts down. You share the room, but not the weight.','Thomas se cierra. Comparten el cuarto, pero no el peso.'));
  Ls.push(B('bob')>=2?L('Bob ainda acha que você é invencível. Você decide que vai ser, por ele.','Bob still thinks you\'re invincible. You decide you will be, for him.','Bob todavía cree que eres invencible. Decides que vas a serlo, por él.'):L('Bob quase não fala desde aquela noite.','Bob barely speaks since that night.','Bob casi no habla desde esa noche.'));
  Ls.push(S.flags.pegou?L('Nos telhados, você viu a tatuagem no pulso do homem que apagava os rastros. Você lembra do rosto dele. Um dia vai encontrar esse rosto de novo.','On the rooftops, you saw the tattoo on the wrist of the man erasing the traces. You remember his face. One day you\'ll find that face again.','En los techos, viste el tatuaje en la muñeca del hombre que borraba los rastros. Recuerdas su cara. Un día vas a volver a encontrarla.'):L('O homem dos telhados escapou. Você só lembra da capa de chuva e do barulho da escova na parede.','The man on the rooftops got away. All you remember is the raincoat and the sound of the brush on the wall.','El hombre de los techos escapó. Solo recuerdas el impermeable y el ruido del cepillo en la pared.'));
  Ls.push(B('vt')>=3?L('VT virou mais do que um professor. Ele erra o seu nome no bolo e acerta todo o resto. Você ainda não chama de família. Mas está perto.','VT has become more than a teacher. He gets your name wrong on the cake and everything else right. You don\'t call it family yet. But you\'re close.','VT se volvió más que un maestro. Se equivoca con tu nombre en la torta y acierta en todo lo demás. Todavía no lo llamas familia. Pero falta poco.'):L('VT te ensina tudo o que sabe, e você aprende. Mas ainda guarda uma distância. Se apegar de novo custa caro.','VT teaches you everything he knows, and you learn it. But you still keep some distance. Getting attached again costs too much.','VT te enseña todo lo que sabe, y lo aprendes. Pero todavía guardas distancia. Encariñarse otra vez cuesta caro.'));
  Ls.push(B('kavyur')>=2?L('Kavyur deve a vida aos três Zart, e sabe disso. Ele não fala em dívida. Só faz café antes de todo mundo acordar e espera o elevador descer depois de cada missão.','Kavyur owes his life to the three Zarts, and he knows it. He never talks about debt. He just makes coffee before anyone wakes up and waits for the elevator to come down after every mission.','Kavyur les debe la vida a los tres Zart, y lo sabe. Nunca habla de deudas. Solo hace café antes de que todos se despierten y espera el montacargas después de cada misión.'):L('Kavyur mora no porão agora. Ainda é um estranho, mas um estranho que ficou.','Kavyur lives in the basement now. Still a stranger, but a stranger who stayed.','Kavyur vive en el sótano ahora. Todavía es un extraño, pero un extraño que se quedó.'));
  Ls.push(S.flags.vtfalou?L('VT encostou a testa na sua antes de você ir para a Ordem. "Volta inteiro. Sempre." Vocês nunca mais falaram disso.','VT rested his forehead against yours before you left for the Order. "Come back in one piece. Always." You never spoke of it again.','VT apoyó su frente contra la tuya antes de que te fueras a la Orden. "Vuelve entero. Siempre." Nunca más hablaron de eso.'):L('A porta do VT não abriu quando vocês foram para a Ordem. Ele ainda finge que não se importa.','VT\'s door didn\'t open when you left for the Order. He still pretends he doesn\'t care.','La puerta de VT no se abrió cuando se fueron a la Orden. Todavía finge que no le importa.'));
  Ls.push(B('derick')>=3?L('Derick segura a manga da sua camiseta nos corredores da Base como se ainda estivesse naquele porão. Ele diz a todo mundo que deve tudo a você. Você finge que não ouve.','Derick holds on to your sleeve in the Base hallways as if he were still in that basement. He tells everyone he owes you everything. You pretend not to hear.','Derick te agarra la manga en los pasillos de la Base como si todavía estuviera en ese sótano. Le dice a todos que te debe todo. Tú finges no oír.'):L('Derick ainda não sabe o que fazer com você. Mas dorme com a porta aberta, do lado da sua.','Derick doesn\'t know what to make of you yet. But he sleeps with his door open, next to yours.','Derick todavía no sabe qué hacer contigo. Pero duerme con la puerta abierta, al lado de la tuya.'));
  Ls.push(B('ryan')>=3?L('Ryan tirou o colete dos Corvos no meio-fio e nunca mais vestiu. Agora conserta as motos da Ordem e fala com você como se te conhecesse há anos.','Ryan took off the Crows\' vest on the curb and never wore it again. Now he fixes the Order\'s bikes and talks to you as if he\'s known you for years.','Ryan se sacó el chaleco de los Cuervos en el cordón y nunca más se lo puso. Ahora arregla las motos de la Orden y te habla como si te conociera hace años.'):L('Ryan entrou para a Ordem e para a Equipe Bob. Com você, ainda é só educado.','Ryan joined the Order and Team Bob. With you, he\'s still just polite.','Ryan entró a la Orden y al Equipo Bob. Contigo, todavía es solo educado.'));
  Ls.push(L('Três equipes, três Zart. Pela primeira vez desde a noite do aniversário, cada um de vocês cuida de alguém que não é da família. Ou que virou.','Three teams, three Zarts. For the first time since the birthday night, each of you is looking after people who aren\'t family. Or who became family.','Tres equipos, tres Zart. Por primera vez desde la noche del cumpleaños, cada uno de ustedes cuida de gente que no es de la familia. O que se volvió familia.'));
  Ls.push(sanP>.6?L('Você ainda dorme. Pouco, mas dorme.','You still sleep. Not much, but you do.','Todavía duermes. Poco, pero duermes.'):L('Toda noite você ouve seu pai gritar "Adam" em inglês.','Every night you hear your father shout "Adam".','Cada noche oyes a tu padre gritar "Adam".'));
  return `<section class="lvl"><div class="act">${L('Fim · Ato I · Cap. 5','End · Act I · Ch. 5','Fin · Acto I · Cap. 5')}</div>
  <h1 class="scene">${L('Relatório','Report','Informe')}</h1>
  <div class="report"><span class="rank">${rank}</span><h2>Adam "Mada" Zart</h2>
    <p style="font-family:var(--mono);font-size:13px">${CLASSES[S.cls].name} · ${ORIGINS[S.origin].name}${(S.powers||[]).includes('casca')?' · '+TRILHA():''} · ${S.age} ${L('anos','y/o','años')} · NEX ${S.nex}% · SAN ${S.san}/${S.sanMax} · ${PV()} ${S.pv}/${S.pvMax}</p>
    ${Ls.map(l=>`<p>${l}</p>`).join('')}
    <ul><li>${L('Pistas','Clues','Pistas')}: ${S.clues.length}/${Object.keys(CLUES).length}</li><li>${L('Vínculos','Bonds','Vínculos')}: ${bonds}</li><li>${L('Pontuação','Score','Puntuación')}: ${score}</li></ul>
    <p style="margin-top:14px"><b>${L('A história continua no Ato II · Capítulo 1.','The story continues in Act II · Chapter 1.','La historia continúa en el Acto II · Capítulo 1.')}</b></p>
  </div>
  <div class="btns"><button class="cta" data-a="act2">${L('Continuar para o Ato II','Continue to Act II','Continuar al Acto II')}</button><button class="ghost" data-a="new">${L('Jogar de novo','Play again','Jugar de nuevo')}</button><button class="ghost" data-a="menu">${L('Menu principal','Main menu','Menú principal')}</button></div>

function setLang(l){if(!LANG_NAMES[l]||l===LANG)return;LANG=l;try{localStorage.setItem(LANG_KEY,l)}catch(e){}buildData();render()}
async function treat(){
  if(busy||!S.treatReady)return;busy=true;render();
  const r=await test('Medicina',15,{label:L('Primeiros socorros','First aid','Primeros auxilios')});
  S.treatReady=false;busy=false;
  if(r.ok){const h=healPv(rollExpr('2d6').total+S.attr.INT);S.outcome=`<p class="gain">+${h} ${PV()}.</p>`;S.outcomeCls='ok'}
  else{S.outcome=`<p>${L('Os curativos não seguram. Tente de novo depois da próxima luta.','The bandages don\'t hold. Try again after the next fight.','Los vendajes no aguantan. Intenta otra vez tras la próxima pelea.')}</p>`;S.outcomeCls='fail'}
  save();render();
}
document.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-a]');if(!b||b.disabled)return;
  const a=b.dataset.a,id=b.dataset.id;
  switch(a){
    case 'lang':setLang(id);break;
    case 'new':D=draft();S={screen:'create'};render();window.scrollTo(0,0);break;
    case 'act2':startAct2();break;
    case 'continue':{const sv=loadSave();if(sv){S=sv;busy=false;if(S.screen==='combat')S=Object.assign(clone(S.checkpoint),{checkpoint:S.checkpoint,screen:'game'});if(S.screen==='arsenal')S.screen='game';render()}break}
    case 'back':case 'menu':if(S&&S.cls&&S.screen!=='end')save();S={screen:'title'};render();break;
    case 'attr':{D.attr[id]+=+b.dataset.d;const max=dPickCount();if(D.picks.length>max)D.picks=D.picks.slice(0,max);render();break}
    case 'pick':D.picks=D.picks.includes(id)?D.picks.filter(x=>x!==id):[...D.picks,id];render();break;
    case 'start':startGame();break;
    case 'arsenal-ok':{if(gearProblems(D.inv).length)return;S.inv=D.inv;if(!S.inv.some(i=>i.uid===S.equip)){const w=S.inv.find(i=>ITEMS[i.id].dmg);S.equip=w?w.uid:'_desarmado'}const back=S.arsenal.next===S.arsenal.from;S.scene=S.arsenal.next;if(S.fxs&&!back)delete S.fxs[S.scene];S.arsenal=null;S.screen='game';S.outcome=null;if(SCENES[S.scene].checkpoint&&!back)setCheckpoint();save();render();window.scrollTo(0,0);break}
    case 'g-add':D.inv.push(newInst(id));render();break;
    case 'g-del':D.inv=D.inv.filter(i=>i.uid!==id);render();break;
    case 'choose':choose(+b.dataset.i);break;
    case 'gate':{const g=S.gate;if(!g)break;S.gate=null;proceed(g);break}
    case 'c-over':leaveCombat();break;
    case 'treat':treat();break;
    case 'equip':if(!busy){S.equip=id;save();render()}break;
    case 'use-out':{if(busy)return;const i=S.inv.find(x=>x.uid===id);if(!i)return;S.inv=S.inv.filter(x=>x!==i);const h=healPv(rollExpr('2d8+2').total);S.outcome=`<p class="gain">+${h} ${PV()}.</p>`;S.outcomeCls='ok';save();render();break}
    case 'c-atk':playerAction('atk',id);break;
    case 'c-item':playerAction('item',id);break;
    case 'c-guard':playerAction('guard');break;
    case 'c-env':playerAction('env',id);break;
    case 'lv-opt':S.lvl.opt=id;S.lvl.sub=null;render();break;
    case 'lv-sub':S.lvl.sub=id;render();break;
    case 'lv-ok':{const Lv=S.lvl;if(Lv.opt&&Lv.opt.startsWith('skill:')){const k=Lv.opt.slice(6);if(!S.trained.includes(k))S.trained.push(k);S.skillUps=(S.skillUps||[]).concat(S.nex)}if(Lv.opt&&Lv.opt.startsWith('attr:')){S.attr[Lv.opt.slice(5)]++;S.attrUps=(S.attrUps||[]).concat(S.nex);const b=S.pvMax;recalcMax();S.pv+=S.pvMax-b}if(POWER_DESC()[Lv.opt]){S.powers=S.powers||[];if(!S.powers.includes(Lv.opt))S.powers.push(Lv.opt);const b=S.pvMax;recalcMax();S.pv+=S.pvMax-b}if(Lv.opt==='skill')S.trained.push(Lv.sub);if(Lv.opt==='power')S.power++;fullRestore();S.scene=Lv.next;S.lvl=null;S.screen='game';S.treatReady=true;S.outcome=`<p class="gain">${L('Vida, PE e Sanidade restaurados.','HP, EP and Sanity restored.','Vida, PE y Cordura restaurados.')}</p>`;S.outcomeCls='ok';setCheckpoint();save();render();window.scrollTo(0,0);break}
    case 'rest':restChoice(id);break;
    case 'retry':{const cp=S.checkpoint;S=clone(cp);S.checkpoint=cp;S.pv=Math.max(S.pv,Math.ceil(S.pvMax*.75));S.san=Math.max(S.san,Math.ceil(S.sanMax*.75));S.pe=S.peMax;busy=false;S.gate=null;S.screen='game';S.outcome=null;save();render();window.scrollTo(0,0);break}
  }
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='langSel'){setLang(t.value);return}
  if(t.id==='c-equip'&&!busy&&S.combat){playerAction('switch',t.value);return}
});
$('sheetBtn').addEventListener('click',()=>$('sheet').classList.toggle('open'));

function goMenu(){if(busy)return;if(S&&S.cls&&S.screen!=='end')save();S={screen:'title'};$('sheet').classList.remove('open');render();window.scrollTo(0,0)}
function askMenu(){
  if(!S||S.screen==='title'||busy)return;
  if(document.querySelector('.qmodal'))return;
  const m=document.createElement('div');m.className='qmodal';m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');
  m.innerHTML=`<div class="qbox"><h2>${L('Voltar para o menu?','Back to the menu?','¿Volver al menú?')}</h2><p>${L('Seu progresso fica salvo. Você pode continuar de onde parou.','Your progress is saved. You can continue where you left off.','Tu progreso queda guardado. Puedes seguir desde donde lo dejaste.')}</p><div class="btns"><button class="cta" data-q="yes">${L('Voltar ao menu','Back to menu','Volver al menú')}</button><button class="ghost" data-q="no">${L('Continuar jogando','Keep playing','Seguir jugando')}</button></div></div>`;
  const close=()=>{m.remove();document.removeEventListener('keydown',esc)};
  const esc=e=>{if(e.key==='Escape')close()};
  m.addEventListener('click',e=>{const q=e.target.closest('[data-q]');if(q){close();if(q.dataset.q==='yes')goMenu()}else if(e.target===m)close()});
  document.addEventListener('keydown',esc);
  document.body.appendChild(m);m.querySelector('[data-q=yes]').focus();
}
$('brandBtn').addEventListener('click',askMenu);
$('brandBtn').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();askMenu()}});
$('menuBtn').addEventListener('click',()=>{if(busy)return;if(S&&S.cls&&S.screen!=='end')save();S={screen:'title'};$('sheet').classList.remove('open');render()});
document.addEventListener('click',ev=>{const sh=$('sheet');if(sh.classList.contains('open')&&!sh.contains(ev.target)&&ev.target.id!=='sheetBtn')sh.classList.remove('open')});

/* ================= BOOT ================= */
function start(data){
  buildData();
  if(data&&data.S){S=data.S;if(data.D)D=data.D}else S={screen:'title'};
  busy=false;
  if(S.screen==='arsenal'&&(!D||!D.inv))S.screen='game';
  $('crestSm').src=CREST;
  render();
}
window.claude?.hot?.snapshot?.(()=>({S,D}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
</body>
