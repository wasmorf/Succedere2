Object.assign(SCENES,{
a3a_base:{act:K,title:L('O número sem nome','The unnamed number','El número sin nombre'),checkpoint:true,
  text:()=>P(L(`O celular do Brenner está no centro da mesa de reunião, ligado num carregador, cercado de cafés frios. Ninguém dormiu direito.

"Alguma notícia da luva do Anfitrião?" A última mensagem do Comprador continua na tela.

A luva do Kadu. Você mesmo viu ela ir para o cofre da antiga Base, cinco andares abaixo da terra, anos atrás. Ninguém voltou lá desde o massacre. Ninguém quis.

O Derick espalha um mapa na mesa. "Três lugares para começar", ele diz. "A antiga Base, o clube dos Corvos e esse número." Ele olha para você. "Por onde?"`,
`Brenner's phone sits in the middle of the meeting table, plugged into a charger, surrounded by cold coffees. Nobody slept well.

"Any news about the Host's glove?" The Buyer's last message is still on the screen.

Kadu's glove. You saw it go into the old Base's vault yourself, five floors underground, years ago. Nobody has been back since the massacre. Nobody wanted to.

Derick spreads a map on the table. "Three places to start," he says. "The old Base, the Crows' clubhouse and this number." He looks at you. "Where first?"`,
`El celular de Brenner está en el centro de la mesa de reuniones, enchufado a un cargador, rodeado de cafés fríos. Nadie durmió bien.

"¿Alguna noticia del guante del Anfitrión?" El último mensaje del Comprador sigue en la pantalla.

El guante de Kadu. Tú mismo lo viste entrar en la bóveda de la antigua Base, cinco pisos bajo tierra, hace años. Nadie volvió desde la masacre. Nadie quiso.

Derick despliega un mapa sobre la mesa. "Tres lugares para empezar", dice. "La antigua Base, el club de los Cuervos y este número." Te mira. "¿Por dónde?"`)),
  choices:()=>[
    {once:'silvio3',label:L('Descer para falar com o Sílvio','Go down to talk to Sílvio','Bajar a hablar con Sílvio'),
      run:()=>({text:P(L(`O Sílvio escuta a mensagem e fecha os olhos. "O Comprador. Eu nunca vi. Nem o Brenner viu. Só a voz, sempre filtrada." Ele pensa. "O Brenner dizia que ele não quer sentar em trono nenhum. Quer ter. As quatro. Como quem coleciona selo."`,`Sílvio listens to the message and closes his eyes. "The Buyer. I never saw him. Neither did Brenner. Just the voice, always filtered." He thinks. "Brenner used to say he doesn't want to sit on any throne. He wants to own. All four. Like someone collecting stamps."`,`Sílvio escucha el mensaje y cierra los ojos. "El Comprador. Nunca lo vi. Ni Brenner lo vio. Solo la voz, siempre filtrada." Piensa. "Brenner decía que no quiere sentarse en ningún trono. Quiere tenerlos. Los cuatro. Como quien colecciona estampillas."`))+addClue('a3comprador')})},
    {once:'maite3',label:L('Perguntar à Maitê sobre o Anfitrião','Ask Maitê about the Host','Preguntarle a Maitê sobre el Anfitrión'),
      run:()=>({text:P(L(`"Sem portador, a Relíquia de Energia é só chama e raio, girando no mesmo lugar. Ela quer um corpo. Qualquer corpo que aguente." A Maitê pega um guardanapo e desenha um círculo com quatro pontas. Explica devagar, como numa aula. Depois dobra o guardanapo e coloca no bolso do seu colete. "Para não esquecer."`,`"Without a bearer, the Energy Relic is just flame and lightning, spinning in one place. It wants a body. Any body that can take it." Maitê grabs a napkin and draws a circle with four points. She explains slowly, like a lecture. Then she folds the napkin and tucks it into your vest pocket. "So you don't forget."`,`"Sin portador, la Reliquia de Energía es solo llama y rayo, girando en el mismo lugar. Quiere un cuerpo. Cualquier cuerpo que aguante." Maitê agarra una servilleta y dibuja un círculo con cuatro puntas. Explica despacio, como en una clase. Después dobla la servilleta y la guarda en el bolsillo de tu chaleco. "Para que no te olvides."`))+addClue('a3opressor')+bond('maite')})},
    {once:'kor3',label:L('A Koranna','Koranna','Koranna'),
      run:()=>({text:S.flags.beijo?P(L(`Ela senta do seu lado com dois cafés e empurra um para você, como se nada tivesse mudado. Tudo mudou. "A gente não contou para ninguém", ela diz baixinho. Do outro lado da mesa, o Derick está mostrando uma foto do telhado no celular para o Tuninho. "O Derick contou para todo mundo", você responde. Ela ri com a mão na boca, e você percebe que está sorrindo também.`,`She sits beside you with two coffees and pushes one toward you, as if nothing had changed. Everything has. "We didn't tell anyone," she says quietly. Across the table, Derick is showing Tuninho a photo of the roof on his phone. "Derick told everyone," you answer. She laughs behind her hand, and you realize you're smiling too.`,`Se sienta a tu lado con dos cafés y te acerca uno, como si nada hubiera cambiado. Todo cambió. "No le contamos a nadie", dice bajito. Del otro lado de la mesa, Derick le está mostrando a Tuninho una foto del techo en el celular. "Derick le contó a todo el mundo", respondes. Ella se ríe tapándose la boca, y te das cuenta de que tú también sonríes.`))+bond('koranna')+calm(3):P(L(`Ela senta do seu lado com dois cafés. Quando você pega o seu, os dedos de vocês se encostam, e nenhum dos dois tira a mão rápido. "Eu vou com você nessa", ela diz. "Em todas." Não é uma pergunta.`,`She sits beside you with two coffees. When you take yours, your fingers touch, and neither of you pulls away quickly. "I'm coming with you on this," she says. "On all of them." It isn't a question.`,`Se sienta a tu lado con dos cafés. Cuando agarras el tuyo, sus dedos se rozan, y ninguno retira la mano rápido. "Voy contigo en esta", dice. "En todas." No es una pregunta.`))+bond('koranna')+calm(2)})},
    {label:L('Começar a investigação','Start the investigation','Empezar la investigación'),main:true,run:()=>({go:'a3b_hub'})}
  ]},

a3b_hub:{act:KI,title:L('Três pistas','Three leads','Tres pistas'),
  text:()=>{const done=['ruinas','clube','numero'].filter(k=>S.flags['a3_'+k]).length;
    return P(L(`A mesa de reunião virou um mural, como o que o Thomas montava no quarto da pensão. Barbante vermelho, fotos, recortes. Você já visitou ${done} de 3 lugares.

Quando achar que já sabe o bastante, monte o quadro. Mas o Comprador pediu notícias da luva há dias. O tempo está correndo.`,`The meeting table has become a board, like the one Thomas used to build in the boarding house room. Red string, photos, clippings. You've visited ${done} of 3 places.

When you think you know enough, put the board together. But the Buyer asked about the glove days ago. Time is running out.`,`La mesa de reuniones se volvió un mural, como el que Thomas armaba en el cuarto de la pensión. Hilo rojo, fotos, recortes. Visitaste ${done} de 3 lugares.

Cuando creas que sabes lo suficiente, arma el mural. Pero el Comprador preguntó por el guante hace días. El tiempo corre.`))},
  choices:()=>[
    {cond:()=>!S.flags.a3_ruinas,label:L('A antiga Base','The old Base','La antigua Base'),run:()=>({go:'a3c_ruinas'})},
    {cond:()=>!S.flags.a3_clube,label:L('O clube dos Corvos','The Crows\' clubhouse','El club de los Cuervos'),run:()=>({go:'a3d_clube'})},
    {cond:()=>!S.flags.a3_numero,label:L('Rastrear o número com o Tuninho','Trace the number with Tuninho','Rastrear el número con Tuninho'),run:()=>({go:'a3e_numero'})},
    {label:L('Montar o quadro','Put the board together','Armar el mural'),main:true,run:()=>({go:'a3f_q1'})}
  ]},

a3c_ruinas:{act:KI,title:L('A antiga Base','The old Base','La antigua Base'),checkpoint:true,
  text:()=>{S.flags.a3_ruinas=true;return P(L(`O prédio comercial sem nome continua de pé. Lacrado, com as janelas pretas de fuligem. O elevador não funciona. Você e o Derick descem pela escada de incêndio, andar por andar.

Ninguém limpou nada. No terceiro subsolo, a mancha no chão do corredor da análise ainda está lá. Você sabe de quem é. Você tirou o relógio do pulso dele bem ali.

O Derick não diz nada. Ele só anda um pouco mais perto de você.`,
`The nameless office building is still standing. Sealed, windows black with soot. The elevator doesn't work. You and Derick go down the fire stairs, floor by floor.

No one cleaned anything. On the third basement level, the stain on the analysis corridor floor is still there. You know whose it is. You took the watch off his wrist right there.

Derick says nothing. He just walks a little closer to you.`,
`El edificio de oficinas sin nombre sigue en pie. Clausurado, con las ventanas negras de hollín. El ascensor no funciona. Tú y Derick bajan por la escalera de incendio, piso por piso.

Nadie limpió nada. En el tercer subsuelo, la mancha en el piso del pasillo de análisis sigue ahí. Sabes de quién es. Le sacaste el reloj de la muñeca justo ahí.

Derick no dice nada. Solo camina un poco más cerca de ti.`))+loseSan('1d4',L('a antiga Base','the old Base','la antigua Base'))},
  choices:()=>[
    {once:'cela3',label:L('Ir até a ala das celas','Go to the cell block','Ir al pabellón de celdas'),
      run:()=>({text:P(L(`O corredor das celas zumbe. As lâmpadas quebradas acendem sozinhas quando vocês passam. No fim do corredor, a cela do Kadu: as grades estão derretidas e retorcidas para fora. E alguma coisa ainda está ali dentro, feita de raio, com o formato das grades.`,`The cell corridor hums. The broken bulbs light up on their own as you pass. At the end of the corridor, Kadu's cell: the bars are melted and twisted outward. And something is still in there, made of lightning, shaped like the bars.`,`El pasillo de las celdas zumba. Las bombillas rotas se encienden solas cuando pasan. Al final del pasillo, la celda de Kadu: los barrotes están derretidos y retorcidos hacia afuera. Y algo sigue ahí adentro, hecho de rayos, con la forma de los barrotes.`))+addClue('a3cela'),combat:{id:'eco',after:'a3c_ruinas',allies:['derick16'],winText:L('O Eco se desfaz numa chuva de faíscas. As lâmpadas do corredor apagam de vez.','The Echo comes apart in a shower of sparks. The corridor bulbs go dark for good.','El Eco se deshace en una lluvia de chispas. Las bombillas del pasillo se apagan para siempre.')}})},
    {once:'cofre3',label:L('Descer até o cofre e puxar as câmeras','Go down to the vault and pull the camera footage','Bajar a la bóveda y sacar las grabaciones'),test:{sk:'Investigação',dt:14},
      ok:()=>({text:P(L(`O servidor das câmeras ficou num armário blindado e sobreviveu. O Derick liga no notebook. Vocês assistem em silêncio. Quando o rosto aparece, o Derick fecha a mão com tanta força que os nós dos dedos ficam brancos.`,`The camera server was in an armored cabinet and survived. Derick hooks it to the laptop. You watch in silence. When the face appears, Derick clenches his fist so hard his knuckles go white.`,`El servidor de las cámaras estaba en un armario blindado y sobrevivió. Derick lo conecta a la notebook. Miran en silencio. Cuando aparece la cara, Derick cierra el puño con tanta fuerza que se le ponen blancos los nudillos.`))+addClue('a3video')}),
      fail:()=>({text:P(L(`O servidor está queimado pela metade. Vocês recuperam três segundos de vídeo, cheios de chuvisco.`,`The server is half burned. You recover three seconds of footage, full of static.`,`El servidor está medio quemado. Recuperan tres segundos de video, llenos de estática.`))+addClue('a3escudo')})},
    {once:'quartoth',label:L('Entrar no quarto do Thomas','Go into Thomas\'s room','Entrar en el cuarto de Thomas'),
      run:()=>({text:P(L(`A cama feita. O mural de cortiça na parede, igual ao da pensão, só que maior. Uma foto dos três irmãos no hangar do VT, presa com um alfinete no canto. Você tira a foto do mural e guarda junto com a de Natal. O Derick espera na porta sem entrar.`,`The bed made. The corkboard on the wall, like the one at the boarding house, only bigger. A photo of the three brothers at VT's hangar, pinned in the corner. You take the photo off the board and put it with the Christmas one. Derick waits at the door without coming in.`,`La cama hecha. El corcho en la pared, igual al de la pensión, solo que más grande. Una foto de los tres hermanos en el hangar de VT, clavada en una esquina. Sacas la foto del corcho y la guardas junto a la de Navidad. Derick espera en la puerta sin entrar.`))+bond('thomas')+bond('bob')+calm(3)})},
    back
  ]},

a3d_clube:{act:KI,title:L('Os Corvos','The Crows','Los Cuervos'),checkpoint:true,
  text:()=>{S.flags.a3_clube=true;return P(L(`O galpão de tijolo continua lá, com a placa de lata CORVOS DE FERRO · MC. Só que agora tem só duas motos na frente. E, na portaria, sentado na mesma cadeira de plástico, o mesmo cara de colete de couro e barriga de cerveja. Mais velho. Mais magro.

Ele te reconhece antes de você abrir a boca e levanta as mãos. "Eu não fiz nada, cara. Eu juro." Você lembra do nome dele no relatório: Beto.

Lá dentro, pendurado na parede atrás do bar, entre fotos de viagens de moto, um colete com o nome bordado: RYAN.`,
`The brick warehouse is still there, with the tin sign IRON CROWS · MC. Only now there are just two bikes out front. And at the door, sitting in the same plastic chair, the same guy in a leather vest with a beer belly. Older. Thinner.

He recognizes you before you open your mouth and raises his hands. "I didn't do anything, man. I swear." You remember his name from the report: Beto.

Inside, hanging on the wall behind the bar, among photos of bike trips, a vest with a name stitched on it: RYAN.`,
`El galpón de ladrillo sigue ahí, con el cartel de chapa CUERVOS DE HIERRO · MC. Solo que ahora hay solo dos motos al frente. Y en la entrada, sentado en la misma silla de plástico, el mismo tipo con chaleco de cuero y panza de cerveza. Más viejo. Más flaco.

Te reconoce antes de que abras la boca y levanta las manos. "No hice nada, loco. Te lo juro." Recuerdas su nombre del informe: Beto.

Adentro, colgado en la pared detrás de la barra, entre fotos de viajes en moto, un chaleco con un nombre bordado: RYAN.`))},
  choices:()=>[
    {once:'beto',label:L('Pressionar o Beto','Lean on Beto','Presionar a Beto'),test:{sk:'Intimidação',dt:15},
      ok:()=>({text:P(L(`Você não levanta a voz. Só senta na frente dele e espera. Trinta segundos. O Beto quebra no vigésimo.`,`You don't raise your voice. You just sit down in front of him and wait. Thirty seconds. Beto breaks on the twentieth.`,`No levantas la voz. Solo te sientas frente a él y esperas. Treinta segundos. Beto se quiebra en el vigésimo.`))+addClue('a3usina')}),
      fail:()=>({text:P(L(`O Beto tem mais medo do Kadu do que de você. Mas fala demais sem perceber.`,`Beto is more afraid of Kadu than of you. But he says too much without noticing.`,`Beto le tiene más miedo a Kadu que a ti. Pero habla de más sin darse cuenta.`))+addClue('a3cobre')})},
    {once:'coleteryan',label:L('Olhar o colete do Ryan','Look at Ryan\'s vest','Mirar el chaleco de Ryan'),
      run:()=>({text:P(L(`Alguém deixou o colete no mesmo prego onde ele pendurava a chave de roda. Embaixo, uma foto: o Ryan de olho roxo, sentado no meio-fio, na noite em que você soltou ele da jaula. Alguém escreveu atrás, com caneta: "Ele tinha razão."

O Beto está atrás de você. "A gente soube. Do túnel." Ele coça a nuca. "Ele disse que ia arrumar outra família. Arrumou, né?"

"Arrumou", você diz.`,`Someone hung the vest on the same nail where he used to hang his tire iron. Underneath, a photo: Ryan with a black eye, sitting on the curb, the night you let him out of the cage. Someone wrote on the back, in pen: "He was right."

Beto is behind you. "We heard. About the tunnel." He scratches his neck. "He said he'd find another family. He did, huh?"

"He did," you say.`,`Alguien colgó el chaleco en el mismo clavo donde él colgaba la llave de rueda. Abajo, una foto: Ryan con el ojo morado, sentado en el cordón, la noche en que lo sacaste de la jaula. Alguien escribió atrás, con birome: "Tenía razón."

Beto está detrás de ti. "Nos enteramos. Del túnel." Se rasca la nuca. "Dijo que iba a encontrar otra familia. La encontró, ¿no?"

"La encontró", dices.`))+bond('ryan')+calm(2)})},
    {once:'fundos',label:L('Revistar os fundos do galpão','Search the back of the warehouse','Revisar el fondo del galpón'),
      run:()=>({text:P(L(`As jaulas do porão continuam lá. Duas estão vazias. Na terceira, três Corvos com pulseiras de cobre levantam de uma vez quando você desce a escada.`,`The basement cages are still there. Two are empty. In the third, three Crows with copper bracelets stand up at once as you come down the stairs.`,`Las jaulas del sótano siguen ahí. Dos están vacías. En la tercera, tres Cuervos con pulseras de cobre se levantan de golpe cuando bajas la escalera.`)),combat:{id:'corvos2',after:'a3d_clube',allies:['derick16'],winText:L('O último Corvo cai contra a jaula onde o Ryan ficou preso. A pulseira de cobre dele para de faiscar.','The last Crow falls against the cage where Ryan was held. His copper bracelet stops sparking.','El último Cuervo cae contra la jaula donde estuvo preso Ryan. Su pulsera de cobre deja de chispear.')}})},
    back
  ]},

a3e_numero:{act:KI,title:L('O rastro do dinheiro','Following the money','El rastro del dinero'),
  text:()=>{S.flags.a3_numero=true;return P(L(`Na sala de análise, o Tuninho empurra os óculos tortos para cima do nariz e estala os dedos em cima do teclado. "O Formiga me ensinou umas coisas que eu preferia não saber", ele diz, com o sotaque de Xique-Xique carregado de concentração. "Mas elas servem."

Três telas. Números passando rápido demais. O Derick puxa uma cadeira do seu lado.`,
`In the analysis room, Tuninho pushes his crooked glasses up his nose and cracks his knuckles over the keyboard. "Formiga taught me some things I'd rather not know," he says, his Xique-Xique accent thick with concentration. "But they come in handy."

Three screens. Numbers scrolling too fast. Derick pulls up a chair next to you.`,
`En la sala de análisis, Tuninho se sube los anteojos torcidos por la nariz y hace crujir los dedos sobre el teclado. "Formiga me enseñó unas cosas que preferiría no saber", dice, con el acento de Xique-Xique cargado de concentración. "Pero sirven."

Tres pantallas. Números pasando demasiado rápido. Derick acerca una silla a tu lado.`))},
  choices:()=>[
    {once:'tun',label:L('Deixar o Tuninho trabalhar','Let Tuninho work','Dejar trabajar a Tuninho'),test:{sk:'Investigação',dt:13},
      ok:()=>({text:P(L(`Você lê por cima do ombro dele e percebe o padrão antes dele: sempre a mesma subestação, sempre o mesmo valor redondo. O Tuninho olha para você, surpreso. "Você devia ter sido analista." "Meu irmão era", você responde.`,`You read over his shoulder and spot the pattern before he does: always the same substation, always the same round amount. Tuninho looks at you, surprised. "You should've been an analyst." "My brother was," you answer.`,`Lees por encima de su hombro y ves el patrón antes que él: siempre la misma subestación, siempre el mismo monto redondo. Tuninho te mira, sorprendido. "Deberías haber sido analista." "Mi hermano lo era", respondes.`))+addClue('a3data')+bond('tuninho')+bond('thomas')}),
      fail:()=>({text:P(L(`Você não entende metade do que passa na tela. O Tuninho entende. Quarenta minutos depois, ele vira a cadeira com um sorriso cansado e aponta um endereço.`,`You don't understand half of what's on the screen. Tuninho does. Forty minutes later, he spins his chair around with a tired smile and points at an address.`,`No entiendes la mitad de lo que pasa en la pantalla. Tuninho sí. Cuarenta minutos después, gira la silla con una sonrisa cansada y señala una dirección.`))+addClue('a3data')+bond('tuninho')})},
    {once:'tunhist',label:L('Perguntar ao Tuninho por que ele mudou de lado','Ask Tuninho why he switched sides','Preguntarle a Tuninho por qué cambió de bando'),
      run:()=>({text:P(L(`Ele para de digitar. "Porque o Formiga não tinha mais propósito. E eu vi o que acontece com gente sem propósito." Ele olha para você. "Aí eu vi a Base. Vocês, depois de tudo, ainda levantando de manhã para treinar os outros." Ele volta para o teclado. "Isso é um propósito, né?"`,`He stops typing. "Because Formiga had no purpose left. And I saw what happens to people with no purpose." He looks at you. "Then I saw the Base. You people, after everything, still getting up in the morning to train others." He goes back to the keyboard. "That's a purpose, right?"`,`Deja de teclear. "Porque Formiga ya no tenía propósito. Y vi lo que le pasa a la gente sin propósito." Te mira. "Después vi la Base. Ustedes, después de todo, todavía levantándose a la mañana para entrenar a otros." Vuelve al teclado. "Eso es un propósito, ¿no?"`))+bond('tuninho')})},
    back
  ]},

a3f_q1:{act:KI,title:L('O quadro · 1','The board · 1','El mural · 1'),
  text:()=>P(L(`Você fica de pé na frente do mural. Todo mundo em volta da mesa espera. É assim que o Thomas fazia: primeiro as perguntas, depois as respostas.

<b>Onde o Kadu vai fazer o ritual?</b>`,`You stand in front of the board. Everyone around the table waits. This is how Thomas did it: questions first, then answers.

<b>Where is Kadu going to perform the ritual?</b>`,`Te paras frente al mural. Todos alrededor de la mesa esperan. Así lo hacía Thomas: primero las preguntas, después las respuestas.

<b>¿Dónde va a hacer Kadu el ritual?</b>`))+hints([['a3usina',L('O Beto falou da Usina Velha.','Beto mentioned the Old Plant.','Beto habló de la Usina Vieja.')],['a3cobre',L('Os Corvos roubaram cobre e um gerador grande demais para o clube.','The Crows stole copper and a generator too big for the clubhouse.','Los Cuervos robaron cobre y un generador demasiado grande para el club.')],['a3data',L('O Comprador pagou a Subestação Serra Alta para desligar a energia amanhã à meia-noite. Ela alimenta uma única instalação: a Usina Velha.','The Buyer paid the Serra Alta Substation to shut off power tomorrow at midnight. It feeds a single facility: the Old Plant.','El Comprador le pagó a la Subestación Serra Alta para cortar la energía mañana a medianoche. Alimenta una sola instalación: la Usina Vieja.')]]),
  choices:()=>[
    {label:L('No clube dos Corvos','At the Crows\' clubhouse','En el club de los Cuervos'),run:()=>{S.flags.q1='clube';return {go:'a3f_q2'}}},
    {label:L('Na Subestação Serra Alta','At the Serra Alta Substation','En la Subestación Serra Alta'),run:()=>{S.flags.q1='sub';return {go:'a3f_q2'}}},
    {label:L('Na Usina Velha','At the Old Plant','En la Usina Vieja'),run:()=>{S.flags.q1='usina';return {go:'a3f_q2'}}}
  ]},

a3f_q2:{act:KI,title:L('O quadro · 2','The board · 2','El mural · 2'),
  text:()=>P(L(`<b>Quem abriu o cofre e entregou a luva ao Kadu na noite do massacre?</b>

Três traidores estavam na Base naquela noite. O Roger Jr, filho do líder, que organizava tudo. O Jon Cordeiro, o sniper que nunca ficava de costas. O Leon Silva, que lutava de soco, pistola e escudo.`,`<b>Who opened the vault and gave Kadu the glove on the night of the massacre?</b>

Three traitors were at the Base that night. Roger Jr, the leader's son, who organized everything. Jon Cordeiro, the sniper who never turned his back. Leon Silva, who fought with fists, pistol and shield.`,`<b>¿Quién abrió la bóveda y le entregó el guante a Kadu la noche de la masacre?</b>

Tres traidores estaban en la Base esa noche. Roger Jr, el hijo del líder, que lo organizaba todo. Jon Cordeiro, el francotirador que nunca daba la espalda. Leon Silva, que peleaba con puños, pistola y escudo.`))+hints([['a3video',L('No vídeo, é o rosto do Leon.','In the footage, it\'s Leon\'s face.','En el video, es la cara de Leon.')],['a3escudo',L('Na gravação corrompida, uma silhueta grande com um escudo nas costas.','In the corrupted recording, a big silhouette with a shield on its back.','En la grabación dañada, una silueta grande con un escudo en la espalda.')],['a3cela',L('A luva já estava com o Kadu antes de a cela abrir: alguém entregou.','Kadu already had the glove before the cell opened: someone handed it over.','Kadu ya tenía el guante antes de que se abriera la celda: alguien se lo dio.')]]),
  choices:()=>[
    {label:'Roger Jr',run:()=>{S.flags.q2='rjr';return {go:'a3f_q3'}}},
    {label:'Jon Cordeiro',run:()=>{S.flags.q2='jon';return {go:'a3f_q3'}}},
    {label:'Leon Silva',run:()=>{S.flags.q2='leon';return {go:'a3f_q3'}}}
  ]},

a3f_q3:{act:KI,title:L('O quadro · 3','The board · 3','El mural · 3'),
  text:()=>P(L(`<b>Que elemento é capaz de conter a Relíquia de Energia?</b>`,`<b>Which element can contain the Energy Relic?</b>`,`<b>¿Qué elemento puede contener la Reliquia de Energía?</b>`))+hints([['a3opressor',L('O guardanapo da Maitê: Sangue cede à Morte, Morte cede à Energia, Energia cede ao Conhecimento, Conhecimento cede ao Sangue.','Maitê\'s napkin: Blood yields to Death, Death to Energy, Energy to Knowledge, Knowledge to Blood.','La servilleta de Maitê: la Sangre cede ante la Muerte, la Muerte ante la Energía, la Energía ante el Conocimiento, el Conocimiento ante la Sangre.')],['opressor',L('No trono, foi a Morte que conteve o Sangue.','At the throne, it was Death that contained Blood.','En el trono, fue la Muerte la que contuvo a la Sangre.')]]),
  choices:()=>[
    {label:L('Morte','Death','Muerte'),run:()=>{S.flags.q3='morte';return {go:'a3f_resultado'}}},
    {label:L('Conhecimento','Knowledge','Conocimiento'),run:()=>{S.flags.q3='conhecimento';return {go:'a3f_resultado'}}},
    {label:L('Sangue','Blood','Sangre'),run:()=>{S.flags.q3='sangue';return {go:'a3f_resultado'}}}
  ]},

a3f_resultado:{act:KI,title:L('O quadro montado','The finished board','El mural armado'),
  text:()=>{const f=S.flags;const ok=[f.q1==='usina',f.q2==='leon',f.q3==='conhecimento'];S.flags.a3acertos=ok.filter(Boolean).length;
    const lines=[];
    lines.push(ok[0]?L('A Usina Velha. Tudo aponta para lá: o cobre, o gerador, o desligamento à meia-noite.','The Old Plant. Everything points there: the copper, the generator, the midnight shutdown.','La Usina Vieja. Todo apunta ahí: el cobre, el generador, el corte a medianoche.'):L('Você aponta o lugar no mapa com certeza. Ninguém discute.','You point to the place on the map with certainty. Nobody argues.','Señalas el lugar en el mapa con seguridad. Nadie discute.'));
    lines.push(ok[1]?L('Leon. O Derick não diz nada, mas você vê ele respirar fundo. O homem que apertou a sua mão com força demais no dia das equipes.','Leon. Derick says nothing, but you see him take a deep breath. The man who shook your hand too hard on team day.','Leon. Derick no dice nada, pero lo ves respirar hondo. El hombre que te apretó la mano demasiado fuerte el día de los equipos.'):L('Você escreve um nome embaixo do vídeo. Uma parte de você não tem certeza.','You write a name under the footage. Part of you isn\'t sure.','Escribes un nombre debajo del video. Una parte de ti no está segura.'));
    lines.push(ok[2]?L('Conhecimento. Vocês vão precisar de alguém que saiba escrever um selo. Só existe uma pessoa em quem você confia para isso.','Knowledge. You\'ll need someone who can write a seal. There\'s only one person you trust with that.','Conocimiento. Van a necesitar a alguien que sepa escribir un sello. Solo hay una persona en quien confías para eso.'):L('Você decide o elemento. Mesmo assim, só existe uma pessoa em quem você confia para escrever um selo.','You decide on the element. Even so, there\'s only one person you trust to write a seal.','Decides el elemento. Aun así, solo hay una persona en quien confías para escribir un sello.'));
    return P(lines.join('\n\n')+'\n\n'+L(`<b>Acertos: ${S.flags.a3acertos}/3.</b>`,`<b>Correct: ${S.flags.a3acertos}/3.</b>`,`<b>Aciertos: ${S.flags.a3acertos}/3.</b>`))},
  choices:()=>[{label:L('Ir até o hangar do VT','Go to VT\'s hangar','Ir al hangar de VT'),main:true,run:()=>({go:'a3g_hangar'})}]},

a3g_hangar:{act:K,title:L('O elevador de carga','The freight elevator','El montacargas'),checkpoint:true,
  text:()=>P(L(`O hangar na beira da pista de terra está igual. Você e a Koranna descem no elevador de carga, e ele faz o mesmo barulho de quando você tinha dezoito anos.

O Kavyur está esperando lá embaixo com uma garrafa térmica de café, como se soubesse. Atrás dele, encostado na parede, de bermuda, chinelo e braços cruzados: o VT. Mais velho. Os mesmos olhos.

"Eu disse para nunca mais pedir ajuda", ele diz.

"Eu sei."

Ele olha para você. Depois olha para a Koranna. Depois para você de novo.`,
`The hangar at the edge of the dirt strip is the same. You and Koranna ride the freight elevator down, and it makes the same noise it did when you were eighteen.

Kavyur is waiting at the bottom with a thermos of coffee, as if he knew. Behind him, leaning against the wall in shorts and flip-flops with his arms crossed: VT. Older. The same eyes.

"I told you never to ask for help again," he says.

"I know."

He looks at you. Then he looks at Koranna. Then at you again.`,
`El hangar al borde de la pista de tierra está igual. Tú y Koranna bajan en el montacargas, y hace el mismo ruido que cuando tenías dieciocho años.

Kavyur los espera abajo con un termo de café, como si supiera. Detrás de él, apoyado en la pared, de bermudas, ojotas y brazos cruzados: VT. Más viejo. Los mismos ojos.

"Te dije que nunca más pidieras ayuda", dice.

"Lo sé."

Te mira. Después mira a Koranna. Después a ti otra vez.`)),
  choices:()=>[
    {once:'vtkor',label:L('Deixar o VT olhar para a Koranna','Let VT look Koranna over','Dejar que VT mire a Koranna'),
      run:()=>({text:P(L(`"Então é ela", o VT diz. Não é uma pergunta. A Koranna levanta uma sobrancelha. "Ela o quê?" O VT abre um sorriso que você não via há anos. "Ela que fez o Adam descer o meu elevador de volta." Ele estende a mão para ela. "VT. Ele já falou mal de mim?" "Nunca", ela diz. "É o que mais me preocupa."`,`"So it's her," VT says. It isn't a question. Koranna raises an eyebrow. "It's me what?" VT breaks into a smile you haven't seen in years. "The one who made Adam come back down my elevator." He holds out his hand to her. "VT. Has he badmouthed me yet?" "Never," she says. "That's what worries me the most."`,`"Así que es ella", dice VT. No es una pregunta. Koranna levanta una ceja. "¿Soy ella qué?" VT sonríe como no lo veías hace años. "La que hizo que Adam volviera a bajar por mi montacargas." Le tiende la mano. "VT. ¿Ya habló mal de mí?" "Nunca", dice ella. "Eso es lo que más me preocupa."`))+bond('vt')+bond('koranna')})},
    {once:'desculpa',label:L('Pedir desculpas ao VT','Apologize to VT','Pedirle disculpas a VT'),test:{sk:'Vontade',dt:17},
      ok:()=>{S.flags.vtperdao=true;return {text:P(L(`As palavras saem tortas, poucas, do seu jeito. Pela Ordem. Pelo cartão que você pegou em cima da mesa. Por não ter descido esse elevador nenhuma vez em oito anos. O VT escuta até o fim sem se mexer.

"Você acha que eu tô bravo porque vocês foram para a Ordem?" Ele descruza os braços. "Eu tô bravo porque vocês foram, e eu fiquei esperando vocês voltarem inteiros. E vocês voltaram em dois caixões e um relógio no seu pulso." A voz dele falha. "Eu não fui no enterro do Bob, Adam. Eu não consegui."

Você não sabia disso. Você dá um passo. Ele dá o outro.`,`The words come out crooked, few, your way. For the Order. For the card you picked up off the table. For not coming down this elevator once in eight years. VT listens to the end without moving.

"You think I'm mad because you went to the Order?" He uncrosses his arms. "I'm mad because you went, and I stayed here waiting for you to come back in one piece. And you came back as two coffins and a watch on your wrist." His voice cracks. "I didn't go to Bob's funeral, Adam. I couldn't."

You didn't know that. You take a step. He takes the other.`,`Las palabras salen torcidas, pocas, a tu manera. Por la Orden. Por la tarjeta que agarraste de la mesa. Por no haber bajado este montacargas ni una vez en ocho años. VT escucha hasta el final sin moverse.

"¿Crees que estoy enojado porque se fueron a la Orden?" Descruza los brazos. "Estoy enojado porque se fueron, y yo me quedé esperando que volvieran enteros. Y volvieron en dos cajones y un reloj en tu muñeca." Se le quiebra la voz. "No fui al entierro de Bob, Adam. No pude."

No lo sabías. Das un paso. Él da el otro.`))+bond('vt',2)+calm(4)}},
      fail:()=>({text:P(L(`Você abre a boca e nada sai. Nove anos de coisas para dizer e nenhuma cabe na garganta. O VT espera. Depois suspira e bate no seu ombro, uma vez. "Tá bom. Eu também não sei falar." É o suficiente. Por enquanto.`,`You open your mouth and nothing comes out. Nine years of things to say and none of them fit in your throat. VT waits. Then he sighs and claps your shoulder, once. "All right. I don't know how to talk either." It's enough. For now.`,`Abres la boca y no sale nada. Nueve años de cosas para decir y ninguna cabe en la garganta. VT espera. Después suspira y te da una palmada en el hombro, una vez. "Está bien. Yo tampoco sé hablar." Alcanza. Por ahora.`))+bond('vt')})},
    {once:'kavselo',label:L('Pedir o selo ao Kavyur','Ask Kavyur for the seal','Pedirle el sello a Kavyur'),
      run:()=>({text:P(S.flags.q3==='conhecimento'?L(`O Kavyur já está com o caderno aberto. "Conhecimento. Você acertou." Ele parece quase orgulhoso. "Eu consigo escrever um selo grande o bastante. Mas preciso estar lá, do lado da coisa, desenhando enquanto ela ainda está solta." Ele fecha o caderno. "Vocês me protegem. Eu fecho a porta."`,`Kavyur already has his notebook open. "Knowledge. You got it right." He looks almost proud. "I can write a seal big enough. But I have to be there, right next to the thing, drawing while it's still loose." He closes the notebook. "You protect me. I shut the door."`,`Kavyur ya tiene el cuaderno abierto. "Conocimiento. Acertaste." Parece casi orgulloso. "Puedo escribir un sello lo bastante grande. Pero tengo que estar ahí, al lado de la cosa, dibujando mientras todavía está suelta." Cierra el cuaderno. "Ustedes me protegen. Yo cierro la puerta."`):L(`O Kavyur olha para o seu quadro e franze a testa. "${S.flags.q3==='morte'?'Morte':'Sangue'}? Não, Adam. Energia cede ao Conhecimento. Se você tivesse levado ${S.flags.q3==='morte'?'Morte':'Sangue'} para aquela usina, ia só alimentar a coisa." Ele pega o caderno. "Ainda bem que você veio aqui antes. Eu escrevo o selo. Mas preciso estar lá."`,`Kavyur looks at your board and frowns. "${S.flags.q3==='morte'?'Death':'Blood'}? No, Adam. Energy yields to Knowledge. If you'd brought ${S.flags.q3==='morte'?'Death':'Blood'} to that plant, you'd just have fed the thing." He picks up his notebook. "Good thing you came here first. I'll write the seal. But I need to be there."`,`Kavyur mira tu mural y frunce el ceño. "¿${S.flags.q3==='morte'?'Muerte':'Sangre'}? No, Adam. La Energía cede ante el Conocimiento. Si hubieras llevado ${S.flags.q3==='morte'?'Muerte':'Sangre'} a esa usina, solo la habrías alimentado." Agarra el cuaderno. "Menos mal que viniste acá primero. Yo escribo el sello. Pero tengo que estar ahí."`))+bond('kavyur')})},
    {label:L('Subir no elevador para ir à usina','Take the elevator up and head for the plant','Subir en el montacargas e ir a la usina'),main:true,
      run:()=>{S.flags.vtvem=!!(S.flags.vtdica||S.flags.vtperdao);return {text:P(S.flags.vtvem?L(`O Kavyur entra no elevador com o caderno e uma lata de tinta de ritual. Quando a porta começa a fechar, uma mão segura ela. O VT entra com o M4 no ombro, de bermuda e chinelo, como se fosse pescar.

"Eu não vou por você", ele diz. "Vou porque o Kadu tá usando uma luva que eu caçava antes de você nascer." Ninguém acredita nele. Ele sabe disso.`,`Kavyur steps into the elevator with his notebook and a can of ritual paint. As the door starts to close, a hand stops it. VT gets in with the M4 on his shoulder, in shorts and flip-flops, as if going fishing.

"I'm not going for you," he says. "I'm going because Kadu is wearing a glove I was hunting before you were born." Nobody believes him. He knows it.`,`Kavyur entra en el montacargas con el cuaderno y una lata de pintura ritual. Cuando la puerta empieza a cerrarse, una mano la detiene. VT entra con el M4 al hombro, de bermudas y ojotas, como si fuera a pescar.

"No voy por ti", dice. "Voy porque Kadu está usando un guante que yo cazaba antes de que nacieras." Nadie le cree. Él lo sabe.`):L(`O Kavyur entra no elevador com o caderno e uma lata de tinta de ritual. O VT fica lá embaixo, de braços cruzados, vendo a porta fechar. Não diz nada. Mas também não vira as costas até o elevador sumir.`,`Kavyur steps into the elevator with his notebook and a can of ritual paint. VT stays below, arms crossed, watching the door close. He says nothing. But he doesn't turn his back until the elevator is gone.`,`Kavyur entra en el montacargas con el cuaderno y una lata de pintura ritual. VT se queda abajo, de brazos cruzados, viendo cerrarse la puerta. No dice nada. Pero tampoco da la espalda hasta que el montacargas desaparece.`)),go:S.flags.q1==='usina'?'a3h_usina':'a3h_errado'}}}
  ]},

a3h_errado:{act:KU,title:L('Lugar errado','Wrong place','Lugar equivocado'),
  text:()=>{S.flags.atraso=true;return P(S.flags.q1==='clube'?L(`O clube dos Corvos está vazio. Só o Beto, na portaria, com cara de quem sabia que vocês iam voltar. "Eu tentei te dizer, cara", ele fala. "A usina. Eles tão na Usina Velha."

Vocês perdem quarenta minutos na estrada de terra até a serra. Quando a represa aparece no farol do carro, o céu em cima dela já está piscando azul.`,`The Crows' clubhouse is empty. Just Beto at the door, looking like he knew you'd be back. "I tried to tell you, man," he says. "The plant. They're at the Old Plant."

You lose forty minutes on the dirt road up into the hills. When the dam shows up in the headlights, the sky above it is already flashing blue.`,`El club de los Cuervos está vacío. Solo Beto, en la entrada, con cara de saber que iban a volver. "Intenté decírtelo, loco", dice. "La usina. Están en la Usina Vieja."

Pierden cuarenta minutos en el camino de tierra hacia la sierra. Cuando la represa aparece en los faros del auto, el cielo encima ya está titilando azul.`):L(`A Subestação Serra Alta está cercada e deserta, zumbindo. Um técnico sonolento aponta a serra. "Eles pagaram para desligar tudo aqui e mandar a carga para lá. Para a usina velha. Pagaram bem."

Vocês perdem quarenta minutos na estrada de terra. Quando a represa aparece no farol do carro, o céu em cima dela já está piscando azul.`,`The Serra Alta Substation is fenced off and deserted, humming. A sleepy technician points toward the hills. "They paid to shut everything down here and send the load up there. To the old plant. Paid well."

You lose forty minutes on the dirt road. When the dam shows up in the headlights, the sky above it is already flashing blue.`,`La Subestación Serra Alta está cercada y desierta, zumbando. Un técnico somnoliento señala la sierra. "Pagaron para cortar todo acá y mandar la carga para allá. A la usina vieja. Pagaron bien."

Pierden cuarenta minutos en el camino de tierra. Cuando la represa aparece en los faros del auto, el cielo encima ya está titilando azul.`))+loseSan('1d4',L('o atraso','the delay','el retraso'))},
  choices:()=>[{label:L('Acelerar até a usina','Floor it to the plant','Acelerar hasta la usina'),main:true,run:()=>({go:'a3h_usina'})}]},

a3h_usina:{act:KU,title:L('A represa','The dam','La represa'),checkpoint:true,
  text:()=>P(L(`A Usina Velha é uma represa de concreto encaixada entre dois morros, com a casa de turbinas lá embaixo, colada na parede de água. Tudo deveria estar escuro há trinta anos. Mas as janelas da casa de turbinas estão acesas por dentro. Não é luz elétrica. É outra coisa.

Na crista da represa, uma dúzia de Corvos espalhados, com correntes de cobre nos braços e olhos azuis.

${S.flags.atraso?L('O ritual já começou. Vocês chegaram tarde.','The ritual has already started. You\'re late.','El ritual ya empezó. Llegaron tarde.'):L('Ainda falta uma hora para a meia-noite. Vocês chegaram antes.','There\'s still an hour until midnight. You\'re early.','Todavía falta una hora para la medianoche. Llegaron antes.')}`,
`The Old Plant is a concrete dam wedged between two hills, with the turbine house far below, pressed against the wall of water. It should have been dark for thirty years. But the turbine house windows are lit from within. It isn't electric light. It's something else.

On the crest of the dam, a dozen Crows spread out, copper chains on their arms and blue eyes.

${S.flags.atraso?L('O ritual já começou. Vocês chegaram tarde.','The ritual has already started. You\'re late.','El ritual ya empezó. Llegaron tarde.'):L('Ainda falta uma hora para a meia-noite. Vocês chegaram antes.','There\'s still an hour until midnight. You\'re early.','Todavía falta una hora para la medianoche. Llegaron antes.')}`,
`La Usina Vieja es una represa de concreto encajada entre dos cerros, con la sala de turbinas abajo, pegada a la pared de agua. Todo debería estar a oscuras hace treinta años. Pero las ventanas de la sala de turbinas están encendidas por dentro. No es luz eléctrica. Es otra cosa.

En la cresta de la represa, una docena de Cuervos repartidos, con cadenas de cobre en los brazos y ojos azules.

${S.flags.atraso?L('O ritual já começou. Vocês chegaram tarde.','The ritual has already started. You\'re late.','El ritual ya empezó. Llegaron tarde.'):L('Ainda falta uma hora para a meia-noite. Vocês chegaram antes.','There\'s still an hour until midnight. You\'re early.','Todavía falta una hora para la medianoche. Llegaron antes.')}`)),
  choices:()=>[
    {label:L('Descer de rapel pela parede da represa','Rappel down the dam wall','Bajar en rappel por la pared de la represa'),test:{sk:'Atletismo',dt:17},
      ok:()=>({text:P(L(`Corda, parede molhada, trinta metros. Você cai atrás dos Corvos como numa cena ensaiada.`,`Rope, wet wall, thirty meters. You land behind the Crows like a rehearsed scene.`,`Cuerda, pared mojada, treinta metros. Caes detrás de los Cuervos como en una escena ensayada.`)),combat:{id:'corvos3',after:'a3i_kadu',allies:['koranna','derick16'].concat(S.flags.vtvem?['vt2']:[]),surprise:true,winText:L('O último Corvo cai na crista da represa. Os olhos dele voltam a ser castanhos antes de fechar.','The last Crow falls on the crest of the dam. His eyes turn brown again before they close.','El último Cuervo cae en la cresta de la represa. Sus ojos vuelven a ser marrones antes de cerrarse.')}}),
      fail:()=>({text:P(L(`A corda escorrega na parede molhada e você cai os últimos cinco metros de costas. Os Corvos te veem antes de você levantar.`,`The rope slips on the wet wall and you drop the last five meters on your back. The Crows see you before you get up.`,`La cuerda resbala en la pared mojada y caes los últimos cinco metros de espaldas. Los Cuervos te ven antes de que te levantes.`))+losePv('3d6',L('a queda','the fall','la caída')),combat:{id:'corvos3',after:'a3i_kadu',allies:['koranna','derick16'].concat(S.flags.vtvem?['vt2']:[]),enemyFirst:true,winText:L('O último Corvo cai na crista da represa.','The last Crow falls on the crest of the dam.','El último Cuervo cae en la cresta de la represa.')}})},
    {label:L('Atravessar a crista da represa de frente','Cross the dam crest head-on','Cruzar la cresta de la represa de frente'),main:true,
      run:()=>({text:P(L(`Você anda pelo meio da crista, sem se esconder. A Koranna do lado esquerdo. O Derick do direito. O Kavyur atrás, com o caderno apertado no peito.`,`You walk down the middle of the crest, not hiding. Koranna on your left. Derick on your right. Kavyur behind, notebook clutched to his chest.`,`Caminas por el medio de la cresta, sin esconderte. Koranna a tu izquierda. Derick a tu derecha. Kavyur detrás, con el cuaderno apretado contra el pecho.`)),combat:{id:'corvos3',after:'a3i_kadu',allies:['koranna','derick16'].concat(S.flags.vtvem?['vt2']:[]),enemyFirst:!!S.flags.atraso,winText:L('O último Corvo cai na crista da represa. Os olhos dele voltam a ser castanhos antes de fechar.','The last Crow falls on the crest of the dam. His eyes turn brown again before they close.','El último Cuervo cae en la cresta de la represa. Sus ojos vuelven a ser marrones antes de cerrarse.')}})}
  ]},

a3i_kadu:{act:KU,title:L('A casa de turbinas','The turbine hall','La sala de turbinas'),checkpoint:true,
  text:()=>P(L(`Lá dentro, as turbinas paradas há trinta anos giram sozinhas, sem água. Os cabos de cobre roubados sobem pelas paredes e se juntam no teto, onde uma coisa feita de chama e raio gira devagar, do tamanho de um carro. A Relíquia de Energia. Sem portador. Esperando.

Embaixo dela, o Kadu. O braço esquerdo inteiro virou metal.

"O Ryan disse que isso ia matar todo mundo", ele fala, sem tirar os olhos da coisa. "Soube do túnel. Ele tinha razão sobre mim." Ele se vira. "Mas não sobre isso."

O Kavyur já está ajoelhado na porta, abrindo a lata de tinta.`,
`Inside, turbines that have been still for thirty years spin on their own, without water. The stolen copper cables climb the walls and gather at the ceiling, where something made of flame and lightning turns slowly, the size of a car. The Energy Relic. Without a bearer. Waiting.

Beneath it, Kadu. His whole left arm has turned to metal.

"Ryan said this would get everyone killed," he says, without taking his eyes off the thing. "Heard about the tunnel. He was right about me." He turns around. "But not about this."

Kavyur is already kneeling at the door, opening the paint can.`,
`Adentro, las turbinas paradas hace treinta años giran solas, sin agua. Los cables de cobre robados suben por las paredes y se juntan en el techo, donde algo hecho de llama y rayo gira despacio, del tamaño de un auto. La Reliquia de Energía. Sin portador. Esperando.

Debajo, Kadu. Todo su brazo izquierdo se volvió metal.

"Ryan dijo que esto iba a matar a todos", dice, sin sacarle los ojos de encima a la cosa. "Me enteré del túnel. Tenía razón sobre mí." Se da vuelta. "Pero no sobre esto."

Kavyur ya está arrodillado en la puerta, abriendo la lata de pintura.`))+loseSan('1d4',L('a relíquia','the relic','la reliquia')),
  choices:()=>[
    {label:L('"Kavyur, escreve. A gente segura."','"Kavyur, write. We\'ll hold him."','"Kavyur, escribe. Nosotros lo aguantamos."'),main:true,
      run:()=>({combat:{id:'kadu2',after:'a3j_selo',allies:['koranna','derick16'].concat(S.flags.vtvem?['vt2']:[]),script:'anfitriao'}})}
  ]},

a3j_selo:{act:KU,title:L('O selo','The seal','El sello'),
  text:()=>P(L(`O Kadu cai de joelhos. A luva no braço dele apaga, e ele grita, porque de repente sente tudo o que a Energia não deixava ele sentir.

Sem ele, a coisa no teto para de girar. Os raios se esticam, procurando. Procurando um corpo. Qualquer corpo que aguente.

E encontram o Derick.

Os raios descem na direção dele como dedos. O Kavyur ainda está no último traço do selo. "Dez segundos!", ele grita.`,
`Kadu drops to his knees. The glove on his arm goes dark, and he screams, because suddenly he feels everything the Energy wouldn't let him feel.

Without him, the thing at the ceiling stops spinning. The lightning stretches out, searching. Searching for a body. Any body that can take it.

And it finds Derick.

The bolts reach down toward him like fingers. Kavyur is still on the last stroke of the seal. "Ten seconds!" he shouts.`,
`Kadu cae de rodillas. El guante de su brazo se apaga, y grita, porque de repente siente todo lo que la Energía no lo dejaba sentir.

Sin él, la cosa del techo deja de girar. Los rayos se estiran, buscando. Buscando un cuerpo. Cualquier cuerpo que aguante.

Y encuentran a Derick.

Los rayos bajan hacia él como dedos. Kavyur todavía está en el último trazo del sello. "¡Diez segundos!", grita.`)),
  choices:()=>[
    {label:L('Ficar na frente do Derick','Step in front of Derick','Ponerte delante de Derick'),main:true,test:{sk:'Fortitude',dt:20},
      ok:()=>({text:P(L(`Você não pensa. Nunca pensa. Você se joga na frente dele e o raio te acerta no peito.

Dez segundos. É o mais longo que você já aguentou alguma coisa. Você sente a relíquia tentando entrar. Oferecendo tudo. Você fecha os olhos e pensa no Bob caindo no colchão, rindo.

O Kavyur fecha o selo. A coisa no teto grita sem boca, se dobra sobre si mesma e cai no chão da casa de turbinas como uma esfera de vidro cheia de relâmpagos, presa dentro de letras que brilham.

Você cai sentado. O Derick está te segurando pelos ombros e dizendo o seu nome sem parar.`,`You don't think. You never do. You throw yourself in front of him and the lightning hits you square in the chest.

Ten seconds. The longest you've ever held on to anything. You feel the relic trying to get in. Offering everything. You close your eyes and think of Bob falling on the mattress, laughing.

Kavyur closes the seal. The thing at the ceiling screams without a mouth, folds in on itself and drops to the turbine hall floor like a glass sphere full of lightning, trapped inside glowing letters.

You drop to the floor. Derick is holding you by the shoulders, saying your name over and over.`,`No piensas. Nunca piensas. Te tiras delante de él y el rayo te da de lleno en el pecho.

Diez segundos. Es lo más largo que aguantaste algo en tu vida. Sientes a la reliquia intentando entrar. Ofreciéndolo todo. Cierras los ojos y piensas en Bob cayendo en el colchón, riéndose.

Kavyur cierra el sello. La cosa del techo grita sin boca, se pliega sobre sí misma y cae al piso de la sala de turbinas como una esfera de vidrio llena de relámpagos, atrapada dentro de letras que brillan.

Caes sentado. Derick te sostiene de los hombros y repite tu nombre sin parar.`))+safePv('4d10',L('o raio','the lightning','el rayo'))+bond('derick',2)+bond('kavyur'),go:'a3k_fim'}),
      fail:()=>({text:P(L(`Você se joga na frente dele. O raio te acerta, e a relíquia entra. Por três segundos, você é outra coisa. Você vê a cidade inteira de uma vez, cada fio, cada lâmpada, cada coração batendo. Você poderia salvar todo mundo. Ninguém que você ama ia morrer nunca mais.

Então alguém segura a sua mão. A Koranna. Não diz nada. Só segura.

Você solta. O Kavyur fecha o selo. A coisa cai no chão como uma esfera de vidro cheia de relâmpagos, presa dentro de letras que brilham. Você cai de joelhos, e a Koranna cai junto, sem soltar.`,`You throw yourself in front of him. The lightning hits you, and the relic gets in. For three seconds, you are something else. You see the whole city at once, every wire, every bulb, every beating heart. You could save everyone. No one you love would ever die again.

Then someone takes your hand. Koranna. She says nothing. She just holds on.

You let go. Kavyur closes the seal. The thing drops to the floor like a glass sphere full of lightning, trapped inside glowing letters. You fall to your knees, and Koranna falls with you, without letting go.`,`Te tiras delante de él. El rayo te alcanza, y la reliquia entra. Por tres segundos, eres otra cosa. Ves la ciudad entera de golpe, cada cable, cada bombilla, cada corazón latiendo. Podrías salvar a todos. Nadie que ames volvería a morir.

Entonces alguien te toma la mano. Koranna. No dice nada. Solo sostiene.

Sueltas. Kavyur cierra el sello. La cosa cae al piso como una esfera de vidrio llena de relámpagos, atrapada dentro de letras que brillan. Caes de rodillas, y Koranna cae contigo, sin soltarte.`))+safePv('4d10',L('o raio','the lightning','el rayo'))+loseSan('2d6',L('a relíquia por dentro','the relic inside you','la reliquia por dentro'))+bond('koranna',2)+bond('derick'),go:'a3k_fim'})}
  ]},

a3k_fim:{act:K,title:L('Fim do Capítulo 3','End of Chapter 3','Fin del Capítulo 3'),
  text:()=>P(L(`O Kadu está algemado na porta da casa de turbinas, com o braço de metal enrolado num cobertor térmico. Ele não tenta fugir. Quando você passa do lado dele, ele fala baixo, sem levantar a cabeça.

"Você acha que o Leon foi o único?" Ele ri, cansado. "O Comprador não trabalha com um só, Zart. Ele sempre tem alguém dentro. Sempre." Ele finalmente te olha. "Pergunta quem sabia que você ia pra usina hoje."

${S.flags.vtvem?L('O VT está sentado na beira da represa, com o M4 no colo, olhando a água. Você senta do lado dele. Ninguém fala nada por um tempo. Depois ele encosta o ombro no seu, como o Thomas fazia.','VT is sitting on the edge of the dam, the M4 in his lap, looking at the water. You sit beside him. Nobody says anything for a while. Then he leans his shoulder against yours, the way Thomas used to.','VT está sentado en el borde de la represa, con el M4 en el regazo, mirando el agua. Te sientas a su lado. Nadie dice nada por un rato. Después apoya el hombro contra el tuyo, como hacía Thomas.'):L('O Kavyur guarda a esfera de relâmpagos numa caixa de chumbo coberta de letras. "O VT vai querer ver isso", ele diz. "Mesmo que diga que não."','Kavyur puts the sphere of lightning into a lead box covered in letters. "VT will want to see this," he says. "Even if he says he doesn\'t."','Kavyur guarda la esfera de relámpagos en una caja de plomo cubierta de letras. "VT va a querer ver esto", dice. "Aunque diga que no."')}

Duas relíquias contidas. Duas faltando. E uma pergunta que não sai da sua cabeça: quem, na Base, sabia da usina?`,
`Kadu is cuffed at the turbine hall door, his metal arm wrapped in a thermal blanket. He doesn't try to run. When you walk past him, he speaks quietly, without looking up.

"You think Leon was the only one?" He laughs, tired. "The Buyer doesn't work with just one, Zart. He always has someone inside. Always." He finally looks at you. "Ask who knew you were going to the plant tonight."

${S.flags.vtvem?L('O VT está sentado na beira da represa, com o M4 no colo, olhando a água. Você senta do lado dele. Ninguém fala nada por um tempo. Depois ele encosta o ombro no seu, como o Thomas fazia.','VT is sitting on the edge of the dam, the M4 in his lap, looking at the water. You sit beside him. Nobody says anything for a while. Then he leans his shoulder against yours, the way Thomas used to.','VT está sentado en el borde de la represa, con el M4 en el regazo, mirando el agua. Te sientas a su lado. Nadie dice nada por un rato. Después apoya el hombro contra el tuyo, como hacía Thomas.'):L('O Kavyur guarda a esfera de relâmpagos numa caixa de chumbo coberta de letras. "O VT vai querer ver isso", ele diz. "Mesmo que diga que não."','Kavyur puts the sphere of lightning into a lead box covered in letters. "VT will want to see this," he says. "Even if he says he doesn\'t."','Kavyur guarda la esfera de relámpagos en una caja de plomo cubierta de letras. "VT va a querer ver esto", dice. "Aunque diga que no."')}

Two relics contained. Two to go. And one question you can't get out of your head: who, at the Base, knew about the plant?`,
`Kadu está esposado en la puerta de la sala de turbinas, con el brazo de metal envuelto en una manta térmica. No intenta huir. Cuando pasas a su lado, habla bajo, sin levantar la cabeza.

"¿Crees que Leon fue el único?" Se ríe, cansado. "El Comprador no trabaja con uno solo, Zart. Siempre tiene a alguien adentro. Siempre." Por fin te mira. "Pregunta quién sabía que ibas a la usina esta noche."

${S.flags.vtvem?L('O VT está sentado na beira da represa, com o M4 no colo, olhando a água. Você senta do lado dele. Ninguém fala nada por um tempo. Depois ele encosta o ombro no seu, como o Thomas fazia.','VT is sitting on the edge of the dam, the M4 in his lap, looking at the water. You sit beside him. Nobody says anything for a while. Then he leans his shoulder against yours, the way Thomas used to.','VT está sentado en el borde de la represa, con el M4 en el regazo, mirando el agua. Te sientas a su lado. Nadie dice nada por un rato. Después apoya el hombro contra el tuyo, como hacía Thomas.'):L('O Kavyur guarda a esfera de relâmpagos numa caixa de chumbo coberta de letras. "O VT vai querer ver isso", ele diz. "Mesmo que diga que não."','Kavyur puts the sphere of lightning into a lead box covered in letters. "VT will want to see this," he says. "Even if he says he doesn\'t."','Kavyur guarda la esfera de relámpagos en una caja de plomo cubierta de letras. "VT va a querer ver esto", dice. "Aunque diga que no."')}

Dos reliquias contenidas. Faltan dos. Y una pregunta que no se te va de la cabeza: ¿quién, en la Base, sabía de la usina?`))+(S.flags.vtvem?bond('vt'):''),
  choices:()=>[{label:L('Ver o relatório','See the report','Ver el informe'),main:true,run:()=>({end:true})}]}
});

function hints(list){const got=list.filter(([k])=>has(k));
  return `<div class="profile" style="margin-top:6px"><p class="hint" style="margin:0 0 6px">${L('O que você sabe','What you know','Lo que sabes')}</p>${got.length?got.map(([,t])=>`<p style="margin:0 0 6px">• ${t}</p>`).join(''):`<p class="empty" style="margin:0">${L('Nenhuma pista sobre isso. Você vai ter que confiar no instinto.','No clues about this. You\'ll have to trust your gut.','Ninguna pista sobre esto. Vas a tener que confiar en tu instinto.')}</p>`}</div>`}

function buildAct2C4(){
Object.assign(ENEMIES,{
  agentes:{human:true,eyes:true,name:L('Homens do Comprador','The Buyer\'s men','Hombres del Comprador'),kind:L('Humanos · grupo','Humans · group','Humanos · grupo'),el:null,pv:150,def:22,atk:15,dmg:'2d10+6',res:7,init:6,presence:null,
    desc:L(`Seis homens de terno escuro e máscara de gás, com fuzis silenciados. Profissionais demais para serem Corvos. Alguém disse a eles que a Base fica embaixo de um bar.`,`Six men in dark suits and gas masks, carrying suppressed rifles. Far too professional to be Crows. Someone told them the Base is under a bar.`,`Seis hombres de traje oscuro y máscara de gas, con fusiles silenciados. Demasiado profesionales para ser Cuervos. Alguien les dijo que la Base está debajo de un bar.`)},
  vtfinal:{human:true,eyes:true,name:'VT',kind:L('Humano · segurando a caneta da Magistrada','Human · holding the Magistrate\'s pen','Humano · sosteniendo la pluma de la Magistrada'),el:null,pv:300,def:25,atk:18,dmg:'2d10+8',res:9,init:8,presence:null,
    special:{every:3,kind:'atk',name:L('Rajada','Burst','Ráfaga'),text:L(`Ele troca o carregador sem olhar e esvazia o M4 em você. Ele nunca errou uma rajada na vida.`,`He swaps magazines without looking and empties the M4 into you. He has never missed a burst in his life.`,`Cambia el cargador sin mirar y vacía el M4 sobre ti. Nunca falló una ráfaga en su vida.`),dmg:'4d10+6'},
    desc:L(`De bermuda e chinelo, como sempre. O M4 no ombro, como sempre. A mão esquerda suja de tinta preta até o pulso, da caneta que ele arrancou do livro. Os olhos vermelhos de quem não dorme há semanas. "Sai da frente, Adam. Por favor."`,`In shorts and flip-flops, as always. The M4 on his shoulder, as always. His left hand stained with black ink up to the wrist, from the pen he tore out of the book. The red eyes of someone who hasn't slept in weeks. "Get out of the way, Adam. Please."`,`De bermudas y ojotas, como siempre. El M4 al hombro, como siempre. La mano izquierda manchada de tinta negra hasta la muñeca, de la pluma que le arrancó al libro. Los ojos rojos de alguien que no duerme hace semanas. "Sal del medio, Adam. Por favor."`)}
});
Object.assign(BOND_NAME,{iris:'Iris'});
