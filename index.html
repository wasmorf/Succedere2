<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080506">
<title>Succedere 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Spectral:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}.brand{cursor:pointer;border-radius:8px;transition:opacity .15s}
.brand:hover{opacity:.8}
.brand:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.qmodal{position:fixed;inset:0;z-index:200;background:rgba(8,5,6,.78);display:flex;align-items:center;justify-content:center;padding:16px;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.qmodal .qbox{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:12px;max-width:380px;width:100%;padding:22px 20px 18px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.qmodal h2{font-family:var(--type);font-size:20px;margin:0 0 8px}
.qmodal p{margin:0 0 18px;color:var(--faint);font-size:16px}
.qmodal .btns{display:flex;gap:10px;flex-wrap:wrap}
.succ-card{margin:26px auto 6px;max-width:520px;text-align:left;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:16px 18px}
.succ-card h2{font-family:var(--type);font-size:19px;margin:0 0 6px;line-height:1.3}
.succ-card p{margin:0 0 12px;font-size:16px}
.succ-link{display:inline-block;color:var(--bone);text-decoration:none}
.succ-link:hover{border-color:var(--accent)}
</style>
<style>
:root{
  color-scheme: dark;
  --ground:#080506; --panel:#140a0c; --panel2:#1e0d11; --line:#3d161d;
  --bone:#f6eeee; --muted:#d9c4c6; --faint:#a88c90;
  --accent:#e0303a; --accent-deep:#7a1022; --wine:#5c0d1b;
  --paper:#f1e4e3; --paper-ink:#2a0a10;
  --sangue:#d4463d; --morte:#a3a3aa; --energia:#a07bff; --conhec:#e3b943; --gain:#ff9aa1; --medo:#f4f1ec;
  --pv:#ff4b55; --pe:#5fb8cc; --san:#e8d3a8;
  --ok:#86c47f; --fail:#ff5a52;
  --type:"Special Elite", "Courier New", monospace;
  --serif:"Spectral", Georgia, "Times New Roman", serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --insan:0;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{height:100%}
*{-webkit-tap-highlight-color:transparent}
button,input,select{touch-action:manipulation}
body{background:radial-gradient(ellipse 90% 60% at 50% -10%,rgba(92,13,27,.55),transparent 70%) fixed,var(--ground);color:var(--bone);font-family:var(--serif);font-weight:500;font-size:18px;line-height:1.65;margin:0;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);opacity:calc(.12 + var(--insan)*1.2)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:51;background:radial-gradient(ellipse at center,transparent 55%,rgba(120,30,15,calc(var(--insan)*.6)) 100%)}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(8,5,6,.94);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top-in{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:var(--type);font-size:20px;letter-spacing:.04em;display:flex;align-items:center;gap:10px}
.brand small{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.12em;text-transform:uppercase}
.freq{color:var(--accent)}
.brand>span{white-space:nowrap}
.top-sp{flex:1}
.mini{display:none;gap:10px;font-family:var(--mono);font-size:13px}
.mini b{font-weight:600}
.tbtn{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:6px 12px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.tbtn:hover{border-color:var(--muted)}
#sheetBtn{display:none}
.layout{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:24px 60px;display:grid;grid-template-columns:310px minmax(0,1fr);gap:32px;align-items:start}
.layout.nosheet{grid-template-columns:minmax(0,1fr)}
#sheet{position:sticky;top:70px;max-height:calc(100dvh - 90px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px;scrollbar-width:thin}
#sheet:empty{display:none}
main{min-width:0}
.sh-name{font-family:var(--type);font-size:22px;line-height:1.2;margin:0}
.sh-sub{font-family:var(--mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:4px}
.nex{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-family:var(--mono);font-size:12px;border:1px solid var(--line);padding:3px 8px;border-radius:3px}
.nex b{color:var(--accent);font-size:15px}
.meters{display:grid;gap:10px;margin:16px 0}
.meter{display:grid;grid-template-columns:38px 1fr 64px;align-items:center;gap:8px;font-family:var(--mono);font-size:12px}
.meter .bar{height:8px;background:var(--panel2);border-radius:2px;overflow:hidden;border:1px solid var(--line)}
.meter .bar i{display:block;height:100%;transition:width .5s ease}
.meter .v{text-align:right;font-variant-numeric:tabular-nums}
.meter.pv i{background:var(--pv)} .meter.pe i{background:var(--pe)} .meter.san i{background:var(--san)}
.meter.pv .l{color:var(--pv)} .meter.pe .l{color:var(--pe)} .meter.san .l{color:var(--san)}
.attrs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0}
.attr{text-align:center;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:6px 0}
.attr b{display:block;font-family:var(--mono);font-size:18px}
.attr span{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.08em}
.sh-h{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--faint);margin:18px 0 8px;display:flex;justify-content:space-between}
.kv{display:flex;justify-content:space-between;font-size:14px;gap:8px;padding:2px 0}
.kv span:last-child{font-family:var(--mono);font-size:13px;color:var(--muted);text-align:right}
.skills{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;font-size:13px}
.skills div{display:flex;justify-content:space-between;color:var(--faint)}
.skills div.tr{color:var(--bone)}
.skills em{font-style:normal;font-family:var(--mono);font-size:11px}
.item{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;padding:3px 0}
.sbtn{background:none;border:1px solid var(--line);border-radius:3px;padding:2px 8px;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.sbtn:hover:not(:disabled){color:var(--bone);border-color:var(--muted)}
.el{display:inline-block;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;padding:1px 6px;border-radius:2px;border:1px solid currentColor}
.el.sangue{color:var(--sangue)} .el.morte{color:var(--morte)} .el.energia{color:var(--energia)} .el.conhecimento{color:var(--conhec)} .el.medo{color:var(--medo)}
.clues{display:flex;flex-direction:column;gap:8px}
.clue{background:var(--paper);color:var(--paper-ink);border-radius:2px;font-size:14px;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.clue:nth-child(odd){transform:rotate(-.6deg)} .clue:nth-child(even){transform:rotate(.5deg)}
.clue summary{font-family:var(--type);padding:6px 10px;cursor:pointer;list-style:none}
.clue summary::-webkit-details-marker{display:none}
.clue summary::before{content:"▸ ";opacity:.6}
.clue[open] summary::before{content:"▾ "}
.clue p{margin:0;padding:0 10px 8px;font-size:13.5px;line-height:1.45}
.empty{font-size:13px;color:var(--faint);font-style:italic}
.log{font-family:var(--mono);font-size:11.5px;color:var(--muted);max-height:220px;overflow:auto;display:flex;flex-direction:column;gap:4px}
.log div{border-left:2px solid var(--line);padding-left:6px}
details.logw summary{cursor:pointer}
.act{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.16em;color:var(--accent);display:flex;gap:10px;align-items:center}
.act::after{content:"";flex:1;height:1px;background:var(--line)}
h1.scene{font-family:var(--type);font-weight:400;font-size:clamp(28px,4vw,40px);line-height:1.1;margin:10px 0 18px;text-wrap:balance}
.story{max-width:66ch}
.story p{margin:0 0 1em;text-shadow:calc(var(--insan)*2.2px) 0 rgba(224,48,58,.6),calc(var(--insan)*-2.2px) 0 rgba(122,16,34,.7)}
.story .radio{border-left:3px solid var(--accent);padding:4px 0 4px 14px;font-style:italic;color:#f3d3d5}
.story .radio b{font-style:normal;font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--accent);display:block}
.whisper{display:block;font-family:var(--type);color:var(--sangue);letter-spacing:.3em;font-size:13px;margin:-4px 0 12px;opacity:.8;animation:flick 2.4s infinite}
@keyframes flick{0%,100%{opacity:.8}45%{opacity:.2}50%{opacity:.9}}
.outcome{max-width:66ch;border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:12px 16px;margin:0 0 22px;font-size:16px}
.outcome.ok{border-color:rgba(134,196,127,.5)} .outcome.fail{border-color:rgba(224,87,77,.5)}
.outcome p{margin:0 0 .5em} .outcome p:last-child{margin:0}
.gain{font-family:var(--mono);font-size:13px;color:var(--gain)}
.loss{font-family:var(--mono);font-size:13px;color:var(--fail)}
.choices{display:flex;flex-direction:column;gap:10px;max-width:66ch;margin-top:26px}
.choice{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:14px;transition:border-color .15s,transform .15s}
.choice:hover:not(:disabled){border-color:var(--bone);transform:translateX(3px)}
.choice .t{font-size:17px}
.choice .tag{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap;text-align:right;line-height:1.35}
.choice .tag b{color:var(--bone);font-weight:600}
.choice.main{border-color:var(--accent)}
.choice.main .t::before{content:"→ ";color:var(--accent)}
.perito{display:flex;align-items:center;gap:10px;margin-top:16px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.perito input{accent-color:var(--accent)}
#tray{margin-top:28px;max-width:66ch;border:1px dashed var(--line);border-radius:6px;padding:12px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:center;background:linear-gradient(180deg,var(--panel),transparent)}
.tr-label{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.tr-dice{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-family:var(--mono)}
.die{width:40px;height:44px;display:grid;place-items:center;font-weight:600;font-size:16px;color:var(--ground);background:var(--bone);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);font-variant-numeric:tabular-nums}
.die.drop{background:var(--faint);opacity:.55}
.die.spin{animation:spin .12s linear infinite}
.die.n20{background:var(--accent);color:var(--bone)} .die.n1{background:var(--sangue);color:var(--bone)}
.die.en{background:var(--sangue);color:var(--bone)}
@keyframes spin{50%{transform:rotate(12deg) scale(.92)}}
.tr-sum{font-size:14px;color:var(--muted)}
.tr-sum b{font-size:22px;color:var(--bone);font-variant-numeric:tabular-nums}
.stamp{grid-row:1/span 2;grid-column:2;font-family:var(--type);font-size:20px;letter-spacing:.1em;padding:4px 12px;border:2px solid currentColor;transform:rotate(-6deg);border-radius:3px}
.stamp.ok{color:var(--ok)} .stamp.fail{color:var(--fail)} .stamp.crit{color:var(--accent)} .stamp.none{display:none}
.tr-parts{grid-column:1/-1;font-family:var(--mono);font-size:11px;color:var(--faint)}
.wrap{max-width:900px}
.lede{font-size:18px;color:var(--muted);max-width:60ch}
.step{margin-top:34px}
.step h2{font-family:var(--type);font-weight:400;font-size:22px;margin:0 0 4px}
.step .hint{font-size:14px;color:var(--muted);margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.card{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.card:hover{border-color:var(--muted)}
.card.sel{border-color:var(--accent);background:var(--panel2);box-shadow:inset 0 0 0 1px var(--accent)}
.card b{font-family:var(--type);font-weight:400;font-size:18px}
.card span{font-size:13.5px;color:var(--muted);line-height:1.4}
.card small{font-family:var(--mono);font-size:11px;color:var(--faint)}
.field{background:var(--panel);border:1px solid var(--line);color:var(--bone);font:inherit;font-family:var(--type);font-size:22px;padding:10px 14px;border-radius:4px;width:100%;max-width:420px}
.alloc{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.al{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:10px 12px}
.al .row{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.al b{font-family:var(--mono);font-size:26px}
.al .nm{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--muted)}
.al p{font-size:12.5px;color:var(--faint);margin:6px 0 0;line-height:1.35}
.pm{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);font-family:var(--mono);font-size:18px}
.pool{font-family:var(--mono);font-size:13px;margin-bottom:12px}
.pool b{color:var(--accent);font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:14px}
.chip small{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-left:4px}
.chip.sel{border-color:var(--accent);color:var(--accent)}
.chip.lock{border-style:dashed;color:var(--muted);cursor:default}
.summary{margin-top:34px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;border-top:1px solid var(--line);padding-top:20px}
.summary .stats{font-family:var(--mono);font-size:14px;display:flex;gap:16px;flex-wrap:wrap}
.cta{background:linear-gradient(180deg,#b3172a,var(--accent-deep));color:#fff;box-shadow:0 0 0 1px #a3172a inset;border:none;border-radius:4px;padding:12px 22px;font-family:var(--type);font-size:18px;letter-spacing:.04em}
.cta:hover:not(:disabled){filter:brightness(1.1)}
.ghost{background:none;border:1px solid var(--line);border-radius:4px;padding:11px 20px;font-family:var(--type);font-size:17px}
.warn{font-family:var(--mono);font-size:12px;color:var(--fail)}
.title{padding-block:6vh 0;max-width:760px;margin-inline:auto;text-align:center}
.title .case{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--accent);text-transform:uppercase}
.title h1{white-space:nowrap;font-family:var(--type);font-weight:400;font-size:clamp(44px,13vw,92px);line-height:.95;margin:14px 0 18px;letter-spacing:-.01em}
.title h1 span{color:var(--accent)}
.title .lede{margin-inline:auto}
.title .btns{justify-content:center}
.title .rules{text-align:left}
.title .rules summary{text-align:center}
.crest{width:min(340px,80vw);height:auto;display:block;margin:0 auto 14px;filter:drop-shadow(0 0 30px rgba(224,48,58,.35))}
.crest-sm{height:30px;width:auto;object-fit:contain;display:block;transform:translateY(-9px)}
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.rules{margin-top:40px;border-top:1px solid var(--line);padding-top:18px}
.rules summary{font-family:var(--type);font-size:19px;cursor:pointer}
.rules dl{display:grid;grid-template-columns:140px 1fr;gap:10px 18px;font-size:15px;margin-top:16px}
.rules dt{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);padding-top:3px}
.rules dd{margin:0;color:var(--muted)}
.wheel{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-family:var(--mono);font-size:12px}
.foe{max-width:66ch;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 18px;position:relative;overflow:hidden}
.foe::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 90% 10%,var(--foec,transparent),transparent 60%);opacity:.18;pointer-events:none}
.foe h2{font-family:var(--type);font-weight:400;font-size:26px;margin:4px 0 2px}
.foe .kind{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.foe .meter{grid-template-columns:38px 1fr 80px;margin-top:14px}
.foe .meter i{background:var(--foec,var(--sangue))}
.foe .desc{font-size:14.5px;color:var(--muted);margin:10px 0 0}
.round{font-family:var(--mono);font-size:12px;color:var(--faint);letter-spacing:.1em;text-transform:uppercase;margin:22px 0 8px}
.clog{max-width:66ch;display:flex;flex-direction:column;gap:6px;font-size:15.5px}
.clog p{margin:0;padding-left:12px;border-left:2px solid var(--line);color:var(--muted)}
.clog p:last-child{color:var(--bone);border-color:var(--bone)}
.clog p.hit{border-color:var(--fail)} .clog p.good{border-color:var(--ok)}
.actions{max-width:66ch;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:22px}
.abtn{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.abtn:hover:not(:disabled){border-color:var(--bone)}
.abtn b{font-weight:600;font-size:15.5px}
.abtn small{font-family:var(--mono);font-size:11px;color:var(--muted)}
.abtn.sp{border-color:rgba(224,48,58,.6)}
.abtn .el{align-self:flex-start;margin-top:3px}
.abtn.it{border-style:dashed}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.gear-head{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-family:var(--mono);font-size:13px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:10px 14px;margin-bottom:10px}
.gear-head b{color:var(--bone);font-size:16px;font-variant-numeric:tabular-nums}
.gear-head b.bad{color:var(--fail)}
.gear-head .sp{flex:1}
.note{font-family:var(--mono);font-size:12px;color:var(--conhec);margin:8px 0;line-height:1.5}
.invlist{display:flex;flex-direction:column;gap:8px;margin:12px 0 20px}
.inv{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:10px 12px}
.inv-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.inv-top b{font-weight:600}
.inv-top small{font-family:var(--mono);font-size:11.5px;color:var(--muted);flex:1;min-width:120px}
.inv-opts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;font-size:13px;color:var(--muted)}
.inv-opts:empty{display:none}
.inv-opts .chip{font-size:12px;padding:3px 10px}
.cat{font-family:var(--mono);font-size:10.5px;font-weight:600;border-radius:2px;padding:1px 6px;border:1px solid currentColor}
.cat.c0{color:var(--muted)} .cat.c1{color:var(--pe)} .cat.c2,.cat.c3{color:var(--fail)}
.sel-s{background:var(--panel);color:var(--bone);border:1px solid var(--line);border-radius:3px;font-family:var(--mono);font-size:12px;padding:4px 6px;max-width:100%}
.catalog{display:flex;flex-direction:column;gap:8px}
.cg{border:1px solid var(--line);border-radius:5px;background:var(--panel)}
.cg summary{cursor:pointer;padding:10px 14px;font-family:var(--type);font-size:17px}
.cg summary small{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:6px}
.csub{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);padding:10px 14px 4px;border-top:1px solid var(--line)}
.gi{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:8px 14px}
.gi-t{min-width:0}
.gi-t small{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.gi-t em{color:var(--conhec);font-style:normal}
.gi-t p{margin:2px 0 0;font-size:13.5px;color:var(--muted);line-height:1.4}
.sbtn.add{white-space:nowrap;flex-shrink:0}
.sbtn.add:not(:disabled){color:var(--bone);border-color:var(--muted)}
.dim{font-family:var(--mono);font-size:11px;color:var(--faint)}
.wsel{max-width:66ch;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:18px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.wsel small{font-size:11px;color:var(--faint)}
.allies{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:14px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.allies span{border:1px solid var(--line);border-radius:12px;padding:2px 10px;color:var(--bone)}
.profile{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:4px;padding:16px 18px;max-width:66ch}
.profile p{margin:0 0 8px}
.bondv{color:var(--accent)!important;letter-spacing:.15em}
.social{display:inline-flex;align-items:center;gap:8px;margin-top:22px;padding:8px 16px;border:1px solid var(--line);border-radius:999px;color:var(--bone);text-decoration:none;font-family:var(--mono);font-size:13px;background:var(--panel)}
.social:hover,.social:focus-visible{border-color:var(--accent);color:var(--accent)}
.social .x{font-family:"Segoe UI Symbol","Apple Symbols","Noto Sans Math","DejaVu Sans",sans-serif;font-size:18px;line-height:1}
.langpick{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0 18px}
.langsel{appearance:none;-webkit-appearance:none;padding:6px 10px;color:var(--bone);cursor:pointer}
.lvl{max-width:760px}
.nexbig{font-family:var(--mono);font-size:15px;color:var(--muted);display:flex;align-items:center;gap:14px;margin:6px 0 18px}
.nexbig b{font-size:40px;color:var(--accent);font-weight:600}
.gains{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--mono);font-size:14px;margin-bottom:10px}
.report{max-width:66ch;background:var(--paper);color:var(--paper-ink);padding:22px 24px;border-radius:2px;margin-top:10px;box-shadow:0 4px 0 rgba(0,0,0,.4)}
.report h2{font-family:var(--type);font-weight:400;margin:0 0 6px;font-size:24px}
.report .rank{font-family:var(--type);font-size:64px;line-height:1;color:#7a1022;float:right;border:3px solid #7a1022;padding:4px 14px;transform:rotate(6deg);margin:0 0 10px 16px}
.report p{margin:0 0 .8em}
.report ul{margin:.3em 0 0;padding-left:18px;font-size:15px}
@media (max-width:860px){
  .top-in{gap:8px 10px}
  .brand{order:2;flex:1;justify-content:center;min-width:0}
  #sheetBtn{order:1} #menuBtn{order:3} .langsel{order:3}
  .top-sp{display:none}
  .mini{order:4;flex-basis:100%;justify-content:center}
  .mini:empty{display:none}
  input,select,.sel-s,.field{font-size:16px!important}
  .layout{grid-template-columns:minmax(0,1fr);gap:0;padding-block:18px 60px}
  #sheet{position:fixed;top:0;left:0;bottom:0;width:min(88vw,340px);max-height:none;border-radius:0;z-index:60;transform:translateX(-105%);transition:transform .25s ease;padding-top:calc(18px + env(safe-area-inset-top,0px));overscroll-behavior:contain}
  #sheet.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.55)}
  #sheetBtn{display:inline-block}
  .mini{display:flex}
  .brand small{display:none}
  .brand{font-size:16px;gap:6px}
  .crest-sm{height:20px;transform:translateY(-6px)}
  .choice{flex-direction:column;align-items:flex-start}
  .choice .tag{text-align:left;white-space:normal}
  .rules dl{grid-template-columns:1fr}
  body{font-size:17px}
}
@media (max-width:420px){.crest-sm{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

    simbolo:c(L('O símbolo no portão','The symbol on the gate','El símbolo en el portón'),L('Alguém desenhou um círculo com riscos por dentro no portão da casa dos seus avós, em tinta vermelha escura. Não estava lá de manhã.','Someone drew a circle with lines inside it on your grandparents\' gate, in dark red paint. It wasn\'t there that morning.','Alguien dibujó un círculo con rayas adentro en el portón de la casa de tus abuelos, con pintura roja oscura. No estaba ahí a la mañana.')),
    vizinhos:c(L('Os vizinhos','The neighbors','Los vecinos'),L('Os primeiros a chegar no portão eram gente da rua. O dono da padaria. A professora do Bob. Não foi uma casa escolhida ao acaso: a rua inteira caiu primeiro.','The first ones at the gate were people from the street. The bakery owner. Bob\'s teacher. It wasn\'t a random house: the whole street fell first.','Los primeros en llegar al portón eran gente de la calle. El dueño de la panadería. La maestra de Bob. No fue una casa al azar: primero cayó toda la calle.')),
    luvas:c(L('As luvas do seu pai','Your father\'s gloves','Los guantes de tu padre'),L('Luvas de couro gastas, com "M.Z." bordado no punho. Seu pai usou nelas em cada queda da carreira. Agora são suas.','Worn leather gloves with "M.Z." stitched on the cuff. Your father wore them for every fall of his career. Now they\'re yours.','Guantes de cuero gastados, con "M.Z." bordado en el puño. Tu padre los usó en cada caída de su carrera. Ahora son tuyos.'))
  };
}
function buildScenes(){
const PRO=L('Prólogo · Nove anos','Prologue · Age nine','Prólogo · Nueve años');
const C1=L('Ato I · Cap. 1 · O primeiro salto','Act I · Ch. 1 · The first jump','Acto I · Cap. 1 · El primer salto');
const C2=L('Ato I · Cap. 1 · A família reunida','Act I · Ch. 1 · The family together','Acto I · Cap. 1 · La familia reunida');
const EPI=L('Ato I · Cap. 1 · Amanhecer','Act I · Ch. 1 · Dawn','Acto I · Cap. 1 · Amanecer');
SCENES={
p_chegada:{act:PRO,title:L('A casa da vó','Grandma\'s house','La casa de la abuela'),checkpoint:true,
  text:()=>P(L(`O avião pousa no Brasil numa manhã abafada. Você tem nove anos e sabe dizer "obrigado", "bom dia" e um palavrão que o Thomas te ensinou no voo.

Até ontem, sua casa era nos Estados Unidos. A partir de hoje é esta: um sobrado de muro baixo, uma mangueira no quintal e a sua avó na calçada, de braços abertos, gritando "Adam!" com um sotaque que transforma o seu nome em outra coisa.

Seus pais, Adriana e Maxwel, vão passar semanas fora, pulando de prédios e capotando carros para filmes que você ainda não pode ver. É por isso que vocês vieram. Thomas, o mais velho, já está conversando com os meninos da rua sem entender metade. Bob, o caçula, não larga a sua mão.`,
`The plane lands in Brazil on a muggy morning. You're nine years old and you can say "thank you", "good morning" and one swear word Thomas taught you on the flight.

Until yesterday, home was in the United States. From today on it's this: a two-story house with a low wall, a mango tree in the backyard and your grandmother on the sidewalk, arms wide open, shouting "Adam!" with an accent that turns your name into something else.

Your parents, Adriana and Maxwel, will be gone for weeks at a time, jumping off buildings and flipping cars for movies you're not allowed to watch yet. That's why you came. Thomas, the oldest, is already talking to the street kids without understanding half of it. Bob, the youngest, won't let go of your hand.`,
`El avión aterriza en Brasil una mañana sofocante. Tienes nueve años y sabes decir "gracias", "buen día" y una mala palabra que Thomas te enseñó en el vuelo.

Hasta ayer, tu casa estaba en Estados Unidos. Desde hoy es esta: una casa de dos pisos con muro bajo, un mango en el patio y tu abuela en la vereda, con los brazos abiertos, gritando "¡Adam!" con un acento que convierte tu nombre en otra cosa.

Tus padres, Adriana y Maxwel, van a pasar semanas afuera, saltando de edificios y volcando autos para películas que todavía no puedes ver. Por eso vinieron. Thomas, el mayor, ya habla con los chicos de la calle sin entender la mitad. Bob, el menor, no te suelta la mano.`)),
  choices:()=>[
    {once:'vo',label:L('Ajudar a vó na cozinha','Help Grandma in the kitchen','Ayudar a la abuela en la cocina'),
      run:()=>({text:P(L(`Ela te dá uma colher de pau e um avental três vezes maior que você. "Aqui em casa todo mundo ajuda." Enquanto o feijão cozinha, o vô passa, lê o seu nome no bilhete da escola e ri. "Adam. Ao contrário fica Mada." Ele gosta tanto da piada que nunca mais te chama de outra coisa.`,`She hands you a wooden spoon and an apron three times your size. "In this house, everyone helps." While the beans cook, Grandpa walks by, reads your name on the school form and laughs. "Adam. Backwards it's Mada." He likes the joke so much he never calls you anything else again.`,`Te da una cuchara de madera y un delantal tres veces más grande que tú. "En esta casa todos ayudan." Mientras se cocinan los porotos, el abuelo pasa, lee tu nombre en el papel de la escuela y se ríe. "Adam. Al revés es Mada." Le gusta tanto el chiste que nunca más te llama de otra forma.`))+bond('avos')})},
    {once:'telhado',label:L('Subir no telhado, como o pai faz nos filmes','Climb onto the roof, like Dad does in the movies','Subir al techo, como hace papá en las películas'),test:{sk:'Acrobacia',dt:12},
      ok:()=>({text:P(L(`Mangueira, muro, calha, telhado. Você fica de pé lá em cima com o coração na boca e a cidade inteira aos seus pés. Lá de baixo, Bob bate palmas. A vó grita até ficar rouca. À noite, pelo telefone, seu pai ri: "Esse é o meu garoto."`,`Mango tree, wall, gutter, roof. You stand up there with your heart in your throat and the whole city at your feet. Down below, Bob claps. Grandma yells herself hoarse. That night, on the phone, your father laughs: "That's my boy."`,`Mango, muro, canaleta, techo. Te paras allá arriba con el corazón en la boca y la ciudad entera a tus pies. Abajo, Bob aplaude. La abuela grita hasta quedar ronca. A la noche, por teléfono, tu padre se ríe: "Ese es mi chico."`))+bond('maxwel')}),
      fail:()=>({text:P(L(`A calha cede e você cai de costas na grama. Nada quebrado, só o orgulho. Quando sua mãe liga, a vó conta tudo. "Primeira regra do dublê, filho", diz Adriana, rindo. "Aprender a cair antes de aprender a subir."`,`The gutter gives way and you land on your back in the grass. Nothing broken, just your pride. When your mother calls, Grandma tells her everything. "First rule of stunts, baby," Adriana says, laughing. "Learn to fall before you learn to climb."`,`La canaleta cede y caes de espaldas en el pasto. Nada roto, solo el orgullo. Cuando llama tu madre, la abuela le cuenta todo. "Primera regla del doble, hijo", dice Adriana, riendo. "Aprender a caer antes que a subir."`))+losePv('1d3',L('a queda','the fall','la caída'))+bond('adriana')})},
    {once:'bob',label:L('Mostrar o quintal para o Bob','Show Bob the backyard','Mostrarle el patio a Bob'),
      run:()=>({text:P(L(`Vocês passam a tarde embaixo da mangueira. Bob pergunta se os pais vão voltar. Você diz que sim, que sempre voltam, e que enquanto isso quem cuida dele é você. Ele acredita na hora. Você também.`,`You spend the afternoon under the mango tree. Bob asks if Mom and Dad are coming back. You say yes, they always come back, and until then you're the one looking after him. He believes it right away. So do you.`,`Pasan la tarde bajo el mango. Bob pregunta si mamá y papá van a volver. Le dices que sí, que siempre vuelven, y que mientras tanto el que lo cuida eres tú. Te cree enseguida. Tú también.`))+bond('bob')})},
    {label:L('Os anos passam','The years go by','Pasan los años'),main:true,run:()=>({go:'c1_set'})}
  ]},

c1_set:{act:C1,title:L('Dezesseis anos','Sixteen','Dieciséis años'),checkpoint:true,
  text:()=>P(L(`Sete anos depois, todo mundo te chama de Mada: a rua, a escola, até sua mãe quando esquece. Só seu pai insiste em "Adam", e só quando está sério.

Hoje é o seu primeiro dia num set de verdade. Foi indicação dos dois: um filme de ação barato, filmado num galpão na zona portuária. Você é o dublê de um ator mirim que "cai da escada e foge de moto". Seu pai está de coordenador de cena. Sua mãe, pilotando o carro que vai te perseguir.

"Regra de ouro", diz Maxwel, ajustando o seu colete. "Ninguém se machuca no meu set. Nem você, nem o cara do seu lado."`,
`Seven years later, everyone calls you Mada: the street, school, even your mother when she forgets. Only your father insists on "Adam", and only when he's serious.

Today is your first day on a real set. Both of them recommended you: a cheap action movie, shot in a warehouse by the docks. You're the stunt double for a child actor who "falls down the stairs and escapes on a motorcycle". Your father is the stunt coordinator for the scene. Your mother is driving the car that chases you.

"Golden rule," Maxwel says, adjusting your vest. "Nobody gets hurt on my set. Not you, not the guy next to you."`,
`Siete años después, todos te llaman Mada: la calle, la escuela, hasta tu madre cuando se olvida. Solo tu padre insiste con "Adam", y solo cuando habla en serio.

Hoy es tu primer día en un set de verdad. Fue recomendación de los dos: una película de acción barata, filmada en un galpón del puerto. Eres el doble de un actor infantil que "se cae por la escalera y huye en moto". Tu padre coordina la escena. Tu madre maneja el auto que te persigue.

"Regla de oro", dice Maxwel, ajustándote el chaleco. "Nadie se lastima en mi set. Ni tú, ni el que está a tu lado."`)),
  choices:()=>[
    {once:'escada',label:L('A queda da escada','The fall down the stairs','La caída de la escalera'),test:{sk:'Acrobacia',dt:13},
      ok:()=>({text:P(L(`Você rola os doze degraus exatamente como ensaiou: ombro, costas, quadril, nunca a cabeça. O diretor pede "corta" e o galpão inteiro aplaude. Seu pai não aplaude. Só balança a cabeça, uma vez. Vale mais.`,`You roll down the twelve steps exactly as rehearsed: shoulder, back, hip, never the head. The director calls "cut" and the whole warehouse applauds. Your father doesn't applaud. He just nods, once. It's worth more.`,`Ruedas los doce escalones exactamente como ensayaste: hombro, espalda, cadera, nunca la cabeza. El director grita "corte" y todo el galpón aplaude. Tu padre no aplaude. Solo asiente, una vez. Vale más.`))+bond('maxwel')}),
      fail:()=>({text:P(L(`Você bate o cotovelo no oitavo degrau e sente o choque até os dentes. "De novo", diz o diretor. Seu pai te levanta pelo colete. "Você travou. Não trava. O corpo sabe cair, deixa ele."`,`You hit your elbow on the eighth step and feel it all the way to your teeth. "Again," says the director. Your father pulls you up by the vest. "You froze. Don't freeze. Your body knows how to fall, let it."`,`Te golpeas el codo en el octavo escalón y lo sientes hasta los dientes. "Otra vez", dice el director. Tu padre te levanta del chaleco. "Te trabaste. No te trabes. El cuerpo sabe caer, déjalo."`))+losePv('1d4',L('a escada','the stairs','la escalera'))})},
    {once:'moto',label:L('A fuga de moto','The motorcycle escape','La huida en moto'),test:{sk:'Pilotagem',dt:14},
      ok:()=>({text:P(L(`Você corta entre os contêineres com o carro da sua mãe colado no seu pneu traseiro. Na curva final, ela passa a meio metro de você, de propósito, e pisca pelo para-brisa. Depois da cena, te abraça ainda de capacete. "Você dirige igualzinho a mim. Coitado."`,`You weave between the containers with your mother's car glued to your rear tire. On the final turn she passes half a meter from you, on purpose, and winks through the windshield. After the take she hugs you with your helmet still on. "You ride just like me. Poor thing."`,`Zigzagueas entre los contenedores con el auto de tu madre pegado a tu rueda trasera. En la curva final pasa a medio metro de ti, a propósito, y te guiña por el parabrisas. Después de la toma te abraza con el casco todavía puesto. "Manejas igualito a mí. Pobrecito."`))+bond('adriana')}),
      fail:()=>({text:P(L(`A roda traseira escapa no óleo do chão e você deita a moto antes da marca. Sua mãe freia a dois metros. Ela desce correndo, confere seus braços, suas pernas, e só depois briga. "Primeira regra, Mada."`,`The back wheel slips on oil on the floor and you lay the bike down before your mark. Your mother brakes two meters away. She runs over, checks your arms, your legs, and only then yells at you. "First rule, Mada."`,`La rueda trasera patina en el aceite del piso y acuestas la moto antes de la marca. Tu madre frena a dos metros. Baja corriendo, te revisa los brazos, las piernas, y recién después te reta. "Primera regla, Mada."`))+losePv('1d4',L('o tombo','the spill','la caída'))})},
    {label:L('O ensaio de luta','The fight rehearsal','El ensayo de pelea'),main:true,
      run:()=>({text:P(L(`Última cena do dia: uma briga no corredor. Do outro lado, o coordenador de dublês mais velho do set estala o pescoço. "É ensaio. Mas ensaio de verdade."`,`Last scene of the day: a fight in the hallway. Across from you, the oldest stunt coordinator on set cracks his neck. "It's a rehearsal. But a real one."`,`Última escena del día: una pelea en el pasillo. Enfrente, el coordinador de dobles más veterano del set se truena el cuello. "Es ensayo. Pero ensayo de verdad."`)),combat:{id:'coordenador',after:'c1_fim',script:'ensaio',noDeath:true}})}
  ]},

c1_fim:{act:C1,title:L('Os três Zart','The three Zarts','Los tres Zart'),
  text:()=>P(L(`No carro, voltando para casa, seu pai tira as próprias luvas de couro do porta-luvas e joga no seu colo. Gastas, com "M.Z." bordado no punho. "Eu usei essas em todas as quedas da minha vida. Agora quem cai é você."

Em casa, a vó fez bolo. Thomas, que trabalha de dia e estuda à noite, diz que ser dublê é um jeito caro de se machucar. Bob, com doze anos e cara de quem vai ser igual a você, quer ver o vídeo da queda três vezes.`,
`In the car on the way home, your father takes his own leather gloves out of the glove box and tosses them into your lap. Worn, with "M.Z." stitched on the cuff. "I wore these for every fall of my life. Now you're the one falling."

At home, Grandma made cake. Thomas, who works during the day and studies at night, says being a stuntman is an expensive way to get hurt. Bob, twelve years old and clearly about to be just like you, wants to watch the video of the fall three times.`,
`En el auto, volviendo a casa, tu padre saca sus propios guantes de cuero de la guantera y te los tira en el regazo. Gastados, con "M.Z." bordado en el puño. "Los usé en todas las caídas de mi vida. Ahora el que cae eres tú."

En casa, la abuela hizo torta. Thomas, que trabaja de día y estudia de noche, dice que ser doble es una forma cara de lastimarse. Bob, con doce años y cara de que va a ser igual a ti, quiere ver el video de la caída tres veces.`))+addClue('luvas')+gloves(),
  choices:()=>[
    {once:'thomas',label:L('Conversar com Thomas na varanda','Talk to Thomas on the porch','Hablar con Thomas en el porche'),
      run:()=>({text:P(L(`"Eu não tenho nada contra", diz ele, olhando a rua. "Só que alguém nessa família tem que ter um emprego que não termine no hospital." Pausa. "Se você se machucar, a vó morre do coração. E eu fico com o Bob sozinho." É o jeito dele de dizer que se preocupa.`,`"I've got nothing against it," he says, looking at the street. "It's just that someone in this family needs a job that doesn't end at the hospital." A pause. "If you get hurt, Grandma has a heart attack. And I'm left alone with Bob." It's his way of saying he worries.`,`"No tengo nada en contra", dice, mirando la calle. "Solo que alguien en esta familia tiene que tener un trabajo que no termine en el hospital." Pausa. "Si te lastimas, a la abuela le da un infarto. Y yo me quedo solo con Bob." Es su forma de decir que se preocupa.`))+bond('thomas')})},
    {once:'bob2',label:L('Ensinar Bob a cair no colchão','Teach Bob to fall on the mattress','Enseñarle a Bob a caer en el colchón'),
      run:()=>({text:P(L(`Ombro, costas, quadril, nunca a cabeça. Bob cai quarenta vezes seguidas, rindo, até a vó apagar a luz do quarto. No escuro, ele diz: "Quando eu crescer vou ser igual a você." Você finge que está dormindo para ele não ver que você sorriu.`,`Shoulder, back, hip, never the head. Bob falls forty times in a row, laughing, until Grandma turns off the bedroom light. In the dark he says: "When I grow up I'm gonna be just like you." You pretend to be asleep so he doesn't see you smile.`,`Hombro, espalda, cadera, nunca la cabeza. Bob se cae cuarenta veces seguidas, riendo, hasta que la abuela apaga la luz del cuarto. En la oscuridad dice: "Cuando sea grande voy a ser igual a ti." Finges dormir para que no vea que sonreíste.`))+bond('bob')})},
    {label:L('Um ano depois','One year later','Un año después'),main:true,run:()=>({go:'c2_almoco'})}
  ]},

c2_almoco:{act:C2,title:L('Aniversário do vô','Grandpa\'s birthday','Cumpleaños del abuelo'),checkpoint:true,
  text:()=>P(L(`Dezessete anos. Setenta do vô. Pela primeira vez em meses, a família inteira está na mesma casa: seus pais de folga entre dois filmes, tios que vieram de longe, primos pequenos correndo pelo quintal, a mangueira carregada.

O almoço vira tarde, a tarde vira noite. Seu pai conta a história da vez em que pegou fogo de verdade num set em Atlanta, e sua mãe corrige cada detalhe. A vó dorme sentada no sofá com um prato no colo.

É um domingo comum. Você só vai entender depois o quanto ele era raro.`,
`Seventeen years old. Grandpa's seventieth. For the first time in months, the whole family is in the same house: your parents on a break between two movies, uncles who came from far away, little cousins running around the backyard, the mango tree heavy with fruit.

Lunch turns into afternoon, afternoon turns into night. Your father tells the story of the time he really caught fire on a set in Atlanta, and your mother corrects every detail. Grandma falls asleep sitting on the couch with a plate in her lap.

It's an ordinary Sunday. You'll only understand later how rare it was.`,
`Diecisiete años. Setenta del abuelo. Por primera vez en meses, toda la familia está en la misma casa: tus padres libres entre dos películas, tíos que vinieron de lejos, primos chicos corriendo por el patio, el mango cargado.

El almuerzo se vuelve tarde, la tarde se vuelve noche. Tu padre cuenta la vez que se prendió fuego de verdad en un set en Atlanta, y tu madre corrige cada detalle. La abuela se duerme sentada en el sillón con un plato en el regazo.

Es un domingo común. Recién después vas a entender lo raro que era.`)),
  choices:()=>[
    {once:'mae',label:L('Lavar a louça com a sua mãe','Wash the dishes with your mother','Lavar los platos con tu madre'),
      run:()=>({text:P(L(`Ela lava, você seca. Ela conta que te viu cair naquela escada e pensou em desistir de te indicar para outro set. "Aí eu vi a sua cara depois. Era a cara do seu pai com vinte anos." Ela te molha de propósito com a esponja. "Promete que não vai ser tão teimoso quanto ele."`,`She washes, you dry. She tells you she saw you fall down those stairs and thought about never recommending you for another set. "Then I saw your face afterward. It was your father's face at twenty." She splashes you with the sponge on purpose. "Promise me you won't be as stubborn as he is."`,`Ella lava, tú secas. Te cuenta que te vio caer por esa escalera y pensó en no recomendarte nunca más para otro set. "Después vi tu cara. Era la cara de tu padre a los veinte." Te moja con la esponja a propósito. "Prométeme que no vas a ser tan terco como él."`))+bond('adriana')})},
    {once:'pai',label:L('Ficar com o seu pai no quintal','Stay with your father in the backyard','Quedarte con tu padre en el patio'),
      run:()=>({text:P(L(`Ele está sentado no degrau da cozinha, olhando os primos. "Sabe qual é a parte mais difícil desse trabalho, Adam? Não é cair. É olhar em volta antes. Ver onde cada um está. Quem pode se machucar se você errar." Ele aponta com o queixo para Bob, pendurado na mangueira. "Você já faz isso sem perceber."`,`He's sitting on the kitchen step, watching the cousins. "You know what the hardest part of this job is, Adam? It's not falling. It's looking around first. Seeing where everyone is. Who could get hurt if you mess up." He juts his chin at Bob, hanging from the mango tree. "You already do it without noticing."`,`Está sentado en el escalón de la cocina, mirando a los primos. "¿Sabes cuál es la parte más difícil de este trabajo, Adam? No es caer. Es mirar alrededor antes. Ver dónde está cada uno. Quién se puede lastimar si te equivocas." Señala con el mentón a Bob, colgado del mango. "Tú ya lo haces sin darte cuenta."`))+bond('maxwel')})},
    {once:'portao',label:L('Levar o lixo até o portão','Take the trash out to the gate','Sacar la basura al portón'),test:{sk:'Percepção',dt:14},
      ok:()=>({text:P(L(`A rua está quieta demais para um domingo à noite. Nenhuma TV ligada, nenhum cachorro latindo. E, na parte de fora do portão, um desenho que não estava lá de manhã, ainda brilhando de úmido.`,`The street is too quiet for a Sunday night. No TVs on, no dogs barking. And on the outside of the gate, a drawing that wasn't there that morning, still glistening wet.`,`La calle está demasiado callada para un domingo a la noche. Ninguna tele prendida, ningún perro ladrando. Y del lado de afuera del portón, un dibujo que no estaba a la mañana, todavía brillando de húmedo.`))+addClue('simbolo')+loseSan('1d2',L('o símbolo','the symbol','el símbolo'))}),
      fail:()=>({text:P(L(`A rua está escura. Você deixa o saco na calçada e volta correndo para não perder o bolo.`,`The street is dark. You leave the bag on the sidewalk and run back so you don't miss the cake.`,`La calle está oscura. Dejas la bolsa en la vereda y vuelves corriendo para no perderte la torta.`))})},
    {label:L('Cantar parabéns','Sing happy birthday','Cantar el feliz cumpleaños'),main:true,run:()=>({go:'c2_ataque'})}
  ]},

c2_ataque:{act:C2,title:L('A luz cai','The lights go out','Se corta la luz'),
  text:()=>P(L(`As velas estão acesas quando a luz da rua inteira apaga. Os primos riem, acham que é parte da surpresa. Aí alguém bate no portão. Depois bate de novo. Depois são muitas mãos batendo ao mesmo tempo.

Seu pai vai até a janela com a lanterna do celular. Você vê o rosto dele mudar.

No portão estão os vizinhos. Cobertos de sangue que escorre como se estivesse vivo. E o portão está cedendo.`,
`The candles are lit when the whole street's power goes out. The cousins laugh, thinking it's part of the surprise. Then someone knocks on the gate. Then again. Then it's many hands knocking at once.

Your father goes to the window with his phone flashlight. You see his face change.

At the gate are the neighbors. Covered in blood that runs as if it were alive. And the gate is giving way.`,
`Las velas están encendidas cuando se corta la luz de toda la calle. Los primos se ríen, creen que es parte de la sorpresa. Entonces alguien golpea el portón. Después otra vez. Después son muchas manos golpeando al mismo tiempo.

Tu padre va hasta la ventana con la linterna del celular. Ves cómo le cambia la cara.

En el portón están los vecinos. Cubiertos de sangre que corre como si estuviera viva. Y el portón está cediendo.`))+addClue('vizinhos'),
  choices:()=>[
    {label:L('Ficar ao lado dos seus pais','Stand beside your parents','Quedarte junto a tus padres'),main:true,
      run:()=>({text:P(L(`Seu pai passa a mão numa cadeira. Sua mãe, na frigideira de ferro. Os dois se posicionam na porta da sala como se fosse uma cena ensaiada mil vezes. Você fica entre eles. Ninguém manda você sair. Ainda.`,`Your father grabs a chair. Your mother, the iron skillet. The two of them take position at the living room door as if it were a scene rehearsed a thousand times. You stand between them. Nobody tells you to leave. Yet.`,`Tu padre agarra una silla. Tu madre, la sartén de hierro. Los dos se ubican en la puerta de la sala como si fuera una escena ensayada mil veces. Tú te quedas entre ellos. Nadie te dice que te vayas. Todavía.`)),combat:{id:'zumbi',after:'c2_adam',allies:['maxwel','adriana'],script:'casa',noDeath:true,enemyFirst:true}})}
  ]},

c2_adam:{act:C2,title:'"Adam."',
  text:()=>P(L(`A janela da sala explode para dentro. São muitos. Um dos tios cai. A vó grita no quarto.

Seu pai te segura pelo ombro e te olha nos olhos. Pela primeira vez na vida, a voz dele treme.

"Adam. Pega os seus irmãos. Tira eles daqui."

Sua mãe já está de costas para você, a frigideira erguida, bloqueando o corredor. "Vai, filho. A gente vai logo atrás."

Você sabe que é mentira. Ela sabe que você sabe.`,
`The living room window bursts inward. There are too many. One of your uncles goes down. Grandma screams in the bedroom.

Your father grabs you by the shoulder and looks you in the eye. For the first time in your life, his voice shakes.

"Adam. Get your brothers. Get them out of here."

Your mother already has her back to you, skillet raised, blocking the hallway. "Go, baby. We'll be right behind you."

You know it's a lie. She knows you know.`,
`La ventana de la sala estalla hacia adentro. Son demasiados. Uno de tus tíos cae. La abuela grita en el cuarto.

Tu padre te agarra del hombro y te mira a los ojos. Por primera vez en tu vida, le tiembla la voz.

"Adam. Agarra a tus hermanos. Sácalos de aquí."

Tu madre ya está de espaldas a ti, con la sartén en alto, bloqueando el pasillo. "Ve, hijo. Vamos justo detrás."

Sabes que es mentira. Ella sabe que lo sabes.`)),
  choices:()=>[
    {label:L('Obedecer e correr para a escada','Obey and run for the stairs','Obedecer y correr a la escalera'),test:{sk:'Vontade',dt:15},
      ok:()=>{S.flags.obedeceu=true;return {text:P(L(`Você vira as costas para eles. É a coisa mais difícil que você já fez. Atrás de você, seu pai grita alguma coisa em inglês que você nunca vai conseguir lembrar direito.`,`You turn your back on them. It's the hardest thing you've ever done. Behind you, your father shouts something in English that you'll never quite be able to remember.`,`Les das la espalda. Es lo más difícil que hiciste en tu vida. Detrás de ti, tu padre grita algo en inglés que nunca vas a poder recordar bien.`))+loseSan('1d4',L('seus pais','your parents','tus padres')),go:'c2_quarto'}},
      fail:()=>({text:P(L(`Seu corpo não obedece. Você dá um passo na direção da sua mãe bem na hora em que o corredor engole ela. Seu pai te empurra com tanta força que você cai no pé da escada. "ADAM! VAI!" É a última vez que você ouve a voz dele.`,`Your body won't obey. You take a step toward your mother right as the hallway swallows her. Your father shoves you so hard you land at the foot of the stairs. "ADAM! GO!" It's the last time you hear his voice.`,`Tu cuerpo no obedece. Das un paso hacia tu madre justo cuando el pasillo se la traga. Tu padre te empuja tan fuerte que caes al pie de la escalera. "¡ADAM! ¡VETE!" Es la última vez que oyes su voz.`))+losePv('1d6',L('o corredor','the hallway','el pasillo'))+loseSan('1d4',L('sua mãe','your mother','tu madre')),go:'c2_quarto'})},
    {label:L('Voltar para ajudar','Go back to help','Volver a ayudar'),
      run:()=>{S.flags.voltou=true;return {text:P(L(`Você não pensa. Nunca pensa quando alguém está em perigo. Pega um abajur e avança para o corredor. Chega a acertar um deles. Então sua mãe se vira, te olha uma única vez, e fecha a porta do corredor com você do lado de fora. Você ouve a trava. Ouve o resto.`,`You don't think. You never think when someone's in danger. You grab a lamp and charge into the hallway. You actually hit one of them. Then your mother turns, looks at you one single time, and shuts the hallway door with you on the outside. You hear the lock. You hear the rest.`,`No piensas. Nunca piensas cuando alguien está en peligro. Agarras una lámpara y avanzas al pasillo. Llegas a golpear a uno. Entonces tu madre se da vuelta, te mira una única vez y cierra la puerta del pasillo contigo del lado de afuera. Oyes el cerrojo. Oyes lo demás.`))+losePv('1d6',L('o corredor','the hallway','el pasillo'))+loseSan('1d4',L('a porta fechada','the closed door','la puerta cerrada')),go:'c2_quarto'}}}
  ]},

c2_quarto:{act:C2,title:L('O quarto de cima','The upstairs bedroom','El cuarto de arriba'),checkpoint:true,
  text:()=>P(L(`Lá em cima, Thomas empurrou a cômoda contra a porta do quarto. Bob está encolhido atrás dele, com as duas mãos no ouvido. Quando você entra, Thomas te olha e não pergunta nada sobre os pais. Ele já sabe pela sua cara.

Alguma coisa sobe a escada. Devagar. Arrastando.

Duas saídas: a janela, que dá para o telhado da garagem, e o corredor, onde fica a escada dos fundos.`,
`Upstairs, Thomas has shoved the dresser against the bedroom door. Bob is curled up behind him, both hands over his ears. When you come in, Thomas looks at you and doesn't ask anything about your parents. He already knows from your face.

Something is coming up the stairs. Slowly. Dragging.

Two ways out: the window, which opens onto the garage roof, and the hallway, where the back staircase is.`,
`Arriba, Thomas empujó la cómoda contra la puerta del cuarto. Bob está acurrucado detrás de él, con las dos manos en las orejas. Cuando entras, Thomas te mira y no pregunta nada de tus padres. Ya lo sabe por tu cara.

Algo sube la escalera. Despacio. Arrastrándose.

Dos salidas: la ventana, que da al techo del garaje, y el pasillo, donde está la escalera de atrás.`)),
  choices:()=>[
    {once:'faixa',cond:()=>S.pv<S.pvMax,label:L('Deixar Thomas enfaixar o seu braço','Let Thomas bandage your arm','Dejar que Thomas te vende el brazo'),
      run:()=>{const h=healPv(rollExpr('2d4+2').total);return {text:P(L(`Ele rasga um lençol em tiras sem dizer nada. As mãos dele tremem, mas o nó sai firme. "Você não vai cair antes da gente sair daqui", ele diz. Não é um pedido.`,`He tears a bedsheet into strips without a word. His hands shake, but the knot comes out tight. "You're not going down before we get out of here," he says. It isn't a request.`,`Rompe una sábana en tiras sin decir nada. Le tiemblan las manos, pero el nudo sale firme. "No te vas a caer antes de que salgamos de acá", dice. No es un pedido.`))+`<p class="gain">+${h} ${PV()}</p>`+bond('thomas')}}},
    {once:'taco',label:L('Pegar o taco de beisebol do seu pai no armário','Grab your father\'s baseball bat from the closet','Agarrar el bate de béisbol de tu padre del armario'),
      run:()=>({text:P(L(`O taco que ele trouxe dos Estados Unidos e nunca usou para jogar. Pesa mais do que você lembrava.`,`The bat he brought from the States and never once used to play. It's heavier than you remembered.`,`El bate que trajo de Estados Unidos y nunca usó para jugar. Pesa más de lo que recordabas.`))+addLoot('bastao')})},
    {once:'kit',label:L('Abrir a bolsa de trabalho do seu pai','Open your father\'s work bag','Abrir el bolso de trabajo de tu padre'),test:{sk:'Percepção',dt:11},
      ok:()=>({text:P(L(`Corda de rapel, fita, uma pistola sinalizadora de cena com duas cargas de verdade. Tudo que um dublê leva para o set.`,`Rappel rope, tape, a prop flare gun with two real charges. Everything a stuntman takes to set.`,`Cuerda de rappel, cinta, una pistola de bengalas de utilería con dos cargas de verdad. Todo lo que un doble lleva al set.`))+addLoot('corda')+addLoot('sinalizadora')}),
      fail:()=>({text:P(L(`No escuro, sua mão só acha a corda. O resto rola para baixo da cama.`,`In the dark, your hand only finds the rope. The rest rolls under the bed.`,`En la oscuridad, tu mano solo encuentra la cuerda. Lo demás rueda debajo de la cama.`))+addLoot('corda')})},
    {label:L('Pela janela, pelo telhado da garagem','Through the window, over the garage roof','Por la ventana, por el techo del garaje'),main:true,test:{sk:'Acrobacia',dt:14},
      ok:()=>({text:P(L(`Você desce primeiro e segura os dois. Ombro, costas, quadril. Bob cai do jeito que você ensinou no colchão, sem um grito.`,`You go down first and catch them both. Shoulder, back, hip. Bob falls exactly the way you taught him on the mattress, without a sound.`,`Bajas primero y los atajas a los dos. Hombro, espalda, cadera. Bob cae exactamente como le enseñaste en el colchón, sin un grito.`))+bond('bob'),go:'c2_quintal'}),
      fail:()=>({text:P(L(`As telhas quebram e você cai no quintal de mau jeito, amortecendo o Bob com o próprio corpo.`,`The tiles crack and you land badly in the backyard, cushioning Bob with your own body.`,`Las tejas se rompen y caes mal en el patio, amortiguando a Bob con tu propio cuerpo.`))+losePv('1d6',L('o telhado','the roof','el techo')),go:'c2_quintal'})},
    {label:L('Pelo corredor, pela escada dos fundos','Through the hallway, down the back stairs','Por el pasillo, por la escalera de atrás'),
      run:()=>({text:P(L(`Você abre a porta. Ele já está no alto da escada.`,`You open the door. It's already at the top of the stairs.`,`Abres la puerta. Ya está en lo alto de la escalera.`)),combat:{id:'zumbi',after:'c2_quintal',allies:['thomas'],winText:L('Ele rola escada abaixo e não levanta. Vocês descem por cima dele.','It tumbles down the stairs and doesn\'t get up. You climb down over it.','Rueda escalera abajo y no se levanta. Bajan pasando por encima.')}})}
  ]},

c2_quintal:{act:C2,title:L('O quintal','The backyard','El patio'),
  text:()=>P(L(`A mangueira, o varal, a garagem com o carro de cena do seu pai: o único carro na rua que você sabe que pega de primeira.

Entre vocês e a garagem, uma coisa enorme vira o rosto devagar na sua direção. Ainda está usando a camisa de time que o seu tio vestia no almoço.`,
`The mango tree, the clothesline, the garage with your father's stunt car: the only car on the street you know starts on the first try.

Between you and the garage, something huge slowly turns its face toward you. It's still wearing the team jersey your uncle had on at lunch.`,
`El mango, el tendedero, el garaje con el auto de escena de tu padre: el único auto de la calle que sabes que arranca a la primera.

Entre ustedes y el garaje, algo enorme gira la cara despacio hacia ti. Todavía lleva la camiseta de fútbol que tu tío tenía puesta en el almuerzo.`))+loseSan('1d2',L('seu tio','your uncle','tu tío')),
  choices:()=>[
    {cond:()=>hasItem('sinalizadora'),label:L('Disparar a sinalizadora nos olhos dele','Fire the flare into its eyes','Disparar la bengala a sus ojos'),test:{sk:'Pontaria',dt:13},
      ok:()=>{const it=S.inv.find(i=>i.id==='sinalizadora');if(it){it.charges--;if(it.charges<=0)S.inv=S.inv.filter(x=>x!==it)}
        return {text:P(L(`O clarão vermelho acerta em cheio. Ele urra e cambaleia, cego e em chamas.`,`The red flash hits dead on. It roars and staggers, blind and burning.`,`El destello rojo impacta de lleno. Ruge y se tambalea, ciego y en llamas.`)),combat:{id:'brutamontes',after:'c2_garagem',allies:['thomas'],weak:true,surprise:true,winText:L('O Brutamontes desaba sobre o varal da vó.','The Brute collapses onto Grandma\'s clothesline.','El Bruto se desploma sobre el tendedero de la abuela.')}}},
      fail:()=>{const it=S.inv.find(i=>i.id==='sinalizadora');if(it){it.charges--;if(it.charges<=0)S.inv=S.inv.filter(x=>x!==it)}
        return {text:P(L(`O sinalizador passa por cima do ombro dele e se apaga na mangueira. Agora ele sabe exatamente onde você está.`,`The flare sails over its shoulder and dies in the mango tree. Now it knows exactly where you are.`,`La bengala pasa por encima de su hombro y se apaga en el mango. Ahora sabe exactamente dónde estás.`)),combat:{id:'brutamontes',after:'c2_garagem',allies:['thomas'],enemyFirst:true,winText:L('O Brutamontes desaba sobre o varal da vó.','The Brute collapses onto Grandma\'s clothesline.','El Bruto se desploma sobre el tendedero de la abuela.')}}}},
    {label:L('Mandar Thomas levar Bob para a garagem e enfrentar sozinho','Tell Thomas to take Bob to the garage and face it alone','Decirle a Thomas que lleve a Bob al garaje y enfrentarlo solo'),main:true,
      run:()=>({text:P(L(`"Vai com ele. Eu seguro." Thomas hesita um segundo. Depois pega o Bob no colo e corre pela lateral. Você fica.`,`"Go with him. I've got this." Thomas hesitates for a second. Then he picks Bob up and runs along the side of the house. You stay.`,`"Ve con él. Yo lo aguanto." Thomas duda un segundo. Después alza a Bob y corre por el costado. Tú te quedas.`))+bond('thomas')+facao(),combat:{id:'brutamontes',after:'c2_garagem',winText:L('O Brutamontes desaba sobre o varal da vó.','The Brute collapses onto Grandma\'s clothesline.','El Bruto se desploma sobre el tendedero de la abuela.')}})}
  ]},

c2_garagem:{act:C2,title:L('O carro de cena','The stunt car','El auto de escena'),
  text:()=>P(L(`A chave está no quebra-sol, onde seu pai sempre deixa. Thomas no banco do carona, Bob no chão do banco de trás. A porta da garagem está fechada, e lá fora a rua inteira vem na direção do barulho do motor.

Seu pai ensinou isso num sábado qualquer, rindo: acelerar reto, não frear, confiar no carro.`,
`The key is behind the sun visor, where your father always leaves it. Thomas in the passenger seat, Bob on the floor in the back. The garage door is shut, and outside the whole street is heading toward the sound of the engine.

Your father taught you this on some random Saturday, laughing: floor it straight, don't brake, trust the car.`,
`La llave está en el parasol, donde tu padre siempre la deja. Thomas en el asiento del acompañante, Bob en el piso de atrás. La puerta del garaje está cerrada, y afuera toda la calle viene hacia el ruido del motor.

Tu padre te enseñó esto un sábado cualquiera, riendo: acelerar derecho, no frenar, confiar en el auto.`)),
  choices:()=>[
    {once:'olhar',label:L('Olhar para a casa uma última vez','Look at the house one last time','Mirar la casa una última vez'),test:{sk:'Vontade',dt:14},
      ok:()=>({text:P(L(`As velas do bolo ainda estão acesas na janela da sala. Você guarda essa imagem. Não a outra.`,`The birthday candles are still lit in the living room window. You keep that image. Not the other one.`,`Las velas de la torta siguen encendidas en la ventana de la sala. Te quedas con esa imagen. No con la otra.`))+calm(1)}),
      fail:()=>({text:P(L(`Você olha tempo demais. Vê coisas pela janela que vão voltar toda noite.`,`You look for too long. You see things through the window that will come back every night.`,`Miras demasiado tiempo. Ves cosas por la ventana que van a volver cada noche.`))+loseSan('1d4',L('a janela','the window','la ventana'))})},
    {label:L('Acelerar contra o portão','Floor it through the door','Acelerar contra el portón'),main:true,test:{sk:'Pilotagem',dt:14},
      ok:()=>({text:P(L(`O portão da garagem voa. O carro atravessa a rua, sobe na calçada, desvia de dois deles e desce a ladeira sem tocar no freio. Exatamente como seu pai faria.`,`The garage door flies off. The car crosses the street, jumps the curb, swerves around two of them and goes down the hill without touching the brake. Exactly like your father would.`,`La puerta del garaje sale volando. El auto cruza la calle, se sube a la vereda, esquiva a dos de ellos y baja la cuesta sin tocar el freno. Exactamente como lo haría tu padre.`))+bond('maxwel'),go:'c2_amanhecer'}),
      fail:()=>({text:P(L(`O carro atravessa o portão, mas bate de lado no poste da esquina. O para-brisa racha. O motor tosse, e pega de novo. Vocês saem de lá mancando, mas saem.`,`The car smashes through the door but clips the corner lamppost sideways. The windshield cracks. The engine coughs, then catches again. You limp out of there, but you get out.`,`El auto atraviesa el portón pero choca de costado contra el poste de la esquina. El parabrisas se raja. El motor tose y vuelve a arrancar. Salen de ahí cojeando, pero salen.`))+losePv('1d6',L('a batida','the crash','el choque')),go:'c2_amanhecer'})}
  ]},

c2_amanhecer:{act:EPI,title:L('Três','Three','Tres'),
  text:()=>P(L(`O sol nasce num posto de gasolina na saída da cidade. Bob dorme no banco de trás, abraçado na mochila. Thomas está sentado no meio-fio com o rosto nas mãos, e chora sem fazer barulho.

Você não chora. Fica de pé, olhando a estrada nos dois sentidos, contando carros. Onde cada um está. Quem pode se machucar se você errar.

Ninguém mais. Você decide isso ali, sem dizer em voz alta. Ninguém mais vai passar pelo que vocês passaram esta noite. Não enquanto você estiver de pé.`,
`The sun comes up over a gas station on the edge of town. Bob is asleep in the back seat, hugging his backpack. Thomas sits on the curb with his face in his hands, crying without a sound.

You don't cry. You stand, looking down the road in both directions, counting cars. Where everyone is. Who could get hurt if you mess up.

No one else. You decide it right there, without saying it out loud. No one else is going to go through what the three of you went through tonight. Not while you're still standing.`,
`El sol sale sobre una estación de servicio en la salida de la ciudad. Bob duerme en el asiento de atrás, abrazado a la mochila. Thomas está sentado en el cordón con la cara entre las manos, y llora sin hacer ruido.

Tú no lloras. Te quedas de pie, mirando la ruta en los dos sentidos, contando autos. Dónde está cada uno. Quién puede lastimarse si te equivocas.

Nadie más. Lo decides ahí, sin decirlo en voz alta. Nadie más va a pasar por lo que ustedes pasaron esta noche. No mientras tú sigas de pie.`)),
  choices:()=>[
    {once:'fim_t',label:L('Sentar ao lado de Thomas','Sit down next to Thomas','Sentarte al lado de Thomas'),
      run:()=>({text:P(L(`Você senta. Não fala nada. Depois de um tempo, ele encosta o ombro no seu. "Agora é a gente", ele diz. "Agora é a gente", você responde.`,`You sit. You say nothing. After a while he leans his shoulder against yours. "It's just us now," he says. "It's just us now," you answer.`,`Te sientas. No dices nada. Después de un rato, él apoya el hombro contra el tuyo. "Ahora somos nosotros", dice. "Ahora somos nosotros", respondes.`))+bond('thomas')+calm(2)})},
    {once:'fim_b',label:L('Cobrir o Bob com a sua jaqueta','Cover Bob with your jacket','Tapar a Bob con tu chaqueta'),
      run:()=>({text:P(L(`Ele se mexe, abre um olho e pergunta se os pais vão voltar. Você não consegue mentir desta vez. Só diz que quem cuida dele agora é você. Ele acredita na hora. Você precisa que alguém acredite.`,`He stirs, opens one eye and asks if Mom and Dad are coming back. You can't lie this time. You just say that you're the one looking after him now. He believes it right away. You need someone to.`,`Se mueve, abre un ojo y pregunta si mamá y papá van a volver. Esta vez no puedes mentir. Solo le dices que ahora el que lo cuida eres tú. Te cree enseguida. Necesitas que alguien te crea.`))+bond('bob')+calm(2)})},
    {label:L('Encerrar o Capítulo 1','End Chapter 1','Terminar el Capítulo 1'),main:true,run:()=>({levelup:'a1_fim'})}
  ]},

a1_fim:{act:EPI,title:L('Fim do Capítulo 1','End of Chapter 1','Fin del Capítulo 1'),
  text:()=>P(L(`Ninguém nunca vai explicar para vocês o que aconteceu naquela rua. A polícia fala em "surto". O jornal fala em "chacina". Uma semana depois, a casa da vó está lacrada e três irmãos Zart dormem num quarto de pensão, revezando quem fica acordado vigiando a porta.

Você sempre fica com o turno mais longo.

Fim do Capítulo 1.`,
`No one will ever explain to you what happened on that street. The police say "outbreak". The newspaper says "massacre". A week later, Grandma's house is sealed off and three Zart brothers sleep in a boarding house room, taking turns staying awake to watch the door.

You always take the longest shift.

Mada'End of Chapter 1.`,
`Nadie nunca les va a explicar qué pasó en esa calle. La policía habla de "brote". El diario habla de "masacre". Una semana después, la casa de la abuela está clausurada y tres hermanos Zart duermen en un cuarto de pensión, turnándose para quedarse despiertos vigilando la puerta.

Tú siempre te quedas con el turno más largo.

Fin del Capítulo 1.`)),
  choices:()=>[{label:L('Ver o relatório','See the report','Ver el informe'),main:true,run:()=>({end:true})}]}
};
}
function facao(){if(S.inv.some(i=>ITEMS[i.id].dmg))return '';const i=newInst('machete');i.gift=L('Facão do vô','Grandpa\'s machete','Machete del abuelo');S.inv.push(i);S.equip=i.uid;return P(L('O facão que o vô usa para podar a mangueira está encostado no tronco. Você arranca ele da terra.','The machete Grandpa uses to prune the mango tree is leaning against the trunk. You yank it out of the dirt.','El machete que el abuelo usa para podar el mango está apoyado en el tronco. Lo arrancas de la tierra.'))+`<p class="gain">+ ${i.gift}</p>`}
function buildCap2(){
Object.assign(ENEMIES,{
  rastejante:{eyes:false,name:L('Coágulo Rastejante','Crawling Clot','Coágulo Reptante'),kind:L('Criatura de Sangue','Blood Creature','Criatura de Sangre'),el:'sangue',pv:14,def:10,atk:3,dmg:'1d4+1',res:1,init:0,
    presence:{dt:11,san:'1d2'},desc:L('Um pedaço daquela noite que não foi embora. Uma massa de sangue do tamanho de um cachorro, arrastando-se pelo tapete da sala em direção ao portão.','A piece of that night that never left. A mass of blood the size of a dog, dragging itself across the living room rug toward the gate.','Un pedazo de aquella noche que no se fue. Una masa de sangre del tamaño de un perro, arrastrándose por la alfombra de la sala hacia el portón.')},
  cultista:{human:true,eyes:true,name:L('Cultista do Sangue','Blood Cultist','Cultista de la Sangre'),kind:L('Humano','Human','Humano'),el:null,pv:20,def:12,atk:4,dmg:'1d6+1',res:2,init:2,presence:null,
    desc:L('Roupa comum, faca de cozinha, olhos que não piscam. Podia ser qualquer vizinho. Talvez tenha sido.','Ordinary clothes, a kitchen knife, eyes that don\'t blink. He could be any neighbor. Maybe he was.','Ropa común, cuchillo de cocina, ojos que no parpadean. Podría ser cualquier vecino. Tal vez lo fue.')},
  cria:{eyes:true,name:L('Cria de Sangue','Blood Spawn','Engendro de Sangre'),kind:L('Criatura de Sangue','Blood Creature','Criatura de Sangre'),el:'sangue',pv:34,def:12,atk:5,dmg:'1d8+2',res:3,init:2,
    presence:{dt:13,san:'1d3'},special:{every:3,kind:'atk',name:L('Jorro','Gush','Chorro'),text:L('Ela se abre inteira e cospe sangue fervendo.','It splits open and spits boiling blood.','Se abre entera y escupe sangre hirviendo.'),dmg:'2d6'},
    desc:L('Feita com o sangue dos tambores. Com o sangue da sua rua. Você reconhece a aliança da dona da padaria presa no que deveria ser uma mão.','Made from the blood in the drums. From your street\'s blood. You recognize the bakery owner\'s wedding ring stuck in what should be a hand.','Hecha con la sangre de los tambores. Con la sangre de tu calle. Reconoces la alianza de la dueña de la panadería atrapada en lo que debería ser una mano.')},
  enjaulado:{eyes:true,name:L('Zumbi de Sangue (a prova)','Blood Zombie (the test)','Zombi de Sangre (la prueba)'),kind:L('Criatura de Sangue','Blood Creature','Criatura de Sangre'),el:'sangue',pv:26,def:12,atk:5,dmg:'1d6+2',res:2,init:2,
    presence:{dt:12,san:'1d2'},desc:L('VT capturou esse aqui há semanas e deixou numa jaula no fundo do hangar. "Você viu o que eles fazem", ele diz. "Agora mostra o que você faz."','VT caught this one weeks ago and kept it in a cage at the back of the hangar. "You\'ve seen what they do," he says. "Now show me what you do."','VT atrapó a este hace semanas y lo dejó en una jaula al fondo del hangar. "Viste lo que hacen", dice. "Ahora muéstrame lo que haces tú."')}
});
Object.assign(ALLIES,{
